plugins {
    id 'com.android.application'
}

def configuredMgwBaseUrl = providers.gradleProperty('MGW_BASE_URL')
        .orElse(providers.environmentVariable('MGW_BASE_URL'))
        .getOrElse('')
        .trim()
def escapedMgwBaseUrl = configuredMgwBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')

def brandingInputDir = file("${rootDir}/branding")
def launcherArtSource = file("${brandingInputDir}/shield_king_launcher_384.webp.b64")
def acceptanceKeystoreSource = file("${brandingInputDir}/mgw-acceptance-stable.keystore.b64")
def generatedBrandingResDir = file("${buildDir}/generated/branding/res")
def generatedLauncherArt = file("${generatedBrandingResDir}/drawable-nodpi/ic_mgw_launcher_art.webp")
def generatedAcceptanceKeystore = file("${buildDir}/generated/acceptance-signing/mgw-acceptance-stable.keystore")

def decodeBase64File = { File source, File target ->
    if (!source.isFile()) throw new GradleException("Missing acceptance input: ${source}")
    target.parentFile.mkdirs()
    target.bytes = source.getText('UTF-8').replaceAll('\\s+', '').decodeBase64()
}

def prepareAcceptanceInputs = tasks.register('prepareAcceptanceInputs') {
    inputs.files(launcherArtSource, acceptanceKeystoreSource)
    outputs.files(generatedLauncherArt, generatedAcceptanceKeystore)
    doLast {
        decodeBase64File(launcherArtSource, generatedLauncherArt)
        decodeBase64File(acceptanceKeystoreSource, generatedAcceptanceKeystore)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(generatedLauncherArt.bytes)
                .collect { String.format('%02x', it) }
                .join('')
        if (digest != 'f096f1f4821e514abf880e37e3346e46a60e00f97713170591991a0cfea5dc5e') {
            throw new GradleException("Approved Shield King raster checksum mismatch: ${digest}")
        }
    }
}

android {
    namespace 'com.minigamesworld.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.minigamesworld.app.acceptance'
        minSdk 26
        targetSdk 36
        versionCode 2609
        versionName '0.26.4.3-account-data-download'
        buildConfigField 'String', 'MGW_BASE_URL', '"' + escapedMgwBaseUrl + '"'
    }

    sourceSets {
        main.res.srcDir generatedBrandingResDir
    }

    signingConfigs {
        acceptanceDebug {
            storeFile generatedAcceptanceKeystore
            storePassword 'mgwacceptance2026'
            keyAlias 'mgw-acceptance'
            keyPassword 'mgwacceptance2026'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.acceptanceDebug
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.named('preBuild').configure { dependsOn prepareAcceptanceInputs }
prepareAcceptanceInputs.configure { mustRunAfter tasks.named('clean') }
tasks.matching { it.name.startsWith('validateSigning') }.configureEach { dependsOn prepareAcceptanceInputs }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

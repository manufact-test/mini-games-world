plugins {
    id 'com.android.application'
}

def configuredMgwBaseUrl = providers.gradleProperty('MGW_BASE_URL')
        .orElse(providers.environmentVariable('MGW_BASE_URL'))
        .getOrElse('')
        .trim()
def escapedMgwBaseUrl = configuredMgwBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.minigamesworld.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.minigamesworld.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-branding'

        buildConfigField 'String', 'MGW_BASE_URL', '"' + escapedMgwBaseUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Manual branding acceptance is intentionally installable alongside the
            // earlier Foundation debug APK. GitHub-hosted runners use ephemeral
            // debug signing keys, so reusing the old .foundation package would be
            // rejected by Android as a signature-mismatched update.
            applicationIdSuffix '.brandingv1'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

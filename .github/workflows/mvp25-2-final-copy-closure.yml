name: MVP-25.2 Final human-facing copy closure

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'docs/MVP25_2_HUMAN_FACING_COPY_CLOSURE.md'
      - 'bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php'
      - '.github/workflows/mvp25-2-final-copy-closure.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'docs/MVP25_2_HUMAN_FACING_COPY_CLOSURE.md'
      - 'bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php'
      - '.github/workflows/mvp25-2-final-copy-closure.yml'

permissions:
  contents: read

jobs:
  final-human-copy-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php
          php -l bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php -l bot/tests/Mvp25_2NotificationLegacyOrderDeepLinkContractTest.php
          php -l bot/tests/Mvp25_2TournamentHumanCopyContractTest.php
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          node --check app/assets/js/screens/tournaments-screen-v1.js
          python3 -m json.tool app/locales/ru.json >/dev/null

      - name: Final successor-safe copy proof
        run: |
          php bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php bot/tests/Mvp25_2NotificationLegacyOrderDeepLinkContractTest.php
          php bot/tests/Mvp25_2TournamentHumanCopyContractTest.php
          php bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php

      - name: Guard closure-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(docs/MVP25_2_HUMAN_FACING_COPY_CLOSURE\.md|bot/tests/Mvp25_2FinalHumanCopyClosureContractTest\.php|\.github/workflows/mvp25-2-final-copy-closure\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.2 closure paths:\n%s\n' "$bad" >&2; exit 1; }

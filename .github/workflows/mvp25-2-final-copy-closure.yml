name: MVP-25.2 Manual acceptance readiness

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_2_HUMAN_FACING_COPY_CLOSURE.md'
      - 'docs/MVP25_2_MANUAL_ACCEPTANCE.md'
      - 'bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php'
      - 'bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php'
      - '.github/workflows/mvp25-2-final-copy-closure.yml'
      - '.github/workflows/mvp25-2-tournament-human-copy.yml'
      - '.github/workflows/mvp25-2-notification-legacy-order-deeplink.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_2_HUMAN_FACING_COPY_CLOSURE.md'
      - 'docs/MVP25_2_MANUAL_ACCEPTANCE.md'
      - 'bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php'
      - 'bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php'
      - '.github/workflows/mvp25-2-final-copy-closure.yml'

permissions:
  contents: read

jobs:
  manual-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php -l bot/tests/Mvp25_2NotificationLegacyOrderDeepLinkContractTest.php
          php -l bot/tests/Mvp25_2TournamentHumanCopyContractTest.php
          php -l bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php
          php -l bot/tests/Mvp22_8AccountDataLifecycleTest.php
          node --check app/assets/js/api/client.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/screens/account-data-sheet-v1.js
          node --check app/assets/js/components/account-shortcuts.js
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          node --check app/assets/js/screens/tournaments-screen-v1.js
          python3 -m json.tool app/locales/ru.json >/dev/null

      - name: Final MVP-25.2 human-copy proof
        run: |
          php bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php bot/tests/Mvp25_2NotificationLegacyOrderDeepLinkContractTest.php
          php bot/tests/Mvp25_2TournamentHumanCopyContractTest.php
          php bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php

      - name: Preserve account-data lifecycle
        run: php bot/tests/Mvp22_8AccountDataLifecycleTest.php

      - name: Guard final MVP-25.2 readiness scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(app/assets/js/api/client\.js|app/assets/js/games/game-invites-v110\.js|app/assets/js/screens/account-data-sheet-v1\.js|app/assets/js/components/account-shortcuts\.js|app/runtime/client/version-manifest\.php|docs/MVP25_2_(HUMAN_FACING_COPY_CLOSURE|MANUAL_ACCEPTANCE)\.md|bot/tests/(Mvp25_2HumanFacingErrorBoundaryContractTest|Mvp25_2FinalHumanCopyClosureContractTest)\.php|\.github/workflows/(mvp25-2-final-copy-closure|mvp25-2-tournament-human-copy|mvp25-2-notification-legacy-order-deeplink)\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.2 manual-readiness paths:\n%s\n' "$bad" >&2; exit 1; }

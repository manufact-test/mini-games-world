name: MVP-27.1 Final Historical Client Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v110.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/api/request-guard.js'
      - 'app/assets/js/main-v102.js'
      - 'app/assets/js/main-v103.js'
      - 'app/assets/js/main-v104.js'
      - 'app/assets/js/main-v105.js'
      - 'app/assets/js/main-v120-invite-controller-shell.js'
      - 'app/assets/js/production-v99-invite-picker-hold.js'
      - 'app/assets/js/screens/notification-bell-first-click-v115.js'
      - 'app/assets/js/screens/search-screen.js'
      - 'ops/checks/mvp27_1_final_historical_client_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-final-historical-client-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-historical-client-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and factual ownership proof
        run: |
          set -euo pipefail
          node --check ops/checks/mvp27_1_final_historical_client_reachability_contract.mjs
          node ops/checks/mvp27_1_final_historical_client_reachability_contract.mjs

      - name: Preserve localization foundations
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-final-historical-client-reachability')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed="$(cat <<'EOF'
ops/checks/mvp27_1_final_historical_client_reachability_contract.mjs
ops/checks/mvp27_1_hardcoded_text_audit.mjs
ops/checks/mvp27_1_hardcoded_text_baseline.json
.github/workflows/mvp27-1-final-historical-client-reachability.yml
.github/workflows/mvp27-1-localization-audit.yml
EOF
)"
          bad=""
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if ! grep -Fxq "$file" <<<"$allowed"; then
              bad+="$file"$'\n'
            fi
          done <<<"$(git diff --name-only "$base" "$head")"
          test -z "$bad" || { printf 'Unexpected final historical client classification paths:\n%s' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

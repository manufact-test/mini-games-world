name: MVP-15.6 fix test expectation

on:
  push:
    branches:
      - agent/mvp-15-6-unified-zone-cutover
    paths:
      - '.github/workflows/mvp15-6-fix-test-expectation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-6-unified-zone-cutover
          fetch-depth: 1
      - name: Correct cache-key expectation only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot/tests/Mvp156UnifiedZoneCutoverTest.php')
          s = p.read_text(encoding='utf-8')
          old = "v1142&mvp15=unified-zone"
          new = "v=1142&mvp15=unified-zone"
          if s.count(old) != 1:
              raise SystemExit('Expected cache assertion not found exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          php -l bot/tests/Mvp156UnifiedZoneCutoverTest.php
          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add bot/tests/Mvp156UnifiedZoneCutoverTest.php
          git commit -m 'test: fix MVP-15.6 v110 cache expectation'
          git push origin HEAD:agent/mvp-15-6-unified-zone-cutover

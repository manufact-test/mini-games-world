name: Apply scalar D2 terminal notification acceptance v2

on:
  push:
    branches:
      - agent/mvp14-d2-terminal-notification-scalar-acceptance
    paths:
      - .github/workflows/mvp14-d2-terminal-notification-scalar-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-notification-scalar-acceptance
          fetch-depth: 0

      - name: Apply scalar browser-context assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          e2e_path = Path('e2e/staging/d2-d3-d5-integration.spec.mjs')
          e2e = e2e_path.read_text(encoding='utf-8')

          anchor = """async function expectPlayerRequest(page, pathname, data, label) {
            const result = await postFromPlayer(page, pathname, data);
            expect(
              result.status,
              `${label}; public error: ${result.publicError || 'no_public_error'}`,
            ).toBe(200);
            expect(result.payload?.ok, `${label} payload`).toBe(true);
            return result.payload;
          }

          async function openPlayer"""
          replacement = """async function expectPlayerRequest(page, pathname, data, label) {
            const result = await postFromPlayer(page, pathname, data);
            expect(
              result.status,
              `${label}; public error: ${result.publicError || 'no_public_error'}`,
            ).toBe(200);
            expect(result.payload?.ok, `${label} payload`).toBe(true);
            return result.payload;
          }

          async function notificationByInviteToken(page, inviteToken) {
            return page.evaluate(async ({ inviteToken: expectedToken }) => {
              const sessionId = localStorage.getItem('mgw_device_session_id');
              const deviceId = localStorage.getItem('mgw_device_id');
              const response = await fetch('/bot/notifications.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({
                  markRead: true,
                  initData: '',
                  sessionId,
                  deviceId,
                }),
              });
              const payload = await response.json().catch(() => null);
              const items = Array.isArray(payload?.items) ? payload.items : [];
              const item = items.find(candidate =>
                String(candidate?.invite_token || '') === String(expectedToken || '')
              ) || null;
              return {
                status: response.status,
                ok: payload?.ok === true,
                publicError: typeof payload?.error === 'string' ? payload.error.slice(0, 300) : null,
                item,
                availableTokens: items.slice(0, 8).map(candidate => String(candidate?.invite_token || '')),
              };
            }, { inviteToken });
          }

          async function openPlayer"""
          if e2e.count(anchor) != 1:
              raise SystemExit('Expected one helper insertion anchor.')
          e2e = e2e.replace(anchor, replacement)

          old = """    const bNotifications = await expectPlayerRequest(
              playerB.page,
              '/bot/notifications.php',
              { markRead: true },
              'Player B cancelled invitation notifications',
            );
            const cancelledItem = (Array.isArray(bNotifications.items) ? bNotifications.items : [])
              .find(item => String(item?.invite_token || '') === directToken);
            expect(cancelledItem).toBeTruthy();
            expect(String(cancelledItem?.invite_status || '')).toMatch(/cancelled|canceled/);
            expect(Array.isArray(cancelledItem.actions) ? cancelledItem.actions : []).toEqual([]);"""
          new = """    const bNotification = await notificationByInviteToken(playerB.page, directToken);
            expect(
              bNotification.status,
              `Player B terminal notification status; public error: ${bNotification.publicError || 'no_public_error'}`,
            ).toBe(200);
            expect(bNotification.ok, 'Player B terminal notification payload').toBe(true);
            expect(
              bNotification.item,
              `Expected terminal token ${directToken}; first tokens: ${bNotification.availableTokens.join(', ')}`,
            ).toBeTruthy();
            expect(String(bNotification.item?.invite_status || '')).toMatch(/cancelled|canceled/);
            expect(Array.isArray(bNotification.item?.actions) ? bNotification.item.actions : []).toEqual([]);"""
          if e2e.count(old) != 1:
              raise SystemExit('Expected one large notification payload assertion.')
          e2e_path.write_text(e2e.replace(old, new), encoding='utf-8')

          contract_path = Path('bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php')
          contract = contract_path.read_text(encoding='utf-8')
          old_contract = """    && str_contains($e2e, 'otherParticipantTerminalStatusPresent: true'),
              'The live E2E must use the authoritative cancelled label and still prove the complete terminal-card behavior.');"""
          new_contract = """    && str_contains($e2e, 'async function notificationByInviteToken(page, inviteToken)')
              && str_contains($e2e, 'items.find(candidate =>')
              && str_contains($e2e, 'const bNotification = await notificationByInviteToken(playerB.page, directToken);')
              && str_contains($e2e, 'otherParticipantTerminalStatusPresent: true'),
              'The live E2E must use the authoritative cancelled label and return one token-matched notification from the browser context.');"""
          if contract.count(old_contract) != 1:
              raise SystemExit('Expected one integration contract assertion.')
          contract_path.write_text(contract.replace(old_contract, new_contract), encoding='utf-8')
          PY

          cat > bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $e2e = file_get_contents($root . '/e2e/staging/d2-d3-d5-integration.spec.mjs');
          if (!is_string($e2e)) throw new RuntimeException('Cannot read D2 integration E2E.');
          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $assert(str_contains($e2e, 'async function notificationByInviteToken(page, inviteToken)')
              && str_contains($e2e, "fetch('/bot/notifications.php'")
              && str_contains($e2e, 'items.find(candidate =>')
              && str_contains($e2e, "String(candidate?.invite_token || '') === String(expectedToken || '')"),
              'The browser context must reduce the authoritative notification response to one exact-token item.');
          $assert(str_contains($e2e, 'const bNotification = await notificationByInviteToken(playerB.page, directToken);')
              && str_contains($e2e, 'bNotification.item')
              && str_contains($e2e, 'bNotification.availableTokens.join'),
              'The Node test must assert only the scalar matched item and expose bounded diagnostics.');
          $assert(!str_contains($e2e, 'const bNotifications = await expectPlayerRequest(')
              && !str_contains($e2e, 'Array.isArray(bNotifications.items)'),
              'The large notification payload must not cross the Playwright structured-clone boundary.');
          $assert(str_contains($e2e, "toMatch(/cancelled|canceled/)")
              && str_contains($e2e, 'bNotification.item?.actions'),
              'The second player terminal status and non-actionable state must remain mandatory.');

          fwrite(STDOUT, "ProductionMvp14D2TerminalNotificationScalarAcceptanceTest: {$assertions} assertions passed\n");
          PHP

          sed -i 's/^          //' bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php

      - name: Run focused checks
        shell: bash
        run: |
          node --check e2e/staging/d2-d3-d5-integration.spec.mjs
          php -l bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php
          php -l bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php
          php bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php
          php bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php

      - name: Commit test-harness fix
        shell: bash
        run: |
          rm -f .github/workflows/mvp14-d2-terminal-notification-scalar-apply.yml
          rm -f .github/workflows/mvp14-d2-terminal-notification-scalar-apply-v2.yml
          git config user.name "manufact-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: match terminal notification inside browser context"
          git push origin HEAD:agent/mvp14-d2-terminal-notification-scalar-acceptance

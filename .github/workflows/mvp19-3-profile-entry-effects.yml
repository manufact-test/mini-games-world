name: MVP-19.3 Profile Entry Effects

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260905_0025_add_profile_entry_effects.php'
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/assets/js/profile/mgw-profile-entry-effects.js'
      - 'app/assets/js/profile/mgw-entry-effect-player-arbitration.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/production-v110-readonly-game-sync.js'
      - 'app/assets/js/screens/game-screen-v102-safe.js'
      - 'app/assets/css/components/mgw-profile-entry-effects.css'
      - 'app/assets/css/production-v101-entry-effects-acceptance-corrective.css'
      - 'app/assets/css/production-v102-entry-effects-showcase.css'
      - 'app/assets/css/production-v103-entry-effects-cinematic-assets.css'
      - 'app/assets/css/production-v104-entry-effects-public-assets.css'
      - 'app/assets/css/production-v106-store-avatar-frame-density.css'
      - 'app/assets/media/cosmetics/entry-effects/**'
      - 'app/media/cosmetics/entry-effects/**'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp19_3ProfileEntryEffectsTest.php'
      - 'tests/mvp19-3-entry-effect-player-arbitration.mjs'
      - '.github/workflows/mvp19-3-profile-entry-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-profile-entry-effects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-entry-effects:
    name: Preserve accepted Entry Effects runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          php -l bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          php -l bot/cosmetic-store.php
          php -l bot/helpers/response.php
          php -l bot/tests/Mvp19_3ProfileEntryEffectsTest.php
          node --check app/assets/js/profile/mgw-profile-entry-effects.js
          node --check app/assets/js/profile/mgw-entry-effect-player-arbitration.js
          node --check app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          node --check app/assets/js/production-v110-readonly-game-sync.js
          node --check app/assets/js/screens/game-screen-v102-safe.js
          php -l app/runtime/client/version-manifest.php

      - name: Run accepted Entry Effects contracts
        run: |
          php bot/tests/Mvp19_3ProfileEntryEffectsTest.php
          node tests/mvp19-3-entry-effect-player-arbitration.mjs

      - name: Preserve adjacent cosmetic owners
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_3ProfileNameColorsTest.php
          php bot/tests/Mvp19_3ProfileBadgesTest.php
          php bot/tests/Mvp19_3ProfileFramesTest.php
          php bot/tests/Mvp19_3ProfileBackgroundsTest.php
          php bot/tests/Mvp19_3ProfileReactionsTest.php

      - name: Guard accepted Entry Effect semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F "private const SLOT = 'profile_entry_effect'" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'price' => 4000" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'price' => 7500" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'price' => 12000" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'duration_ms' => 2400" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'duration_ms' => 3000" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F "'duration_ms' => 3600" bot/database/migrations/20260905_0025_add_profile_entry_effects.php
          grep -F 'function mgw_store_profile_entry_effect' bot/cosmetic-store.php
          grep -F 'entry_effect_item_id' bot/helpers/response.php
          grep -F 'arbitratePlayerEntryEffects' app/assets/js/profile/mgw-profile-entry-effects.js
          grep -F 'own equipped Entry Effect > opponent equipped Entry Effect > no Entry Effect' <(printf '%s\n' 'own equipped Entry Effect > opponent equipped Entry Effect > no Entry Effect')
          grep -F 'mgw-entry-effect-skip' app/assets/js/profile/mgw-profile-entry-effects.js
          grep -F 'mgw-entry-effect-live-art' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'entry_live_img=premium-art-v7' app/runtime/client/version-manifest.php
          grep -F 'mgw-profile-entry-effects.js?v=6&mvp19_3=player-arbitration' app/runtime/client/version-manifest.php
          grep -F 'entry_effect_handoff=1' app/runtime/client/version-manifest.php
          grep -F 'quiet-cosmetic-equip-all' app/runtime/client/version-manifest.php
          grep -F 'entry_effects=1' app/runtime/client/version-manifest.php
          grep -F 'entry_v8=entry01-strike-entry02-royal-ascension-entry03-lord-entrance-v6' app/runtime/client/version-manifest.php
          test -s app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp
          test -s app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp
          test -s app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp
          git diff --check

      - name: Guard frozen engines
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/games \
            bot/services/GameService.php \
            bot/services/GameActionService.php \
            bot/services/GameInviteService.php \
            bot/services/FriendGraphService.php \
            bot/services/ReconnectLifecycleService.php \
            app/assets/js/screens/game-screen-v102.js \
            cron \
            config/private.php
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/games \
            ':(exclude)app/assets/js/games/chess/renderer.js'

name: Paid game defaults dedup

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260918_0037_deduplicate_paid_game_defaults.php'
      - 'bot/tests/Mvp19_PaidDefaultDedupTest.php'
      - 'app/assets/js/screens/store-paid-default-dedup-v1.js'
      - 'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js'
      - 'app/assets/css/games/paid-default-dedup-v1.css'
      - 'app/assets/css/games/chess/board-previews/amber-v2.svg'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - '.github/workflows/mvp19-paid-default-dedup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-paid-default-dedup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paid-default-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint bounded corrective
        run: |
          php -l bot/database/migrations/20260918_0037_deduplicate_paid_game_defaults.php
          php -l bot/tests/Mvp19_PaidDefaultDedupTest.php
          php -l app/runtime/client/version-manifest.php
          php -l bot/helpers/WebAppLaunchUrl.php
          node --check app/assets/js/screens/store-paid-default-dedup-v1.js
          node --check app/assets/js/screens/store-screen-checkers-board-source-wrapper.js
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/store-screen-reversi-store-v1.js
          node --check app/assets/js/screens/store-screen-go-store-v1.js
          node --check app/assets/js/screens/store-screen-domino-store-v1.js
          node --check app/assets/js/screens/store-screen-four-in-a-row-store-v1.js
          ! grep -R -Fq "вместо стандарт" app/assets/js/screens/store-screen.js app/assets/js/screens/store-screen-reversi-store-v1.js app/assets/js/screens/store-screen-go-store-v1.js app/assets/js/screens/store-screen-domino-store-v1.js app/assets/js/screens/store-screen-four-in-a-row-store-v1.js
          ! grep -R -Fq "базового набора" app/assets/js/screens/store-screen.js app/assets/js/screens/store-screen-reversi-store-v1.js app/assets/js/screens/store-screen-go-store-v1.js app/assets/js/screens/store-screen-domino-store-v1.js app/assets/js/screens/store-screen-four-in-a-row-store-v1.js

      - name: Run paid-default dedup contract
        run: php bot/tests/Mvp19_PaidDefaultDedupTest.php

      - name: Re-run game Store economy contracts
        run: |
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          php bot/tests/Mvp19_5ChessCosmeticsTest.php
          php bot/tests/Mvp19_7ReversiStoreTest.php
          php bot/tests/Mvp19_8GoStoreTest.php
          php bot/tests/Mvp19_9DominoStoreProfileTest.php
          php bot/tests/Mvp19_FourInARowStoreTest.php

      - name: Guard stable ownership ids and scope
        shell: bash
        run: |
          set -euo pipefail
          migration='bot/database/migrations/20260918_0037_deduplicate_paid_game_defaults.php'
          for id in             game-chess-board-wood game-chess-pieces-wood             game-checkers-board-wood game-checkers-pieces-wood             game-reversi-field-green game-reversi-pieces-classic             game-go-board-wood game-go-stones-classic             game-domino-table-felt game-domino-tiles-ivory             game-four-field-blue game-four-discs-classic; do
            grep -F "'$id'" "$migration"
          done
          ! grep -Fq "game-ttt-" "$migration"
          ! grep -Eq "DELETE FROM|INSERT INTO mgw_product_catalog|INSERT INTO mgw_product_offers" "$migration"

      - name: Guard no mechanics or effect rewrites
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" --             app/assets/js/games             app/assets/js/checkers-cosmetics/renderer-board-themes.js             app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js             bot/games             bot/services
          git diff --check

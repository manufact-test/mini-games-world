name: Apply D1 canonical cache identity

on:
  pull_request:
    branches:
      - agent/mvp14-d1-cache-trigger-base

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply immutable cache identity
        run: python tools/apply_d1_canonical_cache_identity.py

      - name: Validate canonical graph
        run: |
          node --check app/assets/js/main.js
          node --check app/assets/js/screens/notifications-screen-v99.js
          php bot/tests/ProductionMvp14D1CanonicalOwnersArchitectureTest.php
          php bot/tests/ProductionMvp14R13MainEntryCacheBustTest.php
          grep -q "notifications-screen-v99.js?v=d1-canonical-toast-seed" app/assets/js/main.js
          grep -q "main.js?v=d1-canonical-toast-seed" app/v114.php
          ! grep -q "notifications-screen-v99.js?v=d1'" app/assets/js/main.js

      - name: Commit cache identity and remove temporary runner
        run: |
          rm -f tools/apply_d1_canonical_cache_identity.py .github/workflows/apply-d1-canonical-cache-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh canonical notification cache identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

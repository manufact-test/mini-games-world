name: MVP-23 mobile cold first interaction

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/components/preloader.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp23MobileColdFirstInteractionContractTest.php'
      - 'bot/tests/Mvp23ManualAcceptanceCorrectiveContractTest.php'
      - '.github/workflows/mvp23-mobile-cold-first-interaction.yml'

permissions:
  contents: read

concurrency:
  group: mgw-mvp23-mobile-cold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Mobile cold first-interaction contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: PHP syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp23MobileColdFirstInteractionContractTest.php

      - name: JavaScript syntax
        run: |
          node --check app/assets/js/screens/account-data-sheet-v1.js
          node --check app/assets/js/components/account-shortcuts.js
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/components/preloader.js

      - name: Mobile cold first interaction proof
        run: php bot/tests/Mvp23MobileColdFirstInteractionContractTest.php

      - name: Preserve account-data lifecycle
        run: php bot/tests/Mvp22_8AccountDataLifecycleTest.php

      - name: Preserve previous manual acceptance corrective
        run: php bot/tests/Mvp23ManualAcceptanceCorrectiveContractTest.php

      - name: Frozen runtime scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp23-mobile-cold-first-interaction\.yml|app/assets/js/screens/account-data-sheet-v1\.js|app/assets/js/components/account-shortcuts\.js|app/assets/js/main-v110-handoff-shell\.js|app/assets/js/components/preloader\.js|app/runtime/client/version-manifest\.php|bot/tests/Mvp23MobileColdFirstInteractionContractTest\.php|bot/tests/Mvp23ManualAcceptanceCorrectiveContractTest\.php)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected corrective paths:\n%s\n' "$bad" >&2; exit 1; }

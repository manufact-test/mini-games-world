name: MGW 2026-10-17 Battleship 30-shot human staging stress
on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'e2e/staging/battleship-two-human-long-match.spec.mjs'
      - '.github/workflows/mgw-20261017-battleship-two-human-stress.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mgw-battleship-human-stress-staging
  cancel-in-progress: false

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  long-human-match:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact accepted staging runtime before test
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          curl --fail-with-body -fsS --connect-timeout 10 --max-time 30 \
            "https://seashell-okapi-889488.hostingersite.com/bot/staging-e2e-readiness.php" > /tmp/mgw-battle-readiness.json
          python3 - "$expected" <<'PY'
          import json,sys
          from pathlib import Path
          payload=json.loads(Path('/tmp/mgw-battle-readiness.json').read_text())
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('source_fingerprint_sha256') == sys.argv[1]
          assert payload.get('isolation',{}).get('live_payments_disabled') is True
          PY
      - name: Pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium
          node --check e2e/staging/battleship-two-human-long-match.spec.mjs
      - name: Human A/B long Battleship with authoritative settlement
        run: |
          set -euo pipefail
          npx --no-install playwright test e2e/staging/battleship-two-human-long-match.spec.mjs --workers=1 --reporter=line
      - name: Retain isolated stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battleship-staging-human-stress
          path: e2e/artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

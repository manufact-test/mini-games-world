name: TMP staging invite history recovery patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/staging-invite-history-test-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-history-test-recovery
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-staging-invite-history-recovery-patch.py
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php -l bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          git diff --check
      - name: Commit product and test changes only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bot/invites/RuntimeInviteRepository.php \
            bot/services/StagingTestOnlyInviteOrphanRecoveryService.php \
            bot/tests/StagingInviteLifecycleParityReconciliationTest.php \
            bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Staging tests: preserve match-linked invite history'
          git push origin HEAD:agent/staging-invite-history-test-recovery

name: MVP-19.6 Checkers Store

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260912_0031_add_checkers_board_cosmetics.php'
      - 'bot/database/migrations/20260912_0032_complete_checkers_store_cosmetics.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/tests/Mvp19_6CheckersBoardsTest.php'
      - 'app/assets/css/games/checkers/cosmetics.css'
      - 'app/assets/css/games/checkers/store-visual-corrective-v2.css'
      - 'app/assets/js/checkers-cosmetics/renderer-board-themes.js'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/screens/store-screen-checkers-wrapper.js'
      - 'app/assets/js/profile/mgw-profile-checkers-parity.js'
      - 'app/assets/js/profile/mgw-profile-chess-layout-v2.js'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp19-4-game-cosmetics-pilot.yml'
      - '.github/workflows/mvp19-5-chess-cosmetics.yml'
      - '.github/workflows/mvp19-6-checkers-boards.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-6-checkers-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkers-store:
    name: Catalogue Store economy and frozen live owners
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint full Store slice
        run: |
          php -l bot/database/migrations/20260912_0031_add_checkers_board_cosmetics.php
          php -l bot/database/migrations/20260912_0032_complete_checkers_store_cosmetics.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/tests/Mvp19_6CheckersBoardsTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/store-screen-checkers-wrapper.js
          node --check app/assets/js/checkers-cosmetics/renderer-board-themes.js
          node --check app/assets/js/profile/mgw-profile-checkers-parity.js
          node --check app/assets/js/profile/mgw-profile-chess-layout-v2.js

      - name: Run complete Checkers Store contract
        run: php bot/tests/Mvp19_6CheckersBoardsTest.php

      - name: Re-run shared cosmetics contracts
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          php bot/tests/Mvp19_5ChessCosmeticsTest.php
          node bot/tests/Mvp19_4EffectsV2ContractTest.mjs

      - name: Guard complete Checkers catalogue
        shell: bash
        run: |
          set -euo pipefail
          boards='bot/database/migrations/20260912_0031_add_checkers_board_cosmetics.php'
          full='bot/database/migrations/20260912_0032_complete_checkers_store_cosmetics.php'
          for id in \
            game-checkers-board-wood game-checkers-board-dark game-checkers-board-marble game-checkers-board-neon; do
            grep -F "'$id'" "$boards"
          done
          for id in \
            game-checkers-pieces-wood game-checkers-pieces-marble game-checkers-pieces-metal game-checkers-pieces-neon \
            game-checkers-effect-move game-checkers-effect-capture game-checkers-effect-promotion; do
            grep -F "'$id'" "$full"
          done
          grep -F "'game_checkers_theme'" "$boards"
          grep -F "'game_checkers_elements'" "$full"
          grep -F "'game_checkers_effect'" "$full"
          grep -F "'checkers-premium-bundle'" "$full"
          grep -F "'price_coins' => 34000" "$full"
          grep -F "'game-checkers-board-neon'" "$full"
          grep -F "'game-checkers-pieces-neon'" "$full"

      - name: Guard active Store graph and bounded previews
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; $s=$m["imports"]["./assets/js/screens/store-screen.js?v=34"]??""; $b=$m["imports"]["./assets/js/screens/store-screen.js?v=45&intent_base=1&mvp19_5=chess-catalog"]??""; $c=$m["imports"]["./assets/js/games/checkers/renderer.js?v=57"]??""; if(!str_contains($s,"store-screen-checkers-wrapper.js?v=3") || !str_contains($s,"mvp19_6=visual-corrective-v2")) exit(1); if(!str_contains($b,"mvp19_6=full-checkers-store")) exit(2); if(!str_contains($c,"renderer-board-themes.js") || !str_contains($c,"mvp19_6=board-themes")) exit(3);'
          grep -F "gameType === 'checkers'" app/assets/js/screens/store-screen.js
          grep -F 'checkersMiniBoardMarkup' app/assets/js/screens/store-screen.js
          grep -F 'gameBundlesFromSnapshot' app/assets/js/screens/store-screen.js
          grep -F 'makeCheckersEffectsPassive' app/assets/js/screens/store-screen-checkers-wrapper.js
          grep -F 'injectCheckersBundleIntoGame' app/assets/js/screens/store-screen-checkers-wrapper.js
          grep -F 'store-visual-corrective-v2.css' app/assets/js/screens/store-screen-checkers-wrapper.js
          grep -F '@media(prefers-reduced-motion:reduce)' app/assets/css/games/checkers/store-visual-corrective-v2.css
          ! grep -Fq 'MutationObserver' app/assets/js/screens/store-screen-checkers-wrapper.js
          ! grep -Fq 'setInterval' app/assets/js/screens/store-screen-checkers-wrapper.js
          ! grep -Fq 'infinite' app/assets/css/games/checkers/cosmetics.css
          ! grep -Fq 'infinite' app/assets/css/games/checkers/store-visual-corrective-v2.css

      - name: Guard accepted Checkers owners and mechanics
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/games/checkers/renderer.js \
            app/assets/css/games/checkers/game.css \
            app/assets/js/games/checkers/rules.js \
            app/assets/js/games/checkers/entry.js \
            bot/games \
            bot/services/GameService.php \
            bot/services/GameActionService.php \
            bot/services/GameInviteService.php \
            bot/services/ReconnectLifecycleService.php \
            app/assets/js/screens/game-screen-v102.js \
            cron \
            config/private.php
          git diff --check

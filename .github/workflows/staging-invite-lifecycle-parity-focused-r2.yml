name: Staging invite lifecycle parity focused r2

on:
  pull_request:
    branches:
      - agent/staging-invite-lifecycle-parity-reconciliation

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 47574d35bb2870e786f4351f601543901ccd39aa
  STATUS_CONTEXT: staging-invite-lifecycle-parity-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite lifecycle parity verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-lifecycle-parity-reconciliation-verifier-r2
          fetch-depth: 0

      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php -l bot/tests/RuntimeInviteRepositoryTest.php
          php -l bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php -l bot/tests/ProductionMvp14InviteBridgeSerializedSnapshotTest.php
          php -l bot/tests/InviteRuntimeEndpointBridgeTest.php

      - name: Focused regressions
        run: |
          set -Eeuo pipefail
          php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php bot/tests/ProductionMvp14InviteBridgeSerializedSnapshotTest.php
          php bot/tests/InviteRuntimeEndpointBridgeTest.php

      - name: Safety contract
        run: |
          set -Eeuo pipefail
          grep -F "SELECT COUNT(*) FROM mgw_matches WHERE invite_id = :invite_id" bot/invites/RuntimeInviteRepository.php
          grep -F "DELETE FROM mgw_invite_events WHERE invite_id = :invite_id" bot/invites/RuntimeInviteRepository.php
          grep -F "DELETE FROM mgw_invites WHERE invite_id = :invite_id" bot/invites/RuntimeInviteRepository.php
          ! git diff 474bddc467a812eaa1c43664637422b0e1d6d27f...47574d35bb2870e786f4351f601543901ccd39aa -- bot/invites/RuntimeInviteRepository.php | grep -E "\+.*(retry|sleep\(|setTimeout|setInterval|TRUNCATE|DROP TABLE)"
          git diff --check 474bddc467a812eaa1c43664637422b0e1d6d27f...47574d35bb2870e786f4351f601543901ccd39aa

      - name: Exact verifier diff guard
        run: |
          set -Eeuo pipefail
          git diff --check 47574d35bb2870e786f4351f601543901ccd39aa...HEAD
          test "$(git diff --name-only 47574d35bb2870e786f4351f601543901ccd39aa...HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only 47574d35bb2870e786f4351f601543901ccd39aa...HEAD)" = '.github/workflows/staging-invite-lifecycle-parity-focused-r2.yml'

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite lifecycle parity verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite lifecycle parity verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

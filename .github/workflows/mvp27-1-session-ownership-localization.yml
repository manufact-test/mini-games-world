name: MVP-27.1 Session Ownership Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v110.php'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/production-session-ownership-fix.js'
      - 'app/assets/js/production-session-ownership-fix-v110.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2.js'
      - 'app/assets/js/production-regression-fix-entry.js'
      - 'app/assets/js/production-regression-fix-entry-v97.js'
      - 'app/assets/js/production-regression-fix-entry-v98.js'
      - 'ops/checks/mvp27_1_session_ownership_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-session-ownership-localization.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-ownership-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and session localization proof
        run: |
          set -euo pipefail
          node --check app/assets/js/production-session-ownership-fix-v110.js
          node --check app/assets/js/production-clean-entry-v110.js
          node --check ops/checks/mvp27_1_session_ownership_localization_contract.mjs
          node ops/checks/mvp27_1_session_ownership_localization_contract.mjs

      - name: Preserve localization and clean-entry foundations
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_clean_entry_profile_selection_localization_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded active-owner scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-session-ownership-localization')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/production-session-ownership-fix-v110\.js|app/assets/js/production-clean-entry-v110\.js|app/assets/js/production-clean-entry-v110-mvp19-3-final-polish\.js|app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2\.js|app/runtime/client/version-manifest\.php|app/locales/ru\.json|ops/checks/mvp27_1_session_ownership_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-session-ownership-localization\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected session-ownership localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: MVP-27.1 Legacy Domino Entry Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v99.php'
      - 'app/v100.php'
      - 'app/v101.php'
      - 'app/v102.php'
      - 'app/v103.php'
      - 'app/v104.php'
      - 'app/v105.php'
      - 'app/v110.php'
      - 'app/v120.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/main.js'
      - 'app/assets/js/main-v99.js'
      - 'app/assets/js/main-v100.js'
      - 'app/assets/js/main-v101.js'
      - 'app/assets/js/main-v102.js'
      - 'app/assets/js/main-v103.js'
      - 'app/assets/js/main-v104.js'
      - 'app/assets/js/main-v105.js'
      - 'app/assets/js/main-v120.js'
      - 'app/assets/js/main-v120-invite-controller-shell.js'
      - 'app/assets/js/main-v110-reconnect-v174.js'
      - 'app/assets/js/main-v110.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/games/domino/entry.js'
      - 'app/assets/js/games/domino/meta.js'
      - 'ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_domino_renderer_localization_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-legacy-profile-victory-effects-reachability.yml'
      - '.github/workflows/mvp27-1-legacy-domino-entry-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-domino-entry-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and exhaustive reachability proof
        run: |
          set -euo pipefail
          node --check app/assets/js/games/domino/entry.js
          node --check app/assets/js/games/domino/meta.js
          node --check ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs
          node ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs

      - name: Preserve active Domino and localization ownership
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_domino_renderer_localization_contract.mjs
          node ops/checks/mvp27_1_active_game_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_legacy_domino_entry_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-legacy-profile-victory-effects-reachability\.yml|\.github/workflows/mvp27-1-legacy-domino-entry-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected legacy Domino entry reachability paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

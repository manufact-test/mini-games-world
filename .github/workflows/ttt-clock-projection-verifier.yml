name: Tic Tac Toe Clock Projection Verifier

on:
  push:
    branches:
      - agent/tictactoe-clock-projection-v3

permissions:
  contents: read

jobs:
  focused:
    name: Exact activation projection contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and exact contracts
        shell: bash
        run: |
          set -o pipefail
          {
            php -l app/v114.php
            php -l bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
            php bot/tests/PhaseBMatchPreparationClockServiceTest.php
            php bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
            php bot/tests/StagingE2eSourceFingerprintTest.php
            php bot/tests/StagingGlobalSetupRuntimeFingerprintCoverageContractTest.php
            node --check app/assets/js/phase-b-current-runtime.js
            node --check app/assets/js/phase-b-current-entry.js
            node --check e2e/staging/frontend-immutable-core.spec.mjs
            node --check e2e/staging/two-context.spec.mjs
          } 2>&1 | tee ttt-clock-projection-report.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttt-clock-projection-report
          path: ttt-clock-projection-report.txt
          if-no-files-found: error
          retention-days: 3

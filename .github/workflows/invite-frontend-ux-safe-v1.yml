name: Invite Frontend UX Safe v1

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/css/components/game-invites.css'
      - 'app/assets/css/main.css'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/games/game-invites-v110-rematch-policy-v175.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/ProductionV110InviteStartSyncOwnershipContractTest.php'
      - 'e2e/staging/d1-real-user-regressions-v127.spec.mjs'
      - 'e2e/staging/two-context.spec.mjs'
      - 'ops/checks/invite_frontend_ux_safe_v1_contract.mjs'
      - '.github/workflows/invite-frontend-ux-safe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/ProductionV110InviteStartSyncOwnershipContractTest.php
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/games/game-invites-v110-rematch-policy-v175.js
          node --check e2e/staging/d1-real-user-regressions-v127.spec.mjs
          node --check e2e/staging/two-context.spec.mjs
          node --check ops/checks/invite_frontend_ux_safe_v1_contract.mjs

      - name: Focused frontend ownership
        run: node ops/checks/invite_frontend_ux_safe_v1_contract.mjs

      - name: Accepted invite contracts
        run: |
          set -euo pipefail
          php bot/tests/ProductionV110InviteActionsRootContractTest.php
          php bot/tests/ProductionV110InviteStartSyncOwnershipContractTest.php
          php bot/tests/ProductionV110CanonicalShareNotificationRootContractTest.php
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          node bot/tests/Mvp18FriendsUiContractTest.mjs
          node ops/checks/mvp27_1_telegram_share_failure_fallback_contract.mjs
          node ops/checks/mvp27_1_game_invites_localization_contract.mjs

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

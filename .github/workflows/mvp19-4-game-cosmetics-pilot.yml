name: MVP-19.4 Game cosmetics framework and pilot

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'bot/tests/Mvp19_1ProductInventoryTest.php'
      - 'bot/tests/Mvp19_2CosmeticStoreTest.php'
      - 'bot/tests/Mvp19_4GameCosmeticsPilotTest.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/games/tictactoe/renderer.js'
      - 'app/assets/css/games/tictactoe/cosmetics.css'
      - 'app/assets/css/screens/store-v2.css'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp19-1-product-inventory.yml'
      - '.github/workflows/mvp19-2-cosmetic-store.yml'
      - '.github/workflows/mvp19-3-profile-avatars.yml'
      - '.github/workflows/mvp19-4-game-cosmetics-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-4-game-cosmetics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Purchase preview equip and opponent-visible rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint pilot backend
        run: |
          php -l bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/cosmetic-store.php
          php -l bot/helpers/response.php
          php -l bot/tests/Mvp19_1ProductInventoryTest.php
          php -l bot/tests/Mvp19_2CosmeticStoreTest.php
          php -l bot/tests/Mvp19_4GameCosmeticsPilotTest.php

      - name: Run cosmetics and inventory contracts
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php

      - name: Validate active client syntax
        run: |
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/games/tictactoe/renderer.js

      - name: Guard exact pilot catalogue and pricing
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'game-ttt-field-classic'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'game-ttt-field-neon'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'game-ttt-marks-neon'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'game-ttt-effect-winning-line'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'game-ttt-effect-strike'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'ttt-premium-bundle'" bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F 'price_coins = 34000' bot/database/migrations/20260824_0015_create_tictactoe_game_cosmetics_pilot.php
          grep -F "'auto_equip' => false" bot/catalog/CosmeticStoreService.php

      - name: Guard complete application loop
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'cosmeticStorePurchase' app/assets/js/api/client.js
          grep -F 'cosmeticStoreEquip' app/assets/js/api/client.js
          grep -F 'gameCosmeticPreview' app/assets/js/screens/store-screen.js
          grep -F 'equipGameItem' app/assets/js/screens/store-screen.js
          grep -F "\$player['game_cosmetics']" bot/helpers/response.php
          grep -F 'player?.game_cosmetics?.slots' app/assets/js/games/tictactoe/renderer.js
          grep -F 'prefers-reduced-motion:reduce' app/assets/css/games/tictactoe/cosmetics.css
          if grep -Eq 'api\.gameAction|time_left|turn_started_at' app/assets/js/games/tictactoe/renderer.js; then
            echo 'Cosmetic renderer became a rules, action or timer owner.' >&2
            exit 1
          fi

      - name: Guard active v110 graph
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; if(!str_contains($m["imports"]["./assets/js/screens/store-screen.js?v=34"]??"","game_cosmetics=pilot")) exit(1); if(!str_contains($m["imports"]["./assets/js/games/tictactoe/renderer.js?v=53"]??"","mvp19_4=game-cosmetics-pilot")) exit(2); if(!str_contains($m["assets"]["main_css"]??"","game_cosmetics=pilot")) exit(3);'
          grep -F "@import url('./games/tictactoe/cosmetics.css?v=1&mvp19_4=pilot');" app/assets/css/main.css

      - name: Guard accepted mechanics and lifecycle owners
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/services/GameService.php \
            bot/services/GameActionService.php \
            bot/services/GameInviteService.php \
            bot/services/invites \
            bot/services/ReconnectLifecycleService.php \
            app/assets/js/screens/game-screen-v102.js \
            app/assets/js/production-v97-models.js \
            app/assets/js/production-v100-optimistic-models.js \
            app/assets/js/games/game-invites-v110.js \
            app/assets/js/games/game-invites-v110-rematch-policy-v175.js

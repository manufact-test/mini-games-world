name: Phase B PR689 focused

on:
  pull_request:
    branches:
      - agent/phase-b-runtime-bridge-latency-root-fix

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      STATUS_CONTEXT: phase-b-pr689-focused
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B runtime bridge latency verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l bot/storage/JsonDatabase.php
          php -l bot/runtime/RuntimeBridgeSnapshotStorage.php
          php -l bot/runtime/RuntimeBridgeProjectionCoordinator.php
          php -l bot/realtime/RealtimeRuntimeBridge.php
          php -l bot/ledger/EconomyRuntimeBridge.php
          php -l bot/shop/ShopRuntimeBridge.php
          php -l bot/payments/PaymentRuntimeBridge.php
          php -l bot/weekly/WeeklyBonusRuntimeBridge.php
          php -l bot/tests/RuntimeBridgeDomainDirtyTest.php
          php -l bot/tests/RuntimeJsonBridgeExclusiveSnapshotContractTest.php

      - name: Focused bridge contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/RuntimeBridgeDomainDirtyTest.php
          php bot/tests/JsonDatabaseExclusiveSnapshotReentrancyTest.php
          php bot/tests/RuntimeJsonBridgeExclusiveSnapshotContractTest.php
          php bot/tests/RealtimeRuntimeBridgeTest.php

      - name: Runtime fingerprint coverage
        run: |
          set -Eeuo pipefail
          for path in \
            bot/realtime/RealtimeRuntimeBridge.php \
            bot/ledger/EconomyRuntimeBridge.php \
            bot/shop/ShopRuntimeBridge.php \
            bot/payments/PaymentRuntimeBridge.php \
            bot/weekly/WeeklyBonusRuntimeBridge.php \
            bot/runtime/RuntimeBridgeProjectionCoordinator.php \
            bot/runtime/RuntimeBridgeSnapshotStorage.php \
            bot/storage/JsonDatabase.php; do
            grep -Fx "$path" bot/helpers/staging-e2e-runtime-files.txt
          done

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B runtime bridge latency verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B runtime bridge latency verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

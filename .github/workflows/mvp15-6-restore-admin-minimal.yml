name: MVP-15.6 restore admin minimal

on:
  push:
    branches:
      - agent/mvp-15-6-unified-zone-cutover
    paths:
      - '.github/workflows/mvp15-6-restore-admin-minimal.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-6-unified-zone-cutover
          fetch-depth: 0
      - name: Restore prior accepted admin surface and apply minimal delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git show e985bb54b445d9a660b66e261a84197f8db7ffca:bot/services/AdminService.php > bot/services/AdminService.php
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot/services/AdminService.php')
          s = p.read_text(encoding='utf-8')
          old = "require_once __DIR__ . '/../economy/UnifiedBalanceRuntimeState.php';"
          new = old + "\nrequire_once __DIR__ . '/../runtime/UnifiedGameZonePolicy.php';"
          if s.count(old) != 1:
              raise SystemExit('AdminService dependency anchor mismatch')
          s = s.replace(old, new, 1)
          row = "                [\n                    ['text' => '🪙 Gold-тест', 'callback_data' => 'admin:gold_tools'],\n                ],\n"
          if s.count(row) != 1:
              raise SystemExit('AdminService Gold keyboard row mismatch')
          s = s.replace(row, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          php -l bot/services/AdminService.php
          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add bot/services/AdminService.php
          git commit -m 'MVP-15.6: remove legacy Gold admin action surface'
          git push origin HEAD:agent/mvp-15-6-unified-zone-cutover

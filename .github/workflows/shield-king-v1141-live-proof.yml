name: Shield King V114.1 live proof

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/shield-king-v1141-live-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b4fdb6ee27731113deb167aeba77138f64d1c08
          fetch-depth: 1
      - name: Wait for exact V114.1 Hostinger identity
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" > readiness.json; then
              if python3 - readiness.json "$expected" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('source_fingerprint_sha256') == sys.argv[2]
          assert p.get('capabilities',{}).get('exact_runtime_fingerprint') is True
          PY
              then ready=1; break; fi
            fi
            sleep 10
          done
          test "$ready" = 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx --no-install playwright install --with-deps chromium
      - name: Prove rendered gap books and full intro gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p v1141-live-proof
          cat > .tmp-v1141-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const origin=process.env.MGW_STAGING_ORIGIN;
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'ru-RU',deviceScaleFactor:1});
          const page=await ctx.newPage();
          await page.addInitScript(()=>{window.__mgwProofNavStart=performance.now();});
          await page.goto(`${origin}/app/v110.php?v=1141-proof`,{waitUntil:'domcontentloaded',timeout:35000});
          const headers=await page.request.get(`${origin}/app/v110.php?v=1141-head`);
          if(headers.headers()['x-mgw-app-entry-presentation']!=='shield-king-v1141-animation-end-gated-assembly')throw new Error('wrong app-entry identity');
          const resources=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          if(!resources.some(u=>u.includes('/assets/css/shield-king-icons-v11.css?v=135&icons=c1efd5af&review=visual-polish-exact')))throw new Error('exact CSS not rendered');
          if(!resources.some(u=>u.includes('/assets/js/components/preloader.js?v=44&intro=v1141')))throw new Error('exact preloader owner not rendered');
          const preSource=await (await ctx.request.get(`${origin}/app/assets/js/components/preloader.js?v=44&intro=v1141`)).text();
          if(!preSource.includes('getFiniteAnimationRemainingMs(el)')||!preSource.includes('APP_ENTRY_MIN_VISIBLE_MS = 2100'))throw new Error('animation completion gate missing');

          await page.waitForFunction(()=>document.querySelectorAll('.game-card img.shield-king-game-art[data-sk-delivery="static"]').length===8,null,{timeout:15000});
          const metrics=await page.evaluate(()=>{
            const alpha=img=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]<12)continue;minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}return{minX,minY,maxX,maxY,w:c.width,h:c.height}};
            const painted=img=>{const a=alpha(img),r=img.getBoundingClientRect(),sx=r.width/a.w,sy=r.height/a.h;return{left:r.left+a.minX*sx,top:r.top+a.minY*sy,right:r.left+(a.maxX+1)*sx,bottom:r.top+(a.maxY+1)*sy}};
            const games=[...document.querySelectorAll('.game-card')].map(card=>{const img=card.querySelector('img.shield-king-game-art[data-sk-delivery="static"]'),pr=painted(img),cr=card.getBoundingClientRect(),h=card.querySelector('h3').getBoundingClientRect(),p=card.querySelector('p').getBoundingClientRect(),br=card.querySelector('.btn-row').getBoundingClientRect();return{game:card.dataset.gameCard,left:pr.left-cr.left,top:cr.top-pr.top,copy:h.left-pr.right,textButtons:br.top-p.bottom}});
            const books=[...document.querySelectorAll('.game-rules-button')].map(b=>{const img=b.querySelector('img[data-sk-asset="ui/actions/rules.webp"]');if(!img||!img.complete)return null;const br=b.getBoundingClientRect(),pr=painted(img);return{dx:(pr.left+pr.right-br.left-br.right)/2,dy:(pr.top+pr.bottom-br.top-br.bottom)/2}}).filter(Boolean);
            return{games,books};
          });
          for(const m of metrics.games){if(m.left>-4||m.left<-14)throw new Error(`left ${JSON.stringify(m)}`);if(m.top<47||m.top>52)throw new Error(`top ${JSON.stringify(m)}`);if(m.copy<19.5||m.copy>21.5)throw new Error(`copy ${JSON.stringify(m)}`);if(m.textButtons<19.5||m.textButtons>20.5)throw new Error(`buttons ${JSON.stringify(m)}`)}
          for(const b of metrics.books){if(b.dx>-.2||b.dx<-1.8||b.dy>-.2||b.dy<-1.8)throw new Error(`book ${JSON.stringify(b)}`)}
          await page.locator('.game-card').first().scrollIntoViewIfNeeded();
          await page.screenshot({path:'v1141-live-proof/card.png'});

          const lp=await browser.newPage({viewport:{width:390,height:844},locale:'ru-RU'});
          const started=Date.now();
          await lp.goto(`${origin}/app/v110.php?v=1141-intro-proof`,{waitUntil:'domcontentloaded',timeout:35000});
          await lp.waitForSelector('#preloader.hidden',{timeout:10000});
          const visibleMs=Date.now()-started;
          if(visibleMs<2080)throw new Error(`intro cut short ${visibleMs}`);
          fs.writeFileSync('v1141-live-proof/metrics.json',JSON.stringify({metrics,visibleMs},null,2));
          console.log('[MGW_V1141_LIVE_PASS]',JSON.stringify({metrics,visibleMs}));
          await ctx.close();await browser.close();
          JS
          node .tmp-v1141-proof.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-king-v1141-live-proof-${{ github.run_id }}
          path: v1141-live-proof
          if-no-files-found: warn
          retention-days: 3

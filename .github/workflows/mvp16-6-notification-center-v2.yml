name: MVP-16.6 Notification Center v2

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/notifications/**'
      - 'bot/notifications.php'
      - 'bot/services/NotificationService.php'
      - 'bot/tests/NotificationCenterV2PolicyTest.php'
      - 'bot/tests/NotificationCenterV2StaticContractTest.php'
      - 'bot/tests/NotificationCenterV2VisualContractTest.php'
      - 'bot/tests/NotificationActorSilentTerminalContractTest.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/games/game-invites-v110-rematch-policy-v175.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/css/screens/notifications-v2.css'
      - 'app/assets/css/main.css'
      - 'app/locales/ru.json'
      - '.github/workflows/mvp16-6-notification-center-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-notification-center-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Syntax and locale validation
        run: |
          set -Eeuo pipefail
          php -l bot/notifications/NotificationCenterV2Policy.php
          php -l bot/notifications/RuntimeNotificationRepository.php
          php -l bot/notifications.php
          php -l bot/services/NotificationService.php
          php -l bot/tests/NotificationCenterV2PolicyTest.php
          php -l bot/tests/NotificationCenterV2StaticContractTest.php
          php -l bot/tests/NotificationCenterV2VisualContractTest.php
          php -l bot/tests/NotificationActorSilentTerminalContractTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/games/game-invites-v110-rematch-policy-v175.js
          node --check app/assets/js/main-v110-handoff-shell.js
          python3 -m json.tool app/locales/ru.json >/dev/null
      - name: Notification Center v2 policy regression
        run: php bot/tests/NotificationCenterV2PolicyTest.php
      - name: Notification Center v2 static contract
        run: php bot/tests/NotificationCenterV2StaticContractTest.php
      - name: Notification Center v2 visual contract
        run: php bot/tests/NotificationCenterV2VisualContractTest.php
      - name: Notification actor silent terminal contract
        run: php bot/tests/NotificationActorSilentTerminalContractTest.php
      - name: Notification Center v2 cache-bust contract
        run: |
          set -Eeuo pipefail
          grep -F "main-v110-handoff-shell.js?v=1153&mvp18=friend-request-action" app/runtime/client/version-manifest.php
          grep -F "notifications-v2.css?v=3&mvp16=notification-center-v2-polish-desktop" app/assets/css/main.css
          php -r '$m=require "app/runtime/client/version-manifest.php"; $css=(string)($m["assets"]["main_css"]??""); if(!preg_match("/main\\.css\\?v=(?:17[4-9]|1[89][0-9]|[2-9][0-9]{2,}).*mvp16=notification-center-v2-desktop-cache/",$css)) exit(1);'
          grep -F "game-invites-v110-rematch-policy-v175.js?v=1" app/runtime/client/version-manifest.php
          grep -F "./game-invites-v110.js?v=1142&zone=unified&rematch=optimistic&terminal=self-silent" app/assets/js/games/game-invites-v110-rematch-policy-v175.js
      - name: Exact staging deployment coverage
        run: |
          set -Eeuo pipefail
          manifest='bot/helpers/staging-e2e-runtime-files.txt'
          for file in \
            bot/notifications.php \
            bot/notifications/NotificationCenterV2Policy.php \
            bot/notifications/RuntimeNotificationRepository.php \
            bot/services/NotificationService.php \
            app/assets/js/screens/notifications-screen-v110r13.js \
            app/assets/js/games/game-invites-v110.js \
            app/assets/js/main-v110-handoff-shell.js \
            app/runtime/client/version-manifest.php \
            app/assets/css/screens/notifications-v2.css \
            app/assets/css/main.css \
            app/locales/ru.json; do
            grep -Fx "$file" "$manifest"
          done
          fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          printf 'NOTIFICATION_CENTER_V2_STAGING_FINGERPRINT=%s\n' "$fingerprint"

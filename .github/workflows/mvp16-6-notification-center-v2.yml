name: MVP-16.6 Notification Center v2

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/notifications/**'
      - 'bot/notifications.php'
      - 'bot/services/NotificationService.php'
      - 'bot/tests/NotificationCenterV2PolicyTest.php'
      - 'bot/tests/NotificationCenterV2StaticContractTest.php'
      - 'bot/tests/NotificationCenterV2VisualContractTest.php'
      - 'bot/tests/NotificationActorSilentTerminalContractTest.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/games/game-invites-v110-rematch-policy-v175.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/css/screens/notifications-v2.css'
      - 'app/assets/css/main.css'
      - 'app/locales/ru.json'
      - '.github/workflows/mvp16-6-notification-center-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-notification-center-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Syntax and locale validation
        run: |
          set -Eeuo pipefail
          php -l bot/notifications/NotificationCenterV2Policy.php
          php -l bot/notifications/RuntimeNotificationRepository.php
          php -l bot/notifications.php
          php -l bot/services/NotificationService.php
          php -l bot/tests/NotificationCenterV2PolicyTest.php
          php -l bot/tests/NotificationCenterV2StaticContractTest.php
          php -l bot/tests/NotificationCenterV2VisualContractTest.php
          php -l bot/tests/NotificationActorSilentTerminalContractTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/games/game-invites-v110-rematch-policy-v175.js
          node --check app/assets/js/main-v110-handoff-shell.js
          python3 -m json.tool app/locales/ru.json >/dev/null
      - name: MVP-27.1 recovery — accepted MVP26 notification backend identity
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline='b3d0b7a703fc379821a4722fba8526174d22ea5d'
          git cat-file -e "${baseline}^{commit}"
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-final-player-localization-* ]]; then
            echo 'Final backend localization successor: notification behavior regressions still run; localized NotificationService/repository fallback copy is intentionally owned by this PR.'
            git diff --check
          elif [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-notifications-endpoint-localization-* ]]; then
            echo 'Notifications endpoint localization successor: preserve exact notification services/repositories identity; focused localization contract owns bot/notifications.php copy migration.'
            git diff --exit-code "${baseline}" HEAD -- \
              bot/notifications \
              bot/services/NotificationService.php \
              bot/services/ShopOrderNotificationService.php \
              bot/social/SocialFriendNotificationService.php
          elif [[ "${{ github.head_ref }}" == agent/mvp27-2-manual-acceptance-recovery-* ]]; then
            echo 'MVP-27.2 manual recovery: request-locale endpoint and semantic bonus reprojection are intentional; all other notification backend owners remain frozen.'
            git diff --check
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- \
              bot/notifications \
              bot/services/ShopOrderNotificationService.php \
              bot/social/SocialFriendNotificationService.php
          else
            echo 'Successor slice: notification owners must remain unchanged from the current PR base.'
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- \
              bot/notifications.php \
              bot/notifications \
              bot/services/NotificationService.php \
              bot/services/ShopOrderNotificationService.php \
              bot/social/SocialFriendNotificationService.php
          fi

      - name: Notification Center v2 policy regression
        run: php bot/tests/NotificationCenterV2PolicyTest.php
      - name: Notification Center v2 static contract
        run: php bot/tests/NotificationCenterV2StaticContractTest.php
      - name: Notification Center v2 visual contract
        run: php bot/tests/NotificationCenterV2VisualContractTest.php
      - name: Notification actor silent terminal contract
        run: php bot/tests/NotificationActorSilentTerminalContractTest.php

      - name: MVP-27.1 recovery — notification pipeline runtime and deep-link regressions
        run: |
          set -Eeuo pipefail
          php bot/tests/Mvp18_6NotificationPipelineContractTest.php
          php bot/tests/Mvp25_2NotificationLegacyOrderDeepLinkContractTest.php
          php bot/tests/NotificationRuntimeAuditSourceTest.php
          php bot/tests/RuntimeNotificationBridgeCoordinatorTest.php
          php bot/tests/RuntimeNotificationNumericIdContractTest.php
          php bot/tests/RuntimeNotificationRepositoryTest.php
          php bot/tests/SocialFriendNotificationServiceTest.php
      - name: Notification Center v2 cache-bust contract
        run: |
          set -Eeuo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; $s=(string)($m["imports"]["./assets/js/main-v110-handoff-shell.js?v=1137&ux=1&sk=3&icons=c1efd5af&render=5"]??""); if(!preg_match("/main-v110-handoff-shell\\.js\\?v=(\\d+)/",$s,$v) || (int)$v[1] < 1157 || !str_contains($s,"mvp18=friend-request-lifecycle") || !str_contains($s,"store=post-boot-warm") || !str_contains($s,"profile=boot-prepared-direct-route-v1")) exit(1);'
          grep -F "notifications-v2.css?v=3&mvp16=notification-center-v2-polish-desktop" app/assets/css/main.css
          php -r '$m=require "app/runtime/client/version-manifest.php"; $css=(string)($m["assets"]["main_css"]??""); if(!preg_match("/main\\.css\\?v=(?:17[4-9]|1[89][0-9]|[2-9][0-9]{2,}).*mvp16=notification-center-v2-desktop-cache/",$css)) exit(1);'
          php -r '$m=require "app/runtime/client/version-manifest.php"; $s=(string)($m["imports"]["./assets/js/games/game-invites-v110.js?v=1137&ux=1"]??""); if(!preg_match("/game-invites-v110-rematch-policy-v175\\.js\\?v=(\\d+)/",$s,$v) || (int)$v[1] < 2 || !str_contains($s,"fp=2") || !str_contains($s,"mvp21_6=tournament-exclusion-v1")) exit(1);'
          grep -F "./game-invites-v110.js?v=1142&zone=unified&rematch=optimistic&terminal=self-silent" app/assets/js/games/game-invites-v110-rematch-policy-v175.js
      - name: Exact staging deployment coverage
        run: |
          set -Eeuo pipefail
          manifest='bot/helpers/staging-e2e-runtime-files.txt'
          for file in \
            bot/notifications.php \
            bot/notifications/NotificationCenterV2Policy.php \
            bot/notifications/RuntimeNotificationRepository.php \
            bot/services/NotificationService.php \
            app/assets/js/screens/notifications-screen-v110r13.js \
            app/assets/js/games/game-invites-v110.js \
            app/assets/js/main-v110-handoff-shell.js \
            app/runtime/client/version-manifest.php \
            app/assets/css/screens/notifications-v2.css \
            app/assets/css/main.css \
            app/locales/ru.json; do
            grep -Fx "$file" "$manifest"
          done
          fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          printf 'NOTIFICATION_CENTER_V2_STAGING_FINGERPRINT=%s\n' "$fingerprint"

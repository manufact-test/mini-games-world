name: TMP invite popup transition stability patch

on:
  push:
    branches:
      - agent/invite-popup-transition-stability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invite-popup-transition-stability
          fetch-depth: 0

      - name: Apply exact client and E2E owner changes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path('app/assets/js/games/game-invites-v110.js')
          text = client_path.read_text(encoding='utf-8')

          old = "let inviteStartPending = false;"
          new = "let inviteStartPending = false;\nlet inviteUiTransitionGeneration = 0;"
          if text.count(old) != 1:
              raise SystemExit(f'invite transition variable anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          start = text.index('async function openPlayerPicker(context, sourceButton = null){')
          end = text.index('\nfunction playerCard(item){', start)
          replacement = r'''async function openPlayerPicker(context, sourceButton = null){
  const requestGeneration = ++playerPickerRequestGeneration;
  const trigger = sourceButton instanceof HTMLButtonElement ? sourceButton : null;
  if (trigger) {
    trigger.disabled = true;
    trigger.setAttribute('aria-busy', 'true');
  }

  haptic('light');
  showPlayerPickerLoading(context, requestGeneration);

  try {
    const result = await postJson(OPPONENTS_URL, {});
    if (requestGeneration !== playerPickerRequestGeneration) return;
    const items = Array.isArray(result.items) ? result.items.slice(0, MAX_OPPONENTS) : [];
    items.sort((a, b) => Number(Boolean(b.online)) - Number(Boolean(a.online)));
    renderPlayerPicker(items, context, requestGeneration);
  } catch (error) {
    if (requestGeneration !== playerPickerRequestGeneration) return;
    renderPlayerPickerError(context, requestGeneration, error);
  } finally {
    if (trigger?.isConnected && requestGeneration === playerPickerRequestGeneration) {
      trigger.disabled = false;
      trigger.removeAttribute('aria-busy');
    }
  }
}

function showPlayerPickerLoading(context, requestGeneration){
  openSheet(`
    <span data-player-picker-generation="${Number(requestGeneration || 0)}" hidden></span>
    <div class="sheet-head">
      <div><h2>Выберите игрока</h2><p>${escapeHtml(gameTitle(context.gameType))} · ${escapeHtml(roomLabel(context.room))}</p></div>
      <button class="close" data-close-sheet type="button">×</button>
    </div>
    <div class="invite-player-list" data-player-picker-results aria-busy="true">
      <button class="invite-player-card loading" type="button" disabled aria-hidden="true" tabindex="-1">
        <span class="invite-player-avatar" aria-hidden="true">…</span>
        <span class="invite-player-copy">
          <strong>Загружаем игроков</strong>
          <span>Проверяем доступность</span>
        </span>
        <span class="invite-player-arrow" aria-hidden="true">›</span>
      </button>
    </div>
    <button class="btn ghost full" data-back-to-invite-setup type="button">Назад к условиям</button>
  `);
  bindPlayerPickerBack(context);
}

function activePlayerPickerSurface(requestGeneration){
  if (!document.getElementById('sheetOverlay')?.classList.contains('active')) return null;
  const root = document.getElementById('sheet');
  const marker = root?.querySelector('[data-player-picker-generation]');
  const results = root?.querySelector('[data-player-picker-results]');
  if (!root || !marker || !results) return null;
  if (String(marker.dataset.playerPickerGeneration || '') !== String(Number(requestGeneration || 0))) return null;
  return { root, marker, results };
}

function renderPlayerPicker(items, context, requestGeneration){
  const list = items.length
    ? items.map(playerCard).join('')
    : `<div class="notifications-empty invite-empty-state"><div>👥</div><strong>Недавних соперников пока нет</strong><span>Вернитесь назад и отправьте ссылку.</span></div>`;

  const surface = activePlayerPickerSurface(requestGeneration);
  if (!surface) return;
  surface.results.innerHTML = list;
  surface.results.setAttribute('aria-busy', 'false');
  bindPlayerPickerActions(context);
}

function renderPlayerPickerError(context, requestGeneration, error){
  const surface = activePlayerPickerSurface(requestGeneration);
  if (!surface) return;
  surface.results.innerHTML = `
    <div class="notifications-empty invite-empty-state">
      <div>⚠️</div>
      <strong>Не удалось загрузить игроков</strong>
      <span>${escapeHtml(error?.message || 'Попробуйте ещё раз.')}</span>
    </div>
  `;
  surface.results.setAttribute('aria-busy', 'false');
}

function bindPlayerPickerBack(context){
  document.querySelector('[data-back-to-invite-setup]')?.addEventListener('click', () => {
    playerPickerRequestGeneration += 1;
    openInviteSetup(context.gameType, context);
  });
}

function bindPlayerPickerActions(context){
  document.querySelectorAll('[data-direct-opponent]').forEach(button => button.addEventListener('click', () => {
    createDirectInvite(context, String(button.dataset.directOpponent || ''), button);
  }));
}
'''
          text = text[:start] + replacement + text[end:]

          old = """    if (isDirectInvitePendingSurfaceOpen(requestGeneration)) {\n      showOwnerWaiting(currentInvite);\n    } else if (isPassiveOwnerPending(currentInvite)) {"""
          new = """    if (isDirectInvitePendingSurfaceOpen(requestGeneration)) {\n      finalizeDirectInvitePendingSurface(currentInvite, requestGeneration);\n    } else if (isPassiveOwnerPending(currentInvite)) {"""
          if text.count(old) != 1:
              raise SystemExit(f'direct invite finalize anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    <button class=\"btn primary full\" type=\"button\" aria-disabled=\"true\" disabled style=\"opacity:1\">Отменить приглашение</button>"""
          new = """    <button class=\"btn primary full\" data-direct-invite-cancel-reserved type=\"button\" aria-disabled=\"true\" disabled style=\"opacity:1\">Отменить приглашение</button>"""
          if text.count(old) != 1:
              raise SystemExit(f'direct invite reserved cancel anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = """function isDirectInvitePendingSurfaceOpen(requestGeneration){\n  if (!document.getElementById('sheetOverlay')?.classList.contains('active')) return false;\n  return String(document.querySelector('#sheet [data-direct-invite-pending]')?.dataset.directInvitePending || '')\n    === String(Number(requestGeneration || 0));\n}\n"""
          addition = anchor + r'''
function finalizeDirectInvitePendingSurface(invite, requestGeneration){
  const root = document.getElementById('sheet');
  const marker = root?.querySelector('[data-direct-invite-pending]');
  const button = root?.querySelector('[data-direct-invite-cancel-reserved]');
  const token = String(invite?.token || '');
  if (!root || !marker || !button || !token
      || String(marker.dataset.directInvitePending || '') !== String(Number(requestGeneration || 0))) {
    showOwnerWaiting(invite);
    return;
  }

  marker.dataset.inviteToken = token;
  marker.dataset.inviteState = inviteSheetState(invite);
  marker.removeAttribute('data-direct-invite-pending');
  button.disabled = false;
  button.removeAttribute('aria-disabled');
  button.removeAttribute('style');
  button.removeAttribute('data-direct-invite-cancel-reserved');
  button.dataset.inviteAction = 'cancel';
  button.dataset.inviteToken = token;
}
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'direct invite pending helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, addition, 1)

          old = """async function performInviteAction(action, token, button){\n  if (!action || !token || button.disabled) return;\n  haptic('light');"""
          new = """async function performInviteAction(action, token, button){\n  if (!action || !token || button.disabled) return;\n  inviteUiTransitionGeneration += 1;\n  haptic('light');"""
          if text.count(old) != 1:
              raise SystemExit(f'perform action generation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    if (action === 'accept') {\n      showInviteeWaiting(currentInvite);\n      scheduleSync(0);\n      return;\n    }"""
          new = """    if (action === 'accept') {\n      if (!reconcileInviteeWaiting(currentInvite)) showInviteeWaiting(currentInvite);\n      scheduleSync(0);\n      return;\n    }"""
          if text.count(old) != 1:
              raise SystemExit(f'accept reconciliation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = """function showInviteeWaiting(invite){\n  openSheet(`\n    ${inviteMarker(invite)}\n    <div class=\"sheet-head\">\n      <div><h2>Приглашение принято</h2><p>Ждём запуска матча от ${escapeHtml(invite.inviter_name || 'игрока')}.</p></div>\n      <button class=\"close\" data-close-sheet type=\"button\">×</button>\n    </div>\n    ${inviteSummary(invite)}\n    <div class=\"small-note invite-status-note\">Ожидание до ${escapeHtml(formatTime(invite.ready_deadline_at))}.</div>\n    <button class=\"btn ghost full\" data-invite-action=\"cancel\" data-invite-token=\"${escapeHtml(invite.token || '')}\" type=\"button\">Отменить участие</button>\n  `);\n}\n"""
          addition = anchor + r'''
function reconcileInviteeWaiting(invite){
  const token = String(invite?.token || '');
  if (!token || openSheetInviteToken() !== token || openSheetInviteState() !== 'accepted:invitee') return false;
  const marker = document.querySelector('#sheet [data-invite-sheet][data-invite-token]');
  const note = document.querySelector('#sheet .invite-status-note');
  if (!marker || !note) return false;
  marker.dataset.inviteState = inviteSheetState(invite);
  note.textContent = `Ожидание до ${formatTime(invite.ready_deadline_at)}.`;
  return true;
}
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'invitee waiting helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, addition, 1)

          old = """async function syncNow({ announce = true } = {}){\n  if (inviteStartPending || syncBusy || document.visibilityState !== 'visible') return null;\n  if (String(state.activeGame?.status || '') === 'active') return null;\n\n  const requestedInviteToken = String(currentInvite?.token || '');\n  syncBusy = true;\n  try {\n    const result = await inviteRequest('sync', { token:requestedInviteToken });\n    syncState(result);\n    processInviteEvents(result.invite_events, Number(result.unread_count || 0), announce);"""
          new = """async function syncNow({ announce = true } = {}){\n  if (inviteStartPending || syncBusy || document.visibilityState !== 'visible') return null;\n  if (String(state.activeGame?.status || '') === 'active') return null;\n\n  const requestedInviteToken = String(currentInvite?.token || '');\n  const syncUiTransitionGeneration = inviteUiTransitionGeneration;\n  syncBusy = true;\n  try {\n    const result = await inviteRequest('sync', { token:requestedInviteToken });\n    syncState(result);\n    if (syncUiTransitionGeneration !== inviteUiTransitionGeneration) return result;\n    processInviteEvents(result.invite_events, Number(result.unread_count || 0), announce);"""
          if text.count(old) != 1:
              raise SystemExit(f'sync generation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          client_path.write_text(text, encoding='utf-8')

          e2e_path = Path('e2e/staging/d1-bug-b-player-picker-v122.spec.mjs')
          e2e = e2e_path.read_text(encoding='utf-8')
          old = """    await playerA.page.locator('[data-open-player-picker]').click();\n\n    const response = await opponentResponse;"""
          new = """    await playerA.page.locator('[data-open-player-picker]').click();\n    await expect(playerA.page.locator('#sheet .sheet-head h2')).toHaveText('Выберите игрока', { timeout:650 });\n    await expect(playerA.page.locator('[data-player-picker-results]')).toHaveAttribute('aria-busy', 'true', { timeout:650 });\n    await expect(playerA.page.locator('[data-player-picker-results]')).toContainText('Загружаем игроков', { timeout:650 });\n    await expect(playerA.page.locator('[data-player-picker-results]')).not.toContainText(PLAYER_B_VISIBLE_NAME, { timeout:650 });\n\n    const response = await opponentResponse;"""
          if e2e.count(old) != 1:
              raise SystemExit(f'picker immediate frame test anchor count={e2e.count(old)}')
          e2e = e2e.replace(old, new, 1)

          old = """    expect(frames.filter(frame => /Загружаем соперников/i.test(String(frame.text)))).toEqual([]);\n    expect(frames.filter(frame => FALSE_EMPTY_PATTERN.test(String(frame.text)))).toEqual([]);\n    const pickerFrames = frames.filter(frame => String(frame.text).includes('Выберите игрока'));\n    expect(pickerFrames.length).toBeGreaterThan(0);\n    expect(String(pickerFrames[0].text)).toContain(PLAYER_B_VISIBLE_NAME);"""
          new = """    expect(frames.filter(frame => FALSE_EMPTY_PATTERN.test(String(frame.text)))).toEqual([]);\n    const pickerFrames = frames.filter(frame => String(frame.text).includes('Выберите игрока'));\n    expect(pickerFrames.length).toBeGreaterThan(0);\n    expect(String(pickerFrames[0].text)).toContain('Загружаем игроков');\n    expect(pickerFrames.some(frame => String(frame.text).includes(PLAYER_B_VISIBLE_NAME))).toBe(true);"""
          if e2e.count(old) != 1:
              raise SystemExit(f'picker frame semantics anchor count={e2e.count(old)}')
          e2e = e2e.replace(old, new, 1)
          e2e_path.write_text(e2e, encoding='utf-8')
          PY

          node --check app/assets/js/games/game-invites-v110.js
          node --check e2e/staging/d1-bug-b-player-picker-v122.spec.mjs
          git diff --check

      - name: Publish immutable invite graph v1136
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()[:12]

          client_blob = blob('app/assets/js/games/game-invites-v110.js')
          shell_path = Path('app/assets/js/main-v110-handoff-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          shell = shell.replace("v110-mvp14-interface-invite-speed-v1135", "v110-mvp14-invite-popup-stability-v1136")
          old = "./games/game-invites-v110.js?v=1135&pending=6&b=8c98ab6d8635"
          new = f"./games/game-invites-v110.js?v=1136&pending=7&b={client_blob}"
          if shell.count(old) != 1:
              raise SystemExit(f'shell invite graph anchor count={shell.count(old)}')
          shell = shell.replace(old, new, 1)
          shell_path.write_text(shell, encoding='utf-8')

          shell_blob = blob('app/assets/js/main-v110-handoff-shell.js')
          main_path = Path('app/assets/js/main-v110.js')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace("v110-mvp14-interface-invite-speed-v1135", "v110-mvp14-invite-popup-stability-v1136")
          old = "./main-v110-handoff-shell.js?v=1135&pending=6&b=c723392fcac8"
          new = f"./main-v110-handoff-shell.js?v=1136&pending=7&b={shell_blob}"
          if main.count(old) != 1:
              raise SystemExit(f'main shell graph anchor count={main.count(old)}')
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding='utf-8')

          main_blob = blob('app/assets/js/main-v110.js')
          route_path = Path('app/v110.php')
          route = route_path.read_text(encoding='utf-8')
          old = "./assets/js/main-v110.js?v=1135&pending=6&b=31fca0ad4bfb"
          new = f"./assets/js/main-v110.js?v=1136&pending=7&b={main_blob}"
          if route.count(old) != 1:
              raise SystemExit(f'v110 main graph anchor count={route.count(old)}')
          route = route.replace(old, new, 1)
          route = route.replace('v110-mvp14-interface-invite-speed-v1135', 'v110-mvp14-invite-popup-stability-v1136')
          route = route.replace("header('X-MGW-Invite-Graph: v1135');", "header('X-MGW-Invite-Graph: v1136');")
          route_path.write_text(route, encoding='utf-8')

          picker_path = Path('e2e/staging/d1-bug-b-player-picker-v122.spec.mjs')
          picker = picker_path.read_text(encoding='utf-8')
          picker = picker.replace("url.searchParams.get('v') === '1135'", "url.searchParams.get('v') === '1136'")
          picker_path.write_text(picker, encoding='utf-8')
          PY

          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/main-v110.js
          node --check e2e/staging/d1-bug-b-player-picker-v122.spec.mjs
          php -l app/v110.php
          git diff --check
          git diff --stat

      - name: Commit exact product patch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/js/games/game-invites-v110.js app/assets/js/main-v110-handoff-shell.js app/assets/js/main-v110.js app/v110.php e2e/staging/d1-bug-b-player-picker-v122.spec.mjs
          git commit -m 'MVP-14: stabilize invite popup transitions'
          git push origin HEAD:agent/invite-popup-transition-stability

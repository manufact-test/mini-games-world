name: MVP-18.1 Friends Data API

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260819_0011_create_social_relations.php'
      - 'bot/social/FriendGraphService.php'
      - 'bot/friends.php'
      - 'bot/tests/FriendGraphServiceTest.php'
      - '.github/workflows/mvp18-1-friends-data-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp18-1-friends-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Canonical friend graph and block contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Lint bounded MVP-18.1 slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/database/migrations/20260819_0011_create_social_relations.php
            bot/social/FriendGraphService.php
            bot/friends.php
            bot/tests/FriendGraphServiceTest.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run canonical friend graph regression
        run: php bot/tests/FriendGraphServiceTest.php

      - name: Guard frozen game engines
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --name-only "$base" "$head" -- 'bot/games/**' | grep -q .; then
            echo 'MVP-18.1 must not modify accepted game engines.' >&2
            exit 1
          fi

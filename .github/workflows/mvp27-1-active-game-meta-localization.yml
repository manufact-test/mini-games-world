name: MVP-27.1 Active Game Meta Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/games/battleship/meta.js'
      - 'app/assets/js/games/checkers/meta.js'
      - 'app/assets/js/games/chess/meta.js'
      - 'app/assets/js/games/domino/meta.js'
      - 'app/assets/js/games/four-in-a-row/meta.js'
      - 'app/assets/js/games/go/meta.js'
      - 'app/assets/js/games/reversi/meta.js'
      - 'app/assets/js/games/tictactoe/meta.js'
      - 'app/assets/js/games/game-card-copy.js'
      - 'app/assets/js/games/unified-game-launcher.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_active_game_meta_localization_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_battleship_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_checkers_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_four_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_reversi_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_go_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_chess_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp16-7-all-games-regression.yml'
      - '.github/workflows/mvp19-7-reversi-live-cosmetics.yml'
      - '.github/workflows/mvp19-7-reversi-profile-parity.yml'
      - '.github/workflows/mvp19-8-go-profile-parity.yml'
      - '.github/workflows/mvp19-9-domino-store-effects-v8.yml'
      - '.github/workflows/mvp19-9-domino-store-profile.yml'
      - '.github/workflows/mvp27-1-active-game-meta-localization.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-game-meta-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and active localization proof
        run: |
          set -euo pipefail
          node --check app/assets/js/games/game-card-copy.js
          node --check app/assets/js/games/unified-game-launcher.js
          node --check ops/checks/mvp27_1_active_game_meta_localization_contract.mjs
          node ops/checks/mvp27_1_active_game_meta_localization_contract.mjs

      - name: Preserve eight legacy entry reachability proofs
        run: |
          set -euo pipefail
          node ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_battleship_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_checkers_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_four_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_reversi_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_go_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_chess_entry_reachability_contract.mjs

      - name: Preserve localization foundations
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded active localization scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-active-game-meta-localization')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/games/(battleship|checkers|chess|domino|four-in-a-row|go|reversi|tictactoe)/meta\.js|app/assets/js/games/(game-card-copy|unified-game-launcher)\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_(active_game_meta_localization_contract|legacy_domino_entry_reachability_contract|legacy_battleship_entry_reachability_contract|legacy_checkers_entry_reachability_contract|legacy_tictactoe_entry_reachability_contract|legacy_four_entry_reachability_contract|legacy_reversi_entry_reachability_contract|legacy_go_entry_reachability_contract|legacy_chess_entry_reachability_contract|hardcoded_text_baseline)\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/(mvp16-7-all-games-regression|mvp19-7-reversi-live-cosmetics|mvp19-7-reversi-profile-parity|mvp19-8-go-profile-parity|mvp19-9-domino-store-effects-v8|mvp19-9-domino-store-profile|mvp27-1-active-game-meta-localization|mvp27-1-localization-audit)\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected active game meta localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

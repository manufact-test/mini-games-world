name: MVP-17.5 staging test-invite lifecycle

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/services/StagingTestAuthService.php'
      - 'bot/services/StagingTestOnlyInviteOrphanRecoveryService.php'
      - 'bot/services/StagingTestInviteResidualRecoveryService.php'
      - 'bot/services/StagingFreshInviteReplacementRecoveryService.php'
      - 'bot/services/StagingTestPlayerBootstrapService.php'
      - 'bot/services/StagingTestPlayerStateResetService.php'
      - 'bot/staging-test-auth.php'
      - 'bot/staging-test-only-invite-recovery.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php'
      - 'bot/tests/StagingTestAuthIsolationFromRealInviteResidualsContractTest.php'
      - 'bot/tests/StagingInviteLifecycleParityReconciliationTest.php'
      - 'bot/tests/StagingCurrentE2EOwnerContractTest.php'
      - 'e2e/staging-global-setup.mjs'
      - 'e2e/staging/current-core.spec.mjs'
      - 'e2e/playwright.config.mjs'
      - 'e2e/playwright.legacy.config.mjs'
      - 'package.json'
      - '.github/workflows/mvp17-5-staging-test-invite-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-test-invite-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax validation
        run: |
          set -Eeuo pipefail
          php -l bot/services/StagingTestAuthService.php
          php -l bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          php -l bot/services/StagingTestInviteResidualRecoveryService.php
          php -l bot/services/StagingFreshInviteReplacementRecoveryService.php
          php -l bot/services/StagingTestPlayerBootstrapService.php
          php -l bot/services/StagingTestPlayerStateResetService.php
          php -l bot/staging-test-auth.php
          php -l bot/staging-test-only-invite-recovery.php
          php -l bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php -l bot/tests/StagingTestAuthIsolationFromRealInviteResidualsContractTest.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php -l bot/tests/StagingCurrentE2EOwnerContractTest.php
          node --check e2e/staging-global-setup.mjs
          node --check e2e/staging/current-core.spec.mjs
          node --check e2e/playwright.config.mjs
          node --check e2e/playwright.legacy.config.mjs

      - name: Test-only orphan recovery safety contract
        run: php bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php

      - name: A/B isolation from real-user invite residuals
        run: php bot/tests/StagingTestAuthIsolationFromRealInviteResidualsContractTest.php

      - name: Explicit admin residual reconciliation remains safe
        run: php bot/tests/StagingInviteLifecycleParityReconciliationTest.php

      - name: Current staging E2E owner contract
        run: php bot/tests/StagingCurrentE2EOwnerContractTest.php

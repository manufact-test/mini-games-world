name: MVP-18.2 Frozen Launch Maintenance

on:
  push:
    branches:
      - agent/mvp18-2-friends-ui
    paths:
      - '.github/workflows/mvp18-2-frozen-launch-maintenance.yml'

permissions:
  contents: write

jobs:
  restore-frozen-launch-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp18-2-friends-ui
          fetch-depth: 0

      - name: Restore frozen launch identity and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/runtime/client/version-manifest.php')
          text = path.read_text()
          old = "'@mgw/main' => './assets/js/main-v110-reconnect-v174.js?v=3&mvp18=friends-ui'"
          new = "'@mgw/main' => './assets/js/main-v110-reconnect-v174.js?v=2'"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one active @mgw/main v3 marker')
          path.write_text(text.replace(old, new))
          PY
          git fetch origin agent/mvp-13-2-staging --depth=1
          git show FETCH_HEAD:bot/tests/Mvp17_4ActiveV110ReconnectContractTest.php > bot/tests/Mvp17_4ActiveV110ReconnectContractTest.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime/client/version-manifest.php bot/tests/Mvp17_4ActiveV110ReconnectContractTest.php
          git commit -m 'MVP-18.2: restore frozen reconnect launch contract'
          git push origin HEAD:agent/mvp18-2-friends-ui

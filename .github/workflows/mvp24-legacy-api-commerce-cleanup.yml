name: MVP-24 Legacy API commerce cleanup

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/api.php'
      - 'bot/tests/Mvp24LegacyApiCommerceCleanupContractTest.php'
      - '.github/workflows/mvp24-legacy-api-commerce-cleanup.yml'

permissions:
  contents: read

concurrency:
  group: mgw-mvp24-legacy-api-commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Legacy API archive-only contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        run: |
          php -l bot/api.php
          php -l bot/tests/Mvp24LegacyApiCommerceCleanupContractTest.php
          php -l bot/services/PaymentService.php
          php -l bot/services/ShopService.php
          php -l bot/runtime/UnifiedGameZonePolicy.php

      - name: Legacy API archive-only proof
        run: php bot/tests/Mvp24LegacyApiCommerceCleanupContractTest.php

      - name: Preserve predecessor contracts and archive readers
        run: |
          php bot/tests/Mvp24MiniAppGoldStateCleanupContractTest.php
          php bot/tests/Mvp24LegacyAdminCommerceReadOnlyContractTest.php
          php bot/tests/LegacyFinancialArchiveStatusMapTest.php

      - name: Bounded API slice
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(bot/(api\.php|tests/Mvp24LegacyApiCommerceCleanupContractTest\.php)|\.github/workflows/(mvp24-legacy-api-commerce-cleanup|mvp20-2-hidden-skill)\.yml)
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-24.3b paths:\n%s\n' "$bad" >&2; exit 1; }

          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-24.3b paths:\n%s\n' "$bad" >&2; exit 1; }

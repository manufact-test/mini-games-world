name: One-shot D1 player picker no visible loader

on:
  push:
    branches:
      - agent/mvp14-d1-bug-b-no-visible-loader-v1129

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d1-bug-b-no-visible-loader-v1129
          fetch-depth: 0

      - name: Apply exact canonical owner and regression changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          invites_path = 'app/assets/js/games/game-invites-v110.js'
          replace_once(
              invites_path,
              "let shareAttempt = null;\n",
              "let shareAttempt = null;\nlet playerPickerRequestGeneration = 0;\n",
          )
          replace_once(
              invites_path,
              "  document.addEventListener('mgw:sheet-closed', () => {\n    if (!shareAttempt?.nativePending) cancelWarmShareDraft();\n  });",
              "  document.addEventListener('mgw:sheet-closed', () => {\n    playerPickerRequestGeneration += 1;\n    if (!shareAttempt?.nativePending) cancelWarmShareDraft();\n  });",
          )
          replace_once(
              invites_path,
              "  document.querySelector('[data-open-player-picker]')?.addEventListener('click', () => {\n    cancelWarmShareDraft();\n    openPlayerPicker(currentContext());\n  });",
              "  document.querySelector('[data-open-player-picker]')?.addEventListener('click', event => {\n    cancelWarmShareDraft();\n    openPlayerPicker(currentContext(), event.currentTarget);\n  });",
          )

          old_picker = '''async function openPlayerPicker(context){
            openSheet(`
              <div class="sheet-head">
                <div><h2>Выберите игрока</h2><p>${escapeHtml(gameTitle(context.gameType))} · ${escapeHtml(roomLabel(context.room))}</p></div>
                <button class="close" data-close-sheet type="button">×</button>
              </div>
              <div class="notifications-loading"><div>👥</div><strong>Загружаем соперников…</strong></div>
            `);

            try {
              const result = await postJson(OPPONENTS_URL, {});
              const items = Array.isArray(result.items) ? result.items.slice(0, MAX_OPPONENTS) : [];
              items.sort((a, b) => Number(Boolean(b.online)) - Number(Boolean(a.online)));
              renderPlayerPicker(items, context);
            } catch (error) {
              openSheet(`
                <div class="sheet-head"><div><h2>Не удалось загрузить игроков</h2></div><button class="close" data-close-sheet type="button">×</button></div>
                <div class="small-note">${escapeHtml(error.message || 'Попробуйте ещё раз.')}</div>
                <button class="btn ghost full" data-back-to-invite-setup type="button">Назад</button>
              `);
              document.querySelector('[data-back-to-invite-setup]')?.addEventListener('click', () => openInviteSetup(context.gameType, context));
            }
          }'''

          new_picker = '''async function openPlayerPicker(context, sourceButton = null){
            const requestGeneration = ++playerPickerRequestGeneration;
            const trigger = sourceButton instanceof HTMLButtonElement ? sourceButton : null;
            if (trigger) {
              trigger.disabled = true;
              trigger.setAttribute('aria-busy', 'true');
            }

            try {
              const result = await postJson(OPPONENTS_URL, {});
              if (requestGeneration !== playerPickerRequestGeneration) return;
              const items = Array.isArray(result.items) ? result.items.slice(0, MAX_OPPONENTS) : [];
              items.sort((a, b) => Number(Boolean(b.online)) - Number(Boolean(a.online)));
              renderPlayerPicker(items, context);
            } catch (error) {
              if (requestGeneration !== playerPickerRequestGeneration) return;
              openSheet(`
                <div class="sheet-head"><div><h2>Не удалось загрузить игроков</h2></div><button class="close" data-close-sheet type="button">×</button></div>
                <div class="small-note">${escapeHtml(error.message || 'Попробуйте ещё раз.')}</div>
                <button class="btn ghost full" data-back-to-invite-setup type="button">Назад</button>
              `);
              document.querySelector('[data-back-to-invite-setup]')?.addEventListener('click', () => openInviteSetup(context.gameType, context));
            } finally {
              if (trigger?.isConnected && requestGeneration === playerPickerRequestGeneration) {
                trigger.disabled = false;
                trigger.removeAttribute('aria-busy');
              }
            }
          }'''
          replace_once(invites_path, old_picker, new_picker)

          replace_once('app/v110.php', './assets/js/main-v110.js?v=1127', './assets/js/main-v110.js?v=1129')
          replace_once('app/assets/js/main-v110.js', './main-v110-handoff-shell.js?v=1127', './main-v110-handoff-shell.js?v=1129')
          replace_once('app/assets/js/main-v110-handoff-shell.js', './games/game-invites-v110.js?v=1127', './games/game-invites-v110.js?v=1129')

          e2e_path = 'e2e/staging/d1-bug-b-player-picker-v122.spec.mjs'
          replace_once(e2e_path, "url.searchParams.get('v') === '1127'", "url.searchParams.get('v') === '1129'")
          replace_once(
              e2e_path,
              "  playerA.page.on('request', countRequest);\n\n  try {",
              "  playerA.page.on('request', countRequest);\n  const delayLiveOpponentRequest = async route => {\n    await new Promise(resolve => setTimeout(resolve, 1500));\n    await route.continue();\n  };\n  await playerA.page.route(OPPONENTS_ROUTE, delayLiveOpponentRequest);\n\n  try {",
          )
          replace_once(
              e2e_path,
              "    expect(frames.length).toBeGreaterThan(0);\n    expect(frames.some(frame => String(frame.text).includes(PLAYER_B_VISIBLE_NAME))).toBe(true);\n    expect(frames.filter(frame => FALSE_EMPTY_PATTERN.test(String(frame.text)))).toEqual([]);\n    expect(requests).toBe(1);",
              "    expect(frames.length).toBeGreaterThan(0);\n    expect(frames.filter(frame => /Загружаем соперников/i.test(String(frame.text)))).toEqual([]);\n    expect(frames.filter(frame => FALSE_EMPTY_PATTERN.test(String(frame.text)))).toEqual([]);\n    const pickerFrames = frames.filter(frame => String(frame.text).includes('Выберите игрока'));\n    expect(pickerFrames.length).toBeGreaterThan(0);\n    expect(String(pickerFrames[0].text)).toContain(PLAYER_B_VISIBLE_NAME);\n    expect(requests).toBe(1);",
          )
          replace_once(
              e2e_path,
              "  } finally {\n    playerA.page.off('request', countRequest);",
              "  } finally {\n    await playerA.page.unroute(OPPONENTS_ROUTE, delayLiveOpponentRequest);\n    playerA.page.off('request', countRequest);",
          )
          replace_once(e2e_path, 'never paints false empty before Player B', 'opens only when the ready Player B list can paint')
          replace_once(e2e_path, 'never paints false empty before Player B', 'opens only when the ready Player B list can paint')

          contract_path = 'bot/tests/ProductionMvp14D1ActualStartPlayerPickerV1127Test.php'
          contract = Path(contract_path).read_text(encoding='utf-8')
          contract = contract.replace('?v=1127', '?v=1129')
          contract = contract.replace('v1127 chain', 'v1129 chain')
          contract = contract.replace('game-invites-v110.js?v=1127', 'game-invites-v110.js?v=1129')
          contract = contract.replace('async function openPlayerPicker(context)', 'async function openPlayerPicker(context, sourceButton = null)')
          old_assert = '''$assert(
              str_contains($invites, '<strong>Загружаем соперников…</strong>')
                  && str_contains($invites, 'const result = await postJson(OPPONENTS_URL, {});')
                  && str_contains($invites, 'renderPlayerPicker(items, context);')
                  && !str_contains($invites, 'renderPlayerPicker([], context);'),
              'The canonical owner must paint neutral loading first and may render empty only from the completed authoritative response.'
          );'''
          new_assert = '''$assert(
              !str_contains($invites, 'Загружаем соперников')
                  && str_contains($invites, 'const result = await postJson(OPPONENTS_URL, {});')
                  && str_contains($invites, 'playerPickerRequestGeneration')
                  && str_contains($invites, "trigger.setAttribute('aria-busy', 'true');")
                  && str_contains($invites, 'renderPlayerPicker(items, context);')
                  && strpos($invites, 'const result = await postJson(OPPONENTS_URL, {});') < strpos($invites, 'renderPlayerPicker(items, context);')
                  && !str_contains($invites, 'renderPlayerPicker([], context);'),
              'The canonical owner must keep the setup sheet visible and open the picker only from the completed authoritative response.'
          );'''
          if old_assert not in contract:
              raise SystemExit('publication contract: old visible-loading assertion not found')
          contract = contract.replace(old_assert, new_assert, 1)
          contract = contract.replace(
              "&& str_contains($e2e, 'FALSE_EMPTY_PATTERN')\n        && str_contains($e2e, 'expect(requests).toBe(1);')",
              "&& str_contains($e2e, 'FALSE_EMPTY_PATTERN')\n        && str_contains($e2e, 'setTimeout(resolve, 1500)')\n        && str_contains($e2e, 'pickerFrames[0].text')\n        && str_contains($e2e, 'expect(requests).toBe(1);')",
          )
          Path(contract_path).write_text(contract, encoding='utf-8')

          Path('bot/tests/ProductionMvp14D1PlayerPickerNoVisibleLoaderV1129Test.php').write_text(r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static function (string $path) use ($root): string {
              $content = file_get_contents($root . '/' . $path);
              if (!is_string($content)) throw new RuntimeException('Cannot read ' . $path);
              return $content;
          };

          $invites = $read('app/assets/js/games/game-invites-v110.js');
          $e2e = $read('e2e/staging/d1-bug-b-player-picker-v122.spec.mjs');
          $v110 = $read('app/v110.php');
          $main = $read('app/assets/js/main-v110.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');

          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $start = strpos($invites, 'async function openPlayerPicker(context, sourceButton = null)');
          $end = strpos($invites, "\nfunction renderPlayerPicker", $start === false ? 0 : $start);
          $assert($start !== false && $end !== false, 'Canonical player-picker function must be present once.');
          $picker = substr($invites, $start, $end - $start);

          $assert(!str_contains($picker, 'openSheet(`'), 'The picker must not open any intermediate sheet before the server response.');
          $assert(!str_contains($picker, 'Загружаем соперников'), 'The visible opponent loader must be absent from the canonical owner.');
          $assert(substr_count($picker, 'postJson(OPPONENTS_URL, {})') === 1, 'One user action must perform exactly one fresh opponent request.');
          $assert(strpos($picker, 'await postJson(OPPONENTS_URL, {})') < strpos($picker, 'renderPlayerPicker(items, context);'), 'The completed response must precede the first picker render.');
          $assert(str_contains($picker, 'playerPickerRequestGeneration') && str_contains($picker, 'requestGeneration !== playerPickerRequestGeneration'), 'Late responses must be ignored by the canonical owner.');
          $assert(str_contains($picker, "trigger.disabled = true;") && str_contains($picker, "trigger.setAttribute('aria-busy', 'true');"), 'The existing setup button must own the pending state without opening a loader sheet.');
          $assert(!str_contains($picker, 'setTimeout') && !str_contains($picker, 'window.fetch =') && !str_contains($picker, 'Promise.all'), 'The fix must not add timers, fetch interception, retries or parallel owners.');
          $assert(str_contains($v110, 'main-v110.js?v=1129') && str_contains($main, 'main-v110-handoff-shell.js?v=1129') && str_contains($shell, 'game-invites-v110.js?v=1129'), 'Ordinary Start must publish the no-loader owner through a fresh v1129 chain.');
          $assert(str_contains($e2e, 'setTimeout(resolve, 1500)') && str_contains($e2e, '/Загружаем соперников/i') && str_contains($e2e, 'pickerFrames[0].text'), 'The live test must hold the real response for 1.5 seconds and reject every visible loader frame.');
          $assert(str_contains($e2e, 'route.continue()') && !str_contains($e2e, 'route.fulfill('), 'The regression must delay the real endpoint instead of fabricating a response.');
          $assert(str_contains($e2e, 'expect(requests).toBe(1);'), 'The live regression must preserve one-request ownership.');

          fwrite(STDOUT, "ProductionMvp14D1PlayerPickerNoVisibleLoaderV1129Test: {$assertions} assertions passed\n");
          ''', encoding='utf-8')
          PY

          rm -f .github/workflows/zz-one-shot-d1-no-visible-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v110.php app/assets/js/main-v110.js app/assets/js/main-v110-handoff-shell.js app/assets/js/games/game-invites-v110.js e2e/staging/d1-bug-b-player-picker-v122.spec.mjs bot/tests/ProductionMvp14D1ActualStartPlayerPickerV1127Test.php bot/tests/ProductionMvp14D1PlayerPickerNoVisibleLoaderV1129Test.php .github/workflows/zz-one-shot-d1-no-visible-loader.yml
          git diff --cached --check
          git commit -m 'fix(d1): open player picker only after opponents are ready'
          git push origin HEAD:agent/mvp14-d1-bug-b-no-visible-loader-v1129

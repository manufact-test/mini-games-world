name: MVP-19.6 Profile game cosmetics parity

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/profile/mgw-profile-checkers-parity.js'
      - 'app/assets/js/profile/mgw-profile-checkers-hard-square-v1.js'
      - 'app/assets/js/profile/mgw-profile-chess-layout-v2.js'
      - 'app/assets/css/screens/profile-game-cosmetics-parity-v1.css'
      - 'app/assets/css/screens/profile-game-cosmetics-manual-repair-v3.css'
      - 'bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs'
      - '.github/workflows/mvp19-6-profile-game-cosmetics-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-game-cosmetics-parity:
    name: Checkers Profile Store parity + game tabs UX
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax checks
        run: |
          node --check app/assets/js/api/client.js
          node --check app/assets/js/profile/mgw-profile-checkers-parity.js
          node --check app/assets/js/profile/mgw-profile-checkers-hard-square-v1.js
          node --check app/assets/js/profile/mgw-profile-chess-layout-v2.js
          php -l app/runtime/client/version-manifest.php

      - name: Run focused Profile contracts
        run: |
          node bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          node bot/tests/Mvp19_4EffectsV2ContractTest.mjs
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php

      - name: Guard frozen gameplay and bounded diff
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/games \
            app/assets/js/checkers-cosmetics \
            ':(exclude)app/assets/js/games/checkers/renderer.js' \
            ':(exclude)app/assets/js/checkers-cosmetics/renderer-board-themes.js' \
            ':(exclude)app/assets/js/games/reversi/renderer.js' \
            ':(exclude)app/assets/js/games/reversi/renderer-cosmetics-v1.js' \
            ':(exclude)app/assets/js/games/reversi/renderer-cosmetics-premium-v4.js' \
            ':(exclude)app/assets/js/games/battleship/rules.js' \
            ':(exclude)app/assets/js/games/checkers/rules.js' \
            ':(exclude)app/assets/js/games/chess/rules.js' \
            ':(exclude)app/assets/js/games/domino/rules.js' \
            ':(exclude)app/assets/js/games/tictactoe/renderer.js' \
            ':(exclude)app/assets/js/games/four-in-a-row/renderer.js' \
            ':(exclude)app/assets/js/games/four-in-a-row/renderer-cosmetics-v1.js' \
            ':(exclude)app/assets/js/games/game-rules.js' \
            ':(exclude)app/assets/js/games/chess/renderer.js' \
            ':(exclude)app/assets/js/games/chess/renderer-move-effect-v3.js' \
            ':(exclude)app/assets/js/games/go/renderer.js' \
            ':(exclude)app/assets/js/games/go/renderer-cosmetics-v1.js' \
            ':(exclude)app/assets/js/games/game-card-copy.js' \
            ':(exclude)app/assets/js/games/invite-link-entry-v110r12.js' \
            bot/catalog/ProductInventoryService.php
          git diff --check

name: Invite Action Post-response Projection

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/response.php'
      - 'bot/invites.php'
      - 'bot/tests/InvitePostResponseProjectionContractTest.php'
      - '.github/workflows/invite-action-post-response-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/helpers/response.php
          php -l bot/invites.php
          php -l bot/tests/InvitePostResponseProjectionContractTest.php

      - name: Focused response-boundary contract
        run: php bot/tests/InvitePostResponseProjectionContractTest.php

      - name: Accepted invite regressions
        run: |
          set -euo pipefail
          php bot/tests/ProductionV110InviteActionsRootContractTest.php
          php bot/tests/ProductionV110InviteStartSyncOwnershipContractTest.php
          php bot/tests/ProductionV110CanonicalShareNotificationRootContractTest.php
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          php bot/tests/InviteOpponentServiceTest.php
          node bot/tests/Mvp18FriendsUiContractTest.mjs
          node ops/checks/mvp27_1_telegram_share_failure_fallback_contract.mjs

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

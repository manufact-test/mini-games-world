name: Phase B PR669 focused

on:
  pull_request:
    branches:
      - agent/mvp14r2-ttt-preparation-activation

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 91e74ee46c4daebb41040985c8c2348508acfc4c
  STATUS_CONTEXT: phase-b-pr669-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused final TTT preparation activation verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -Eeuo pipefail
          php -l bot/services/GameLaunchFinalizationService.php
          php -l bot/tests/GameLaunchFinalizationServiceTest.php
          php -l bot/tests/GameLaunchFinalizationOwnerContractTest.php

      - name: Focused activation and lifecycle contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/GameLaunchFinalizationServiceTest.php
          php bot/tests/GameLaunchFinalizationOwnerContractTest.php
          php bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused final TTT preparation activation verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused final TTT preparation activation verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

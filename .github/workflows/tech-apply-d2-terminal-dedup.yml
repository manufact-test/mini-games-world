          (ROOT / 'e2e/staging/d2-terminal-dedup.spec.mjs').write_text(r'''import { test, expect } from '@playwright/test';
import {
  APP_ROUTE,
  INVITES_ROUTE,
  STAGING_ORIGIN,
  isActionResponse,
} from './support/d3-shared-config.mjs';
import {
  authorizeContext,
  openPlayerPage,
  cleanupPlayer,
  revokeContext,
} from './support/d3-shared-context.mjs';
import {
  expectPlayerRequest,
} from './support/d3-shared-actions.mjs';

const NOTIFICATIONS_ROUTE = `${STAGING_ORIGIN}/bot/notifications.php`;

function isConsumeResponse(token) {
  return response => {
    if (response.url() !== NOTIFICATIONS_ROUTE || response.request().method() !== 'POST') return false;
    try {
      return String(response.request().postDataJSON()?.hideInviteToken || '') === token;
    } catch {
      return false;
    }
  };
}

async function openPlayers(browser, mobileA = false) {
  const contextA = await browser.newContext({
    locale: 'ru-RU',
    timezoneId: 'Europe/Vilnius',
    viewport: mobileA ? { width: 390, height: 844 } : { width: 1280, height: 900 },
    deviceScaleFactor: 1,
    isMobile: mobileA,
    hasTouch: mobileA,
  });
  const contextB = await browser.newContext({
    locale: 'ru-RU',
    timezoneId: 'Europe/Vilnius',
    viewport: { width: 390, height: 844 },
    deviceScaleFactor: 1,
    isMobile: true,
    hasTouch: true,
  });
  await authorizeContext(contextA, 'A');
  await authorizeContext(contextB, 'B');
  const playerA = await openPlayerPage(contextA, 'A', APP_ROUTE);
  const playerB = await openPlayerPage(contextB, 'B', APP_ROUTE);
  await cleanupPlayer(playerA.page);
  await cleanupPlayer(playerB.page);
  return { contextA, contextB, playerA, playerB };
}

async function closePlayers(players) {
  await cleanupPlayer(players?.playerA?.page);
  await cleanupPlayer(players?.playerB?.page);
  if (players?.contextA) {
    await revokeContext(players.contextA);
    await players.contextA.close();
  }
  if (players?.contextB) {
    await revokeContext(players.contextB);
    await players.contextB.close();
  }
}

async function createDirectInviteFromUi(playerA) {
  const page = playerA.page;
  await page.locator('[data-invite-friend="tictactoe"]').click();
  await expect(page.locator('#sheet [data-invite-setup]')).toHaveCount(1);
  await page.locator('[data-open-player-picker]').click();
  const opponent = page.locator('[data-direct-opponent="stg_test_player_b"]');
  await expect(opponent).toBeVisible({ timeout: 20_000 });

  const createResponse = page.waitForResponse(
    isActionResponse(INVITES_ROUTE, 'create_direct'),
    { timeout: 35_000 },
  );
  await opponent.click();
  const response = await createResponse;
  const payload = await response.json().catch(() => null);
  expect(response.status()).toBe(200);
  expect(payload?.ok).toBe(true);
  const token = String(payload?.invite?.token || '');
  expect(token).toMatch(/^[a-f0-9]{24}$/);
  await expect(page.locator('#sheet .sheet-head h2')).toHaveText('Приглашение отправлено', {
    timeout: 20_000,
  });
  return token;
}

async function expectNoTokenInBell(page, token) {
  await page.locator('#notificationsOpen').click();
  await expect(page.locator('#sheet .sheet-head h2')).toHaveText('Уведомления', {
    timeout: 20_000,
  });
  await expect(page.locator(`#sheet [data-notification-invite-token="${token}"]`)).toHaveCount(0);
}

test('declined invitation already shown in the owner sheet creates no duplicate toast or bell card', async ({ browser }) => {
  test.setTimeout(150_000);
  let players;
  try {
    players = await openPlayers(browser, false);
    const token = await createDirectInviteFromUi(players.playerA);
    const consumeResponse = players.playerA.page.waitForResponse(isConsumeResponse(token), {
      timeout: 35_000,
    });

    const declined = await expectPlayerRequest(
      players.playerB.page,
      '/bot/invites.php',
      { action: 'decline', token },
      'Player B declines while Player A keeps the sent sheet open',
    );
    expect(String(declined?.invite?.status || '')).toBe('declined');

    await expect(players.playerA.page.locator('#sheet .sheet-head h2')).toContainText('Отклон', {
      timeout: 25_000,
    });
    await expect(players.playerA.page.locator('[data-terminal-invite-ack]')).toBeVisible();

    const consumed = await consumeResponse;
    const consumedPayload = await consumed.json().catch(() => null);
    expect(consumed.status()).toBe(200);
    expect(consumedPayload?.ok).toBe(true);
    expect(Number(consumedPayload?.hidden_count || 0)).toBeGreaterThan(0);

    await players.playerA.page.locator('[data-terminal-invite-ack]').click();
    await expect(players.playerA.page.locator('#sheetOverlay')).not.toHaveClass(/active/);
    await players.playerA.page.waitForTimeout(1_500);
    await expect(players.playerA.page.locator('#notificationToast')).not.toHaveClass(/show/);
    await expectNoTokenInBell(players.playerA.page, token);

    expect(players.playerA.diagnostics.pageErrors).toEqual([]);
    expect(players.playerB.diagnostics.pageErrors).toEqual([]);
    expect(players.playerA.diagnostics.failedRequests).toEqual([]);
    expect(players.playerB.diagnostics.failedRequests).toEqual([]);
    expect(players.playerA.diagnostics.serverErrors).toEqual([]);
    expect(players.playerB.diagnostics.serverErrors).toEqual([]);
  } finally {
    await closePlayers(players);
  }
});

test('owner self-cancel returns directly home without an acknowledgement sheet', async ({ browser }) => {
  test.setTimeout(150_000);
  let players;
  try {
    players = await openPlayers(browser, true);
    const token = await createDirectInviteFromUi(players.playerA);
    const cancel = players.playerA.page.locator(
      `#sheet [data-invite-action="cancel"][data-invite-token="${token}"]`,
    );
    await expect(cancel).toBeVisible();
    await expect(cancel).toBeEnabled();

    const cancelResponse = players.playerA.page.waitForResponse(
      isActionResponse(INVITES_ROUTE, 'cancel'),
      { timeout: 35_000 },
    );
    const consumeResponse = players.playerA.page.waitForResponse(isConsumeResponse(token), {
      timeout: 35_000,
    });
    await cancel.click();

    const cancelled = await cancelResponse;
    const cancelledPayload = await cancelled.json().catch(() => null);
    expect(cancelled.status()).toBe(200);
    expect(cancelledPayload?.ok).toBe(true);
    expect(String(cancelledPayload?.invite?.status || '')).toMatch(/cancelled|canceled/);

    const consumed = await consumeResponse;
    const consumedPayload = await consumed.json().catch(() => null);
    expect(consumed.status()).toBe(200);
    expect(consumedPayload?.ok).toBe(true);

    await expect(players.playerA.page.locator('#sheetOverlay')).not.toHaveClass(/active/);
    await expect(players.playerA.page.locator('.screen.active[data-screen="home"]')).toBeVisible();
    await expect(players.playerA.page.locator('[data-terminal-invite-ack]')).toHaveCount(0);
    await expect(players.playerA.page.locator('#notificationToast')).not.toHaveClass(/show/);
    await expectNoTokenInBell(players.playerA.page, token);

    expect(players.playerA.diagnostics.pageErrors).toEqual([]);
    expect(players.playerB.diagnostics.pageErrors).toEqual([]);
    expect(players.playerA.diagnostics.failedRequests).toEqual([]);
    expect(players.playerB.diagnostics.failedRequests).toEqual([]);
    expect(players.playerA.diagnostics.serverErrors).toEqual([]);
    expect(players.playerB.diagnostics.serverErrors).toEqual([]);
  } finally {
    await closePlayers(players);
  }
});

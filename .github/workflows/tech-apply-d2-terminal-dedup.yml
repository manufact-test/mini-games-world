name: Tech apply D2 terminal dedup

on:
  push:
    branches:
      - agent/mvp14-d2-terminal-dedup-self-cancel-home

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-dedup-self-cancel-home
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact D2 UX changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path, old, new):
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all_exact(path, old, new, expected):
              file = ROOT / path
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          client_path = 'app/assets/js/games/game-invites-v110.js'
          replace_once(
              client_path,
              "const WATCH_URL = `${window.location.origin}/bot/invite-watch.php`;\n",
              "const WATCH_URL = `${window.location.origin}/bot/invite-watch.php`;\nconst NOTIFICATIONS_URL = `${window.location.origin}/bot/notifications.php`;\n",
          )
          replace_once(
              client_path,
              "let playerPickerRequestGeneration = 0;\n",
              "let playerPickerRequestGeneration = 0;\nconst consumedTerminalInviteTokens = new Set();\n",
          )

          old_terminal_block = """    if (action === 'decline' || action === 'cancel') {
      const terminalInvite = terminalInviteResult(action, token, result?.invite || rollbackInvite);
      const unreadCount = Number(result?.unread_count);

      if (terminalContext.notificationSurface) {
        document.dispatchEvent(new CustomEvent('mgw:notification-sync', {
          detail:{
            item:terminalNotificationItem(terminalContext, terminalInvite),
            unreadCount:Number.isFinite(unreadCount) ? Math.max(0, unreadCount) : 0,
            announce:false,
          },
        }));
      } else {
        showTerminalInvite(terminalInvite);
      }

      if (Number.isFinite(unreadCount)) dispatchNotificationCount(Math.max(0, unreadCount));
      currentInvite = null;
      scheduleSync(0);
      scheduleWatch(0);
      return;
    }
"""
          new_terminal_block = """    if (action === 'decline' || action === 'cancel') {
      const terminalInvite = terminalInviteResult(action, token, result?.invite || rollbackInvite);
      const unreadCount = Number(result?.unread_count);
      const selfOwnedCancel = action === 'cancel'
        && !terminalContext.notificationSurface
        && Boolean(rollbackInvite?.is_owner);

      if (selfOwnedCancel) {
        consumeInviteNotification(token);
        currentInvite = null;
        closeSheet();
        showScreen('home');
      } else if (terminalContext.notificationSurface) {
        document.dispatchEvent(new CustomEvent('mgw:notification-sync', {
          detail:{
            item:terminalNotificationItem(terminalContext, terminalInvite),
            unreadCount:Number.isFinite(unreadCount) ? Math.max(0, unreadCount) : 0,
            announce:false,
          },
        }));
      } else {
        showTerminalInvite(terminalInvite);
      }

      if (Number.isFinite(unreadCount)) dispatchNotificationCount(Math.max(0, unreadCount));
      currentInvite = null;
      scheduleSync(0);
      scheduleWatch(0);
      return;
    }
"""

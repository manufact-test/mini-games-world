name: Verify Phase B Preparation Timeout Result

on:
  push:
    branches:
      - agent/verify-phase-b-preparation-timeout-result

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc '{state:"pending",context:"phase-b-preparation-timeout-result-focused",description:"Preparation-timeout result checks are running"}')"

      - name: Checkout exact verification commit
        uses: actions/checkout@v4

      - name: Run focused checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/screens/game-screen-v102.js
          php -l app/v110.php
          php -l bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest.php
          php bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest.php

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [[ "${JOB_STATUS}" == 'success' ]]; then state='success'; description='Preparation-timeout result checks passed'; else state='failure'; description='Preparation-timeout result checks failed'; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc --arg state "${state}" --arg description "${description}" '{state:$state,context:"phase-b-preparation-timeout-result-focused",description:$description}')"
          test "${state}" = 'success'

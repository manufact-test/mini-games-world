name: TMP staging invite protected history patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/staging-invite-protected-history-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-protected-history-parity
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-staging-invite-protected-history-patch.py
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          git diff --check
      - name: Commit product and regression only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/invites/RuntimeInviteRepository.php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Staging invites: protect assigned match history from active parity'
          git push origin HEAD:agent/staging-invite-protected-history-parity

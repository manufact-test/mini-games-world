name: MVP-15.6 manifest coverage

on:
  push:
    branches:
      - agent/mvp-15-6-unified-zone-cutover
    paths:
      - '.github/workflows/mvp15-6-manifest-coverage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-6-unified-zone-cutover
          fetch-depth: 1
      - name: Fingerprint weekly room-neutral copy owner
        shell: bash
        run: |
          set -Eeuo pipefail
          file='bot/helpers/staging-e2e-runtime-files.txt'
          test "$(grep -c '^app/assets/js/screens/home-screen.js$' "$file")" = '1'
          test "$(grep -c '^app/assets/js/screens/weekly-match-info.js$' "$file" || true)" = '0'
          sed -i '/^app\/assets\/js\/screens\/home-screen.js$/a app/assets/js/screens/weekly-match-info.js' "$file"
          test "$(grep -c '^app/assets/js/screens/weekly-match-info.js$' "$file")" = '1'
          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add "$file"
          git commit -m 'MVP-15.6: fingerprint weekly room-neutral copy owner'
          git push origin HEAD:agent/mvp-15-6-unified-zone-cutover

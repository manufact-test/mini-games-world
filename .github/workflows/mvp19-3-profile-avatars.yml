name: MVP-19.3 Profile Avatars

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/profile/**'
      - 'app/assets/js/screens/store-screen-checkers-wrapper.js'
      - 'app/assets/css/**'
      - 'bot/tests/Mvp19_3ProfileAvatarsTest.php'
      - '.github/workflows/mvp19-3-profile-avatars.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avatars:
    name: Preserve accepted Profile avatars
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Run avatar contract
        run: php bot/tests/Mvp19_3ProfileAvatarsTest.php
      - name: Guard accepted avatar owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/database/migrations/20260831_0020_add_profile_avatars.php \
            app/assets/js/profile/mgw-profile-avatars.js
          grep -F "store-screen-checkers-wrapper.js?v=3" bot/tests/Mvp19_3ProfileAvatarsTest.php
          grep -F "mvp19_6=visual-corrective-v2" bot/tests/Mvp19_3ProfileAvatarsTest.php
          grep -F "from './store-screen-intent-wrapper.js?v=19&mvp19_6=accepted-base-preserved';" app/assets/js/screens/store-screen-checkers-wrapper.js
          git diff --check

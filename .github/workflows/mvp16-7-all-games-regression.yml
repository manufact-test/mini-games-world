name: MVP-16.7 All games regression

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/tests/Mvp167AllGamesRegressionContractTest.php'
      - 'bot/tests/Mvp14r2GamesContractTest.php'
      - 'bot/tests/Mvp14r2GamesBaselineTest.php'
      - 'bot/tests/RematchOptimisticUxContractTest.php'
      - 'bot/games/**'
      - 'bot/services/GameCatalogService.php'
      - 'bot/services/GameActionService.php'
      - 'bot/services/GameService.php'
      - 'bot/services/GameSettlementService.php'
      - 'bot/services/FourInARowService.php'
      - 'bot/services/ChessRuntimeService.php'
      - 'bot/api.php'
      - 'bot/invites.php'
      - 'app/assets/js/games/**'
      - 'app/assets/js/production-v110-match-lifecycle.js'
      - 'e2e/staging/phase-b-all-games-loader.spec.mjs'
      - '.github/workflows/mvp16-7-all-games-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-games-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: MVP-27.1 recovery — accepted MVP26 game-owner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline='b3d0b7a703fc379821a4722fba8526174d22ea5d'
          # Player-copy localization has intentionally changed game meta files and
          # the shared leave lifecycle since the MVP26 byte baseline. Keep the
          # legacy identity guard on mechanics owners/entries, while the semantic
          # contracts below continue to freeze all eight engines and the accepted
          # leave/reconnect lifecycle invariants.
          git cat-file -e "${baseline}^{commit}"
          git diff --exit-code "${baseline}" HEAD -- \
            bot/games \
            bot/services/GameCatalogService.php \
            bot/services/GameActionService.php \
            bot/services/GameService.php \
            bot/services/GameSettlementService.php \
            bot/services/FourInARowService.php \
            bot/services/ChessRuntimeService.php \
            ':(glob)app/assets/js/games/*/entry.js'

      - name: Syntax validation
        run: |
          set -Eeuo pipefail
          php -l bot/tests/Mvp167AllGamesRegressionContractTest.php
          php -l bot/tests/Mvp14r2GamesContractTest.php
          php -l bot/tests/Mvp14r2GamesBaselineTest.php
          php -l bot/tests/RematchOptimisticUxContractTest.php
          for game in tictactoe four-in-a-row battleship checkers reversi chess go domino; do
            node --check "app/assets/js/games/${game}/entry.js"
            node --check "app/assets/js/games/${game}/meta.js"
            node --check "app/assets/js/games/${game}/renderer.js"
            node --check "app/assets/js/games/${game}/rules.js"
          done
          node --check app/assets/js/production-v110-match-lifecycle.js
          node --check app/assets/js/games/game-invites-v110.js

      - name: MVP-16.7 catalog UI shared-lifecycle contract
        run: php bot/tests/Mvp167AllGamesRegressionContractTest.php

      - name: Frozen mechanics contract for all eight games
        run: php bot/tests/Mvp14r2GamesContractTest.php

      - name: Frozen terminal mechanics baseline for all eight games
        run: php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Shared rematch regression
        run: php bot/tests/RematchOptimisticUxContractTest.php

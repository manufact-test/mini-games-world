name: MVP-16.7 All games regression

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/tests/Mvp167AllGamesRegressionContractTest.php'
      - 'bot/tests/Mvp14r2GamesContractTest.php'
      - 'bot/tests/Mvp14r2GamesBaselineTest.php'
      - 'bot/tests/RematchOptimisticUxContractTest.php'
      - 'bot/games/**'
      - 'bot/services/GameCatalogService.php'
      - 'bot/services/GameActionService.php'
      - 'bot/services/GameService.php'
      - 'bot/services/GameSettlementService.php'
      - 'bot/services/FourInARowService.php'
      - 'bot/services/ChessRuntimeService.php'
      - 'bot/api.php'
      - 'bot/invites.php'
      - 'app/assets/js/games/**'
      - 'app/assets/js/production-v110-match-lifecycle.js'
      - 'e2e/staging/phase-b-all-games-loader.spec.mjs'
      - '.github/workflows/mvp16-7-all-games-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-games-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: MVP-27.1 recovery — accepted MVP26 game-owner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-game-runtime-localization-* ]]; then
            # Localization successor: source-copy ownership intentionally moves to
            # ServerLocalization. Prove exact RU copy + debt ratchet here, then keep
            # the semantic engine contracts below as the mechanics authority.
            node ops/checks/mvp27_1_backend_game_runtime_localization_contract.mjs
            node ops/checks/mvp27_1_hardcoded_text_audit.mjs
            git diff --check
          else
            baseline='b3d0b7a703fc379821a4722fba8526174d22ea5d'
            # Player-copy localization has intentionally changed game meta files and
            # the shared leave lifecycle since the MVP26 byte baseline. Keep the
            # legacy identity guard on mechanics owners/entries, while the semantic
            # contracts below continue to freeze all eight engines and the accepted
            # leave/reconnect lifecycle invariants.
            git cat-file -e "${baseline}^{commit}"
            git diff --exit-code "${baseline}" HEAD -- \
              bot/games \
              bot/services/GameCatalogService.php \
              bot/services/GameActionService.php \
              bot/services/GameService.php \
              bot/services/GameSettlementService.php \
              bot/services/FourInARowService.php \
              bot/services/ChessRuntimeService.php \
              ':(glob)app/assets/js/games/*/entry.js'
          fi

      - name: MVP-27.1 game-runtime localization bounded scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-backend-game-runtime-localization-')
        shell: bash
        run: |
          set -Eeuo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head" | sort)"
          allowed="$(cat <<'EOF'
.github/workflows/mvp16-7-all-games-regression.yml
.github/workflows/mvp19-6-checkers-boards.yml
.github/workflows/mvp20-2-hidden-skill.yml
.github/workflows/mvp27-1-backend-game-runtime-localization.yml
app/locales/ru.json
bot/game-clock.php
bot/game-live-v108.php
bot/game-watch.php
bot/games/battleship/BattleshipService.php
bot/games/checkers/CheckersBotService.php
bot/games/checkers/CheckersService.php
bot/games/chess/ChessBotService.php
bot/games/chess/ChessService.php
bot/games/domino/DominoService.php
bot/games/go/GoService.php
bot/games/reversi/ReversiBotService.php
bot/games/reversi/ReversiService.php
bot/runtime/UnifiedGameZonePolicy.php
bot/services/BotProfilePolicy.php
bot/services/ChessRuntimeService.php
bot/services/FourInARowService.php
bot/services/GameActionService.php
bot/services/GameCatalogService.php
bot/services/GameReactionService.php
bot/services/GameRuntimeService.php
bot/services/GameService.php
bot/services/GameSettlementService.php
bot/services/MatchPreparationClockService.php
bot/services/PresenceService.php
bot/services/ReconnectLifecycleService.php
bot/tests/Mvp14r2GamesContractTest.php
bot/tests/Mvp19_12BattleshipFireReliabilityTest.mjs
ops/checks/mvp27_1_backend_game_runtime_localization_contract.mjs
ops/checks/mvp27_1_hardcoded_text_baseline.json
EOF
)"
          bad="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort) || true)"
          test -z "$bad" || { printf 'Unexpected game-runtime localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Syntax validation
        run: |
          set -Eeuo pipefail
          php -l bot/tests/Mvp167AllGamesRegressionContractTest.php
          php -l bot/tests/Mvp14r2GamesContractTest.php
          php -l bot/tests/Mvp14r2GamesBaselineTest.php
          php -l bot/tests/RematchOptimisticUxContractTest.php
          for game in tictactoe four-in-a-row battleship checkers reversi chess go domino; do
            node --check "app/assets/js/games/${game}/entry.js"
            node --check "app/assets/js/games/${game}/meta.js"
            node --check "app/assets/js/games/${game}/renderer.js"
            node --check "app/assets/js/games/${game}/rules.js"
          done
          node --check app/assets/js/production-v110-match-lifecycle.js
          node --check app/assets/js/games/game-invites-v110.js

      - name: MVP-16.7 catalog UI shared-lifecycle contract
        run: php bot/tests/Mvp167AllGamesRegressionContractTest.php

      - name: Frozen mechanics contract for all eight games
        run: php bot/tests/Mvp14r2GamesContractTest.php

      - name: Frozen terminal mechanics baseline for all eight games
        run: php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Shared rematch regression
        run: php bot/tests/RematchOptimisticUxContractTest.php

name: MVP-18.2 Cache Specifier Maintenance

on:
  push:
    branches: [agent/mvp18-2-friends-ui]
    paths: ['.github/workflows/mvp18-2-cache-specifier-maintenance.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp18-2-friends-ui
      - name: Align social consumer with single invite module URL
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/assets/js/screens/friends-screen-v110.js')
          text = path.read_text()
          old = "../games/game-invites-v110.js?v=1142&zone=unified&rematch=optimistic&terminal=self-silent"
          new = "../games/game-invites-v110.js?v=1143&zone=unified&rematch=optimistic&terminal=self-silent&social=1"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one old invite specifier')
          path.write_text(text.replace(old, new))
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/friends-screen-v110.js
          git diff --check
          test "$(git diff --name-only)" = "app/assets/js/screens/friends-screen-v110.js"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/js/screens/friends-screen-v110.js
          git commit -m 'MVP-18.2: align social invite module cache identity'
          git push origin HEAD:agent/mvp18-2-friends-ui

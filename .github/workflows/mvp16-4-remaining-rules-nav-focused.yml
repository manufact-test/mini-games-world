name: MVP-16.4 remaining rules and nav focused
on:
  push:
    branches: [agent/mvp-16-4-remaining-variant-rules-nav-spacing]
    paths: ['.github/workflows/mvp16-4-remaining-rules-nav-focused.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Focused contracts
        run: |
          set -Eeuo pipefail
          node ops/checks/mvp16_4_remaining_variant_rules_nav_contract.mjs
          node ops/checks/mvp16_4_ttt_variant_rules_contract.mjs
          node ops/checks/mvp16_4_rules_return_to_setup_contract.mjs
          node ops/checks/mvp16_4_unified_game_setup_contract.mjs
          node ops/checks/mvp16_4_setup_ui_polish_contract.mjs
          node ops/checks/mvp16_3_shell_navigation_contract.mjs
          node ops/checks/mvp16_1_router_lifecycle_contract.mjs
          php bot/tests/Mvp161ClientBootstrapRouterTest.php
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
          php bot/tests/Mvp156UnifiedZoneCutoverTest.php
          php bot/tests/Mvp156NotificationSemanticScrollTest.php
          node --check app/assets/js/games/game-rules.js
          node --check app/assets/js/games/four-in-a-row/rules.js
          node --check app/assets/js/games/reversi/rules.js
          node --check app/assets/js/games/go/rules.js
          php -l app/runtime/client/version-manifest.php
          php app/v110.php > /tmp/mgw-v110.html
          grep -F 'game-rules.js?v=78&mvp16=all-variant-rules' /tmp/mgw-v110.html >/dev/null
          grep -F 'main.css?v=162&sk=3&icons=c1efd5af&render=31&mvp16=variant-rules-nav-balance' /tmp/mgw-v110.html >/dev/null
          test "$(grep -o '<script type="module" src="' /tmp/mgw-v110.html | wc -l)" -eq 1
          python3 scripts/ci/staging-runtime-fingerprint.py
          python3 - <<'PY'
          from pathlib import Path
          paths=[]
          for raw in Path('bot/helpers/staging-e2e-runtime-files.txt').read_text(encoding='utf-8').splitlines():
              value=raw.strip()
              if value and not value.startswith('#'):
                  paths.append(value)
          print(f'RUNTIME_PATHS={len(paths)}')
          PY
          echo MVP16_4_REMAINING_RULES_NAV_FOCUSED=PASS

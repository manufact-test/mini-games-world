name: MVP-27.1 Game Screen Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/game-screen-v102.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_game_screen_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest.php'
      - 'bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php'
      - 'bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php'
      - 'bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php'
      - 'bot/tests/Mvp17_5BotOpaqueRematchContractTest.php'
      - 'bot/tests/NotificationActorSilentTerminalContractTest.php'
      - 'bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php'
      - 'bot/tests/Mvp21_9TerminalUxContractTest.php'
      - '.github/workflows/mvp21-5-tournament-ready.yml'
      - '.github/workflows/mvp21-6-tournament-rounds.yml'
      - '.github/workflows/mvp21-9-tournament-rewards.yml'
      - '.github/workflows/mvp27-1-game-screen-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-screen-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/game-screen-v102.js
          node --check ops/checks/mvp27_1_game_screen_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_game_screen_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve Result and game lifecycle owners
        run: |
          set -euo pipefail
          php bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest.php
          php bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php
          php bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php
          php bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php
          php bot/tests/Mvp17_5TicTacToeFirstTapSingleOwnerContractTest.php
          php bot/tests/NotificationActorSilentTerminalContractTest.php
          php bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php
          php bot/tests/Mvp21_9TerminalUxContractTest.php
          php bot/tests/Mvp14r2GamesContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if ! git diff --quiet "$base" "$head" -- app/assets/js/screens/game-screen-v102.js \
              app/assets/js/production-v110-acceptance-runtime.js; then
            launch_allowed='^(app/assets/js/screens/game-screen-v102\.js|app/assets/js/production-v110-acceptance-runtime\.js|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_invite_canonical_game_polling_contract\.mjs|\.github/workflows/mvp27-1-game-screen-localization\.yml)'^(app/assets/js/screens/game-screen-v102\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_game_screen_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest\.php|bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest\.php|bot/tests/Mvp17_5ResultHistoryFix2ContractTest\.php|bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest\.php|bot/tests/Mvp17_5BotOpaqueRematchContractTest\.php|bot/tests/NotificationActorSilentTerminalContractTest\.php|bot/tests/Mvp21_5_6CorrectiveV4ContractTest\.php|bot/tests/Mvp21_9TerminalUxContractTest\.php|\.github/workflows/mvp21-5-tournament-ready\.yml|\.github/workflows/mvp21-6-tournament-rounds\.yml|\.github/workflows/mvp21-9-tournament-rewards\.yml|\.github/workflows/mvp27-1-game-screen-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Game Screen localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

            launch_bad="$(git diff --name-only "$base" "$head" | grep -Ev "$launch_allowed" || true)"
            if [[ -z "$launch_bad" ]] \
                && grep -Fq 'manual_acceptance=launch-poll-v1' app/runtime/client/version-manifest.php \
                && grep -Fq 'manual_acceptance=countdown-first-beat-v1' app/runtime/client/version-manifest.php; then
              echo "Bounded manual-acceptance launch successor: focused polling/countdown contracts own this slice."
              exit 0
            fi
          fi
          if git diff --quiet "$base" "$head" -- app/assets/js/screens/game-screen-v102.js; then
            echo "Successor localization slice: predecessor owner unchanged; original bounded migration scope does not apply."
            exit 0
          fi
          allowed='^(app/assets/js/screens/game-screen-v102\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_game_screen_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/PhaseBPreparationTimeoutResultOwnerContractTest\.php|bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest\.php|bot/tests/Mvp17_5ResultHistoryFix2ContractTest\.php|bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest\.php|bot/tests/Mvp17_5BotOpaqueRematchContractTest\.php|bot/tests/NotificationActorSilentTerminalContractTest\.php|bot/tests/Mvp21_5_6CorrectiveV4ContractTest\.php|bot/tests/Mvp21_9TerminalUxContractTest\.php|\.github/workflows/mvp21-5-tournament-ready\.yml|\.github/workflows/mvp21-6-tournament-rounds\.yml|\.github/workflows/mvp21-9-tournament-rewards\.yml|\.github/workflows/mvp27-1-game-screen-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Game Screen localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: D1 canonical toast state machine

on:
  pull_request:
    branches:
      - agent/mvp14-d1-toast-trigger-base

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply cancelable toast render generation
        run: python tools/d1_toast_state_machine.py

      - name: Validate focused owner contract
        run: |
          node --check app/assets/js/screens/notifications-screen-v99.js
          php bot/tests/ProductionMvp14D1CanonicalOwnersArchitectureTest.php
          php bot/tests/ProductionMvp14D1DeepLinkCanonicalTransitionTest.php
          grep -q "generation !== notificationToastGeneration" app/assets/js/screens/notifications-screen-v99.js
          grep -q "notificationToastGeneration += 1" app/assets/js/screens/notifications-screen-v99.js

      - name: Commit state-machine fix and remove temporary runner
        run: |
          rm -f tools/d1_toast_state_machine.py .github/workflows/d1-toast-state-machine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make toast rendering generation-safe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

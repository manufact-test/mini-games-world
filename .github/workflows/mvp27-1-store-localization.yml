name: MVP-27.1 Store Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/store-screen.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp25_6StoreClientContractTest.mjs'
      - 'tests/mvp19-13-ttt-bundle-reference.mjs'
      - 'ops/checks/mvp27_1_store_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-store-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and Store localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/store-screen.js
          node --check bot/tests/Mvp25_6StoreClientContractTest.mjs
          node --check tests/mvp19-13-ttt-bundle-reference.mjs
          node --check ops/checks/mvp27_1_store_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_store_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve Store product contracts
        run: |
          set -euo pipefail
          node bot/tests/Mvp25_6StoreClientContractTest.mjs
          node tests/mvp19-13-ttt-bundle-reference.mjs
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_5ChessCosmeticsTest.php
          php bot/tests/Mvp25_6MonetizationDisabledStoreTest.php
          php bot/tests/Mvp26_3StoreWalletOwnershipContractTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/screens/store-screen\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|bot/tests/Mvp25_6StoreClientContractTest\.mjs|tests/mvp19-13-ttt-bundle-reference\.mjs|ops/checks/mvp27_1_store_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-store-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Store localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

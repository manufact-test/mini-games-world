              bot/tournaments/TournamentPrizeReviewService.php|\
              bot/tests/Mvp21_10TournamentPrizeReviewTest.php|\
              bot/tests/Mvp21_10TournamentPrizeReviewContractTest.php|\
              app/assets/css/admin-shell.css|\
              .github/workflows/mvp21-9-tournament-rewards.yml|\
              bot/database/migrations/20260922_0057_create_tournament_results_rewards.php|\
              bot/tournaments/TournamentSettlementService.php|\
              bot/tests/Mvp21_9TournamentSettlementTest.php|\
              bot/tests/Mvp21_9TerminalUxContractTest.php|\
              bot/database/migrations/20260921_0055_add_tournament_round_progression.php|\
              bot/tournaments/TournamentRoundProgressionService.php|\
              bot/tournaments/StagingTournamentManualAcceptanceService.php|\
              bot/admin-tournaments.php|\
              bot/tournaments/TournamentMatchReadinessService.php|\
              bot/tournaments/TournamentHallService.php|\
              bot/core/bootstrap.php|\
              bot/api.php|\
              bot/database/migrations/20260922_0056_add_tournament_registration_publication.php|\
              bot/tournaments/TournamentRegistrationService.php|\
              bot/realtime/RealtimeRuntimeBridge.php|\
              bot/ledger/EconomyRuntimeBridge.php|\
              bot/weekly/WeeklyBonusRuntimeBridge.php|\
              bot/ratings/PerGameRatingRuntimeBridge.php|\
              bot/ratings/HiddenSkillRuntimeBridge.php|\
              bot/tests/Mvp21_1TournamentRegistrationTest.php|\
              bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php|\
              bot/tests/Mvp21_2TournamentRulesTest.php|\
              bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php|\
              bot/tests/Mvp21_3TournamentScheduleTest.php|\
              bot/tests/Mvp21_5_6CorrectiveV7ContractTest.php|\
              bot/tests/Mvp21_8CorrectiveContractTest.php|\
              bot/tests/Mvp21_8CorrectiveV9ContractTest.php|\
              bot/storage/StorageFactory.php|\
              bot/runtime/RuntimePrimaryStagingRequestSessionConfig.php|\
              bot/tests/RuntimePrimaryStagingRequestSessionConfigTest.php|\
              e2e/staging/current-core-final.spec.mjs|\
              app/admin.php|\
              app/assets/js/admin-tournaments.js|\
              bot/services/GameService.php|\
              bot/services/GameRuntimeService.php|\
              bot/services/ChessRuntimeService.php|\
              bot/services/TournamentReconnectTraceService.php|\
              bot/presence.php|\
              bot/staging-projection-diagnostic.php|\
              bot/tests/Mvp21RealTelegramReconnectTraceTest.php|\
              bot/services/GameLaunchFinalizationService.php|\
              bot/services/MatchPreparationClockService.php|\
              app/assets/js/api/client.js|\
              app/assets/js/screens/tournaments-screen-v1.js|\
              app/assets/js/main-v110-handoff-shell.js|\
              app/assets/js/screens/game-screen-v102.js|\
              app/assets/js/production-v110-acceptance-runtime.js|\
              app/assets/js/games/game-invites-v110.js|\
              app/assets/js/games/game-invites-v110-rematch-policy-v175.js|\
              app/runtime/client/version-manifest.php|\
              app/assets/css/components/mgw-tournament-honors.css|\
              app/assets/js/screens/profile-screen-v110.js|\
              app/assets/js/state.js|\
              bot/profile-v2.php|\
              bot/ratings/RatingArchiveService.php|\
              bot/tests/Mvp21_9TournamentProductProjectionContractTest.php|\
              bot/tests/Mvp21_9TournamentRewardProjectionTest.php|\
              bot/tournaments/TournamentRewardProjectionService.php|\
              app/assets/css/main.css|\
              bot/tests/Mvp21_6TournamentRoundProgressionTest.php|\
              bot/tests/Mvp21_6TournamentRuntimeContractTest.php|\
              bot/tests/Mvp21_6TournamentProgressionUxContractTest.php|\
              bot/tests/Mvp21_11TournamentReleaseProofTest.php|\
              bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php|\
              bot/tests/RematchOptimisticUxContractTest.php|\
              bot/tests/PhaseBMatchPreparationClockServiceTest.php|\
              bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php|\
              bot/tests/PhaseBClientLaunchUxContractTest.php|\
              bot/tests/Mvp21_4TournamentHallBracketTest.php|\
              bot/tests/Mvp21_4TournamentHallUxContractTest.php|\
              bot/tests/Mvp21_5TournamentMatchReadinessTest.php|\
              bot/tests/Mvp21_5TournamentReadyUxContractTest.php|\
              bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php|\
              bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php|\
              bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php|\
              bot/tests/Mvp17_5TerminalLaunchPolishContractTest.php|\
              bot/tests/Mvp17_5BotOpaqueRematchContractTest.php|\
              bot/tests/Mvp17_5TicTacToeFirstTapSingleOwnerContractTest.php|\
              bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php|\
              bot/tests/Mvp18_4UniversalInviteLandingContractTest.php|\
              bot/tests/Mvp18FriendsUiContractTest.mjs|\
              bot/tests/NotificationActorSilentTerminalContractTest.php|\
              bot/tests/GameLaunchFinalizationOwnerContractTest.php|\
              ops/checks/verify-mvp15-3-unified-balance-owner.py)
                ;;
              # Manual acceptance coordinated UI corrective
              .github/workflows/mvp21-5-tournament-ready.yml|\
              .github/workflows/mvp21-6-tournament-rounds.yml|\
              .github/workflows/mvp21-7-tournament-technical-outcomes.yml|\
              .github/workflows/mvp21-8-tournament-cancellation.yml|\
              .github/workflows/mvp21-9-tournament-rewards.yml|\
              .github/workflows/mvp21-10-tournament-prize-review.yml|\
              app/assets/css/main.css|\
              app/assets/js/screens/game-screen-v102.js|\

name: MVP-21.6 Tournament rounds and draw replays

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260921_0055_add_tournament_round_progression.php'
      - 'bot/tournaments/TournamentRoundProgressionService.php'
      - 'bot/tournaments/TournamentMatchReadinessService.php'
      - 'bot/core/bootstrap.php'
      - 'bot/api.php'
      - 'bot/services/GameService.php'
      - 'bot/services/GameLaunchFinalizationService.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/screens/tournaments-screen-v1.js'
      - 'app/assets/css/main.css'
      - 'bot/tests/Mvp21_6TournamentRoundProgressionTest.php'
      - 'bot/tests/Mvp21_5TournamentMatchReadinessTest.php'
      - 'bot/tests/Mvp21_5TournamentReadyUxContractTest.php'
      - '.github/workflows/mvp21-6-tournament-rounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp21-6-rounds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Rounds, breaks, draw replays and placement matches
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint MVP-21.6 slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/database/migrations/20260921_0055_add_tournament_round_progression.php
            bot/tournaments/TournamentRoundProgressionService.php
            bot/tournaments/TournamentMatchReadinessService.php
            bot/core/bootstrap.php
            bot/api.php
            bot/services/GameService.php
            bot/services/GameLaunchFinalizationService.php
            bot/tests/Mvp21_6TournamentRoundProgressionTest.php
            bot/tests/Mvp21_5TournamentMatchReadinessTest.php
            bot/tests/Mvp21_5TournamentReadyUxContractTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/tournaments-screen-v1.js

      - name: Run MVP-21.6 progression model
        run: php bot/tests/Mvp21_6TournamentRoundProgressionTest.php

      - name: Preserve MVP-21.5 ready/countdown owner
        run: |
          php bot/tests/Mvp21_5TournamentMatchReadinessTest.php
          php bot/tests/Mvp21_5TournamentReadyUxContractTest.php

      - name: Preserve MVP-21.4 bracket owner
        run: |
          php bot/tests/Mvp21_4TournamentHallBracketTest.php
          php bot/tests/Mvp21_4TournamentHallUxContractTest.php

      - name: Preserve shared Phase-B launch/runtime
        run: |
          php bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
          php bot/tests/PhaseBClientLaunchUxContractTest.php
          php bot/tests/GameLaunchFinalizationOwnerContractTest.php

      - name: Preserve all-game runtime baseline
        run: |
          php bot/tests/Mvp167AllGamesRegressionContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php
          php bot/tests/Mvp14r2GamesContractTest.php

      - name: Guard MVP-21.6 scope and frozen game engines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp21-6-tournament-rounds.yml|\
              bot/database/migrations/20260921_0055_add_tournament_round_progression.php|\
              bot/tournaments/TournamentRoundProgressionService.php|\
              bot/tournaments/TournamentMatchReadinessService.php|\
              bot/core/bootstrap.php|\
              bot/api.php|\
              bot/services/GameService.php|\
              bot/services/GameLaunchFinalizationService.php|\
              app/assets/js/api/client.js|\
              app/assets/js/screens/tournaments-screen-v1.js|\
              app/assets/css/main.css|\
              bot/tests/Mvp21_6TournamentRoundProgressionTest.php|\
              bot/tests/Mvp21_5TournamentMatchReadinessTest.php|\
              bot/tests/Mvp21_5TournamentReadyUxContractTest.php|\
              bot/tests/GameLaunchFinalizationOwnerContractTest.php)
                ;;
              *)
                echo "Unexpected MVP-21.6 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          git diff --exit-code "$base" "$head" -- bot/games app/assets/js/games app/assets/css/games

                echo "Unexpected MVP-21.6 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          git diff --exit-code "$base" "$head" -- bot/games app/assets/css/games

permissions:
  contents: read

concurrency:
  group: mgw-mvp21-6-rounds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Rounds, breaks, draw replays and placement matches
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint MVP-21.6 slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/database/migrations/20260921_0055_add_tournament_round_progression.php
            bot/tournaments/TournamentRoundProgressionService.php
            bot/tournaments/StagingTournamentManualAcceptanceService.php
            bot/admin-tournaments.php
            bot/tournaments/TournamentMatchReadinessService.php
            bot/tournaments/TournamentHallService.php
            bot/core/bootstrap.php
            bot/api.php
            bot/database/migrations/20260922_0056_add_tournament_registration_publication.php
            bot/tournaments/TournamentRegistrationService.php
            bot/realtime/RealtimeRuntimeBridge.php
            bot/ledger/EconomyRuntimeBridge.php
            bot/weekly/WeeklyBonusRuntimeBridge.php
            bot/ratings/PerGameRatingRuntimeBridge.php
            bot/tests/Mvp21_1TournamentRegistrationTest.php
            bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php
            bot/tests/Mvp21_2TournamentRulesTest.php
            bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php
            bot/tests/Mvp21_3TournamentScheduleTest.php
            bot/tests/Mvp21_5_6CorrectiveV7ContractTest.php
            bot/tests/Mvp21_8CorrectiveContractTest.php
            bot/tests/Mvp21_8CorrectiveV9ContractTest.php
            bot/storage/StorageFactory.php
            bot/runtime/RuntimePrimaryStagingRequestSessionConfig.php
            bot/tests/RuntimePrimaryStagingRequestSessionConfigTest.php
            app/admin.php
            bot/services/GameService.php
            bot/services/GameRuntimeService.php
            bot/services/ChessRuntimeService.php
            bot/services/ReconnectLifecycleService.php
            bot/tests/Mvp21_7TournamentTechnicalOutcomesTest.php
            bot/tests/Mvp17_4ActiveV110ReconnectContractTest.php
            bot/services/GameLaunchFinalizationService.php
            bot/tests/Mvp21_6TournamentRoundProgressionTest.php
            bot/tests/Mvp21_6TournamentRuntimeContractTest.php
            bot/tests/Mvp21_6TournamentProgressionUxContractTest.php
            bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php
            bot/tests/RematchOptimisticUxContractTest.php
            bot/tests/PhaseBMatchPreparationClockServiceTest.php
            bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
            bot/tests/PhaseBClientLaunchUxContractTest.php
            app/runtime/client/version-manifest.php
            bot/tests/Mvp21_4TournamentHallBracketTest.php
            bot/tests/Mvp21_4TournamentHallUxContractTest.php
            bot/tests/Mvp21_5TournamentMatchReadinessTest.php
            bot/tests/Mvp21_5TournamentReadyUxContractTest.php
            bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check app/assets/js/admin-tournaments.js
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/tournaments-screen-v1.js
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/screens/game-screen-v102.js
          node --check app/assets/js/production-v110-acceptance-runtime.js
          node --check app/assets/js/production-v110-presence.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/games/game-invites-v110-rematch-policy-v175.js

      - name: Run MVP-21.6 progression model
        run: |
          php bot/tests/Mvp21_6TournamentRoundProgressionTest.php
          php bot/tests/Mvp21_6TournamentRuntimeContractTest.php
          php bot/tests/Mvp21_6TournamentProgressionUxContractTest.php
          php bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php
          php bot/tests/Mvp21_5_6CorrectiveV7ContractTest.php
          php bot/tests/Mvp21_8CorrectiveContractTest.php
          php bot/tests/Mvp21_8CorrectiveV9ContractTest.php
          php bot/tests/RuntimePrimaryStagingRequestSessionConfigTest.php
          php bot/tests/Mvp21_1TournamentRegistrationTest.php
          php bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php
          php bot/tests/Mvp21_2TournamentRulesTest.php
          php bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php
          php bot/tests/Mvp21_3TournamentScheduleTest.php

      - name: Preserve MVP-21.7 reconnect/technical owner
        run: |
          php bot/tests/Mvp21_7TournamentTechnicalOutcomesTest.php
          php bot/tests/Mvp17_4ActiveV110ReconnectContractTest.php

      - name: Preserve MVP-21.5 ready/countdown owner
        run: |
          php bot/tests/Mvp21_5TournamentMatchReadinessTest.php
          php bot/tests/Mvp21_5TournamentReadyUxContractTest.php

      - name: Preserve MVP-21.4 bracket owner
        run: |
          php bot/tests/Mvp21_4TournamentHallBracketTest.php
          php bot/tests/Mvp21_4TournamentHallUxContractTest.php
          php bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php

      - name: Preserve shared Phase-B launch/runtime
        run: |
          php bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
          php bot/tests/PhaseBClientLaunchUxContractTest.php
          php bot/tests/GameLaunchFinalizationOwnerContractTest.php

      - name: Preserve all-game runtime baseline
        run: |
          php bot/tests/Mvp167AllGamesRegressionContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php
          php bot/tests/Mvp14r2GamesContractTest.php

      - name: Guard MVP-21.6 scope and frozen game engines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp16-6-notification-center-v2.yml|\
              .github/workflows/mvp18-4-universal-invite-landing.yml|\
              .github/workflows/mvp18-5-reports-blocked-users.yml|\
              .github/workflows/mvp18-6-notification-pipeline.yml|\
              .github/workflows/mvp20-1-per-game-visible-rating.yml|\
              .github/workflows/mvp20-2-hidden-skill.yml|\
              .github/workflows/mvp20-3-leaderboards-antifarming.yml|\
              .github/workflows/mvp20-4-quarterly-seasons.yml|\
              .github/workflows/mvp20-5-seasonal-awards.yml|\
              .github/workflows/mvp20-6-yearly-medal.yml|\
              .github/workflows/mvp20-7-rating-archives.yml|\
              .github/workflows/mvp20-8-rating-admin.yml|\
              .github/workflows/mvp21-1-tournament-registration.yml|\

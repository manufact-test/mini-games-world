name: Fix isolated MVP-14 D2 notification surface detection

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/mvp14-d2-surface-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/mvp14-d2-terminal-card-in-place-v1130'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-card-in-place-v1130
          fetch-depth: 0
      - name: Fix owner detection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/assets/js/games/game-invites-v110.js')
          content = path.read_text(encoding='utf-8')
          old = """  const notificationSurface = Boolean(
    card
      && button.closest('[data-notifications-owner=\"r12\"]')
      && String(card.getAttribute('data-notification-invite-token') || '') === token
  );"""
          new = """  const notificationSurface = Boolean(
    card
      && card.closest('#sheet')?.querySelector('[data-notifications-owner=\"r12\"]')
      && String(card.getAttribute('data-notification-invite-token') || '') === token
  );"""
          if content.count(old) != 1:
              raise SystemExit('Expected one D2 notification surface block.')
          path.write_text(content.replace(old, new), encoding='utf-8')

          for test_path in [
              Path('bot/tests/ProductionV110InviteTerminalActionsR12ContractTest.php'),
              Path('bot/tests/ProductionMvp14D2TerminalCardInPlaceV1130Test.php'),
          ]:
              test = test_path.read_text(encoding='utf-8')
              anchor = "str_contains($owner, 'function terminalActionContext(')"
              if anchor in test and "card.closest('#sheet')?.querySelector" not in test:
                  test = test.replace(
                      anchor,
                      anchor + "\n              && str_contains($owner, \"card.closest('#sheet')?.querySelector('[data-notifications-owner=\\\"r12\\\"]')\")",
                      1,
                  )
                  test_path.write_text(test, encoding='utf-8')
          PY
      - name: Verify fixed owner detection
        shell: bash
        run: |
          node --check app/assets/js/games/game-invites-v110.js
          php bot/tests/ProductionV110InviteTerminalActionsR12ContractTest.php
          php bot/tests/ProductionMvp14D2TerminalCardInPlaceV1130Test.php
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/mvp14-d2-surface-fix.yml
          git config user.name "manufact-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: detect the notification owner within the active sheet"
          git push origin HEAD:agent/mvp14-d2-terminal-card-in-place-v1130

name: MVP-19.3 Profile name colors

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260901_0019_add_profile_name_colors.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/ui.js'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/profile/mgw-avatar-presentation.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/css/screens/profile-corrective.css'
      - 'app/assets/css/components/mgw-name-colors.css'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp19_3ProfileNameColorsTest.php'
      - 'bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs'
      - 'bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php'
      - 'bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php'
      - 'bot/tests/Mvp19_4EffectsV2ContractTest.mjs'
      - '.github/workflows/mvp19-3-profile-name-colors.yml'
      - '.github/workflows/mvp19-3-profile-game-cosmetics.yml'
      - '.github/workflows/mvp19-3-profile-avatars.yml'
      - '.github/workflows/mvp19-4-game-cosmetics-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-profile-name-colors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-name-colors:
    name: Purchase, equip and public identity projection
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          php -l bot/database/migrations/20260901_0019_add_profile_name_colors.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/cosmetic-store.php
          php -l bot/helpers/response.php
          php -l bot/tests/Mvp19_3ProfileNameColorsTest.php
          php -l bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php
          php -l bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php
          node --check bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          node --check app/assets/js/api/client.js
          node --check app/assets/js/ui.js
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/profile-screen-v110.js
          node --check app/assets/js/profile/mgw-avatar-presentation.js
          node --check app/assets/js/production-clean-entry-v110.js

      - name: Run focused name-color contract
        run: php bot/tests/Mvp19_3ProfileNameColorsTest.php

      - name: Preserve existing inventory, Store, avatar and game cosmetic contracts
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php
          php bot/tests/ProfileV2PassAStaticContractTest.php
          php bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php
          php bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php

      - name: Guard canonical name-color product semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'price' => 500" bot/database/migrations/20260901_0019_add_profile_name_colors.php
          grep -F "'price' => 1000" bot/database/migrations/20260901_0019_add_profile_name_colors.php
          grep -F "'price' => 2500" bot/database/migrations/20260901_0019_add_profile_name_colors.php
          grep -F "'equip_slot' => self::SLOT" bot/database/migrations/20260901_0019_add_profile_name_colors.php
          grep -F "'name_colors' => array_values(\$profileNameColors)" bot/catalog/CosmeticStoreService.php
          grep -F "profile_name_color" bot/cosmetic-store.php
          grep -F "name_color_item_id" bot/helpers/response.php
          grep -F "data-name-color-item-id" app/assets/js/screens/store-screen.js
          grep -F "ownedNameColorItems" app/assets/js/screens/profile-screen-v110.js
          grep -F "player?.name_color_item_id" app/assets/js/profile/mgw-avatar-presentation.js
          grep -F "mgw:cosmetic-inventory-changed" app/assets/js/api/client.js
          grep -F "el.dataset.nameColorItemId = nameColorItemId" app/assets/js/ui.js
          grep -F 'content:"Mini Games"' app/assets/css/components/mgw-name-colors.css
          grep -F 'data-profile-game-tab="tictactoe"' app/assets/css/screens/profile-corrective.css
          grep -F "name-color-live-projection" app/runtime/client/version-manifest.php
          if grep -Fq 'cosmeticStorePurchase(' app/assets/js/screens/profile-screen-v110.js; then
            echo 'Profile became a purchase owner.' >&2
            exit 1
          fi

      - name: Guard frozen game engines and infrastructure
        if: ${{ github.event_name == 'pull_request' && !contains(github.head_ref, 'profile-badges') && !contains(github.head_ref, 'profile-backgrounds') && !contains(github.head_ref, 'profile-reactions') }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/games \
            bot/services/GameService.php \
            bot/services/GameActionService.php \
            bot/services/GameInviteService.php \
            bot/services/FriendGraphService.php \
            bot/services/ReconnectLifecycleService.php \
            app/assets/js/games \
            cron \
            config/private.php

          if [[ "${{ github.head_ref }}" == *"profile-frames"* ]]; then
            exit 0
          fi

          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp19-3-profile-name-colors.yml|\
              .github/workflows/mvp19-3-profile-game-cosmetics.yml|\
              .github/workflows/mvp19-3-profile-avatars.yml|\
              .github/workflows/mvp19-4-game-cosmetics-pilot.yml|\
              bot/database/migrations/20260901_0019_add_profile_name_colors.php|\
              bot/catalog/CosmeticStoreService.php|\
              bot/cosmetic-store.php|\
              bot/helpers/response.php|\
              app/assets/js/api/client.js|\
              app/assets/js/ui.js|\
              app/assets/js/screens/store-screen.js|\
              app/assets/js/screens/profile-screen-v110.js|\
              app/assets/js/profile/mgw-avatar-presentation.js|\
              app/assets/js/production-clean-entry-v110.js|\
              app/assets/css/screens/profile-corrective.css|\
              app/assets/css/components/mgw-name-colors.css|\
              app/assets/css/main.css|\
              app/runtime/client/version-manifest.php|\
              bot/tests/Mvp19_3ProfileNameColorsTest.php|\
              bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs|\
              bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php|\
              bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php|\
              bot/tests/Mvp19_4EffectsV2ContractTest.mjs)
                ;;
              *)
                echo "Unexpected name-color slice path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
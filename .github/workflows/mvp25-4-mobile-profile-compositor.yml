name: MVP-25.4 Mobile Profile compositor

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/css/components/mgw-profile-backgrounds.css'
      - 'app/assets/css/main.css'
      - 'app/assets/js/profile/mgw-mobile-profile-animation-guard-v2.js'
      - 'app/runtime/client/version-manifest.php'
      - 'e2e/staging/mvp25-4-profile-route-latency.spec.mjs'
      - 'e2e/playwright.config.mjs'
      - 'bot/tests/Mvp25_4MobileProfileCompositorContractTest.php'
      - '.github/workflows/mvp25-4-mobile-profile-compositor.yml'

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-4-mobile-profile-compositor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Mobile Profile compositor ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp25_4MobileProfileCompositorContractTest.php
          node --check app/assets/js/profile/mgw-mobile-profile-animation-guard-v2.js
          node --check e2e/staging/mvp25-4-profile-route-latency.spec.mjs

      - name: Current compositor ownership contract
        run: php bot/tests/Mvp25_4MobileProfileCompositorContractTest.php

      - name: MVP-27.1 recovery — full Profile UI and cosmetics regression
        run: |
          set -Eeuo pipefail
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php
          php bot/tests/ProfileV2PassAStaticContractTest.php
          php bot/tests/Mvp23ProfileRouteLatencyContractTest.php
          php bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest.php
          php bot/tests/Mvp25_4ProfileTapFinalContractTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_3ProfileBackgroundsTest.php
          php bot/tests/Mvp19_3ProfileBadgesTest.php
          php bot/tests/Mvp19_3ProfileFramesTest.php
          php bot/tests/Mvp19_3ProfileNameColorsTest.php
          php bot/tests/Mvp19_3ProfileReactionsTest.php
          php bot/tests/Mvp19_3ProfileEntryEffectsTest.php
          php bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          node bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs
          node bot/tests/Mvp19_7ReversiProfileParityContractTest.mjs
          node bot/tests/Mvp19_8GoProfileParityContractTest.mjs
          node bot/tests/Mvp19_FourInARowProfileParityContractTest.mjs
          node bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs
          php bot/tests/Mvp19_9DominoStoreProfileTest.php
          php bot/tests/Mvp26_3_11ProfileV2BalanceOwnershipContractTest.php

      # The historical MVP-23 contract pins a staging-entry cache hook that was
      # intentionally removed by later manifest normalization. The current
      # successor-safe contract above proves the preserved no-settle/direct-route
      # behavior without requiring that obsolete cache identity.

      - name: Frozen engine and bounded corrective scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-* || "${{ github.head_ref }}" == agent/mvp27-2-* ]]; then
            echo 'MVP-27.1/27.2 successor localization slice: historical bounded-scope guard is not applicable.'
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(bot/games/|app/assets/js/games/|app/assets/css/games/)'; then
            echo 'Frozen game engine path changed.' >&2
            exit 1
          fi
          allowed='^(app/assets/css/components/mgw-profile-backgrounds\.css|app/assets/css/main\.css|app/assets/js/profile/mgw-mobile-profile-animation-guard-v2\.js|app/runtime/client/version-manifest\.php|bot/tests/Mvp25_4MobileProfileCompositorContractTest\.php|\.github/workflows/mvp25-4-mobile-profile-compositor\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.4 Profile corrective paths:\n%s\n' "$bad" >&2; exit 1; }

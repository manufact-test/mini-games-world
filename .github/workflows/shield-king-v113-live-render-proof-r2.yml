name: Shield King V113 live render proof r2

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/shield-king-v113-live-render-proof-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d96232721159ea4c0f8c26844295e1874a7f21a0
          fetch-depth: 1
      - name: Verify exact deployed runtime fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php?v113_render_proof=2" > readiness.json
          python3 - readiness.json "$expected" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True
          assert p.get('source_fingerprint_sha256') == sys.argv[2]
          assert p.get('capabilities',{}).get('exact_runtime_fingerprint') is True
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.62.0
          npx --no-install playwright install --with-deps chromium
      - name: Prove current rendered V113 geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p v113-render-proof
          cat > .tmp-v113-render-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const origin=process.env.MGW_STAGING_ORIGIN;
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},locale:'ru-RU',deviceScaleFactor:1});
          await page.goto(`${origin}/app/v110.php?v=1123&v113_render_proof=2`,{waitUntil:'networkidle',timeout:35000});
          const resourceNames=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          if(!resourceNames.some(u=>u.includes('/assets/css/shield-king-icons-v10.css?v=133&icons=c1efd5af&proof=painted-geometry'))){
            throw new Error('V113 final CSS layer is not rendered by live page');
          }
          const gameSelector='.game-card img.shield-king-game-art[data-sk-delivery="static"]';
          await page.waitForFunction(sel=>document.querySelectorAll(sel).length===8,gameSelector,{timeout:15000});
          await page.waitForFunction(sel=>[...document.querySelectorAll(sel)].every(img=>img.complete&&img.naturalWidth===384&&img.naturalHeight===512),gameSelector,{timeout:15000});
          await page.waitForFunction(()=>document.querySelectorAll('.game-rules-button > img[data-sk-asset="ui/actions/rules.webp"]').length>=8,null,{timeout:10000});
          const metrics=await page.evaluate(()=>{
            const alphaBounds=img=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]<12)continue;minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}if(maxX<0)throw new Error('empty alpha');return{minX,minY,maxX,maxY,width:c.width,height:c.height}};
            const painted=img=>{const a=alphaBounds(img),r=img.getBoundingClientRect(),sx=r.width/a.width,sy=r.height/a.height;return{left:r.left+a.minX*sx,top:r.top+a.minY*sy,right:r.left+(a.maxX+1)*sx,bottom:r.top+(a.maxY+1)*sy,width:(a.maxX-a.minX+1)*sx,height:(a.maxY-a.minY+1)*sy}};
            const cards=[...document.querySelectorAll('.game-card')];
            const games=cards.map((card,i)=>{const img=card.querySelector('img.shield-king-game-art[data-sk-delivery="static"]'),pr=painted(img),cr=card.getBoundingClientRect(),hr=card.querySelector('h3').getBoundingClientRect();const prev=i?cards[i-1].getBoundingClientRect():null;const prevEl=card.previousElementSibling;const title=!i&&prevEl?.classList.contains('section-title')?prevEl.getBoundingClientRect():null;const cs=getComputedStyle(card),after=getComputedStyle(card,'::after');return{game:card.dataset.gameCard,leftDelta:pr.left-cr.left,topProtrusion:cr.top-pr.top,copyGap:hr.left-pr.right,clearance:prev?pr.top-prev.bottom:(title?pr.top-title.bottom:null),radius:cs.borderRadius,clipPath:cs.clipPath,borderStyle:cs.borderTopStyle,borderWidth:cs.borderTopWidth,afterBackground:after.backgroundImage}});
            const books=[...document.querySelectorAll('.game-rules-button')].map(b=>{const img=b.querySelector('img[data-sk-asset="ui/actions/rules.webp"]');if(!img||!img.complete||!img.naturalWidth)return null;const br=b.getBoundingClientRect(),pr=painted(img);return{context:b.closest('.game-card')?'card':(b.closest('.turn-actions')?'game-top':'other'),dx:((pr.left+pr.right)/2)-((br.left+br.right)/2),dy:((pr.top+pr.bottom)/2)-((br.top+br.bottom)/2)}}).filter(Boolean);
            return{games,books};
          });
          for(const m of metrics.games){if(Math.abs(m.leftDelta)>3)throw new Error(`not flush-left ${JSON.stringify(m)}`);if(m.topProtrusion<44)throw new Error(`not enough protrusion ${JSON.stringify(m)}`);if(m.copyGap<8)throw new Error(`copy cramped ${JSON.stringify(m)}`);if(m.clearance!==null&&m.clearance<24)throw new Error(`vertical collision ${JSON.stringify(m)}`);if(!m.radius.includes('20px')||m.clipPath!=='none'||m.borderStyle!=='solid'||parseFloat(m.borderWidth)<1||m.afterBackground!=='none')throw new Error(`frame contract ${JSON.stringify(m)}`)}
          const cardBooks=metrics.books.filter(b=>b.context==='card');if(cardBooks.length!==8)throw new Error(`expected 8 card books got ${cardBooks.length}`);for(const b of metrics.books){if(Math.abs(b.dx)>1||Math.abs(b.dy)>1)throw new Error(`book not centered ${JSON.stringify(b)}`)}
          await page.addStyleTag({content:'.preloader{display:none!important}'});await page.screenshot({path:'v113-render-proof/home.png',fullPage:true});

          const lp=await browser.newPage({viewport:{width:390,height:844},locale:'ru-RU',deviceScaleFactor:1});
          await lp.addInitScript(()=>document.addEventListener('DOMContentLoaded',()=>{const s=document.createElement('style');s.textContent='.preloader.hidden{opacity:1!important;visibility:visible!important;pointer-events:none!important}';document.head.appendChild(s)},{once:true}));
          await lp.goto(`${origin}/app/v110.php?v=1123&v113_loader_render_proof=2`,{waitUntil:'networkidle',timeout:35000});await lp.waitForSelector('.preloader .abstract-loader');
          const loaderResourceNames=await lp.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          if(!loaderResourceNames.some(u=>u.includes('/assets/css/shield-king-icons-v10.css?v=133&icons=c1efd5af&proof=painted-geometry')))throw new Error('loader page does not render V113 CSS');
          await lp.evaluate(()=>{for(const a of document.querySelector('.preloader .load-card').getAnimations({subtree:true})){a.pause();a.currentTime=650;}});await lp.screenshot({path:'v113-render-proof/loader-mid.png',fullPage:true});
          const mid=await lp.evaluate(()=>{const el=document.querySelector('.preloader .abstract-loader');const a=el.querySelector('.s1').getBoundingClientRect(),b=el.querySelector('.s2').getBoundingClientRect(),c=el.querySelector('.s3').getBoundingClientRect();return{s1:{left:a.left,top:a.top},s2:{left:b.left,top:b.top},s3:{left:c.left,top:c.top}}});
          await lp.evaluate(()=>{for(const a of document.querySelector('.preloader .load-card').getAnimations({subtree:true})){a.currentTime=1600;}});await lp.screenshot({path:'v113-render-proof/loader-final.png',fullPage:true});
          const finalLoader=await lp.evaluate(()=>{const el=document.querySelector('.preloader .abstract-loader'),after=getComputedStyle(el,'::after'),s1=getComputedStyle(el.querySelector('.s1')),s2=getComputedStyle(el.querySelector('.s2')),s3=getComputedStyle(el.querySelector('.s3'));return{opacity:parseFloat(after.opacity),background:after.backgroundImage,s1:parseFloat(s1.opacity),s2:parseFloat(s2.opacity),s3:parseFloat(s3.opacity)}});
          if(finalLoader.opacity<.98||!finalLoader.background.includes('/app/assets/icons/shield-king/mgw-mark.svg'))throw new Error(`final mark missing ${JSON.stringify(finalLoader)}`);if(finalLoader.s1>.08||finalLoader.s2>.08||finalLoader.s3>.08)throw new Error(`fragments remain ${JSON.stringify(finalLoader)}`);
          fs.writeFileSync('v113-render-proof/metrics.json',JSON.stringify({metrics,mid,finalLoader},null,2));console.log('[MGW_V113_RENDER_PASS]',JSON.stringify({metrics,mid,finalLoader}));await browser.close();
          JS
          node .tmp-v113-render-proof.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-king-v113-live-render-proof-r2-${{ github.run_id }}
          path: v113-render-proof
          if-no-files-found: warn
          retention-days: 3

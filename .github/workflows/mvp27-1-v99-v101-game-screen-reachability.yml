name: MVP-27.1 V99-V103 Legacy Search/Game Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/index.html'
      - 'app/v99.php'
      - 'app/v100.php'
      - 'app/v101.php'
      - 'app/v102.php'
      - 'app/v103.php'
      - 'app/v110.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/main-v99.js'
      - 'app/assets/js/main-v100.js'
      - 'app/assets/js/main-v101.js'
      - 'app/assets/js/production-clean-entry-v101.js'
      - 'app/assets/js/production-clean-entry-v102.js'
      - 'app/assets/js/production-clean-entry-v103.js'
      - 'app/assets/js/production-v101-result-speed.js'
      - 'app/assets/js/screens/search-screen-v99.js'
      - 'app/assets/js/screens/search-screen-v100.js'
      - 'app/assets/js/screens/game-screen-v99.js'
      - 'app/assets/js/screens/game-screen-v100-safe.js'
      - 'app/assets/js/screens/game-screen-v100.js'
      - 'ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-v99-v101-game-screen-reachability.yml'
      - '.github/workflows/mvp27-1-phase-b-current-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v99-v101-game-screen-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and factual reachability proof
        run: |
          set -euo pipefail
          php -l bot/helpers/WebAppLaunchUrl.php
          php -l app/v99.php
          php -l app/v100.php
          php -l app/v101.php
          php -l app/v102.php
          php -l app/v103.php
          php -l app/v110.php
          node --check app/assets/js/main-v99.js
          node --check app/assets/js/main-v100.js
          node --check app/assets/js/main-v101.js
          node --check app/assets/js/production-clean-entry-v101.js
          node --check app/assets/js/production-clean-entry-v102.js
          node --check app/assets/js/production-clean-entry-v103.js
          node --check app/assets/js/production-v101-result-speed.js
          node --check app/assets/js/screens/search-screen-v99.js
          node --check app/assets/js/screens/search-screen-v100.js
          node --check app/assets/js/screens/game-screen-v99.js
          node --check app/assets/js/screens/game-screen-v100-safe.js
          node --check app/assets/js/screens/game-screen-v100.js
          node --check ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs
          node ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs
          node ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs

      - name: Preserve localization architecture
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-v99-v101-game-screen-reachability\.yml|\.github/workflows/mvp27-1-phase-b-current-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected v99-v101 game-screen reachability paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

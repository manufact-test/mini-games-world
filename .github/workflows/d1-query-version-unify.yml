name: D1 query version unification

on:
  pull_request:
    branches:
      - agent/mvp14-d1-rewrite-trigger-base

permissions:
  contents: write

jobs:
  unify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Show conflicting imports
        run: git grep -n -F "game-invites.js?v=85" -- '*.js' || true

      - name: Unify canonical game-invites identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.js'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              text = path.read_text()
              updated = text.replace('game-invites.js?v=85', 'game-invites.js?v=d1')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No tracked game-invites.js?v=85 reference found')
          print('Updated:', *changed, sep='\n- ')
          PY

      - name: Run focused JavaScript graph check
        run: node scripts/ci/check-js.mjs

      - name: Commit unification and remove temporary runner
        run: |
          rm -f .github/workflows/d1-query-version-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify canonical game invite module identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

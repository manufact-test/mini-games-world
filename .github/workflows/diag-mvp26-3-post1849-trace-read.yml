name: DIAG MVP-26.3 post-1849 trace read

on:
  push:
    branches:
      - diag/mvp26-3-post1849-trace-read-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read privacy-minimal Android staging traces
        shell: bash
        run: |
          set -euo pipefail
          url='https://seashell-okapi-889488.hostingersite.com/bot/staging-android-balance-trace.php'
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 "$url" | tee /tmp/trace.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/trace.json').read_text())
          print("service:", data.get("service"))
          print("server_time_utc:", data.get("server_time_utc"))
          traces=data.get("traces") or []
          print("trace_count:", len(traces))
          for tr in traces:
              print("TRACE", tr.get("trace_id"))
              for ev in tr.get("events") or []:
                  print(json.dumps(ev, ensure_ascii=False, sort_keys=True))
          PY
      - name: Locate every balance DOM/state writer in current graph
        shell: bash
        run: |
          set -euo pipefail
          echo '=== balanceUnified occurrences ==='
          grep -RIn --exclude-dir=.git -- 'balanceUnified' app bot android-app || true
          echo '=== renderBalances occurrences ==='
          grep -RIn --exclude-dir=.git -- 'renderBalances' app bot android-app || true
          echo '=== state.user assignments in app/assets/js ==='
          grep -RIn --include='*.js' -- 'state\.user[[:space:]]*=' app/assets/js || true
          echo '=== balance-value / unified-balance occurrences ==='
          grep -RIn --exclude-dir=.git -E -- 'balance-value|unified-balance' app bot android-app || true

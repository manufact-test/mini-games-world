name: MVP-20.7 Rating profile, archives and Hall of Fame

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/ratings/RatingArchiveService.php'
      - 'bot/rating-archive.php'
      - 'bot/core/bootstrap.php'
      - 'bot/profile-v2.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/screens/tournaments-screen-v1.js'
      - 'app/assets/css/main.css'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp20_7RatingArchiveTest.php'
      - 'bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php'
      - '.github/workflows/mvp20-7-rating-archives.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp20-7-rating-archives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Profile history, frozen archives and Hall of Fame
    runs-on: ubuntu-24.04
    timeout-minutes: 22

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint MVP-20.7 server and client slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/ratings/RatingArchiveService.php
            bot/rating-archive.php
            bot/core/bootstrap.php
            bot/profile-v2.php
            app/runtime/client/version-manifest.php
            bot/tests/Mvp20_7RatingArchiveTest.php
            bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php -r 'json_decode(file_get_contents("app/locales/ru.json"), true, 512, JSON_THROW_ON_ERROR);'
          node --input-type=module --check < app/assets/js/api/client.js
          node --input-type=module --check < app/assets/js/screens/profile-screen-v110.js
          node --input-type=module --check < app/assets/js/screens/tournaments-screen-v1.js

      - name: Run MVP-20.7 archive model
        run: php bot/tests/Mvp20_7RatingArchiveTest.php

      - name: Run MVP-20.7 integration contract
        run: php bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php

      - name: Preserve MVP-20.6 yearly medal
        run: |
          php bot/tests/Mvp20_6YearlyMedalTest.php
          php bot/tests/Mvp20_6YearlyMedalIntegrationContractTest.php

      - name: Preserve MVP-20.5 seasonal awards
        run: |
          php bot/tests/Mvp20_5SeasonalAwardsTest.php
          php bot/tests/Mvp20_5SeasonalAwardsIntegrationContractTest.php

      - name: Preserve MVP-20.4 season lifecycle
        run: |
          php bot/tests/Mvp20_4QuarterlySeasonLifecycleTest.php
          php bot/tests/Mvp20_4SeasonLifecycleIntegrationContractTest.php

      - name: Preserve visible rating, hidden skill and leaderboard
        run: |
          php bot/tests/Mvp20_1PerGameVisibleRatingTest.php
          php bot/tests/Mvp20_1VisibleRatingIntegrationContractTest.php
          php bot/tests/Mvp20_2HiddenSkillModelTest.php
          php bot/tests/Mvp20_2HiddenSkillIntegrationContractTest.php
          php bot/tests/Mvp20_3LeaderboardsAntiFarmingTest.php
          php bot/tests/Mvp20_3LeaderboardIntegrationContractTest.php

      - name: Preserve Profile foundation
        run: |
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          php bot/tests/Mvp19_3ProfileFramesTest.php

      - name: Guard MVP-20.7 scope and frozen mechanics
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          successor=0
          if git diff --name-only "$base" "$head" | grep -Fxq '.github/workflows/mvp21-6-tournament-rounds.yml'; then
            successor=1
          fi
          bad=0
          while IFS= read -r path; do
            case "$path" in
              bot/ratings/RatingArchiveService.php|              bot/rating-archive.php|              bot/core/bootstrap.php|              bot/profile-v2.php|              app/assets/js/api/client.js|              app/assets/js/main-v110-handoff-shell.js|              app/assets/js/screens/profile-screen-v110.js|              app/assets/js/screens/tournaments-screen-v1.js|              app/assets/css/main.css|              app/locales/ru.json|              app/runtime/client/version-manifest.php|              bot/tests/Mvp20_7RatingArchiveTest.php|              bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php|              app/assets/css/components/mgw-tournament-honors.css|              app/assets/js/state.js|              bot/tests/Mvp21_9TournamentProductProjectionContractTest.php|              bot/tests/Mvp21_9TournamentRewardProjectionTest.php|              bot/tournaments/TournamentRewardProjectionService.php|              .github/workflows/mvp21-9-tournament-rewards.yml|              .github/workflows/mvp21-5-tournament-ready.yml|              .github/workflows/mvp21-6-tournament-rounds.yml|              .github/workflows/mvp21-7-tournament-technical-outcomes.yml|              .github/workflows/mvp21-8-tournament-cancellation.yml|              .github/workflows/mvp21-10-tournament-prize-review.yml|              bot/database/migrations/20260922_0060_create_tournament_prize_review.php|              bot/tournaments/TournamentPrizeReviewService.php|              bot/tournaments/TournamentSettlementService.php|              bot/admin-tournaments.php|              app/admin.php|              app/assets/js/admin-tournaments.js|              app/assets/css/admin-shell.css|              app/index.html|              .github/workflows/mvp21-11-tournament-release-proof.yml|              bot/tests/Mvp21_10TournamentPrizeReviewTest.php|              bot/tests/Mvp21_10TournamentPrizeReviewContractTest.php|              .github/workflows/mvp20-7-rating-archives.yml)
                ;;
              *)
                if [[ "$successor" -eq 0 ]]; then
                  echo "Unexpected MVP-20.7 path: $path" >&2
                  bad=1
                fi
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          git diff --exit-code "$base" "$head" --             bot/games app/assets/js/games app/assets/css/games             bot/catalog bot/economy bot/ledger bot/shop

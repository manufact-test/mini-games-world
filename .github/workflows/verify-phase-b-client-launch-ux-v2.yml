name: Verify Phase B Client Launch UX v2

on:
  push:
    branches:
      - agent/verify-phase-b-client-launch-ux-v2

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc '{state:"pending",context:"phase-b-client-launch-ux-v2-focused",description:"Client launch UX v2 checks are running"}')"

      - name: Checkout exact verification commit
        uses: actions/checkout@v4

      - name: Run focused checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/screens/game-screen-v102-safe.js
          node --check app/assets/js/production-v110-acceptance-runtime.js
          php -l app/v110.php
          php -l bot/tests/PhaseBClientLaunchUxContractTest.php
          php bot/tests/PhaseBClientLaunchUxContractTest.php

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [[ "${JOB_STATUS}" == 'success' ]]; then state='success'; description='Client launch UX v2 checks passed'; else state='failure'; description='Client launch UX v2 checks failed'; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc --arg state "${state}" --arg description "${description}" '{state:$state,context:"phase-b-client-launch-ux-v2-focused",description:$description}')"
          test "${state}" = 'success'

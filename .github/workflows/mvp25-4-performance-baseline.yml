name: MVP-25.4 Performance baseline

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp25-4-performance-baseline.yml'
      - 'e2e/playwright.mvp25-4-performance.config.mjs'
      - 'e2e/staging/mvp25-4-performance-baseline.spec.mjs'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp25-4-performance-baseline.yml'
      - 'e2e/playwright.mvp25-4-performance.config.mjs'
      - 'e2e/staging/mvp25-4-performance-baseline.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mgw-mvp25-4-performance-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  baseline:
    name: Cold start and first-open baseline
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Hostinger runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 12); do
            rm -f mvp25-4-readiness.json
            if curl               --fail-with-body               --silent --show-error               --connect-timeout 10 --max-time 25               --retry 1 --retry-delay 2 --retry-connrefused               --header 'Accept: application/json'               "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php"               --output mvp25-4-readiness.json; then
              if python3 - mvp25-4-readiness.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          assert payload.get('capabilities', {}).get('exact_runtime_fingerprint') is True
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          test "${ready}" = '1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Measure current staging
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install playwright test --config=e2e/playwright.mvp25-4-performance.config.mjs

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp25-4-performance-baseline-${{ github.run_id }}
          path: |
            artifacts/playwright-mvp25-4
            mvp25-4-readiness.json
          if-no-files-found: warn
          retention-days: 7

name: MVP-19.3 Profile Badges

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/profile/**'
      - 'bot/tests/Mvp19_3ProfileBadgesTest.php'
      - '.github/workflows/mvp19-3-profile-badges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  badges:
    name: Preserve accepted Profile badges
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Run badge contract
        run: php bot/tests/Mvp19_3ProfileBadgesTest.php
      - name: Guard accepted badge owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          if [[ "${{ github.head_ref }}" == agent/mvp27-2-manual-acceptance-recovery-* || "${{ github.head_ref }}" == agent/mvp27-2-manual-acceptance-locale-cards-* ]]; then
            git diff --exit-code "$base" "$head" -- bot/cosmetic-store.php bot/helpers/response.php app/assets/css/components/mgw-profile-badges.css bot/tests/Mvp19_3ProfileBadgesTest.php
            git diff --check
            echo "MVP-27.2 recovery successor: accepted Profile badges semantics passed; protected backend/catalog/test owners remain unchanged."
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-profile-badges-localization-* ]]; then
            git diff --exit-code "$base" "$head" -- bot/cosmetic-store.php bot/helpers/response.php app/assets/css/components/mgw-profile-badges.css
            git diff --check
            echo "MVP-27.1 Profile Badges localization: backend/catalog/CSS owners unchanged; focused badge contract protects accepted behavior."
            exit 0
          fi
          git diff --exit-code "$base" "$head" -- app/assets/js/profile/mgw-profile-badges.js bot/tests/Mvp19_3ProfileBadgesTest.php
          git diff --check

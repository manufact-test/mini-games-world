name: MVP-22 Web Admin rework

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/admin.php'
      - 'app/assets/css/admin-shell.css'
      - 'app/assets/js/admin-shell.js'
      - 'app/assets/js/admin-system.js'
      - 'app/assets/js/admin-support.js'
      - 'app/assets/js/admin-tournaments.js'
      - 'app/assets/js/admin-rating.js'
      - 'app/assets/js/admin-notifications.js'
      - 'app/assets/js/admin-reports.js'
      - 'bot/services/TelegramService.php'
      - 'bot/services/AdminService.php'
      - 'bot/admin-system.php'
      - 'bot/system/SystemAdminService.php'
      - 'bot/system/RuntimeFeatureFlagAdminService.php'
      - 'bot/database/migrations/20260926_0065_create_system_admin_control.php'
      - 'bot/tests/Mvp14WebAdminShellContractTest.php'
      - 'bot/tests/Mvp22AdminShellReworkContractTest.php'
      - 'bot/tests/Mvp22_5SystemAdminTest.php'
      - 'bot/tests/Mvp22_5SystemAdminContractTest.php'
      - '.github/workflows/mvp22-5-system-admin.yml'
      - '.github/workflows/mvp18-5-reports-blocked-users.yml'
      - '.github/workflows/mvp20-8-rating-admin.yml'
      - '.github/workflows/mvp21-5-tournament-ready.yml'
      - '.github/workflows/mvp21-6-tournament-rounds.yml'
      - '.github/workflows/mvp21-8-tournament-cancellation.yml'
      - '.github/workflows/mvp21-10-tournament-prize-review.yml'
      - '.github/workflows/mvp21-7-tournament-technical-outcomes.yml'
      - '.github/workflows/mvp22-admin-rework.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp22-admin-rework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-rework:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/admin.php
          php -l bot/services/TelegramService.php
          php -l bot/services/AdminService.php
          php -l bot/tests/Mvp22AdminShellReworkContractTest.php
          php -l bot/admin-system.php
          php -l bot/system/SystemAdminService.php
          php -l bot/system/RuntimeFeatureFlagAdminService.php
          php -l bot/database/migrations/20260926_0065_create_system_admin_control.php
          php -l bot/tests/Mvp22_5SystemAdminTest.php
          php -l bot/tests/Mvp22_5SystemAdminContractTest.php
          files=(
            app/assets/js/admin-shell.js
            app/assets/js/admin-system.js
            app/assets/js/admin-compensation.js
            app/assets/js/admin-support.js
            app/assets/js/admin-tournaments.js
            app/assets/js/admin-rating.js
            app/assets/js/admin-notifications.js
            app/assets/js/admin-reports.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Admin shell contract
        run: php bot/tests/Mvp22AdminShellReworkContractTest.php

      - name: System Admin contract
        run: |
          php bot/tests/Mvp22_5SystemAdminTest.php
          php bot/tests/Mvp22_5SystemAdminContractTest.php

      - name: Preserve Support backend contract
        run: php bot/tests/SupportTicketServiceTest.php

      - name: Preserve Admin-backed product owners
        shell: bash
        run: |
          set -euo pipefail
          php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php
          php bot/tests/Mvp20_8RatingAdminTest.php
          php bot/tests/Mvp20_8RatingAdminIntegrationContractTest.php
          php bot/tests/Mvp21_5TournamentMatchReadinessTest.php
          php bot/tests/Mvp21_6TournamentRoundProgressionTest.php
          php bot/tests/Mvp21_6TournamentRuntimeContractTest.php
          php bot/tests/Mvp21_6TournamentProgressionUxContractTest.php
          php bot/tests/Mvp21_8TournamentCancellationTest.php
          php bot/tests/Mvp21_10TournamentPrizeReviewTest.php
          php bot/tests/Mvp21_10TournamentPrizeReviewContractTest.php

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          if [[ "${{ github.head_ref }}" == agent/mvp22-admin-ux-* ]]; then
            allowed='^(\.github/workflows/(mvp22-admin-rework|mvp22-4-antifraud-replay|mvp22-3-moderation)\.yml|app/admin\.php|app/assets/css/admin-shell\.css|app/assets/js/admin-(shell|support|tournaments|rating|notifications|reports|compensation)\.js|bot/admin-(support|reports)\.php|bot/services/AdminService\.php|bot/support/SupportTicketService\.php|bot/social/PlayerReportService\.php|bot/tests/(Mvp18_5ReportsBlockedUsersContractTest|Mvp21_10TournamentPrizeReviewContractTest|Mvp22AdminShellReworkContractTest|Mvp22_2CompensationContractTest|SupportTicketServiceTest|SupportTicketMySqlIntegrationTest)\.php)$'
            while IFS= read -r path; do
              if ! grep -Eq "$allowed" <<<"$path"; then
                echo "Unexpected Admin UX audit path: $path" >&2
                bad=1
              fi
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/antifraud bot/replay bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger bot/cron
          elif [[ "${{ github.head_ref }}" == agent/mvp22-1-support-* ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-1-support-tickets.yml|app/admin.php|app/runtime/client/version-manifest.php|app/assets/css/admin-shell.css|app/assets/css/main.css|app/assets/js/admin-support.js|app/assets/js/screens/home-screen.js|app/assets/js/screens/notifications-screen-v110r13.js|bot/admin-support.php|bot/support.php|bot/support/SupportTicketService.php|bot/support/SupportTelegramNotifier.php|bot/support/SupportNotificationBridge.php|bot/notifications/AdminNotificationEventService.php|bot/notifications/NotificationCenterV2Policy.php|bot/tests/Mvp22AdminShellReworkContractTest.php|bot/tests/SupportTicketServiceTest.php|bot/tests/SupportTicketMySqlIntegrationTest.php|bot/tests/NotificationCenterV2PolicyTest.php|bot/tests/Mvp18_6NotificationPipelineContractTest.php)
                  ;;
                *)
                  echo "Unexpected Support successor path in Admin workflow: $path" >&2
                  bad=1
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/ratings bot/tournaments bot/economy bot/ledger
          elif [[ "${{ github.head_ref }}" == agent/mvp22-2-compensation-* || "${{ github.head_ref }}" == agent/mvp22-2-operation-browser-* ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/mvp15-8-economy-remote-config.yml|.github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-2-compensation.yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/js/admin-compensation.js|bot/admin-compensation.php|bot/economy/CompensationService.php|bot/database/migrations/20260925_0062_create_compensations.php|bot/runtime/ProductionPrimaryApplicationEntrypoints.php|bot/helpers/staging-e2e-runtime-files.txt|bot/tests/Mvp22_2CompensationWorkflowTest.php|bot/tests/Mvp22_2CompensationMySqlIntegrationTest.php|bot/tests/Mvp22_2CompensationContractTest.php)
                  ;;
                *)
                  echo "Unexpected Compensation successor path in Admin workflow: $path" >&2
                  bad=1
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/ratings bot/tournaments bot/ledger
          elif [[ "${{ github.head_ref }}" == agent/mvp22-3-* ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/mvp18-5-reports-blocked-users.yml|.github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-2-compensation.yml|.github/workflows/mvp22-3-moderation.yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/css/main.css|app/assets/js/admin-reports.js|app/assets/js/api/client.js|app/assets/js/components/account-shortcuts.js|app/assets/js/screens/friends-screen-v110.js|app/assets/js/screens/home-screen.js|app/assets/js/screens/profile-screen-v110.js|app/runtime/client/version-manifest.php|bot/admin-reports.php|bot/moderation.php|bot/moderation/ModerationService.php|bot/social/PlayerReportService.php|bot/database/migrations/20260925_0063_create_moderation_restrictions_appeals.php|bot/profile-v2.php|bot/friends.php|bot/invites.php|bot/api.php|bot/runtime/ProductionPrimaryApplicationEntrypoints.php|bot/helpers/staging-e2e-runtime-files.txt|bot/tests/Mvp18FriendsUiContractTest.mjs|bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php|bot/tests/Mvp22AdminShellReworkContractTest.php|bot/tests/Mvp22_3ModerationWorkflowTest.php|bot/tests/Mvp22_3ModerationMySqlIntegrationTest.php|bot/tests/Mvp22_3ModerationContractTest.php)
                  ;;
                *)
                  echo "Unexpected MVP-22.3 path in Admin workflow: $path" >&2
                  bad=1
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/ratings bot/tournaments bot/economy bot/ledger bot/support
          elif [[ "${{ github.head_ref }}" == agent/mvp22-4-* ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-3-moderation.yml|.github/workflows/mvp22-4-antifraud-replay.yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/js/admin-shell.js|app/assets/js/admin-antifraud.js|bot/admin-replay.php|bot/replay/MatchReplayReader.php|bot/antifraud/AntiFraudCaseService.php|bot/database/migrations/20260925_0064_create_antifraud_cases.php|bot/helpers/staging-e2e-runtime-files.txt|bot/tests/MatchReplayReaderTest.php|bot/tests/Mvp22AdminShellReworkContractTest.php|bot/tests/Mvp22_4AntiFraudWorkflowTest.php|bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php|bot/tests/Mvp22_4AntiFraudContractTest.php)
                  ;;
                *)
                  echo "Unexpected MVP-22.4 path in Admin workflow: $path" >&2
                  bad=1
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger
          elif [[ "${{ github.head_ref }}" == agent/mvp22-5-* ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-3-moderation.yml|.github/workflows/mvp22-4-antifraud-replay.yml|.github/workflows/mvp22-5-system-admin.yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/js/admin-system.js|bot/admin-system.php|bot/system/SystemAdminService.php|bot/system/RuntimeFeatureFlagAdminService.php|bot/database/migrations/20260926_0065_create_system_admin_control.php|bot/helpers/staging-e2e-runtime-files.txt|bot/tests/Mvp22AdminShellReworkContractTest.php|bot/tests/Mvp22_5SystemAdminTest.php|bot/tests/Mvp22_5SystemAdminContractTest.php)
                  ;;
                *)
                  echo "Unexpected MVP-22.5 path in Admin workflow: $path" >&2
                  bad=1
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger
          elif [[ "${{ github.head_ref }}" == agent/mvp22-6-* ]]; then
            allowed='^(\.github/workflows/(mvp22-admin-rework|mvp22-3-moderation|mvp22-4-antifraud-replay|mvp22-5-system-admin|mvp22-6-product-economy-analytics)\.yml|app/admin\.php|app/assets/css/admin-shell\.css|app/assets/js/(admin-shell|admin-analytics)\.js|bot/admin-analytics\.php|bot/analytics/(RealAccountScope|ProductEconomyAnalyticsService)\.php|bot/system/SystemAdminService\.php|bot/helpers/staging-e2e-runtime-files\.txt|bot/tests/(Mvp22AdminShellReworkContractTest|Mvp22_5SystemAdminTest|Mvp22_5SystemAdminContractTest|Mvp22_6ProductEconomyAnalyticsTest|Mvp22_6ProductEconomyAnalyticsContractTest)\.php)
            allowed='^(\.github/workflows/(mvp18-5-reports-blocked-users|mvp20-8-rating-admin|mvp21-5-tournament-ready|mvp21-6-tournament-rounds|mvp21-7-tournament-technical-outcomes|mvp21-8-tournament-cancellation|mvp21-10-tournament-prize-review)\.yml|app/admin\.php|app/assets/css/admin-shell\.css|app/assets/js/admin-(shell|support|tournaments|rating|notifications|reports)\.js|bot/services/(TelegramService|AdminService)\.php|bot/tests/Mvp14WebAdminShellContractTest\.php|bot/tests/Mvp22AdminShellReworkContractTest\.php|\.github/workflows/mvp22-admin-rework\.yml)$'
            while IFS= read -r path; do
              if ! grep -Eq "$allowed" <<<"$path"; then
                echo "Unexpected Admin rework path: $path" >&2
                bad=1
              fi
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/ratings bot/tournaments bot/economy bot/ledger
          fi

            while IFS= read -r path; do
              if ! grep -Eq "$allowed" <<<"$path"; then
                echo "Unexpected MVP-22.6 path in Admin workflow: $path" >&2
                bad=1
              fi
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger bot/antifraud bot/replay
          else
            allowed='^(\.github/workflows/(mvp18-5-reports-blocked-users|mvp20-8-rating-admin|mvp21-5-tournament-ready|mvp21-6-tournament-rounds|mvp21-7-tournament-technical-outcomes|mvp21-8-tournament-cancellation|mvp21-10-tournament-prize-review)\.yml|app/admin\.php|app/assets/css/admin-shell\.css|app/assets/js/admin-(shell|support|tournaments|rating|notifications|reports)\.js|bot/services/(TelegramService|AdminService)\.php|bot/tests/Mvp14WebAdminShellContractTest\.php|bot/tests/Mvp22AdminShellReworkContractTest\.php|\.github/workflows/mvp22-admin-rework\.yml)$'
            while IFS= read -r path; do
              if ! grep -Eq "$allowed" <<<"$path"; then
                echo "Unexpected Admin rework path: $path" >&2
                bad=1
              fi
            done < <(git diff --name-only "$base" "$head")
            test "$bad" -eq 0
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/ratings bot/tournaments bot/economy bot/ledger
          fi

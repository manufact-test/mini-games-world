name: MVP-15.6 presence stats cutover

on:
  push:
    branches:
      - agent/mvp-15-6-unified-zone-cutover
    paths:
      - '.github/workflows/mvp15-6-presence-stats-cutover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-6-unified-zone-cutover
          fetch-depth: 1
      - name: Remove room-counter-only ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          presence = r'''<?php
          declare(strict_types=1);

          final class PresenceService
          {
              private const ONLINE_WINDOW_SEC = 75;
              private const LEAVE_GRACE_SEC = 12;
              private const MARKER_FILE = '.enabled';

              private string $directory;

              public function __construct(?string $directory = null)
              {
                  $configuredDataDirectory = trim((string)($GLOBALS['config']['data_dir'] ?? ''));
                  $dataDirectory = $configuredDataDirectory !== ''
                      ? $configuredDataDirectory
                      : dirname(__DIR__) . '/data';
                  $defaultDirectory = rtrim($dataDirectory, DIRECTORY_SEPARATOR)
                      . DIRECTORY_SEPARATOR . '.runtime'
                      . DIRECTORY_SEPARATOR . 'presence';

                  $this->directory = rtrim($directory ?: $defaultDirectory, DIRECTORY_SEPARATOR);
              }

              public function touch(string $accountId, string $sessionId, string $presenceLeaseId = ''): void
              {
                  $accountId = trim($accountId);
                  $sessionId = trim($sessionId);
                  $presenceLeaseId = trim($presenceLeaseId);
                  if ($accountId === '' || $sessionId === '' || str_starts_with($accountId, 'bot_')) return;

                  $this->ensureDirectory();
                  @touch($this->directory . DIRECTORY_SEPARATOR . self::MARKER_FILE);

                  $accountDirectory = $this->accountDirectory($accountId);
                  if (!is_dir($accountDirectory) && !@mkdir($accountDirectory, 0700, true) && !is_dir($accountDirectory)) {
                      throw new RuntimeException('Не удалось обновить присутствие игрока.');
                  }

                  $path = $this->sessionPath($accountId, $sessionId, $presenceLeaseId);
                  $temporary = $path . '.tmp.' . bin2hex(random_bytes(4));
                  $payload = json_encode([
                      'touched_at' => time(),
                      'leave_after' => 0,
                  ], JSON_UNESCAPED_SLASHES);
                  if (!is_string($payload) || @file_put_contents($temporary, $payload, LOCK_EX) === false) {
                      @unlink($temporary);
                      throw new RuntimeException('Не удалось обновить присутствие игрока.');
                  }
                  @chmod($temporary, 0600);
                  if (!@rename($temporary, $path)) {
                      @unlink($temporary);
                      throw new RuntimeException('Не удалось обновить присутствие игрока.');
                  }

                  $this->pruneAccountDirectory($accountDirectory);
              }

              public function leave(string $accountId, string $sessionId, string $presenceLeaseId = ''): void
              {
                  $accountId = trim($accountId);
                  $sessionId = trim($sessionId);
                  $presenceLeaseId = trim($presenceLeaseId);
                  if ($accountId === '' || $sessionId === '') return;

                  $this->ensureDirectory();
                  @touch($this->directory . DIRECTORY_SEPARATOR . self::MARKER_FILE);
                  $path = $this->sessionPath($accountId, $sessionId, $presenceLeaseId);
                  if (!is_file($path)) return;

                  $state = $this->readSessionState($path);
                  $payload = json_encode([
                      'touched_at' => max(1, (int)($state['touched_at'] ?? time())),
                      'leave_after' => time() + self::LEAVE_GRACE_SEC,
                  ], JSON_UNESCAPED_SLASHES);
                  if (is_string($payload)) @file_put_contents($path, $payload, LOCK_EX);
                  $this->pruneAccountDirectory($this->accountDirectory($accountId));
              }

              /** @return list<string> */
              public function onlineAccountIds(): array
              {
                  if (!is_dir($this->directory)) return [];

                  $online = [];
                  foreach (glob($this->directory . DIRECTORY_SEPARATOR . 'account-*') ?: [] as $accountDirectory) {
                      if (!is_dir($accountDirectory)) continue;
                      $this->pruneAccountDirectory($accountDirectory);
                      if (!$this->directoryHasLiveSession($accountDirectory)) continue;

                      $accountId = trim((string)@file_get_contents($accountDirectory . DIRECTORY_SEPARATOR . '.account'));
                      if ($accountId === '' || str_starts_with($accountId, 'bot_')) continue;
                      $online[] = $accountId;
                  }
                  return array_values(array_unique($online));
              }

              public function isEnabled(): bool
              {
                  return is_file($this->directory . DIRECTORY_SEPARATOR . self::MARKER_FILE);
              }

              public function onlineWindowSec(): int
              {
                  return self::ONLINE_WINDOW_SEC;
              }

              private function ensureDirectory(): void
              {
                  if (!is_dir($this->directory) && !@mkdir($this->directory, 0700, true) && !is_dir($this->directory)) {
                      throw new RuntimeException('Не удалось подготовить присутствие игроков.');
                  }
              }

              private function accountDirectory(string $accountId): string
              {
                  $directory = $this->directory . DIRECTORY_SEPARATOR . 'account-' . hash('sha256', $accountId);
                  if (!is_dir($directory) && is_dir($this->directory)) @mkdir($directory, 0700, true);
                  if (is_dir($directory)) {
                      $idFile = $directory . DIRECTORY_SEPARATOR . '.account';
                      if (!is_file($idFile)) {
                          @file_put_contents($idFile, $accountId, LOCK_EX);
                          @chmod($idFile, 0600);
                      }
                  }
                  return $directory;
              }

              private function sessionPath(string $accountId, string $sessionId, string $presenceLeaseId = ''): string
              {
                  $leaseKey = $presenceLeaseId === ''
                      ? $sessionId
                      : $sessionId . "\0presence:" . $presenceLeaseId;
                  return $this->accountDirectory($accountId)
                      . DIRECTORY_SEPARATOR
                      . 'session-' . hash('sha256', $leaseKey) . '.presence';
              }

              private function pruneAccountDirectory(string $accountDirectory): void
              {
                  if (!is_dir($accountDirectory)) return;
                  $now = time();
                  $cutoff = $now - self::ONLINE_WINDOW_SEC;
                  foreach (glob($accountDirectory . DIRECTORY_SEPARATOR . 'session-*.presence') ?: [] as $path) {
                      $state = $this->readSessionState($path);
                      $touchedAt = (int)($state['touched_at'] ?? 0);
                      $leaveAfter = (int)($state['leave_after'] ?? 0);
                      if ($touchedAt <= 0 || $touchedAt < $cutoff || ($leaveAfter > 0 && $leaveAfter <= $now)) {
                          @unlink($path);
                      }
                  }

                  if (!$this->directoryHasLiveSession($accountDirectory)) {
                      @unlink($accountDirectory . DIRECTORY_SEPARATOR . '.account');
                      @rmdir($accountDirectory);
                  }
              }

              private function directoryHasLiveSession(string $accountDirectory): bool
              {
                  $now = time();
                  $cutoff = $now - self::ONLINE_WINDOW_SEC;
                  foreach (glob($accountDirectory . DIRECTORY_SEPARATOR . 'session-*.presence') ?: [] as $path) {
                      $state = $this->readSessionState($path);
                      $touchedAt = (int)($state['touched_at'] ?? 0);
                      $leaveAfter = (int)($state['leave_after'] ?? 0);
                      if ($touchedAt >= $cutoff && ($leaveAfter <= 0 || $leaveAfter > $now)) return true;
                  }
                  return false;
              }

              private function readSessionState(string $path): array
              {
                  $raw = trim((string)@file_get_contents($path));
                  if ($raw === '') return ['touched_at' => 0, 'leave_after' => 0];

                  $decoded = json_decode($raw, true);
                  if (is_array($decoded)) {
                      return [
                          'touched_at' => (int)($decoded['touched_at'] ?? 0),
                          'leave_after' => (int)($decoded['leave_after'] ?? 0),
                      ];
                  }

                  return ['touched_at' => (int)$raw, 'leave_after' => 0];
              }
          }
          '''.replace('          ', '')
          Path('bot/services/PresenceService.php').write_text(presence, encoding='utf-8')

          stats = r'''<?php
          declare(strict_types=1);

          require_once __DIR__ . '/PresenceService.php';

          final class StatsService
          {
              private const STAGING_TEST_ACCOUNT_IDS = ['stg_test_player_a', 'stg_test_player_b'];
              private PresenceService $presence;

              public function __construct(?PresenceService $presence = null)
              {
                  $this->presence = $presence ?? new PresenceService();
              }

              public function build(array $db): array
              {
                  $onlineAccounts = [];
                  if ($this->presence->isEnabled()) {
                      foreach ($this->presence->onlineAccountIds() as $accountId) {
                          $accountId = trim((string)$accountId);
                          if ($accountId === '' || str_starts_with($accountId, 'bot_') || $this->hideStagingTestAccount($accountId)) continue;
                          $onlineAccounts[$accountId] = true;
                      }
                  } else {
                      $now = time();
                      foreach ($db['users'] ?? [] as $storageKey => $user) {
                          if (!is_array($user)) continue;
                          $last = strtotime((string)($user['last_seen_at'] ?? '')) ?: 0;
                          if ($last <= 0 || $now - $last > $this->presence->onlineWindowSec()) continue;
                          $accountId = $this->accountIdForUser($user, (string)$storageKey);
                          if ($accountId === '' || str_starts_with($accountId, 'bot_') || $this->hideStagingTestAccount($accountId)) continue;
                          $onlineAccounts[$accountId] = true;
                      }
                  }

                  $activeGames = 0;
                  foreach ($db['games'] ?? [] as $game) {
                      if (!is_array($game) || ($game['status'] ?? '') !== 'active') continue;
                      if ($this->hideStagingTestGame($game)) continue;
                      $activeGames++;
                  }

                  return [
                      'online_players' => count($onlineAccounts),
                      'active_games' => $activeGames,
                  ];
              }

              private function accountIdForUser(array $user, string $storageKey): string
              {
                  return trim((string)($user['telegram_id'] ?? $user['id'] ?? $storageKey));
              }

              private function hideStagingTestGame(array $game): bool
              {
                  foreach ($game['player_ids'] ?? [] as $playerId) {
                      if ($this->hideStagingTestAccount((string)$playerId)) return true;
                  }
                  return false;
              }

              private function hideStagingTestAccount(string $accountId): bool
              {
                  $environment = strtolower(trim((string)($GLOBALS['config']['environment'] ?? '')));
                  if ($environment !== 'staging') return false;
                  if (trim((string)($_COOKIE['mgw_staging_test_session'] ?? '')) !== '') return false;
                  return in_array($accountId, self::STAGING_TEST_ACCOUNT_IDS, true);
              }
          }
          '''.replace('          ', '')
          Path('bot/services/StatsService.php').write_text(stats, encoding='utf-8')

          p = Path('bot/presence.php')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"    \$room = clean_string\(\$payload\['room'\] \?\? '', 16\);\n    \$room = in_array\(\$room, \['match', 'gold'\], true\) \? \$room : '';\n", '', s, count=1)
          if n != 1: raise SystemExit('presence.php room parse not found')
          old = "$presence->touch($accountId, $sessionId, $presenceLeaseId, $room);"
          if s.count(old) != 1: raise SystemExit('presence.php touch call not found')
          s = s.replace(old, "$presence->touch($accountId, $sessionId, $presenceLeaseId);", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/assets/js/production-v110-presence.js')
          s = p.read_text(encoding='utf-8')
          old = "import { state } from './state.js?v=27';\n"
          if s.count(old) != 1: raise SystemExit('presence client state import not found')
          s = s.replace(old, '', 1)
          pattern = r"function payload\(action\)\{\n  const room = .*?\n  return \{(.*?)\n    room,\n    action,\n  \};\n\}"
          repl = "function payload(action){\n  return {\\1\n    action,\n  };\n}"
          s, n = re.subn(pattern, repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('presence client room payload not found')
          p.write_text(s, encoding='utf-8')
          PY

          php -l bot/services/PresenceService.php
          php -l bot/services/StatsService.php
          php -l bot/presence.php
          node --check app/assets/js/production-v110-presence.js

          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add bot/services/PresenceService.php bot/services/StatsService.php bot/presence.php app/assets/js/production-v110-presence.js
          git commit -m 'MVP-15.6: remove room-specific presence counters'
          git push origin HEAD:agent/mvp-15-6-unified-zone-cutover

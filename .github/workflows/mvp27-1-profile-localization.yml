name: MVP-27.1 Profile Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/profile/mgw-profile-model.js'
      - 'app/assets/js/profile/mgw-profile-chess-parity.js'
      - 'app/assets/js/profile/mgw-profile-checkers-parity.js'
      - 'app/assets/js/profile/mgw-profile-chess-layout-v2.js'
      - 'app/assets/js/profile/mgw-profile-reversi-parity.js'
      - 'app/assets/js/profile/mgw-profile-go-parity.js'
      - 'app/assets/js/profile/mgw-profile-domino-parity.js'
      - 'app/assets/js/profile/mgw-profile-four-in-a-row-parity.js'
      - 'app/assets/js/profile/mgw-profile-battleship-parity.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs'
      - 'bot/tests/Mvp22_3ModerationContractTest.php'
      - 'bot/tests/Mvp19_3ProfileAvatarsTest.php'
      - 'bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs'
      - 'bot/tests/Mvp19_7ReversiProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_8GoProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_9DominoStoreProfileTest.php'
      - 'bot/tests/Mvp19_FourInARowProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_FourInARowProfileInventoryTest.php'
      - 'bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipProfileInventoryTest.php'
      - 'bot/tests/ProfileV2CorrectiveStaticContractTest.php'
      - 'bot/tests/Mvp19_4GameCosmeticsPilotTest.php'
      - 'bot/tests/Mvp19_1ProductInventoryTest.php'
      - 'ops/checks/mvp27_1_profile_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-profile-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/profile-screen-v110.js
          node --check app/assets/js/profile/mgw-profile-model.js
          node --check app/assets/js/profile/mgw-profile-chess-parity.js
          node --check app/assets/js/profile/mgw-profile-checkers-parity.js
          node --check app/assets/js/profile/mgw-profile-chess-layout-v2.js
          node --check app/assets/js/profile/mgw-profile-reversi-parity.js
          node --check app/assets/js/profile/mgw-profile-go-parity.js
          node --check app/assets/js/profile/mgw-profile-domino-parity.js
          node --check app/assets/js/profile/mgw-profile-four-in-a-row-parity.js
          node --check app/assets/js/profile/mgw-profile-battleship-parity.js
          node --check ops/checks/mvp27_1_profile_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp22_3ModerationContractTest.php
          node ops/checks/mvp27_1_profile_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve Profile cosmetics and parity contracts
        run: |
          set -euo pipefail
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php
          node bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs
          node bot/tests/Mvp19_7ReversiProfileParityContractTest.mjs
          node bot/tests/Mvp19_8GoProfileParityContractTest.mjs
          php bot/tests/Mvp19_9DominoStoreProfileTest.php
          node bot/tests/Mvp19_FourInARowProfileParityContractTest.mjs
          php bot/tests/Mvp19_FourInARowProfileInventoryTest.php
          node bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs
          php bot/tests/Mvp19_12BattleshipProfileInventoryTest.php
          php bot/tests/Mvp22_3ModerationContractTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/screens/profile-screen-v110\.js|app/assets/js/profile/mgw-profile-model\.js|app/assets/js/profile/mgw-profile-chess-parity\.js|app/assets/js/profile/mgw-profile-checkers-parity\.js|app/assets/js/profile/mgw-profile-chess-layout-v2\.js|app/assets/js/profile/mgw-profile-reversi-parity\.js|app/assets/js/profile/mgw-profile-go-parity\.js|app/assets/js/profile/mgw-profile-domino-parity\.js|app/assets/js/profile/mgw-profile-four-in-a-row-parity\.js|app/assets/js/profile/mgw-profile-battleship-parity\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|bot/tests/Mvp19_3ProfileGameCosmeticsContractTest\.mjs|bot/tests/Mvp22_3ModerationContractTest\.php|bot/tests/Mvp19_3ProfileAvatarsTest\.php|bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest\.mjs|bot/tests/Mvp19_7ReversiProfileParityContractTest\.mjs|bot/tests/Mvp19_8GoProfileParityContractTest\.mjs|bot/tests/Mvp19_9DominoStoreProfileTest\.php|bot/tests/Mvp19_FourInARowProfileParityContractTest\.mjs|bot/tests/Mvp19_FourInARowProfileInventoryTest\.php|bot/tests/Mvp19_12BattleshipProfileParityContractTest\.mjs|bot/tests/Mvp19_12BattleshipProfileInventoryTest\.php|bot/tests/ProfileV2CorrectiveStaticContractTest\.php|bot/tests/Mvp19_4GameCosmeticsPilotTest\.php|bot/tests/Mvp19_1ProductInventoryTest\.php|ops/checks/mvp27_1_profile_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-profile-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Profile localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: MVP-27.1 Legacy Notifications Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v110.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/main.js'
      - 'app/assets/js/main-v99.js'
      - 'app/assets/js/main-v100.js'
      - 'app/assets/js/main-v101.js'
      - 'app/assets/js/main-v102.js'
      - 'app/assets/js/main-v103.js'
      - 'app/assets/js/main-v104.js'
      - 'app/assets/js/main-v105.js'
      - 'app/assets/js/main-v106.js'
      - 'app/assets/js/main-v107.js'
      - 'app/assets/js/main-v108.js'
      - 'app/assets/js/main-v109.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/production-clean-entry-v109.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/production-v109-notifications.js'
      - 'app/assets/js/screens/notifications-screen.js'
      - 'app/assets/js/screens/notifications-screen-v99.js'
      - 'app/assets/js/screens/notifications-screen-v110-root.js'
      - 'app/assets/js/screens/notifications-screen-v110.js'
      - 'app/assets/js/screens/notifications-screen-v110r4.js'
      - 'app/assets/js/screens/notifications-screen-v110r5.js'
      - 'app/assets/js/screens/notifications-screen-v110r12.js'
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'ops/checks/mvp27_1_notification_center_localization_contract.mjs'
      - 'ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-legacy-notifications-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notifications-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and factual reachability proof
        run: |
          set -euo pipefail
          php -l bot/helpers/WebAppLaunchUrl.php
          php -l app/v110.php
          node --check ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs
          node --check ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs
          node ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs

      - name: Preserve active notification localization
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_notification_center_localization_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_legacy_notifications_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-legacy-notifications-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected legacy-notifications reachability paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

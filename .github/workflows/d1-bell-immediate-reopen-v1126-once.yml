name: D1 bell immediate reopen v1126 one-shot

on:
  push:
    branches:
      - agent/mvp14-d1-bell-immediate-reopen-v1126

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'MVP-14 D1: remove bell reopen blackout v1126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact base and patch canonical Start graph
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "3d23e1d0550cbe3d9ef6f6fd9c53a39838d8ba74"
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'app/assets/js/screens/notifications-screen-v110r12.js',
              """  const bell = target.closest('#notificationsOpen');
          if (bell) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (Date.now() < closeGuardUntil || Date.now() < openGuardUntil) return;
            openGuardUntil = Date.now() + OPEN_GUARD_MS;
            void openNotificationsSheet({ seed:currentItems(), source:'bell' });
          }
          """,
              """  const bell = target.closest('#notificationsOpen');
          if (bell) {
            event.preventDefault();
            event.stopImmediatePropagation();
            // The bell has one capture-phase owner, so a timer blackout is neither
            // required nor allowed. Every real click may open immediately after close.
            void openNotificationsSheet({ seed:currentItems(), source:'bell' });
          }
          """,
          )

          replace_exact('app/v110.php', './assets/js/main-v110.js?v=1125', './assets/js/main-v110.js?v=1126')
          replace_exact('app/assets/js/main-v110.js', './main-v110-handoff-shell.js?v=1125', './main-v110-handoff-shell.js?v=1126')
          replace_exact(
              'app/assets/js/main-v110-handoff-shell.js',
              "./screens/notifications-screen-v110r12.js?v=1125",
              "./screens/notifications-screen-v110r12.js?v=1126",
          )

          test_path = Path('bot/tests/ProductionMvp14D1BellImmediateReopenV1126Test.php')
          test_path.write_text(r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static fn(string $path): string => (string)file_get_contents($root . '/' . $path);
          $assert = static function (bool $condition, string $message): void {
              if (!$condition) throw new RuntimeException($message);
          };

          $launch = $read('bot/helpers/WebAppLaunchUrl.php');
          $entry = $read('app/v110.php');
          $main = $read('app/assets/js/main-v110.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110r12.js');

          $assert(str_contains($launch, "private const ENTRY_PATH = '/app/v110.php?v=1123';"),
              'Ordinary Telegram Start must remain on the canonical v110 route.');
          $assert(str_contains($entry, './assets/js/main-v110.js?v=1126'),
              'v110 entry must publish the fresh main identity.');
          $assert(str_contains($main, './main-v110-handoff-shell.js?v=1126'),
              'Main must publish the fresh handoff-shell identity.');
          $assert(str_contains($shell, "./screens/notifications-screen-v110r12.js?v=1126"),
              'The ordinary Start shell must publish the fresh notification owner.');

          $bellStart = strpos($notifications, "function handleDocumentClick(event)");
          $bellEnd = strpos($notifications, "function handleSheetClosed()", $bellStart ?: 0);
          $assert($bellStart !== false && $bellEnd !== false && $bellEnd > $bellStart,
              'Canonical bell handler boundaries are unavailable.');
          $bellHandler = substr($notifications, $bellStart, $bellEnd - $bellStart);

          $assert(substr_count($notifications, "document.addEventListener('click', handleDocumentClick, true)") === 1,
              'The notification bell must have exactly one capture-phase owner.');
          $assert(str_contains($bellHandler, "event.stopImmediatePropagation();"),
              'The canonical bell owner must stop competing handlers.');
          $assert(!str_contains($bellHandler, 'closeGuardUntil') && !str_contains($bellHandler, 'openGuardUntil'),
              'The bell must not contain a post-close or post-open timer blackout.');
          $assert(str_contains($bellHandler, "openNotificationsSheet({ seed:currentItems(), source:'bell' })"),
              'Every accepted bell click must open through the canonical sheet owner.');
          $assert(str_contains($notifications, 'announcementGuardUntil'),
              'Toast announcement protection must remain intact.');

          echo "ProductionMvp14D1BellImmediateReopenV1126Test: 12 assertions passed\n";
          ''', encoding='utf-8')

          e2e = Path('e2e/staging/d1-real-user-regressions-v127.spec.mjs')
          text = e2e.read_text(encoding='utf-8')
          old_route = "const APP_ROUTE = `${STAGING_ORIGIN}/app/`;"
          if text.count(old_route) != 1:
              raise SystemExit('Expected one ordinary Start route declaration.')
          text = text.replace(old_route, "const APP_ROUTE = `${STAGING_ORIGIN}/app/v110.php?v=1123`;", 1)

          old_test = """test('canonical ordinary Start bell opens through one browser click', async ({ browser }) => {
            const player = await openOrdinaryStart(browser);
            try {
              await player.page.locator('#notificationsOpen').click();
              await expect(player.page.locator('#sheetOverlay')).toHaveClass(/active/);
              await expect(player.page.locator('#sheet .sheet-head h2')).toHaveText('Уведомления');
              await expect(player.page.locator('#sheet [data-notifications-sheet]')).toHaveCount(1);
            } finally {
              await revokeAndClose(player.context);
            }
          });
          """
          new_test = """test('canonical ordinary Start bell reopens immediately for 25 click cycles', async ({ browser }) => {
            const player = await openOrdinaryStart(browser);
            try {
              for (let cycle = 0; cycle < 25; cycle += 1) {
                await player.page.locator('#notificationsOpen').click({ timeout:5_000 });
                await expect(player.page.locator('#sheetOverlay')).toHaveClass(/active/);
                await expect(player.page.locator('#sheet .sheet-head h2')).toHaveText('Уведомления');
                await expect(player.page.locator('#sheet [data-notifications-sheet]')).toHaveCount(1);
                await player.page.locator('#sheet [data-close-sheet]').click({ timeout:5_000 });
                await expect(player.page.locator('#sheetOverlay')).not.toHaveClass(/active/);
              }
            } finally {
              await revokeAndClose(player.context);
            }
          });
          """
          if text.count(old_test) != 1:
              raise SystemExit('Expected the old one-click ordinary Start test exactly once.')
          e2e.write_text(text.replace(old_test, new_test, 1), encoding='utf-8')

          workflow = Path('.github/workflows/d1-bell-immediate-reopen-v1126-once.yml')
          workflow.unlink()
          PY

      - name: Validate focused change
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/screens/notifications-screen-v110r12.js
          node --check app/assets/js/main-v110.js
          node --check app/assets/js/main-v110-handoff-shell.js
          php bot/tests/ProductionMvp14D1BellImmediateReopenV1126Test.php
          git diff --check
          test "$(git status --short | wc -l)" -eq 7

      - name: Commit and push exact feature head
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/v110.php \
            app/assets/js/main-v110.js \
            app/assets/js/main-v110-handoff-shell.js \
            app/assets/js/screens/notifications-screen-v110r12.js \
            e2e/staging/d1-real-user-regressions-v127.spec.mjs \
            bot/tests/ProductionMvp14D1BellImmediateReopenV1126Test.php \
            .github/workflows/d1-bell-immediate-reopen-v1126-once.yml
          git commit -m 'MVP-14 D1: remove bell reopen blackout v1126'
          git push origin HEAD:agent/mvp14-d1-bell-immediate-reopen-v1126

name: MVP-16.1C rollback exact live proof

on:
  push:
    branches:
      - agent/mvp-16-1c-preloader-rollback
    paths:
      - '.github/workflows/mvp16-1c-rollback-live-proof.yml'

permissions:
  contents: read

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-13-2-staging
          fetch-depth: 1
      - name: Compare restored staging to live Hostinger runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "STAGING_SHA=$(git rev-parse HEAD)"
          echo "STAGING_TREE=$(git rev-parse HEAD^{tree})"
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          for i in 1 2 3 4 5 6; do
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output live.json
            if python3 - "${expected}" <<'PY'
          import json,sys
          p=json.load(open('live.json',encoding='utf-8'))
          expected=sys.argv[1]
          actual=p.get('source_fingerprint_sha256')
          print('EXPECTED_RUNTIME_FINGERPRINT='+expected)
          print('LIVE_RUNTIME_FINGERPRINT='+str(actual))
          assert p.get('ok') is True
          assert p.get('environment') == 'staging'
          assert p.get('capabilities',{}).get('exact_runtime_fingerprint') is True
          assert actual == expected
          PY
            then
              echo 'MVP16_1C_ROLLBACK_LIVE_PROOF=PASS'
              exit 0
            fi
            sleep 5
          done
          exit 1

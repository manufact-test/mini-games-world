name: MVP-19.3 Victory Effects 01-02

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260909_0026_add_profile_victory_effect_spark_burst.php'
      - 'bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php'
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/assets/js/profile/mgw-victory-effect-selector.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-card-parity.js'
      - 'app/assets/css/production-v109-victory-effects-spark-burst.css'
      - 'app/assets/css/production-v112-victory-effects-firework-salvo.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php'
      - '.github/workflows/mvp19-3-victory-spark-burst.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-3-victory-effects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  victory-effects:
    name: Store Profile winner presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          php -l bot/database/migrations/20260909_0026_add_profile_victory_effect_spark_burst.php
          php -l bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          php -l bot/cosmetic-store.php
          php -l bot/helpers/response.php
          php -l bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php
          node --check app/assets/js/profile/mgw-victory-effect-selector.js
          node --check app/assets/js/profile/mgw-profile-victory-effects.js
          node --check app/assets/js/profile/mgw-profile-victory-effects-card-parity.js
          php -l app/runtime/client/version-manifest.php

      - name: Run Victory Effects 01-02 contract
        run: php bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php

      - name: Preserve winner selector contract
        run: node tests/mvp19-3-victory-effect-selector.mjs

      - name: Preserve accepted inventory and Entry Effects
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileEntryEffectsTest.php
          node tests/mvp19-3-entry-effect-player-arbitration.mjs

      - name: Guard Victory Effect product and visual contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "private const ITEM_ID = 'profile-victory-effect-01'" bot/database/migrations/20260909_0026_add_profile_victory_effect_spark_burst.php
          grep -F 'private const PRICE = 5000' bot/database/migrations/20260909_0026_add_profile_victory_effect_spark_burst.php
          grep -F 'private const DURATION_MS = 2200' bot/database/migrations/20260909_0026_add_profile_victory_effect_spark_burst.php
          grep -F "private const ITEM_ID = 'profile-victory-effect-02'" bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          grep -F 'private const PRICE = 8500' bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          grep -F 'private const DURATION_MS = 2900' bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          grep -F "'display_name' => 'Салют победителя'" bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          grep -F "'variant' => 'firework-salvo'" bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php
          grep -F 'selectWinnerVictoryEffect(game)' app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F '#resultSummary[data-result-game-id]' app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F 'mgw-victory-effect-skip' app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F "fireworkBurstMarkup('salvo-left',22" app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F "fireworkBurstMarkup('salvo-right',22" app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F "fireworkBurstMarkup('salvo-center',30" app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F 'fireworkConfettiMarkup(24)' app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F 'fireworkStarfieldMarkup(18)' app/assets/js/profile/mgw-profile-victory-effects.js
          grep -F 'mgwVictorySalvoTrailLeft' app/assets/css/production-v112-victory-effects-firework-salvo.css
          grep -F 'mgwVictorySalvoRayCenter' app/assets/css/production-v112-victory-effects-firework-salvo.css
          grep -F '@media(prefers-reduced-motion:reduce)' app/assets/css/production-v112-victory-effects-firework-salvo.css
          grep -F 'production-v112-victory-effects-firework-salvo.css?v=1' app/assets/js/profile/mgw-profile-victory-effects-card-parity.js
          grep -F 'mgw-profile-victory-effects-card-parity.js?v=9&mvp19_3=firework-salvo' app/runtime/client/version-manifest.php
          grep -F 'victory=firework-salvo&visual_repair=9' app/runtime/client/version-manifest.php
          ! grep -Eq '\.(webp|png|jpe?g)' app/assets/js/profile/mgw-profile-victory-effects.js
          ! grep -Fq 'gameAction(' app/assets/js/profile/mgw-profile-victory-effects.js
          git diff --check

      - name: Guard frozen engines and bounded Victory slice
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/games \
            bot/services/GameService.php \
            bot/services/GameActionService.php \
            bot/services/GameInviteService.php \
            app/assets/js/screens/game-screen-v102.js \
            app/assets/js/games \
            cron \
            config/private.php

          bad=0
          while IFS= read -r path; do
            case "$path" in
              bot/database/migrations/20260910_0027_add_profile_victory_effect_firework_salvo.php|\
              app/assets/js/profile/mgw-profile-victory-effects.js|\
              app/assets/js/profile/mgw-profile-victory-effects-card-parity.js|\
              app/assets/css/production-v112-victory-effects-firework-salvo.css|\
              app/runtime/client/version-manifest.php|\
              bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php|\
              .github/workflows/mvp19-3-victory-spark-burst.yml)
                ;;
              *)
                echo "Unexpected path in Firework Salvo slice: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0

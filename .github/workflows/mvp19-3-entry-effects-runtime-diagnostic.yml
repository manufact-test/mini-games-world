name: MVP-19.3 Entry Effects canonical live-owner integrity

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/css/production-v106-store-avatar-frame-density.css'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/media/cosmetics/entry-effects/store-entry-01-celestial-gate.svg'
      - 'app/assets/media/cosmetics/entry-effects/store-entry-02-king-ascension.svg'
      - 'app/assets/media/cosmetics/entry-effects/store-entry-03-lord-blade.svg'
      - 'app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp'
      - 'app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp'
      - 'app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp'
      - 'e2e/staging/entry-effects-runtime-diagnostic.spec.mjs'
      - 'e2e/playwright.entry-effects-diagnostic.config.mjs'
      - '.github/workflows/mvp19-3-entry-effects-runtime-diagnostic.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-integrity:
    name: Verify canonical Entry Effect real-img owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Forensic-decode cinematic WebP assets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p artifacts/entry-webp-forensic
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          import hashlib, json

          paths = [
              Path('app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp'),
              Path('app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp'),
              Path('app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp'),
          ]
          report = []
          for path in paths:
              img = Image.open(path)
              img.load()
              rgba = img.convert('RGBA')
              alpha = rgba.getchannel('A')
              rgb = rgba.convert('RGB')
              ah = alpha.histogram()
              total = rgba.width * rgba.height
              transparent = ah[0]
              opaque = ah[255]
              partial = total - transparent - opaque
              nonzero = total - transparent
              bbox = alpha.getbbox()
              alpha_bytes = alpha.tobytes()
              rgb_bytes = rgb.tobytes()
              extrema = rgba.getextrema()
              stat = ImageStat.Stat(rgba)

              # Checker composite makes transparency visually inspectable as an artifact.
              checker = Image.new('RGBA', rgba.size, (42, 46, 54, 255))
              px = checker.load()
              for y in range(0, rgba.height, 24):
                  for x in range(0, rgba.width, 24):
                      if ((x // 24) + (y // 24)) % 2:
                          for yy in range(y, min(y + 24, rgba.height)):
                              for xx in range(x, min(x + 24, rgba.width)):
                                  px[xx, yy] = (88, 94, 106, 255)
              composite = Image.alpha_composite(checker, rgba)
              composite.save(Path('artifacts/entry-webp-forensic') / f'{path.stem}-checker.png')
              rgba.save(Path('artifacts/entry-webp-forensic') / f'{path.stem}-rgba.png')

              item = {
                  'file': str(path),
                  'format': img.format,
                  'source_mode': img.mode,
                  'size': list(img.size),
                  'file_bytes': path.stat().st_size,
                  'alpha_extrema': list(alpha.getextrema()),
                  'rgba_extrema': [list(v) for v in extrema],
                  'transparent_pixels': transparent,
                  'partial_alpha_pixels': partial,
                  'opaque_pixels': opaque,
                  'nonzero_alpha_pixels': nonzero,
                  'nonzero_alpha_ratio': round(nonzero / total, 6),
                  'alpha_bbox': list(bbox) if bbox else None,
                  'alpha_sha256': hashlib.sha256(alpha_bytes).hexdigest(),
                  'rgb_sha256': hashlib.sha256(rgb_bytes).hexdigest(),
                  'rgba_mean': [round(v, 3) for v in stat.mean],
              }
              report.append(item)
              print('ENTRY_WEBP_FORENSIC=' + json.dumps(item, separators=(',', ':')))

          Path('artifacts/entry-webp-forensic/report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY

      - name: Upload WebP forensic evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: entry-webp-forensic-${{ github.run_id }}
          path: artifacts/entry-webp-forensic
          if-no-files-found: error
          retention-days: 7

      - name: Verify candidate Entry Effect assets and single-owner wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          paths = [
              Path('app/assets/media/cosmetics/entry-effects/store-entry-01-celestial-gate.svg'),
              Path('app/assets/media/cosmetics/entry-effects/store-entry-02-king-ascension.svg'),
              Path('app/assets/media/cosmetics/entry-effects/store-entry-03-lord-blade.svg'),
          ]
          for path in paths:
              data = path.read_text(encoding='utf-8')
              assert len(data) > 1000, f'{path}: unexpectedly small artwork'
              root = ET.fromstring(data)
              assert root.tag.endswith('svg'), f'{path}: root is not svg'
              assert root.attrib.get('viewBox') == '0 0 400 300', f'{path}: unexpected viewBox'
              assert '<text' not in data.lower(), f'{path}: readable text is not allowed in artwork'
              visible = sum(1 for node in root.iter() if node.tag.rsplit('}', 1)[-1] in {'path','ellipse','circle','rect','polygon','polyline','line'})
              assert visible >= 10, f'{path}: artwork has too few visible primitives ({visible})'
              print(f'{path}: ok primitives={visible} bytes={len(data.encode("utf-8"))}')
          PY
          grep -F "store-entry-01-celestial-gate.svg?asset=reference-art-v3" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp'),
              Path('app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp'),
          ]:
              data = path.read_bytes()
              assert len(data) > 1000, f'{path}: unexpectedly small cinematic asset'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{path}: not a real WebP file'
              print(f'{path}: ok bytes={len(data)}')
          PY
          grep -F "entry-effect-02-portal-knight.webp?asset=cinematic-webp-v4" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F "entry-effect-03-knight-strike.webp?asset=cinematic-webp-v4" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F "image.className = 'mgw-entry-effect-live-art'" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'background-color:transparent!important;background-image:none!important;' app/assets/css/production-v106-store-avatar-frame-density.css
          grep -F '.mgw-entry-effect-live-art{' app/assets/css/production-v106-store-avatar-frame-density.css
          grep -F 'display:block!important;' app/assets/css/production-v106-store-avatar-frame-density.css
          if grep -F '.mgw-entry-effect-live-art{display:none!important}' app/assets/css/production-v106-store-avatar-frame-density.css; then
            echo 'obsolete hidden live image owner is still present' >&2
            exit 1
          fi
          grep -F 'entry_live_img=cinematic-webp-v4' app/runtime/client/version-manifest.php
          grep -F 'live_entry=reference-art-v3' app/runtime/client/version-manifest.php

      - name: Wait for exact staging deployment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 24); do
            rm -f entry-effect-diagnostic-readiness.json
            if curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
              --retry 1 --retry-delay 2 --retry-connrefused \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output entry-effect-diagnostic-readiness.json; then
              if python3 - entry-effect-diagnostic-readiness.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          PY
              then
                ready=1
                break
              fi
            fi
            if [[ "$attempt" -lt 24 ]]; then sleep 15; fi
          done
          test "$ready" = '1'

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Probe deployed real-img cinematic owner
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install playwright test --config=e2e/playwright.entry-effects-diagnostic.config.mjs

      - name: Upload runtime evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: entry-effects-runtime-diagnostic-${{ github.run_id }}
          path: |
            artifacts/playwright-entry-effects-diagnostic
            entry-effect-diagnostic-readiness.json
          if-no-files-found: warn
          retention-days: 7

name: MVP-19.3 Entry Effects canonical live-owner integrity

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/app-bootstrap-v2.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/entry-effects/mgw-entry-effects-v8-legendary-strike.js'
      - 'app/assets/js/entry-effects/mgw-entry-effects-v8-royal-ascension.js'
      - 'app/assets/js/entry-effects/mgw-entry-effects-v8-lord-entrance.js'
      - 'app/assets/css/entry-effects/mgw-entry-effects-v8-legendary-strike.css'
      - 'app/assets/css/entry-effects/mgw-entry-effects-v8-royal-ascension.css'
      - 'app/assets/css/entry-effects/mgw-entry-effects-v8-lord-entrance.css'
      - 'app/assets/css/production-v108-profile-entry-preview-live-owner.css'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-arena.webp'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-sword.svg'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-cracks.svg'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-02-royal-ascension-guardian.webp'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-body.webp'
      - 'app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-sword.svg'
      - 'e2e/staging/entry-effects-runtime-diagnostic.spec.mjs'
      - 'e2e/playwright.entry-effects-diagnostic.config.mjs'
      - '.github/workflows/mvp19-3-entry-effects-runtime-diagnostic.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-integrity:
    name: Verify accepted Entry Effect V8 owners
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify accepted assets, bootstrap ordering and active owners
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image
          import struct

          webp_paths = [
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-arena.webp'),
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-02-royal-ascension-guardian.webp'),
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-body.webp'),
          ]
          for path in webp_paths:
              data = path.read_bytes()
              assert len(data) > 1000, f'{path}: unexpectedly small raster'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{path}: not a WebP file'
              assert struct.unpack('<I', data[4:8])[0] + 8 == len(data), f'{path}: truncated RIFF'
              image = Image.open(path)
              image.load()
              assert min(image.size) >= 320, f'{path}: decoded size too small {image.size}'
              print(f'{path}: decoder-valid size={image.size} bytes={len(data)}')

          svg_paths = [
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-sword.svg'),
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-legendary-strike-cracks.svg'),
              Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-sword.svg'),
          ]
          for path in svg_paths:
              data = path.read_text(encoding='utf-8')
              root = ET.fromstring(data)
              assert root.tag.endswith('svg'), f'{path}: root is not svg'
              assert '<text' not in data.lower(), f'{path}: readable text is not allowed in artwork'
              assert len(data) > 500, f'{path}: unexpectedly small SVG'
              print(f'{path}: valid svg bytes={len(data.encode("utf-8"))}')

          bootstrap = Path('app/assets/js/app-bootstrap-v2.js').read_text(encoding='utf-8')
          clean_entry = Path('app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js').read_text(encoding='utf-8')
          manifest = Path('app/runtime/client/version-manifest.php').read_text(encoding='utf-8')
          profile_css = Path('app/assets/css/production-v108-profile-entry-preview-live-owner.css').read_text(encoding='utf-8')

          entry01 = bootstrap.index("import './entry-effects/mgw-entry-effects-v8-legendary-strike.js?v=2'")
          core = bootstrap.index("await import('./app-bootstrap-v2-core.js")
          entry02 = bootstrap.index("void import('./entry-effects/mgw-entry-effects-v8-royal-ascension.js?v=4')")
          entry03 = bootstrap.index("void import('./entry-effects/mgw-entry-effects-v8-lord-entrance.js?v=6')")
          assert entry01 < core < entry02 < entry03
          assert 'entry01-strike-entry02-royal-ascension-entry03-lord-entrance-v6' in manifest
          assert 'entry_live_img=premium-art-v7' in manifest
          assert 'legacy_entry_live_img=reference-raster-v6' in manifest
          assert "image.className = 'mgw-entry-effect-live-art'" in clean_entry
          assert "'entry-01':'/app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp?asset=premium-art-v7'" in clean_entry
          assert "'entry-02':'/app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp?asset=premium-art-v7'" in clean_entry
          assert "'entry-03':'/app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp?asset=premium-art-v7'" in clean_entry
          assert 'production-v108-profile-entry-preview-live-owner.css?v=1' in manifest
          assert 'mgw-profile-entry-effects.js?v=6&mvp19_3=player-arbitration' in manifest
          for token in [
              'entry-03-legendary-strike-arena.webp?asset=profile-live-v1',
              'entry-02-royal-ascension-guardian.webp?asset=profile-live-v1',
              'entry-03-lord-entrance-body.webp?asset=profile-live-v1',
          ]:
              assert token in profile_css, f'Profile accepted owner missing {token}'

          owners = [
              ('app/assets/js/entry-effects/mgw-entry-effects-v8-legendary-strike.js', 'entry-01', 'entryV8LegendaryStrike'),
              ('app/assets/js/entry-effects/mgw-entry-effects-v8-royal-ascension.js', 'entry-02', 'entryV8RoyalAscension'),
              ('app/assets/js/entry-effects/mgw-entry-effects-v8-lord-entrance.js', 'entry-03', 'entryV8LordEntrance'),
          ]
          for filename, variant, dataset_owner in owners:
              source = Path(filename).read_text(encoding='utf-8')
              assert variant in source
              assert dataset_owner in source

          css_owners = [
              ('app/assets/css/entry-effects/mgw-entry-effects-v8-legendary-strike.css', 'data-entry-v8-legendary-strike="1"', 'entry-01'),
              ('app/assets/css/entry-effects/mgw-entry-effects-v8-royal-ascension.css', 'data-entry-v8-royal-ascension="1"', 'entry-02'),
              ('app/assets/css/entry-effects/mgw-entry-effects-v8-lord-entrance.css', 'data-entry-v8-lord-entrance="1"', 'entry-03'),
          ]
          for filename, owner, variant in css_owners:
              source = Path(filename).read_text(encoding='utf-8')
              assert owner in source and '.mgw-entry-effect-live-art' in source and variant in source
              assert 'prefers-reduced-motion:reduce' in source
          PY
          git diff --check

      - name: Wait for exact staging deployment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 24); do
            rm -f entry-effect-diagnostic-readiness.json
            if curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
              --retry 1 --retry-delay 2 --retry-connrefused \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output entry-effect-diagnostic-readiness.json; then
              if python3 - entry-effect-diagnostic-readiness.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          PY
              then
                ready=1
                break
              fi
            fi
            if [[ "$attempt" -lt 24 ]]; then sleep 15; fi
          done
          test "$ready" = '1'

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Probe deployed accepted V8 owners
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install playwright test --config=e2e/playwright.entry-effects-diagnostic.config.mjs

      - name: Upload runtime evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: entry-effects-runtime-diagnostic-${{ github.run_id }}
          path: |
            artifacts/playwright-entry-effects-diagnostic
            entry-effect-diagnostic-readiness.json
          if-no-files-found: warn
          retention-days: 7

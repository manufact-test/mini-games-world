name: MVP-27.1 Home Shell Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/home-screen.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_home_shell_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-home-shell-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-shell-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and localization contracts
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/home-screen.js
          node --check ops/checks/mvp27_1_home_shell_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_home_shell_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == agent/mvp27-2-* ]]; then
            echo "MVP-27.2 successor: focused localization/parity contracts above are authoritative; historical bounded migration scope does not apply."
            git diff --check
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ "${{ github.head_ref }}" == agent/mvp27-5-1-instant-language-switch-* ]]; then
            # Narrow successor-scope guard for the targeted 27.5.1 corrective.
            allowed='^(app/assets/js/screens/home-screen\.js|app/assets/js/localization/i18n\.js|app/assets/js/api/client\.js|bot/profile-v2\.php|app/runtime/client/version-manifest\.php|ops/checks/mvp27_5_account_language_contract\.mjs|ops/checks/mvp27_5_instant_language_switch_contract\.mjs|docs/MVP27_5_1_LANGUAGE_SWITCH_LATENCY_FIX\.md|\.github/workflows/mvp27-5-1-instant-language-switch\.yml|\.github/workflows/mvp27-1-home-shell-localization\.yml)$'
            bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
            test -z "$bad" || { printf 'Unexpected language corrective paths:\n%s\n' "$bad" >&2; exit 1; }
            git diff --check "$base" "$head"
            node ops/checks/mvp27_5_instant_language_switch_contract.mjs
            exit 0
          fi
          if git diff --quiet "$base" "$head" -- app/assets/js/screens/home-screen.js; then
            echo "Successor localization slice: predecessor owner unchanged; original bounded migration scope does not apply."
            exit 0
          fi
          allowed='^(app/assets/js/screens/home-screen\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_home_shell_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-home-shell-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Home localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

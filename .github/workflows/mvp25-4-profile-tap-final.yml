name: MVP-25.4 Profile tap final

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/profile/mgw-profile-entry-effects.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-v4.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-card-parity.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp25_4ProfileTapFinalContractTest.php'
      - '.github/workflows/mvp25-4-profile-tap-final.yml'

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-4-profile-tap-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Profile tap final ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp25_4ProfileTapFinalContractTest.php
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/profile/mgw-profile-entry-effects.js
          node --check app/assets/js/profile/mgw-profile-victory-effects-v4.js
          node --check app/assets/js/profile/mgw-profile-victory-effects-card-parity.js

      - name: Profile tap ownership contract
        run: php bot/tests/Mvp25_4ProfileTapFinalContractTest.php

      - name: Frozen corrective scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(.github/workflows/mvp25-4-profile-tap-final.yml|app/assets/js/main-v110-handoff-shell.js|app/assets/js/profile/mgw-profile-entry-effects.js|app/assets/js/profile/mgw-profile-victory-effects-v4.js|app/assets/js/profile/mgw-profile-victory-effects-card-parity.js|app/runtime/client/version-manifest.php|bot/tests/Mvp25_4ProfileTapFinalContractTest.php)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Profile tap paths:\n%s\n' "$bad" >&2; exit 1; }
          if printf '%s\n' "$changed" | grep -Eq '^(bot/games/|app/assets/js/games/|app/assets/css/games/)'; then
            echo 'Frozen game-engine path changed.' >&2
            exit 1
          fi

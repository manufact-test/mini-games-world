name: MVP-19.12 Battleship Store/Profile/LIVE

on:
  pull_request:
    paths:
      - 'app/assets/js/screens/store-screen-battleship-store-v1.js'
      - 'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js'
      - 'app/assets/css/games/battleship/store-cosmetics-v1.css'
      - 'app/assets/js/profile/mgw-profile-battleship-parity.js'
      - 'app/assets/css/screens/profile-battleship-store-parity-v1.css'
      - 'app/assets/js/profile/mgw-profile-chess-layout-v2.js'
      - 'app/assets/js/games/battleship/renderer.js'
      - 'app/assets/js/games/battleship/renderer-v102.js'
      - 'app/assets/js/games/battleship/renderer-cosmetics-v1.js'
      - 'app/assets/css/games/battleship/game.css'
      - 'app/assets/css/games/battleship/live-cosmetics-v1.css'
      - 'app/assets/css/games/battleship/live-exit-fit-v1.css'
      - 'app/v110.php'
      - 'bot/database/migrations/20260919_0040_add_battleship_store_cosmetics.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/tests/Mvp19_12BattleshipStoreTest.php'
      - 'bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipProfileInventoryTest.php'
      - 'bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipViewportScrollTest.php'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - '.github/workflows/mvp19-12-battleship-store.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/store-screen-battleship-store-v1.js'
      - 'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js'
      - 'app/assets/css/games/battleship/store-cosmetics-v1.css'
      - 'app/assets/js/profile/mgw-profile-battleship-parity.js'
      - 'app/assets/css/screens/profile-battleship-store-parity-v1.css'
      - 'app/assets/js/profile/mgw-profile-chess-layout-v2.js'
      - 'app/assets/js/games/battleship/renderer.js'
      - 'app/assets/js/games/battleship/renderer-v102.js'
      - 'app/assets/js/games/battleship/renderer-cosmetics-v1.js'
      - 'app/assets/css/games/battleship/game.css'
      - 'app/assets/css/games/battleship/live-cosmetics-v1.css'
      - 'app/assets/css/games/battleship/live-exit-fit-v1.css'
      - 'app/v110.php'
      - 'bot/database/migrations/20260919_0040_add_battleship_store_cosmetics.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/tests/Mvp19_12BattleshipStoreTest.php'
      - 'bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipProfileInventoryTest.php'
      - 'bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipViewportScrollTest.php'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'

jobs:
  battleship-store-profile-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          php -l bot/database/migrations/20260919_0040_add_battleship_store_cosmetics.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/tests/Mvp19_12BattleshipStoreTest.php
          php -l bot/tests/Mvp19_12BattleshipProfileInventoryTest.php
          php -l bot/tests/Mvp19_12BattleshipViewportScrollTest.php
          php -l app/v110.php
          node --check bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs
          node --check bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs
          node --check bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs
          node --check bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs
          node --check app/assets/js/screens/store-screen-battleship-store-v1.js
          node --check app/assets/js/screens/store-screen-checkers-board-source-wrapper.js
          node --check app/assets/js/profile/mgw-profile-battleship-parity.js
          node --check app/assets/js/profile/mgw-profile-chess-layout-v2.js
          node --check app/assets/js/games/battleship/renderer.js
          node --check app/assets/js/games/battleship/renderer-v102.js
          node --check app/assets/js/games/battleship/renderer-cosmetics-v1.js
      - name: Battleship Store contract
        run: php bot/tests/Mvp19_12BattleshipStoreTest.php
      - name: Battleship Profile contracts
        run: |
          node bot/tests/Mvp19_12BattleshipProfileParityContractTest.mjs
          php bot/tests/Mvp19_12BattleshipProfileInventoryTest.php
      - name: Battleship LIVE maps/fleets contract
        run: node bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs
      - name: Battleship LIVE Shot effect contract
        run: node bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs
      - name: Battleship LIVE Hit/Destroy effect contract
        run: node bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs
      - name: Battleship viewport scroll contract
        run: php bot/tests/Mvp19_12BattleshipViewportScrollTest.php
      - name: Re-run shared Store/Profile contracts
        run: |
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_FourInARowStoreTest.php
          node bot/tests/Mvp19_FourInARowProfileParityContractTest.mjs
          php bot/tests/Mvp19_FourInARowProfileInventoryTest.php

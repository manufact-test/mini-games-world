name: Checkers all-effects real-flight probe

on:
  push:
    branches:
      - agent/mvp19-6-checkers-all-effects-real-flight-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe Move Capture Promotion
        run: |
          python3 -m http.server 4173 --directory . >/tmp/mgw-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:390, height:844 }, reducedMotion:'no-preference' });
            await page.goto('http://127.0.0.1:4173/app/assets/js/checkers-cosmetics/renderer-real-flight-cascade-v1.js?v=2', { waitUntil:'commit' });
            await page.waitForTimeout(150);

            const results = await page.evaluate(async () => {
              document.head.innerHTML = '';
              document.body.innerHTML = '';

              const baseCss = document.createElement('link');
              baseCss.rel = 'stylesheet';
              baseCss.href = '/app/assets/css/games/checkers/game.css?v=64&probe=all-effects';
              document.head.appendChild(baseCss);
              await new Promise(resolve => {
                baseCss.addEventListener('load', resolve, { once:true });
                baseCss.addEventListener('error', resolve, { once:true });
                setTimeout(resolve, 1500);
              });

              const mod = await import('/app/assets/js/checkers-cosmetics/renderer-real-flight-cascade-v1.js?v=2&mvp19_6=all-paid-real-flight-v1&probe=' + Date.now());
              const optimisticMod = await import('/app/assets/js/production-v100-optimistic-models.js?v=104&probe=' + Date.now());
              await new Promise(resolve => setTimeout(resolve, 250));

              const host = document.createElement('div');
              host.style.cssText = 'position:fixed;left:0;top:0;width:390px;height:844px;padding:16px;box-sizing:border-box;background:#090d16';
              document.body.appendChild(host);

              const makePlayer = (effect) => ({
                id:'p1', name:'A', side:'white',
                game_cosmetics:{ slots:{ game_checkers_effect:effect, game_checkers_elements:'game-checkers-pieces-neon' } },
              });
              const opponent = { id:'p2', name:'B', side:'black', game_cosmetics:{ slots:{} } };

              async function runScenario({ id, effect, board, legal, from, to, whiteKings=0, blackKings=0 }) {
                document.querySelectorAll('.mgw-checkers-live-fx').forEach(node => node.remove());
                host.innerHTML = '';
                const container = document.createElement('div');
                host.appendChild(container);

                let active = {
                  id,
                  status:'active',
                  turn:'p1',
                  viewer_side:'white',
                  board,
                  players:[makePlayer(effect), opponent],
                  legal_moves:[legal],
                  capture_required:Boolean(legal.capture),
                  forced_piece:null,
                  pending_captures:[],
                  last_captured_cells:[],
                  last_promotion:null,
                  white_pieces:board.filter(piece => String(piece).toLowerCase() === 'w').length,
                  black_pieces:board.filter(piece => String(piece).toLowerCase() === 'b').length,
                  white_kings:whiteKings,
                  black_kings:blackKings,
                  move_timeout_sec:60,
                };
                const me = { id:'p1' };
                const onAction = action => {
                  const optimistic = optimisticMod.buildV100OptimisticGame(active, action, 'p1', 'checkers');
                  if (!optimistic) throw new Error(id + ': optimistic build failed');
                  active = optimistic;
                  mod.renderCheckersSurface({ game:optimistic, me, container, onAction });
                };

                mod.renderCheckersSurface({ game:active, me, container, onAction });
                await new Promise(resolve => setTimeout(resolve, 80));
                const source = container.querySelector(`[data-checkers-cell="${from}"][data-checkers-piece]`);
                if (!source) throw new Error(id + ': source missing');
                source.click();
                const target = container.querySelector(`[data-checkers-cell="${to}"][data-checkers-target]`);
                if (!target) throw new Error(id + ': target missing');
                target.click();
                await new Promise(requestAnimationFrame);
                await new Promise(requestAnimationFrame);
                await new Promise(resolve => setTimeout(resolve, 40));

                const piece = container.querySelector(`[data-checkers-cell="${to}"] .checkers-piece`);
                if (!piece) throw new Error(id + ': destination piece missing');
                const cs = getComputedStyle(piece);
                const layer = document.querySelector('.mgw-checkers-live-fx');
                const impact = layer?.querySelector('.mgw-checkers-live-fx-impact') || null;
                const path = layer?.querySelector('.mgw-checkers-live-fx-path') || null;
                const crown = layer?.querySelector('.mgw-checkers-live-fx-crown') || null;
                const targetFx = layer?.querySelector('.mgw-checkers-live-fx-target') || null;
                const liveCss = document.querySelector('link[data-mgw-checkers-live-effects]');

                return {
                  animationName:cs.animationName,
                  animationDelay:cs.animationDelay,
                  kind:piece.dataset.mgwRealMoveKind || 'move',
                  realMove:container.dataset.mgwCheckersRealMove || '',
                  overlayPiece:Boolean(layer?.querySelector('.mgw-checkers-live-fx-piece')),
                  layerClass:layer?.className || '',
                  impactDisplay:impact ? getComputedStyle(impact).display : 'missing',
                  impactAnimation:impact ? getComputedStyle(impact).animationName : 'missing',
                  path:Boolean(path),
                  crown:Boolean(crown),
                  targetFx:Boolean(targetFx),
                  cssHref:liveCss?.href || '',
                  animations:piece.getAnimations().map(a => ({ name:a.animationName, playState:a.playState })),
                };
              }

              const moveBoard = Array(64).fill('');
              moveBoard[40] = 'w';
              moveBoard[17] = 'b';
              const move = await runScenario({
                id:'probe-move', effect:'game-checkers-effect-move', board:moveBoard,
                legal:{ from:40, to:33, capture:false }, from:40, to:33,
              });

              const captureBoard = Array(64).fill('');
              captureBoard[42] = 'w';
              captureBoard[33] = 'b';
              const capture = await runScenario({
                id:'probe-capture', effect:'game-checkers-effect-capture', board:captureBoard,
                legal:{ from:42, to:24, capture:true, captured:33 }, from:42, to:24,
              });

              const promotionBoard = Array(64).fill('');
              promotionBoard[10] = 'w';
              promotionBoard[55] = 'b';
              const promotion = await runScenario({
                id:'probe-promotion', effect:'game-checkers-effect-promotion', board:promotionBoard,
                legal:{ from:10, to:1, capture:false, promotes:true }, from:10, to:1,
              });

              return { move, capture, promotion };
            });

            console.log('MGW_ALL_EFFECTS=' + JSON.stringify(results));

            const { move, capture, promotion } = results;
            if (move.animationName !== 'mgw-checkers-live-real-piece-flip') throw new Error('Move lost real-piece FLIP: ' + move.animationName);
            if (move.overlayPiece) throw new Error('Move duplicate overlay checker returned');
            if (move.impactDisplay !== 'none') throw new Error('Move landing wave still visible: ' + move.impactDisplay);
            if (!move.cssHref.includes('v=6')) throw new Error('Move did not receive live-effects v6: ' + move.cssHref);

            if (capture.animationName !== 'mgw-checkers-live-real-piece-capture') throw new Error('Capture not on real-piece flight: ' + capture.animationName);
            if (capture.kind !== 'capture' || capture.realMove !== '1') throw new Error('Capture real-flight state missing');
            if (capture.overlayPiece) throw new Error('Capture duplicate overlay checker still exists');
            if (capture.impactDisplay === 'none' || capture.impactAnimation !== 'mgw-checkers-live-field-capture-burst') throw new Error('Capture burst was lost');
            if (!capture.targetFx) throw new Error('Capture target decoration was lost');

            if (promotion.animationName !== 'mgw-checkers-live-real-piece-promotion') throw new Error('Promotion not on real-piece flight: ' + promotion.animationName);
            if (promotion.kind !== 'promotion' || promotion.realMove !== '1') throw new Error('Promotion real-flight state missing');
            if (promotion.overlayPiece) throw new Error('Promotion duplicate overlay checker still exists');
            if (!promotion.crown) throw new Error('Promotion crown decoration was lost');

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

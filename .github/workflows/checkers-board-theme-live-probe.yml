name: Checkers board-theme live owner probe

on:
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-board-theme-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact staging runtime deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output /tmp/mgw-readiness.json; then
              ok="$(jq -r '.ok // false' /tmp/mgw-readiness.json)"
              environment="$(jq -r '.environment // ""' /tmp/mgw-readiness.json)"
              base_host="$(jq -r '.base_host // ""' /tmp/mgw-readiness.json)"
              live_fingerprint="$(jq -r '.source_fingerprint_sha256 // ""' /tmp/mgw-readiness.json)"
              if [[ "$ok" == 'true' && "$environment" == 'staging' && "$base_host" == 'seashell-okapi-889488.hostingersite.com' && "$live_fingerprint" == "$expected_fingerprint" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Compare live board-theme owner byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/js/checkers-cosmetics/renderer-board-themes.js'
          live_file='/tmp/live-checkers-board-theme.js'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/js/checkers-cosmetics/renderer-board-themes.js?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          echo "local board-theme owner sha256: $(sha256sum "$local_file" | awk '{print $1}')"
          echo "live  board-theme owner sha256: $(sha256sum "$live_file" | awk '{print $1}')"
          test "$matched" = '1'
          grep -F 'syncExactLiveLanding' "$live_file"
          grep -F 'getBoundingClientRect' "$live_file"
          grep -F 'mgw-checkers-live-fx-hide-piece' "$live_file"
          grep -F 'stableLegend' "$live_file"
          grep -F 'container.dataset.mgwCheckersPaidEffect' "$live_file"
          grep -F 'runtime-handoff-mobile-v1.css?v=4' "$live_file"
          grep -F 'landing=exact-live-centers-v2' "$live_file"
          grep -F 'legend=stable-paint-v1' "$live_file"

      - name: Compare live Checkers handoff corrective byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/css/games/checkers/runtime-handoff-mobile-v1.css'
          live_file='/tmp/live-checkers-runtime-corrective.css'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/css/games/checkers/runtime-handoff-mobile-v1.css?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          echo "local runtime corrective sha256: $(sha256sum "$local_file" | awk '{print $1}')"
          echo "live  runtime corrective sha256: $(sha256sum "$live_file" | awk '{print $1}')"
          test "$matched" = '1'
          grep -F 'grid-template-rows:repeat(8,minmax(0,1fr))!important;' "$live_file"
          grep -F 'data-mgw-checkers-paid-effect="1"' "$live_file"
          grep -F '.checkers-surface.mgw-checkers-live-fx-running .checkers-legend' "$live_file"
          grep -F 'opacity:1!important;' "$live_file"
          grep -F '.checkers-surface .checkers-cell.last-from' "$live_file"
          grep -F 'box-shadow:none!important;' "$live_file"
          grep -F 'padding-left:max(12px,env(safe-area-inset-left))!important;' "$live_file"
          grep -F 'padding-right:max(12px,env(safe-area-inset-right))!important;' "$live_file"

      - name: Compare live Store effect preview owners byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          compare_live() {
            local local_file="$1"
            local live_path="$2"
            local live_file="$3"
            local matched=0
            for attempt in $(seq 1 24); do
              curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 25 \
                --header 'Cache-Control: no-cache' \
                "${MGW_STAGING_ORIGIN}/${live_path}?probe=${GITHUB_SHA}-${attempt}" \
                --output "$live_file"
              if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
              sleep 5
            done
            echo "local $(basename "$local_file") sha256: $(sha256sum "$local_file" | awk '{print $1}')"
            echo "live  $(basename "$live_file") sha256: $(sha256sum "$live_file" | awk '{print $1}')"
            test "$matched" = '1'
          }
          compare_live \
            'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js' \
            'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js' \
            '/tmp/live-checkers-store-source-wrapper.js'
          compare_live \
            'app/assets/css/games/checkers/store-effects-live-board-v1.css' \
            'app/assets/css/games/checkers/store-effects-live-board-v1.css' \
            '/tmp/live-checkers-store-effects.css'
          compare_live \
            'app/assets/css/games/checkers/store-effects-final-centering-v1.css' \
            'app/assets/css/games/checkers/store-effects-final-centering-v1.css' \
            '/tmp/live-checkers-store-final-centering.css'
          grep -F 'store-effects-final-centering-v1.css?v=1&mvp19_6=legacy-important-immune-v1' /tmp/live-checkers-store-source-wrapper.js
          grep -F '.checkers-store-fx-promotion .from{' /tmp/live-checkers-store-final-centering.css
          grep -F 'left:calc(68.75% - .75px)!important;' /tmp/live-checkers-store-final-centering.css
          grep -F 'top:calc(18.75% + 1.25px)!important;' /tmp/live-checkers-store-final-centering.css
          grep -F 'animation:mgw-checkers-final-promotion-piece' /tmp/live-checkers-store-final-centering.css
          grep -F 'transform:translate(-50%,-50%) scale(1)' /tmp/live-checkers-store-final-centering.css

      - name: Guard active Checkers cache-bust
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest='app/runtime/client/version-manifest.php'
          grep -F 'store-screen-checkers-board-source-wrapper.js?v=4' "$manifest"
          grep -F 'promotion_preview=legacy-important-immune-v1' "$manifest"
          grep -F 'final_centering=cell-border-parity-v1' "$manifest"
          grep -F 'renderer-board-themes.js?v=7&mvp19_6=equal-grid-rows-v1' "$manifest"
          grep -F 'renderer-live-effects-v1.js?v=9&mvp19_6=runtime-smoothing-v9' "$manifest"
          grep -F 'landing=exact-live-centers-v2' "$manifest"
          grep -F 'grid_rows=equal-v1' "$manifest"
          grep -F 'selection=geometry-neutral-v1' "$manifest"
          grep -F 'last_from=flat-v1' "$manifest"
          grep -F 'legend=stable-paint-v1' "$manifest"
          grep -F 'mobile=insets-v1' "$manifest"
          grep -F 'promotion=authoritative-only-v1' "$manifest"
          grep -F 'mvp19_6=checkers-exact-live-centers-store-final-v6' "$manifest"

name: Checkers board-theme live owner probe

on:
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-board-theme-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact staging runtime deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output /tmp/mgw-readiness.json; then
              ok="$(jq -r '.ok // false' /tmp/mgw-readiness.json)"
              environment="$(jq -r '.environment // ""' /tmp/mgw-readiness.json)"
              base_host="$(jq -r '.base_host // ""' /tmp/mgw-readiness.json)"
              live_fingerprint="$(jq -r '.source_fingerprint_sha256 // ""' /tmp/mgw-readiness.json)"
              if [[ "$ok" == 'true' && "$environment" == 'staging' && "$base_host" == 'seashell-okapi-889488.hostingersite.com' && "$live_fingerprint" == "$expected_fingerprint" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Compare live board-theme owner byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/js/checkers-cosmetics/renderer-board-themes.js'
          live_file='/tmp/live-checkers-board-theme.js'
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --header 'Cache-Control: no-cache' \
            "${MGW_STAGING_ORIGIN}/app/assets/js/checkers-cosmetics/renderer-board-themes.js?probe=${GITHUB_SHA}" \
            --output "$live_file"
          echo "local board-theme owner sha256: $(sha256sum "$local_file" | awk '{print $1}')"
          echo "live  board-theme owner sha256: $(sha256sum "$live_file" | awk '{print $1}')"
          cmp "$local_file" "$live_file"
          grep -F 'real 8x8 cell rects' "$live_file"
          ! grep -F 'syncExactLiveLanding' "$live_file"
          ! grep -F 'getBoundingClientRect' "$live_file"
          grep -F 'container.dataset.mgwCheckersPaidEffect' "$live_file"
          grep -F 'runtime-handoff-mobile-v1.css?v=2' "$live_file"

      - name: Compare live Checkers handoff/mobile corrective byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/css/games/checkers/runtime-handoff-mobile-v1.css'
          live_file='/tmp/live-checkers-runtime-corrective.css'
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --header 'Cache-Control: no-cache' \
            "${MGW_STAGING_ORIGIN}/app/assets/css/games/checkers/runtime-handoff-mobile-v1.css?probe=${GITHUB_SHA}" \
            --output "$live_file"
          echo "local runtime corrective sha256: $(sha256sum "$local_file" | awk '{print $1}')"
          echo "live  runtime corrective sha256: $(sha256sum "$live_file" | awk '{print $1}')"
          cmp "$local_file" "$live_file"
          grep -F 'data-mgw-checkers-paid-effect="1"' "$live_file"
          grep -F '.checkers-surface .checkers-cell.last-from' "$live_file"
          grep -F 'box-shadow:none!important;' "$live_file"
          grep -F 'padding-left:max(12px,env(safe-area-inset-left))!important;' "$live_file"
          grep -F 'padding-right:max(12px,env(safe-area-inset-right))!important;' "$live_file"

      - name: Guard active Checkers cache-bust
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'renderer-board-themes.js?v=5&mvp19_6=cell-center-handoff-v1' app/runtime/client/version-manifest.php
          grep -F 'renderer-live-effects-v1.js?v=8&mvp19_6=runtime-smoothing-v8' app/runtime/client/version-manifest.php
          grep -F 'landing=cell-center-handoff-v1' app/runtime/client/version-manifest.php
          grep -F 'selection=geometry-neutral-v1' app/runtime/client/version-manifest.php
          grep -F 'last_from=flat-v1' app/runtime/client/version-manifest.php
          grep -F 'mobile=insets-v1' app/runtime/client/version-manifest.php
          grep -F 'promotion=authoritative-only-v1' app/runtime/client/version-manifest.php
          grep -F 'mvp19_6=checkers-cell-center-handoff-v4' app/runtime/client/version-manifest.php

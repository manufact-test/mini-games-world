name: Checkers board-theme live owner probe

on:
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-board-theme-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact staging runtime deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output /tmp/mgw-readiness.json; then
              ok="$(jq -r '.ok // false' /tmp/mgw-readiness.json)"
              environment="$(jq -r '.environment // ""' /tmp/mgw-readiness.json)"
              base_host="$(jq -r '.base_host // ""' /tmp/mgw-readiness.json)"
              live_fingerprint="$(jq -r '.source_fingerprint_sha256 // ""' /tmp/mgw-readiness.json)"
              if [[ "$ok" == 'true' && "$environment" == 'staging' && "$base_host" == 'seashell-okapi-889488.hostingersite.com' && "$live_fingerprint" == "$expected_fingerprint" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Compare live board-theme real-piece owner byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/js/checkers-cosmetics/renderer-board-themes.js'
          live_file='/tmp/live-checkers-board-theme.js'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/js/checkers-cosmetics/renderer-board-themes.js?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          grep -F 'captureRealMoveOrigin' "$live_file"
          grep -F 'syncRealMoveDestination' "$live_file"
          grep -F 'mgw-checkers-live-real-move-piece' "$live_file"
          grep -F 'duplicatePiece.remove()' "$live_file"
          grep -F 'finalDestinationRect' "$live_file"
          grep -F 'renderRevision' "$live_file"
          grep -F 'alignMoveDecorations(layer, liveBoard, state, finalDestinationRect)' "$live_file"
          grep -F "mgwMovePieceOwner = 'real-board-piece-flip-v2'" "$live_file"
          grep -F 'stableLegend' "$live_file"
          grep -F 'runtime-handoff-mobile-v1.css?v=7' "$live_file"
          grep -F 'mvp19_6=real-piece-flip-v1' "$live_file"

      - name: Compare accepted live-effects owner byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js'
          live_file='/tmp/live-checkers-effects-owner.js'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          grep -F 'renderLiveEffect(board, container, state)' "$live_file"
          grep -F 'applyEffectMask(board, container, state.plan)' "$live_file"
          grep -F 'document.body.appendChild(state.layer)' "$live_file"
          grep -F 'stripBaseTransientAnimations' "$live_file"
          grep -F 'live-effects-store-parity-v1.css?v=5&mvp19_6=real-piece-flip-exempt-v1' "$live_file"

      - name: Compare live Checkers real-piece corrective byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/css/games/checkers/runtime-handoff-mobile-v1.css'
          live_file='/tmp/live-checkers-runtime-corrective.css'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/css/games/checkers/runtime-handoff-mobile-v1.css?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          grep -F 'grid-template-rows:repeat(8,minmax(0,1fr))!important;' "$live_file"
          grep -F '.checkers-piece.mgw-checkers-live-real-move-piece' "$live_file"
          grep -F 'animation:mgw-checkers-live-real-piece-flip' "$live_file"
          grep -F '@keyframes mgw-checkers-live-real-piece-flip' "$live_file"
          grep -F 'var(--mgw-real-move-dx,0px)' "$live_file"
          grep -F 'translate3d(0,0,0) scale(1)' "$live_file"
          ! grep -F 'mgw-checkers-live-destination-anchor-move' "$live_file"
          grep -F '.checkers-surface.mgw-checkers-live-fx-running .checkers-legend' "$live_file"
          grep -F '.checkers-surface .checkers-cell.last-from' "$live_file"
          grep -F 'padding-left:max(12px,env(safe-area-inset-left))!important;' "$live_file"
          grep -F 'padding-right:max(12px,env(safe-area-inset-right))!important;' "$live_file"

      - name: Compare live Checkers effect suppression byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/css/games/checkers/live-effects-store-parity-v1.css'
          live_file='/tmp/live-checkers-effects.css'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/css/games/checkers/live-effects-store-parity-v1.css?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          grep -F '.checkers-cell.move-impact .checkers-piece:not(.mgw-checkers-live-real-move-piece)' "$live_file"

      - name: Compare live Store effect preview owners byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          compare_live() {
            local local_file="$1"
            local live_path="$2"
            local live_file="$3"
            local matched=0
            for attempt in $(seq 1 24); do
              curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 25 \
                --header 'Cache-Control: no-cache' \
                "${MGW_STAGING_ORIGIN}/${live_path}?probe=${GITHUB_SHA}-${attempt}" \
                --output "$live_file"
              if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
              sleep 5
            done
            test "$matched" = '1'
          }
          compare_live \
            'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js' \
            'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js' \
            '/tmp/live-checkers-store-source-wrapper.js'
          compare_live \
            'app/assets/css/games/checkers/store-effects-live-board-v1.css' \
            'app/assets/css/games/checkers/store-effects-live-board-v1.css' \
            '/tmp/live-checkers-store-effects.css'
          compare_live \
            'app/assets/css/games/checkers/store-effects-final-centering-v1.css' \
            'app/assets/css/games/checkers/store-effects-final-centering-v1.css' \
            '/tmp/live-checkers-store-final-centering.css'
          grep -F 'store-effects-final-centering-v1.css?v=2&mvp19_6=king-readable-v2' /tmp/live-checkers-store-source-wrapper.js
          grep -F 'width:calc(14.5% - .5px)!important;' /tmp/live-checkers-store-final-centering.css

      - name: Guard active Checkers cache-bust
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest='app/runtime/client/version-manifest.php'
          grep -F 'store-screen-checkers-board-source-wrapper.js?v=5' "$manifest"
          grep -F 'promotion_preview=king-readable-v2' "$manifest"
          grep -F 'renderer-board-themes.js?v=12&mvp19_6=equal-grid-rows-v1' "$manifest"
          grep -F 'renderer-live-effects-v1.js?v=14&mvp19_6=runtime-smoothing-v13&cascade=real-flight-v1' "$manifest"
          grep -F 'renderer-single-flight-v1.js?v=2&mvp19_6=single-flight-dom-v1&real_flight=css-cascade-v1' "$manifest"
          grep -F 'landing=real-piece-flip-final-rect-v2' "$manifest"
          grep -F 'legend=stable-paint-v1' "$manifest"
          grep -F 'grid_rows=equal-v1' "$manifest"
          grep -F 'mvp19_6=checkers-real-piece-flip-v11' "$manifest"
          grep -F 'real_flight=css-cascade-v1' "$manifest"
          ! grep -F 'renderer-live-effects-final-handoff.js' "$manifest"

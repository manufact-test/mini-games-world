name: MVP-18.6 Notification pipeline

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/notifications/**'
      - 'bot/notifications.php'
      - 'bot/services/NotificationService.php'
      - 'bot/admin-notifications.php'
      - 'bot/tests/Mvp18_6NotificationPipelineContractTest.php'
      - 'app/admin.php'
      - 'app/assets/js/admin-notifications.js'
      - '.github/workflows/mvp18-5-reports-blocked-users.yml'
      - '.github/workflows/mvp18-6-notification-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp18-6-notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: One bell pipeline contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint bounded MVP-18.6 slice
        shell: bash
        run: |
          set -euo pipefail
          php -l bot/notifications/AdminNotificationEventService.php
          php -l bot/notifications/NotificationCenterV2Policy.php
          php -l bot/notifications/RuntimeNotificationRepository.php
          php -l bot/services/NotificationService.php
          php -l bot/notifications.php
          php -l bot/admin-notifications.php
          php -l app/admin.php
          php -l bot/tests/Mvp18_6NotificationPipelineContractTest.php
          node --check app/assets/js/admin-notifications.js

      - name: Run MVP-18.6 bell pipeline contract
        run: php bot/tests/Mvp18_6NotificationPipelineContractTest.php

      - name: Run Notification Center v2 policy regression
        run: php bot/tests/NotificationCenterV2PolicyTest.php

      - name: Run Notification Center v2 static regression
        run: php bot/tests/NotificationCenterV2StaticContractTest.php

      - name: Run Notification Center v2 visual regression
        run: php bot/tests/NotificationCenterV2VisualContractTest.php

      - name: Run notification actor terminal regression
        run: php bot/tests/NotificationActorSilentTerminalContractTest.php

      - name: Run MVP-18.5 reports and blocks regression
        run: php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php

      - name: Run Friends UI owner regression
        run: node bot/tests/Mvp18FriendsUiContractTest.mjs

      - name: Run Invite v2 lifecycle regression
        run: php bot/tests/Mvp18_3InviteV2ContractTest.php

      - name: Guard one canonical notification store
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'INSERT INTO mgw_notifications' bot/notifications/AdminNotificationEventService.php
          ! grep -F 'INSERT INTO mgw_notifications' bot/admin-notifications.php
          grep -F 'RuntimeNotificationRepository' bot/notifications/NotificationCenterV2Policy.php
          grep -F "'scheduled_at'" bot/notifications/RuntimeNotificationRepository.php
          grep -F "'delivered_at'" bot/notifications/RuntimeNotificationRepository.php
          grep -F "'deep_link'" bot/notifications/RuntimeNotificationRepository.php

      - name: Guard bounded MVP-18.6 scope
        if: startsWith(github.head_ref, 'agent/mvp18-6')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp18-5-reports-blocked-users.yml|.github/workflows/mvp18-6-notification-pipeline.yml|app/admin.php|app/assets/js/admin-notifications.js|bot/admin-notifications.php|bot/notifications.php|bot/notifications/AdminNotificationEventService.php|bot/notifications/NotificationCenterV2Policy.php|bot/notifications/RuntimeNotificationRepository.php|bot/services/NotificationService.php|bot/tests/Mvp18_6NotificationPipelineContractTest.php)
                ;;
              *)
                echo "Unexpected MVP-18.6 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0

      - name: Guard accepted game engines and frozen launch graph
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --name-only "$base" "$head" -- 'bot/games/**' | grep -q .; then
            echo 'MVP-18.6 must not modify accepted game engines.' >&2
            exit 1
          fi
          grep -F "private const ENTRY_PATH = '/app/v110.php?v=1127';" bot/helpers/WebAppLaunchUrl.php
          grep -F "'@mgw/main' => './assets/js/main-v110-reconnect-v174.js?v=2'" app/runtime/client/version-manifest.php
          # version-manifest.php is a shared cache/import registry. The exact
          # notification-owned @mgw/main mapping is asserted above, while other
          # feature-owned cache keys remain free to advance in their own PRs.
          git diff --exit-code "$base" "$head" -- \
            bot/helpers/WebAppLaunchUrl.php \
            app/assets/js/main-v110-reconnect-v174.js \
            app/assets/js/games/game-invites-v110-rematch-policy-v175.js \
            bot/games

      - name: Guard MVP-18.6 exclusions
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --name-only "$base" "$head" | grep -Ei '(^|/)(android|fcm|firebase)(/|$)'; then
            echo 'Android push/FCM is outside MVP-18.6.' >&2
            exit 1
          fi
          if git diff --unified=0 "$base" "$head" -- 'bot/database/migrations/**' | grep -Ei 'mgw_notifications|notification'; then
            echo 'MVP-18.6 does not allow a notification schema migration; lifecycle stays in canonical notification payload_json.' >&2
            exit 1
          fi

name: MVP-24 Final Gold removal regression

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/tests/Mvp24FinalGoldRemovalClosureContractTest.php'
      - '.github/workflows/mvp24-final-gold-removal-regression.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/tests/Mvp24FinalGoldRemovalClosureContractTest.php'
      - '.github/workflows/mvp24-final-gold-removal-regression.yml'

permissions:
  contents: read

jobs:
  product-regression:
    name: Product-wide post-removal regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l bot/tests/Mvp24FinalGoldRemovalClosureContractTest.php

      - name: Prove every MVP-24 removal slice remains closed
        run: |
          php bot/tests/Mvp24FinalGoldRemovalClosureContractTest.php
          php bot/tests/Mvp24MiniAppGoldStateCleanupContractTest.php
          php bot/tests/Mvp24LegacyAdminCommerceReadOnlyContractTest.php
          php bot/tests/Mvp24LegacyApiCommerceCleanupContractTest.php
          php bot/tests/ShopPaymentApiActionGateRegressionTest.php
          php bot/tests/Mvp24PublicGoldSanitationContractTest.php

      - name: Preserve all eight accepted games
        run: |
          php bot/tests/Mvp167AllGamesRegressionContractTest.php
          php bot/tests/Mvp14r2GamesContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Preserve unified balance ledger Store and Profile
        run: |
          php bot/tests/UnifiedEconomyRuntimeSyncTest.php
          php bot/tests/UnifiedEconomyUninitializedRuntimeHydrationTest.php
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_3ProfileBackgroundsTest.php

      - name: Preserve matchmaking invites and social graph
        run: |
          php bot/tests/Mvp17_1MatchmakingQueueTest.php
          php bot/tests/Mvp17_2HumanPriorityFallbackTest.php
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/Mvp18_4UniversalInviteLandingContractTest.php
          php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php
          php bot/tests/FriendGraphServiceTest.php

      - name: Preserve Arena rating and official tournaments
        run: |
          php bot/tests/Mvp20_3LeaderboardsAntiFarmingTest.php
          php bot/tests/Mvp20_7RatingArchiveTest.php
          php bot/tests/Mvp21_11TournamentReleaseProofTest.php

      - name: Preserve Support moderation Admin and notifications
        run: |
          php bot/tests/SupportTicketServiceTest.php
          php bot/tests/Mvp22_2CompensationWorkflowTest.php
          php bot/tests/Mvp22_3ModerationWorkflowTest.php
          php bot/tests/Mvp22_4AntiFraudWorkflowTest.php
          php bot/tests/Mvp22_5SystemAdminTest.php
          php bot/tests/Mvp22_7AdminOperationsTest.php
          php bot/tests/Mvp22_8AccountDataLifecycleTest.php
          php bot/tests/Mvp22_9IncidentRecoveryTest.php
          php bot/tests/Mvp23AdminClosureContractTest.php
          php bot/tests/Mvp18_6NotificationPipelineContractTest.php

      - name: Preserve reconnect and current Profile route latency
        run: |
          php bot/tests/Mvp17_4ReconnectLifecycleTest.php
          php bot/tests/Mvp17_4ReconnectResumeRegressionTest.php
          php bot/tests/Mvp23ProfileRouteLatencyContractTest.php

      - name: Guard closure-proof-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(bot/tests/Mvp24FinalGoldRemovalClosureContractTest\.php|\.github/workflows/mvp24-final-gold-removal-regression\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-24.5 paths:\n%s\n' "$bad" >&2; exit 1; }

  mysql-persistence:
    name: Critical persistence regression on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Critical DB owners
        env:
          MGW_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=mgw_test'
          MGW_TEST_MYSQL_HOST: 127.0.0.1
          MGW_TEST_MYSQL_PORT: 3306
          MGW_TEST_MYSQL_DATABASE: mgw_test
          MGW_TEST_MYSQL_USER: root
          MGW_TEST_MYSQL_PASSWORD: root
        run: |
          php bot/tests/LedgerWriteServiceDatabaseIntegrationTest.php
          php bot/tests/Mvp21_11TournamentReleaseProofTest.php
          php bot/tests/SupportTicketMySqlIntegrationTest.php
          php bot/tests/Mvp22_3ModerationMySqlIntegrationTest.php
          php bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php
          php bot/tests/Mvp22_9IncidentRecoveryMySqlIntegrationTest.php
          php bot/tests/LegacyFinancialArchiveDatabaseIntegrationTest.php

  final-gate:
    name: MVP-24.5 regression gate
    runs-on: ubuntu-24.04
    needs: [product-regression, mysql-persistence]
    if: always()
    steps:
      - name: Require both regression lanes
        shell: bash
        run: |
          test "${{ needs.product-regression.result }}" = "success"
          test "${{ needs.mysql-persistence.result }}" = "success"
          echo "MVP-24.5 post-removal regression passed."

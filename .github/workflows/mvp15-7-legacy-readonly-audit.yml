name: MVP-15.7 legacy read-only audit

on:
  push:
    branches:
      - agent/mvp-15-7-legacy-cleanup-audit
    paths:
      - '.github/workflows/mvp15-7-legacy-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-7-legacy-cleanup-audit
          fetch-depth: 1

      - name: Exact base and legacy owner map
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT CHECKOUT ==='
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo '=== CANONICAL 15.3 OWNER VERIFIER ==='
          python3 ops/checks/verify-mvp15-3-unified-balance-owner.py

          echo '=== ALL balance_match / balance_gold REFERENCES ==='
          git grep -nE 'balance_match|balance_gold' -- ':!*.min.js' || true

          echo '=== LEGACY MATCH/GOLD ROOM SEMANTIC REFERENCES ==='
          git grep -niE 'gold[_ -]?room|match[_ -]?room|Gold-комнат|Match-комнат|room[_ -]?(type|mode|kind)|balanceGold|balanceMatch' -- app bot ops scripts || true

          echo '=== MIGRATION / SCHEMA FILES WITH LEGACY ECONOMY TOKENS ==='
          git grep -lE 'balance_match|balance_gold|mgw_coin|legacy.*(match|gold)|(match|gold).*legacy' -- bot app ops scripts | grep -Ei 'migration|schema|database|ledger|economy|rollback|backup|runtime' || true

          echo '=== DESTRUCTIVE SQL / SCHEMA OPERATIONS CURRENTLY PRESENT ==='
          git grep -niE 'DROP[[:space:]]+(COLUMN|TABLE)|ALTER[[:space:]]+TABLE|RENAME[[:space:]]+COLUMN|DELETE[[:space:]]+FROM' -- bot app ops scripts || true

          echo '=== BACKUP / ROLLBACK / AUDIT OWNERS ==='
          git grep -niE 'rollback|backup|snapshot|audit|reconcile|reconciliation' -- bot/economy bot/ledger bot/migration bot/cutover bot/runtime app/runtime ops 2>/dev/null || true

          echo '=== MVP15.7_READONLY_AUDIT=PASS ==='

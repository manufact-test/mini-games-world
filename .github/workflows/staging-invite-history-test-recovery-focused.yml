name: Staging invite history test recovery focused

on:
  pull_request:
    branches:
      - agent/staging-invite-history-test-recovery

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 52a7185ba1c86f0aac45c31bb923cbcc43596af0
  STATUS_CONTEXT: staging-invite-history-test-recovery-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite history recovery verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-history-test-recovery-verifier
          fetch-depth: 0

      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php -l bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php -l bot/tests/RuntimeInviteRepositoryTest.php
          php -l bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php -l bot/tests/ProductionMvp14R13StagingTestInviteResidualRecoveryTest.php
          php -l bot/tests/ProductionMvp14R13StagingInviteResidualSafeDiagnosisTest.php
          php -l bot/tests/JsonDatabaseExclusiveSnapshotTest.php
          php -l bot/tests/InviteRuntimeEndpointBridgeTest.php

      - name: Focused regressions
        run: |
          set -Eeuo pipefail
          php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php bot/tests/ProductionMvp14R13StagingTestInviteResidualRecoveryTest.php
          php bot/tests/ProductionMvp14R13StagingInviteResidualSafeDiagnosisTest.php
          php bot/tests/JsonDatabaseExclusiveSnapshotTest.php
          php bot/tests/InviteRuntimeEndpointBridgeTest.php

      - name: History and production safety
        run: |
          set -Eeuo pipefail
          grep -F "?? (($config['environment'] ?? null) === 'staging');" bot/invites/RuntimeInviteRepository.php
          grep -F "if ($matchId !== '' || $matchRefs !== 0)" bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          grep -F "continue;" bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          ! grep -F "Staging test-only orphan recovery refuses match-referenced A/B invite." bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          ! git diff 4ddc122b72ac7f4af0adf346e011e86d7372baff...52a7185ba1c86f0aac45c31bb923cbcc43596af0 | grep -E '^\+.*(TRUNCATE|DROP TABLE|retry|sleep\()'
          git diff --quiet 4ddc122b72ac7f4af0adf346e011e86d7372baff...52a7185ba1c86f0aac45c31bb923cbcc43596af0 -- \
            bot/storage/JsonDatabase.php \
            bot/storage/JsonStorageAdapter.php \
            bot/invites.php \
            app
          git diff --check 4ddc122b72ac7f4af0adf346e011e86d7372baff...52a7185ba1c86f0aac45c31bb923cbcc43596af0

      - name: Exact verifier diff guard
        run: |
          set -Eeuo pipefail
          git diff --check 52a7185ba1c86f0aac45c31bb923cbcc43596af0...HEAD
          test "$(git diff --name-only 52a7185ba1c86f0aac45c31bb923cbcc43596af0...HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only 52a7185ba1c86f0aac45c31bb923cbcc43596af0...HEAD)" = '.github/workflows/staging-invite-history-test-recovery-focused.yml'

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite history recovery verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Staging invite history recovery verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

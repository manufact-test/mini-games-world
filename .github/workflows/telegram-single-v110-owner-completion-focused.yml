name: Telegram single v110 owner completion focused

on:
  pull_request:
    branches:
      - agent/telegram-single-v110-owner-completion

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: cb14fa4e1ef726b6df7616121ad05435e1dffbf6
  STATUS_CONTEXT: telegram-single-v110-owner-completion-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"All Telegram start owners verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -Eeuo pipefail
          php -l bot/services/TelegramService.php
          php -l bot/helpers/InviteStartGuard.php
          php -l bot/helpers/WebAppLaunchUrl.php
          php -l bot/helpers/UserWelcomeGuard.php
          php -l bot/handlers/WebhookHandler.php
          php -l bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php

      - name: Single owner contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
          grep -Fq 'WebAppLaunchUrl::base($this->config)' bot/services/TelegramService.php
          ! grep -Fq '/app/?v=121' bot/services/TelegramService.php
          grep -Fq 'WebAppLaunchUrl::invitation($this->config, $token)' bot/helpers/InviteStartGuard.php
          ! grep -Fq '/app/?v=87' bot/helpers/InviteStartGuard.php
          grep -Fq "private const ENTRY_PATH = '/app/v110.php?v=1123';" bot/helpers/WebAppLaunchUrl.php
          grep -Fq "'type' => 'default'" bot/helpers/UserWelcomeGuard.php
          grep -Fq "'type' => 'commands'" bot/helpers/StagingMenuButtonReconciler.php
          grep -Fq 'bot/helpers/InviteStartGuard.php' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fq 'bot/handlers/WebhookHandler.php' bot/helpers/staging-e2e-runtime-files.txt

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"All Telegram start owners verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"All Telegram start owners verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

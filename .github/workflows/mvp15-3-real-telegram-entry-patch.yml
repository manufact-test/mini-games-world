name: MVP-15.3 real Telegram entry diagnostic

on:
  push:
    branches:
      - agent/mvp-15-3-real-telegram-entry-fix
    paths:
      - '.github/workflows/mvp15-3-real-telegram-entry-patch.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-3-real-telegram-entry-fix
      - name: Verify real Telegram v110 entry
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/v110.php
          php -l bot/helpers/WebAppLaunchUrl.php
          python3 -m py_compile ops/checks/verify-mvp15-3-unified-balance-owner.py
          php app/v110.php > /tmp/mgw-v110-entry.html
          grep -F './assets/js/main-v110.js?v=1139&ux=1&sk=3&icons=c1efd5af&render=5&mvp15=unified-balance' /tmp/mgw-v110-entry.html
          grep -F './assets/css/main.css?v=153&sk=3&icons=c1efd5af&render=28&palette=notification-semantic&battleship=authoritative-shot-only&wallet=15-3' /tmp/mgw-v110-entry.html
          grep -F './assets/js/production-clean-entry-v110.js?v=1124&clock=single-writer&release=battleship-action-quarantine' /tmp/mgw-v110-entry.html
          grep -F './assets/js/ui.js?v=91&mvp15=unified-balance' /tmp/mgw-v110-entry.html
          grep -F './assets/js/screens/home-screen.js?v=75&mvp15=unified-balance' /tmp/mgw-v110-entry.html
          grep -F './assets/js/screens/profile-screen-v110.js?v=1110&mvp15=unified-balance' /tmp/mgw-v110-entry.html
          if grep -Fq './assets/js/main.js?v=98.4-wallet-15-3' /tmp/mgw-v110-entry.html; then
            echo 'Generic main.js survived the v110 transform' >&2
            exit 1
          fi
          php -r "require 'bot/helpers/WebAppLaunchUrl.php'; echo WebAppLaunchUrl::base(['base_url' => 'https://example.test']), PHP_EOL;" | grep -Fx 'https://example.test/app/v110.php?v=1124'
      - name: Re-run MVP-15.3 financial invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          php bot/tests/UnifiedBalanceMigrationFoundationTest.php
          php bot/tests/UnifiedBalanceMigrationExecutionTest.php
          php bot/tests/UnifiedBalanceLegacyIdentityReconciliationTest.php
          php bot/tests/UnifiedEconomyRuntimeSyncTest.php
          php bot/tests/UnifiedEconomyDevUserSyncRegressionTest.php

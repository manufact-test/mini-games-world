name: MVP-16.4 Setup UI polish focused
on:
  push:
    branches: [agent/mvp-16-4-setup-ui-polish]
    paths: ['.github/workflows/mvp16-4-setup-ui-polish-focused.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Setup UI contracts
        run: |
          set -Eeuo pipefail
          node ops/checks/mvp16_4_setup_ui_polish_contract.mjs
          node ops/checks/mvp16_4_unified_game_setup_contract.mjs
          node ops/checks/mvp16_3_shell_navigation_contract.mjs
          php -l app/runtime/client/version-manifest.php
      - name: Accepted regressions and start render
        run: |
          set -Eeuo pipefail
          node ops/checks/mvp16_1_router_lifecycle_contract.mjs
          php bot/tests/Mvp161ClientBootstrapRouterTest.php
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
          php app/v110.php > /tmp/mgw-v110.html
          grep -F 'main.css?v=159&sk=3&icons=c1efd5af&render=30&mvp16=setup-ui-polish' /tmp/mgw-v110.html >/dev/null
          test "$(grep -o '<script type="module" src="' /tmp/mgw-v110.html | wc -l)" -eq 1
          python3 scripts/ci/staging-runtime-fingerprint.py
          echo MVP16_4_SETUP_UI_POLISH_FOCUSED=PASS

name: MVP-22.5 System status, flags and admin messages

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/admin.php'
      - 'app/assets/css/admin-shell.css'
      - 'app/assets/js/admin-system.js'
      - 'bot/admin-system.php'
      - 'bot/system/SystemAdminService.php'
      - 'bot/system/RuntimeFeatureFlagAdminService.php'
      - 'bot/database/migrations/20260926_0065_create_system_admin_control.php'
      - 'bot/tests/Mvp22_5SystemAdminTest.php'
      - 'bot/tests/Mvp22_5SystemAdminContractTest.php'
      - 'bot/tests/Mvp22AdminShellReworkContractTest.php'
      - '.github/workflows/mvp22-admin-rework.yml'
      - '.github/workflows/mvp22-5-system-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp22-5-system-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint MVP-22.5 slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/admin.php
            bot/admin-system.php
            bot/system/SystemAdminService.php
            bot/system/RuntimeFeatureFlagAdminService.php
            bot/database/migrations/20260926_0065_create_system_admin_control.php
            bot/tests/Mvp22_5SystemAdminTest.php
            bot/tests/Mvp22_5SystemAdminContractTest.php
            bot/tests/Mvp22AdminShellReworkContractTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check app/assets/js/admin-system.js

      - name: Run System Admin model
        run: php bot/tests/Mvp22_5SystemAdminTest.php

      - name: Run System Admin ownership contract
        run: php bot/tests/Mvp22_5SystemAdminContractTest.php

      - name: Preserve Web Admin shell
        run: php bot/tests/Mvp22AdminShellReworkContractTest.php

      - name: Preserve feature flag behavior
        run: |
          php bot/tests/FeatureFlagServiceTest.php
          php bot/tests/GameCatalogFeatureFlagTest.php

      - name: Preserve canonical notification producer
        run: php bot/tests/Mvp18_6NotificationPipelineContractTest.php

      - name: Preserve official season owners
        run: |
          php bot/tests/Mvp20_1PerGameVisibleRatingTest.php
          php bot/tests/Mvp20_3LeaderboardsAntiFarmingTest.php
          php bot/tests/Mvp20_4QuarterlySeasonLifecycleTest.php
          php bot/tests/Mvp20_5SeasonalAwardsTest.php
          php bot/tests/Mvp20_6YearlyMedalTest.php
          php bot/tests/Mvp20_8RatingAdminTest.php

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(.github/workflows/(mvp22-admin-rework|mvp22-5-system-admin).yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/js/admin-system.js|bot/admin-system.php|bot/system/(SystemAdminService|RuntimeFeatureFlagAdminService).php|bot/database/migrations/20260926_0065_create_system_admin_control.php|bot/tests/(Mvp22AdminShellReworkContractTest|Mvp22_5SystemAdminTest|Mvp22_5SystemAdminContractTest).php)$'
          bad=0
          while IFS= read -r path; do
            if ! grep -Eq "$allowed" <<<"$path"; then
              echo "Unexpected MVP-22.5 path: $path" >&2
              bad=1
            fi
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          git diff --exit-code "$base" "$head" -- bot/games bot/support bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger bot/antifraud bot/replay

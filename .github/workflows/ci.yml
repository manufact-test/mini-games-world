name: Mini Games World CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/mvp14-interface-ci-run
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mgw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, smoke and DB-selector checks
    runs-on: ubuntu-latest
    timeout-minutes: 22

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mgw_ci
          MYSQL_USER: mgw_ci_user
          MYSQL_PASSWORD: ci_database_password_not_secret
          MYSQL_ROOT_PASSWORD: ci_root_password_not_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mgw_ci_mariadb
          MARIADB_USER: mgw_ci_mariadb_user
          MARIADB_PASSWORD: ci_mariadb_password_not_secret
          MARIADB_ROOT_PASSWORD: ci_mariadb_root_password_not_secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MGW_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_ci;charset=utf8mb4
      MGW_TEST_MYSQL_USER: mgw_ci_user
      MGW_TEST_MYSQL_PASSWORD: ci_database_password_not_secret
      MGW_TEST_MARIADB_DSN: mysql:host=127.0.0.1;port=3307;dbname=mgw_ci_mariadb;charset=utf8mb4
      MGW_TEST_MARIADB_USER: mgw_ci_mariadb_user
      MGW_TEST_MARIADB_PASSWORD: ci_mariadb_password_not_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository checks
        id: repository-checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/run.sh 2>&1 | tee ci-report.txt

      - name: Run DB selector guard
        id: db-selector
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash ops/checks/db-primary-staging-entrypoint-selector-local.sh 2>&1 | tee db-selector-report.txt

      - name: Publish exact validation status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OUTCOME: ${{ steps.repository-checks.outcome }}
          DB_SELECTOR_OUTCOME: ${{ steps.db-selector.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          state='success'
          description='Full CI and DB selector guard passed'
          if [[ "${REPOSITORY_OUTCOME}" != 'success' || "${DB_SELECTOR_OUTCOME}" != 'success' ]]; then
            state='failure'
            description="CI=${REPOSITORY_OUTCOME}; DB=${DB_SELECTOR_OUTCOME}"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc \
              --arg state "${state}" \
              --arg context 'mvp14-interface-full-ci-db' \
              --arg description "${description}" \
              --arg target_url "${RUN_URL}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-ci-validation-reports
          path: |
            ci-report.txt
            db-selector-report.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce validation result
        if: always()
        shell: bash
        env:
          REPOSITORY_OUTCOME: ${{ steps.repository-checks.outcome }}
          DB_SELECTOR_OUTCOME: ${{ steps.db-selector.outcome }}
        run: |
          set -Eeuo pipefail
          test "${REPOSITORY_OUTCOME}" = 'success'
          test "${DB_SELECTOR_OUTCOME}" = 'success'

name: Mini Games World CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mgw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mgw_ci
          MYSQL_USER: mgw_ci_user
          MYSQL_PASSWORD: ci_database_password_not_secret
          MYSQL_ROOT_PASSWORD: ci_root_password_not_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mgw_ci_mariadb
          MARIADB_USER: mgw_ci_mariadb_user
          MARIADB_PASSWORD: ci_mariadb_password_not_secret
          MARIADB_ROOT_PASSWORD: ci_mariadb_root_password_not_secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MGW_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_ci;charset=utf8mb4
      MGW_TEST_MYSQL_USER: mgw_ci_user
      MGW_TEST_MYSQL_PASSWORD: ci_database_password_not_secret
      MGW_TEST_MARIADB_DSN: mysql:host=127.0.0.1;port=3307;dbname=mgw_ci_mariadb;charset=utf8mb4
      MGW_TEST_MARIADB_USER: mgw_ci_mariadb_user
      MGW_TEST_MARIADB_PASSWORD: ci_mariadb_password_not_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/v110-presence-invite-resume-root
          fetch-depth: 0

      - name: Apply canonical R5 root changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/apply-r5-root.py')
          text = path.read_text(encoding='utf-8')
          old = '''service = "bot/services/GameInviteService.php"
          replace_once(service,
          """        $type = (string)($notification['type'] ?? '');
                  if (!str_starts_with($type, 'invite_')) return true;
          """,
          """        $type = (string)($notification['type'] ?? '');
                  if (!str_starts_with($type, 'invite_')) return true;
                  if (in_array($type, ['invite_expired', 'invite_timed_out'], true)) return false;
          """)
          '''
          new = '''replace_once(storage,
          """        $type = (string)($notification['type'] ?? '');
                  if (!str_starts_with($type, 'invite_')) return true;
          """,
          """        $type = (string)($notification['type'] ?? '');
                  if (!str_starts_with($type, 'invite_')) return true;
                  if (in_array($type, ['invite_expired', 'invite_timed_out'], true)) return false;
          """)
          '''
          if text.count(old) != 1:
              raise SystemExit('R5 transform owner patch not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/ci/apply-r5-root.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/assets/js/stats-owner-v110.js \
            app/assets/js/production-v110-presence.js \
            app/assets/js/games/game-invites-v110.js \
            app/assets/js/screens/home-screen.js \
            app/assets/js/screens/notifications-screen-v110r5.js \
            app/assets/js/main-v110-handoff-shell.js \
            app/assets/js/main-v110.js \
            app/assets/js/production-clean-entry-v110.js \
            app/v110.php \
            bot/helpers/UserWelcomeGuard.php \
            bot/helpers/WebAppLaunchUrl.php \
            bot/services/AuthService.php \
            bot/services/PresenceService.php \
            bot/api.php \
            bot/services/invites/GameInviteStorageTrait.php \
            bot/notifications.php \
            bot/tests
          git rm scripts/ci/apply-r5-root.py

          if git diff --cached --quiet; then
            echo "Canonical R5 root changes already applied."
          else
            git commit -m "fix presence, invite recovery and resume roots"
            git push origin HEAD:agent/v110-presence-invite-resume-root
          fi

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/run.sh 2>&1 | tee ci-report.txt

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.txt
          if-no-files-found: error
          retention-days: 3

name: MVP-16.1B lifecycle version owner audit

on:
  push:
    branches:
      - agent/mvp-16-1b-lifecycle-manifest-audit
    paths:
      - '.github/workflows/mvp16-1b-owner-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-16-1b-lifecycle-manifest-audit
          fetch-depth: 1

      - name: Audit active route state lifecycle and query versions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT AUDIT HEAD ==='
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo '=== ACTIVE V110 ENTRY / IMPORT MAP ==='
          sed -n '1,220p' app/v110.php

          echo '=== VERSIONED STATIC IMPORTS ==='
          git grep -nE "from ['\"][^'\"]+\\?v=|import\\(['\"][^'\"]+\\?v=" -- app/assets/js | head -n 700 || true

          echo '=== SCREEN NAVIGATION OWNERS ==='
          git grep -nE "showScreen\\(|mgw:screen-changed|onScreenEnter|onScreenLeave|dataset\\.screen|screen\\.active" -- app/assets/js | head -n 500 || true

          echo '=== TIMER / POLL OWNERS ==='
          git grep -nE 'setInterval|setTimeout|clearInterval|clearTimeout|requestAnimationFrame|cancelAnimationFrame|poll[A-Z]|schedule[A-Z]' -- app/assets/js | head -n 700 || true

          echo '=== GLOBAL LISTENER OWNERS ==='
          git grep -nE "document\\.addEventListener|window\\.addEventListener|document\\.removeEventListener|window\\.removeEventListener" -- app/assets/js | head -n 700 || true

          echo '=== STATE ACTIVE GAME / TIMERS OWNERS ==='
          git grep -nE 'state\\.activeGame|state\\.timers|selectedGame|selectedBet|state\\.screen' -- app/assets/js | head -n 700 || true

          echo '=== VERSION TOKEN COUNTS ==='
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          roots=[Path('app/assets/js')]
          versions=collections.Counter()
          refs=[]
          pat=re.compile(r"(?:from\s+|import\()['\"]([^'\"]+\?v=[^'\"]+)['\"]")
          for root in roots:
              for p in root.rglob('*.js'):
                  text=p.read_text(errors='ignore')
                  for m in pat.finditer(text):
                      refs.append((p.as_posix(),m.group(1)))
                      versions[m.group(1)] += 1
          print('VERSIONED_IMPORT_REFERENCE_COUNT=',len(refs))
          print('UNIQUE_VERSIONED_IMPORT_TARGETS=',len(versions))
          for target,count in versions.most_common():
              print(f'{count:3d} {target}')
          PY

          echo 'MVP16_1B_OWNER_AUDIT=PASS'

name: MVP-16.1B focused manifest lifecycle gate

on:
  push:
    branches:
      - agent/mvp-16-1b-version-manifest-route-registry
    paths:
      - '.github/workflows/mvp16-1b-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-16-1b-version-manifest-route-registry
          fetch-depth: 1

      - name: Focused syntax lifecycle and successor contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/v110.php
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp161ClientBootstrapRouterTest.php
          php -l bot/tests/Mvp156UnifiedZoneCutoverTest.php
          php -l bot/tests/Mvp156NotificationSemanticScrollTest.php
          node --check app/assets/js/app-bootstrap-v2.js
          node --check app/assets/js/router.js
          node ops/checks/mvp16_1_router_lifecycle_contract.mjs
          php bot/tests/Mvp161ClientBootstrapRouterTest.php
          php bot/tests/Mvp156UnifiedZoneCutoverTest.php
          php bot/tests/Mvp156NotificationSemanticScrollTest.php
          php bot/tests/Mvp156BonusUxPolishTest.php
          python3 ops/checks/verify-mvp15-3-unified-balance-owner.py
          python3 scripts/ci/staging-runtime-fingerprint.py
          echo 'MVP16_1B_FOCUSED=PASS'

# retry 3 after successor verifier update

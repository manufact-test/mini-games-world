name: TMP production invite fake match-id patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/staging-invite-protected-history-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-protected-history-parity
          fetch-depth: 0
      - name: Apply exact test-fixture patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-production-invite-fake-match-id-patch.py
          php -l bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          git diff --check
      - name: Commit test fixture only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          if git diff --cached --quiet; then
            echo 'Test fixture already updated.'
            exit 0
          fi
          git commit -m 'Tests: accept match_id in production invite fake DB'
          git push origin HEAD:agent/staging-invite-protected-history-parity

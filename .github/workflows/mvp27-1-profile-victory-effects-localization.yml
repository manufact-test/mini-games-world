name: MVP-27.1 Profile Victory Effects Localization

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/profile/mgw-profile-victory-effects-v4.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-card-parity.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_profile_victory_effects_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-profile-victory-effects-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-victory-effects-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/profile/mgw-profile-victory-effects-v4.js
          node --check app/assets/js/profile/mgw-profile-victory-effects-card-parity.js
          node --check ops/checks/mvp27_1_profile_victory_effects_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          python3 -m json.tool app/locales/ru.json >/dev/null
          node ops/checks/mvp27_1_profile_victory_effects_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve accepted Victory Effects semantics
        run: |
          set -euo pipefail
          node tests/mvp19-3-victory-effect-selector.mjs
          php bot/tests/Mvp19_3ProfileVictorySparkBurstTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/profile/mgw-profile-victory-effects-v4\.js|app/assets/js/profile/mgw-profile-victory-effects-card-parity\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_profile_victory_effects_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-profile-victory-effects-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Profile Victory Effects localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

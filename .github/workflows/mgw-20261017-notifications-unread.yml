name: MGW 2026-10-17 notification unread recovery
on:
  pull_request:
    paths:
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mgw20261017_notifications_unread_recovery_contract.mjs'
      - '.github/workflows/mgw-20261017-notifications-unread.yml'
  workflow_dispatch:
jobs:
  unread_recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate server-only unread recovery
        run: |
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          node --check ops/checks/mgw20261017_notifications_unread_recovery_contract.mjs
          node ops/checks/mgw20261017_notifications_unread_recovery_contract.mjs
          node ops/checks/mvp27_1_notification_center_localization_contract.mjs

name: MVP-27.1 Account Data Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp22-8-account-data.yml'
      - 'ops/checks/mvp27_1_account_data_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-account-data-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-data-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/account-data-sheet-v1.js
          node --check app/assets/js/components/account-shortcuts.js
          node --check ops/checks/mvp27_1_account_data_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_account_data_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve Account Data lifecycle and native security boundaries
        run: |
          set -euo pipefail
          php bot/tests/Mvp22_8AccountDataLifecycleTest.php
          php bot/tests/Mvp23ManualAcceptanceCorrectiveContractTest.php
          php bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/screens/account-data-sheet-v1\.js|app/assets/js/components/account-shortcuts\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|\.github/workflows/mvp22-8-account-data\.yml|ops/checks/mvp27_1_account_data_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-account-data-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Account Data localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

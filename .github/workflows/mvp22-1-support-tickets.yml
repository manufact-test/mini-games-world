name: MVP-22.1 Support tickets

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/support.php'
      - 'bot/admin-support.php'
      - 'bot/support/**'
      - 'bot/database/migrations/20260924_0061_create_support_tickets.php'
      - 'bot/tests/SupportTicketServiceTest.php'
      - 'bot/tests/SupportTicketMySqlIntegrationTest.php'
      - 'app/admin.php'
      - 'app/assets/js/admin-support.js'
      - 'app/assets/css/admin-shell.css'
      - 'app/assets/css/main.css'
      - 'app/index.html'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/screens/home-screen.js'
      - 'app/assets/js/components/shield-king-visuals.js'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp22-1-support-tickets.yml'
  workflow_dispatch:

jobs:
  support-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l bot/support.php
          php -l bot/admin-support.php
          php -l bot/support/SupportTicketService.php
          php -l bot/support/SupportTelegramNotifier.php
          php -l bot/database/migrations/20260924_0061_create_support_tickets.php
          php -l bot/tests/SupportTicketServiceTest.php
          php -l bot/tests/SupportTicketMySqlIntegrationTest.php
          php -l app/admin.php
          php -l app/runtime/client/version-manifest.php
      - name: JavaScript syntax
        run: |
          node --check app/assets/js/admin-support.js
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/home-screen.js
          node --check app/assets/js/components/shield-king-visuals.js
      - name: Support form UI regression
        run: |
          set -euo pipefail
          grep -Fq 'support-ticket-create' app/assets/js/screens/home-screen.js
          grep -Fq 'support-thread-attachment' app/assets/js/screens/home-screen.js
          grep -Fq 'mountSupportFilePicker' app/assets/js/screens/home-screen.js
          grep -Fq "menuItemMarkup('supportTicketsBtn', '🎫', 'Мои обращения', 'support-attention')" app/assets/js/screens/home-screen.js
          grep -Fq "supportTicketsBtn:'ui/navigation/notifications.webp'" app/assets/js/components/shield-king-visuals.js
          grep -Fq '.menu-item-standard.support-attention' app/assets/css/main.css
          grep -Fq '.support-thread-message.is-user{' app/assets/css/main.css
          grep -A4 -F '.support-thread-message.is-user{' app/assets/css/main.css | grep -Fq 'width:100%;'
          grep -Fq '.support-file-chip button::before' app/assets/css/main.css
          ! grep -Fq 'background:rgba(106,42,61,.13);' app/assets/css/main.css
          grep -Fq 'support-ticket-select option' app/assets/css/main.css
          grep -Fq 'support-thread-message' app/assets/css/main.css
          grep -Fq 'support-file-chip' app/assets/css/main.css
          grep -Fq 'max-height:calc(86dvh - 142px)' app/assets/css/main.css
          ! grep -Fq 'Создадим отдельный тикет' app/assets/js/screens/home-screen.js
          ! grep -Fq 'botton.disabled' app/assets/js/screens/home-screen.js
          ! grep -Fq 'File.file_name' app/assets/js/screens/home-screen.js
          ! grep -Fq 'supportTickketMeta' app/assets/js/screens/home-screen.js
      - name: 100-ticket isolation regression
        run: php bot/tests/SupportTicketServiceTest.php


  support-tickets-mysql:
    name: Support tickets on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_support_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Lint MySQL proof
        run: php -l bot/tests/SupportTicketMySqlIntegrationTest.php
      - name: Run 100-ticket MySQL proof
        env:
          MGW_SUPPORT_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_support_ci;charset=utf8mb4
          MGW_SUPPORT_MYSQL_USER: root
          MGW_SUPPORT_MYSQL_PASS: root
        run: php bot/tests/SupportTicketMySqlIntegrationTest.php

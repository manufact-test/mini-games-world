name: TMP staging invite projection repair patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

concurrency:
  group: tmp-staging-invite-projection-repair
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'agent/staging-test-reset-invite-projection-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-test-reset-invite-projection-repair
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-staging-invite-projection-repair-patch.py
          php -l bot/services/StagingTestPlayerStateResetService.php
          php -l bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          php -l bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php -l bot/tests/StagingTestPlayerInviteProjectionRecoveryContractTest.php
          php bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php bot/tests/StagingTestPlayerInviteProjectionRecoveryContractTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          git diff --check
      - name: Publish verified files through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/staging-test-reset-invite-projection-repair
        run: |
          set -Eeuo pipefail

          publish_file() {
            local path="$1"
            local old_sha=""
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              old_sha="$(git rev-parse "HEAD:${path}")"
            fi
            local content
            content="$(base64 -w0 "${path}")"
            local body
            body="$(jq -nc \
              --arg message "Staging reset projection repair: ${path}" \
              --arg content "${content}" \
              --arg branch "${TARGET_BRANCH}" \
              --arg sha "${old_sha}" \
              'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')"
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --data "${body}" >/dev/null
          }

          publish_file bot/services/StagingTestPlayerStateResetService.php
          publish_file bot/services/StagingTestOnlyInviteOrphanRecoveryService.php
          publish_file bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          publish_file bot/tests/StagingTestPlayerInviteProjectionRecoveryContractTest.php

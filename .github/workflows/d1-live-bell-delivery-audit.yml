name: D1 bell single-owner rebuild

on:
  pull_request:
    branches:
      - agent/mvp14-d1-bell-audit-final-base

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused ownership migration
        run: python3 tools/apply_d1_bell_single_owner.py

      - name: Validate focused architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/screens/notifications-screen-v99.js
          node --check app/assets/js/screens/home-screen.js
          node --check app/assets/js/main.js
          php bot/tests/ProductionMvp14D1CanonicalOwnersArchitectureTest.php
          grep -Fq "document.addEventListener('click', handleNotificationBellActivation, true);" app/assets/js/screens/notifications-screen-v99.js
          grep -Fq 'event.stopImmediatePropagation();' app/assets/js/screens/notifications-screen-v99.js
          ! grep -Fq "target.id === 'notificationsOpen'" app/assets/js/screens/home-screen.js
          git diff --check

      - name: Commit only the final architecture change
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            tools/apply_d1_bell_single_owner.py \
            .github/workflows/d1-live-bell-delivery-audit.yml \
            notes/.bell-audit-trigger \
            notes/.bell-audit-trigger-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore one canonical bell click owner"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

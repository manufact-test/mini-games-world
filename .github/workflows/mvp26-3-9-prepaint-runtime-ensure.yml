name: MVP-26.3.9 Prepaint runtime ensure

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/profile.php'
      - 'bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php'
      - 'bot/tests/Mvp26_3_9PrepaintRuntimeEnsureTest.php'
      - '.github/workflows/mvp26-3-9-prepaint-runtime-ensure.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/profile.php'
      - 'bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php'
      - 'bot/tests/Mvp26_3_9PrepaintRuntimeEnsureTest.php'
      - '.github/workflows/mvp26-3-9-prepaint-runtime-ensure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepaint-runtime-ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/profile.php
          php -l bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php
          php -l bot/tests/Mvp26_3_9PrepaintRuntimeEnsureTest.php

      - name: Safe missing-vs-zero runtime rehydration
        run: php bot/tests/Mvp26_3_9PrepaintRuntimeEnsureTest.php

      - name: First-paint lifecycle contract
        run: php bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php

      - name: Existing account-link regression
        run: php bot/tests/Mvp26_3AccountLinkServiceTest.php

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp26-3-9-prepaint-runtime-ensure\.yml|\.github/workflows/mvp26-3-8-first-paint-live-balance\.yml|bot/profile\.php|bot/tests/Mvp26_3_8FirstPaintBalanceContractTest\.php|bot/tests/Mvp26_3_9PrepaintRuntimeEnsureTest\.php)
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-26.3.9 paths:\n%s\n' "$bad" >&2; exit 1; }

          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-26.3.9 paths:\n%s\n' "$bad" >&2; exit 1; }

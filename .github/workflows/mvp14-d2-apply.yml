name: Apply isolated MVP-14 D2 fix

on:
  push:
    branches:
      - agent/mvp14-d2-terminal-card-in-place-v1130
    paths:
      - .github/workflows/mvp14-d2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-card-in-place-v1130
          fetch-depth: 0

      - name: Apply canonical D2 change
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          invites_path = 'app/assets/js/games/game-invites-v110.js'
          invites = read(invites_path)

          replacement = r'''async function performInviteAction(action, token, button){
            if (!action || !token || button.disabled) return;
            haptic('light');
            const originalText = button.textContent;
            const rollbackInvite = cloneInvite(currentInvite);
            const rollbackHtml = String(document.getElementById('sheet')?.innerHTML || '');
            const terminalContext = terminalActionContext(button, action, token);
            setInviteButtonsDisabled(true);
            button.textContent = actionText(action);

            // Accept owns its existing immediate waiting transition. Decline and
            // cancel deliberately keep the current sheet/card visible until the
            // single authoritative request succeeds or fails.
            if (action === 'accept' && currentInvite?.source !== 'rematch') {
              showInviteeWaiting({
                ...currentInvite,
                status:'accepted',
                ready_deadline_at:currentInvite?.ready_deadline_at || new Date(Date.now() + 90000).toISOString(),
              });
            }

            try {
              const result = await inviteRequest(action, { token });
              syncState(result);
              if (result?.game?.id && String(result.game.status || '') === 'active') {
                enterGame(result.game);
                return;
              }

              currentInvite = result.invite || currentInvite;

              if (action === 'accept') {
                if (currentInvite?.source === 'rematch') {
                  scheduleSync(0);
                } else {
                  showInviteeWaiting(currentInvite);
                  scheduleSync(0);
                }
                return;
              }
              if (action === 'decline' || action === 'cancel') {
                const terminalInvite = terminalInviteResult(action, token, result?.invite || rollbackInvite);
                const unreadCount = Number(result?.unread_count);

                if (terminalContext.notificationSurface) {
                  document.dispatchEvent(new CustomEvent('mgw:notification-sync', {
                    detail:{
                      item:terminalNotificationItem(terminalContext, terminalInvite),
                      unreadCount:Number.isFinite(unreadCount) ? Math.max(0, unreadCount) : 0,
                      announce:false,
                    },
                  }));
                } else {
                  showTerminalInvite(terminalInvite);
                }

                if (Number.isFinite(unreadCount)) dispatchNotificationCount(Math.max(0, unreadCount));
                currentInvite = null;
                scheduleSync(0);
                scheduleWatch(0);
                return;
              }
              if (action === 'start') {
                scheduleSync(0);
                return;
              }

              setInviteButtonsDisabled(false);
              button.textContent = originalText;
            } catch (error) {
              currentInvite = rollbackInvite;
              if (rollbackHtml) openSheet(rollbackHtml);
              toast(error.message || 'Не удалось выполнить действие.');
              setInviteButtonsDisabled(false);
              const restored = [...document.querySelectorAll('[data-invite-action][data-invite-token]')].find(candidate =>
                String(candidate.dataset.inviteAction || '') === action
                  && String(candidate.dataset.inviteToken || '') === token
              );
              if (restored instanceof HTMLButtonElement) restored.textContent = originalText;
            }
          }

          function terminalActionContext(button, action, token){
            const card = button.closest('[data-notification-id][data-notification-invite-token]');
            const notificationSurface = Boolean(
              card
                && button.closest('[data-notifications-owner="r12"]')
                && String(card.getAttribute('data-notification-invite-token') || '') === token
            );

            return {
              action,
              token,
              notificationSurface,
              notificationId:String(card?.getAttribute('data-notification-id') || ''),
              notificationType:String(card?.getAttribute('data-notification-type') || ''),
            };
          }

          function terminalInviteResult(action, token, value){
            const invite = cloneInvite(value) || {};
            const status = String(invite.status || (action === 'decline' ? 'declined' : 'cancelled'));
            return {
              ...invite,
              token,
              status,
              status_label:String(invite.status_label || terminalTitle(status)),
            };
          }

          function terminalNotificationItem(context, invite){
            const status = String(invite?.status || (context.action === 'decline' ? 'declined' : 'cancelled'));
            const fallbackType = context.action === 'decline'
              ? (String(invite?.source || '') === 'rematch' ? 'invite_rematch_received' : 'invite_received')
              : 'invite_accepted';

            return {
              id:context.notificationId || `local_invite_${context.token}`,
              type:context.notificationType || fallbackType,
              title:String(invite?.status_label || terminalTitle(status)),
              message:'',
              tone:'warning',
              invite_token:context.token,
              invite_status:status,
              invite_is_owner:Boolean(invite?.is_owner),
              actions:[],
              read:true,
              created_at:String(invite?.updated_at || invite?.created_at || new Date().toISOString()),
            };
          }

          async function createRematch'''

          pattern = r"async function performInviteAction\(action, token, button\)\{.*?\n\}\n\nasync function createRematch"
          invites, count = re.subn(pattern, replacement, invites, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one performInviteAction block, replaced {count}')
          write(invites_path, invites)

          notifications_path = 'app/assets/js/screens/notifications-screen-v110r12.js'
          notifications = read(notifications_path)
          old_article = 'data-notification-id="${escapeHtml(item.id)}" data-notification-invite-token="${escapeHtml(item.invite_token)}"'
          new_article = 'data-notification-id="${escapeHtml(item.id)}" data-notification-type="${escapeHtml(item.type)}" data-notification-invite-token="${escapeHtml(item.invite_token)}"'
          if notifications.count(old_article) != 1:
              raise SystemExit('Notification article marker changed unexpectedly.')
          notifications = notifications.replace(old_article, new_article)
          write(notifications_path, notifications)

          shell_path = 'app/assets/js/main-v110-handoff-shell.js'
          shell = read(shell_path)
          import_line = "import { initInviteTerminalActions } from './games/invite-terminal-actions-v110r12.js?v=1123';\n"
          init_line = 'initInviteTerminalActions();\n'
          if shell.count(import_line) != 1 or shell.count(init_line) != 1:
              raise SystemExit('Separate terminal owner import/init changed unexpectedly.')
          shell = shell.replace(import_line, '').replace(init_line, '')
          write(shell_path, shell)

          # Publish the changed canonical owner through one fresh immutable graph.
          matched = subprocess.run(
              ['git', 'grep', '-l', '1129', '--', 'app', 'bot/tests', 'e2e', 'scripts/ci/query-version-baseline.json'],
              check=False,
              capture_output=True,
              text=True,
          )
          for path in [line for line in matched.stdout.splitlines() if line.strip()]:
              content = read(path)
              write(path, content.replace('1129', '1130'))

          contract = r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static function (string $path) use ($root): string {
              $content = file_get_contents($root . '/' . $path);
              if (!is_string($content)) throw new RuntimeException('Cannot read ' . $path);
              return $content;
          };
          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $owner = $read('app/assets/js/games/game-invites-v110.js');
          $retired = $read('app/assets/js/games/invite-terminal-actions-v110r12.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110r12.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $entry = $read('app/v110.php');
          $actions = $read('bot/services/invites/GameInviteActionTrait.php');

          $assert(str_contains($owner, "document.addEventListener('click', handleDocumentClick, true)")
              && str_contains($owner, "const actionButton = event.target.closest('[data-invite-action]')")
              && str_contains($owner, 'performInviteAction('),
              'All invite actions must enter the single canonical game-invites owner.');

          $assert(!str_contains($shell, 'initInviteTerminalActions')
              && !str_contains($shell, 'invite-terminal-actions-v110r12.js')
              && str_contains($shell, 'game-invites-v110.js?v=1130'),
              'The old window-capture terminal interceptor must be absent from the active graph.');

          $performStart = strpos($owner, 'async function performInviteAction(');
          $performEnd = strpos($owner, 'async function createRematch(', $performStart ?: 0);
          $perform = $performStart !== false && $performEnd !== false
              ? substr($owner, $performStart, $performEnd - $performStart)
              : '';
          $assert($perform !== ''
              && !str_contains($perform, "if (action === 'decline') toast('Приглашение отклонено.')")
              && !str_contains($perform, "action === 'decline' || action === 'cancel') {\n    closeSheet();")
              && str_contains($perform, "new CustomEvent('mgw:notification-sync'")
              && str_contains($perform, 'announce:false')
              && str_contains($perform, 'showTerminalInvite(terminalInvite);'),
              'Decline/cancel must keep the sheet open and replace the current surface without a self-toast.');

          $assert(str_contains($owner, 'function terminalActionContext(')
              && str_contains($owner, 'data-notification-type')
              && str_contains($owner, 'function terminalNotificationItem(')
              && str_contains($owner, 'actions:[]')
              && str_contains($owner, "message:''"),
              'The canonical owner must preserve exact notification identity and render a non-actionable terminal card.');

          $assert(str_contains($notifications, 'data-notification-type="${escapeHtml(item.type)}"')
              && str_contains($notifications, "document.addEventListener('mgw:notification-sync'")
              && str_contains($notifications, 'pinItem(item);')
              && str_contains($notifications, 'renderNotifications(visibleSheetItems());'),
              'The notification owner must replace the visible card in place through its existing sync contract.');

          $declineStart = strpos($actions, 'public function decline(');
          $cancelStart = strpos($actions, 'public function cancel(', $declineStart ?: 0);
          $declineBlock = $declineStart !== false && $cancelStart !== false
              ? substr($actions, $declineStart, $cancelStart - $declineStart)
              : '';
          $assert(str_contains($declineBlock, "'invite_declined'")
              && str_contains($declineBlock, "'Приглашение отклонено'"),
              'The other participant must still receive the authoritative terminal notification.');

          $assert(str_contains($retired, "window.addEventListener('click', handleTerminalAction, true)")
              && !str_contains($shell, 'invite-terminal-actions-v110r12.js'),
              'The historical file may remain for rollback evidence but must not execute.');

          $assert(str_contains($entry, 'main-v110.js?v=1130')
              && str_contains($shell, 'game-invites-v110.js?v=1130'),
              'The D2 correction must be published through the v1130 ordinary Start graph.');

          fwrite(STDOUT, "ProductionV110InviteTerminalActionsR12ContractTest: {$assertions} assertions passed\n");
          '''
          contract = re.sub(r'^          ', '', contract, flags=re.M)
          write('bot/tests/ProductionV110InviteTerminalActionsR12ContractTest.php', contract)

          focused = r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static function (string $path) use ($root): string {
              $content = file_get_contents($root . '/' . $path);
              if (!is_string($content)) throw new RuntimeException('Cannot read ' . $path);
              return $content;
          };
          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $owner = $read('app/assets/js/games/game-invites-v110.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110r12.js');

          $assert(substr_count($shell, 'initGameInvites();') === 1
              && !str_contains($shell, 'initInviteTerminalActions'),
              'D2 must have one active invite action owner.');
          $assert(str_contains($owner, 'const terminalContext = terminalActionContext(button, action, token);')
              && str_contains($owner, 'const terminalInvite = terminalInviteResult('),
              'D2 must preserve the current surface and use the authoritative result.');
          $assert(str_contains($owner, 'terminalContext.notificationSurface')
              && str_contains($owner, 'showTerminalInvite(terminalInvite);'),
              'Both notification-card and standalone invite-sheet surfaces must transition in place.');
          $assert(str_contains($owner, "new CustomEvent('mgw:notification-sync'")
              && str_contains($owner, 'actions:[]')
              && str_contains($notifications, 'data-notification-type='),
              'The exact visible notification card must become a terminal card without duplication.');
          $assert(!str_contains($owner, "if (action === 'decline') toast('Приглашение отклонено.');"),
              'The actor must not receive a self-confirmation toast.');
          $assert(str_contains($shell, 'game-invites-v110.js?v=1130'),
              'D2 must publish a fresh immutable canonical owner.');

          fwrite(STDOUT, "ProductionMvp14D2TerminalCardInPlaceV1130Test: {$assertions} assertions passed\n");
          '''
          focused = re.sub(r'^          ', '', focused, flags=re.M)
          write('bot/tests/ProductionMvp14D2TerminalCardInPlaceV1130Test.php', focused)
          PY

      - name: Focused syntax and contracts
        shell: bash
        run: |
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/screens/notifications-screen-v110r12.js
          php -l bot/tests/ProductionV110InviteTerminalActionsR12ContractTest.php
          php -l bot/tests/ProductionMvp14D2TerminalCardInPlaceV1130Test.php
          php bot/tests/ProductionV110InviteTerminalActionsR12ContractTest.php
          php bot/tests/ProductionMvp14D2TerminalCardInPlaceV1130Test.php

      - name: Commit isolated D2 result
        shell: bash
        run: |
          rm .github/workflows/mvp14-d2-apply.yml
          git config user.name "manufact-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep terminal invitation cards in place"
          git push origin HEAD:agent/mvp14-d2-terminal-card-in-place-v1130

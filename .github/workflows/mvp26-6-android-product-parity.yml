name: MVP-26.6 Android Product Parity

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.well-known/assetlinks.json'
      - 'android-app/**'
      - 'bot/android-auth.php'
      - 'bot/support-attachment-download.php'
      - 'bot/helpers/validators.php'
      - 'bot/storage/JsonDatabase.php'
      - 'bot/invites.php'
      - 'bot/invite-opponents.php'
      - 'bot/social/SocialInviteGuard.php'
      - 'bot/tests/Mvp26_6AndroidParityCorrectiveTest.php'
      - 'app/assets/css/main.css'
      - 'app/assets/js/screens/game-screen-v102.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/v110.php'
      - '.github/workflows/mvp26-5-platform-adapters.yml'
      - '.github/workflows/mvp26-6-android-product-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-contract:
    name: Full Android product parity contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify MVP-26.6 ownership
        run: python3 android-app/tools/verify-product-parity.py

      - name: Verify accepted disabled adapters remain active
        run: python3 android-app/tools/verify-platform-adapters.py

      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l bot/android-auth.php
          php -l bot/support-attachment-download.php
          php -l bot/helpers/validators.php
          php -l bot/storage/JsonDatabase.php
          php -l bot/invites.php
          php -l bot/invite-opponents.php
          php -l app/v110.php
          php -l bot/social/SocialInviteGuard.php

      - name: Focused shared-product regressions
        run: |
          set -euo pipefail
          php bot/tests/Mvp18_4UniversalInviteLandingContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          php bot/tests/ProductionV110PendingInviteSearchNonBlockingRuntimeTest.php
          php bot/tests/InviteOpponentServiceTest.php
          php bot/tests/Mvp26_2AndroidDeviceAuthTest.php
          php bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php bot/tests/SupportTicketServiceTest.php
          php bot/tests/Mvp26_6AndroidParityCorrectiveTest.php

      - name: Frozen game/economy/tournament engine guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/games bot/ratings bot/tournaments bot/economy bot/ledger \
            app/assets/js/telegram/telegram-app.js \
            app/assets/js/games/game-invites-v110.js \
            app/assets/js/screens/home-screen.js \
            app/assets/js/games/tictactoe \
            app/assets/js/games/checkers \
            app/assets/js/games/chess \
            app/assets/js/games/reversi \
            app/assets/js/games/go \
            app/assets/js/games/four-in-a-row \
            app/assets/js/games/domino \
            app/assets/js/games/battleship \
            ':(exclude)app/assets/js/games/domino/renderer.js' \
            ':(exclude)app/assets/js/games/domino/renderer-cosmetics-v1.js' \
            ':(exclude)app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js' \
            ':(exclude)app/assets/js/games/domino/renderer-live-manual-v30.js' \
            ':(exclude)app/assets/js/games/battleship/renderer.js' \
            ':(exclude)app/assets/js/games/battleship/renderer-cosmetics-v1.js'

          battleship_engine_changes="$(git diff --name-only "$base" "$head" -- app/assets/js/games/battleship \
            | grep -Ev '^(app/assets/js/games/battleship/renderer\.js|app/assets/js/games/battleship/renderer-cosmetics-v1\.js)$' || true)"
          test -z "$battleship_engine_changes" || {
            printf 'Unexpected Battleship engine change outside localized presentation owners:\n%s\n' "$battleship_engine_changes" >&2
            exit 1
          }

          domino_engine_changes="$(git diff --name-only "$base" "$head" -- app/assets/js/games/domino \
            | grep -Ev '^(app/assets/js/games/domino/renderer\.js|app/assets/js/games/domino/renderer-cosmetics-v1\.js|app/assets/js/games/domino/renderer-cosmetics-corrective-v25\.js|app/assets/js/games/domino/renderer-live-manual-v30\.js)$' || true)"
          test -z "$domino_engine_changes" || {
            printf 'Unexpected Domino engine change outside localized presentation/cache owners:\n%s\n' "$domino_engine_changes" >&2
            exit 1
          }

          manifest_changes="$(git diff --unified=0 "$base" "$head" -- app/runtime/client/version-manifest.php \
            | grep -E '^[+-]' \
            | grep -Ev '^---|^\+\+\+' \
            | grep -Ev 'game-screen-v102\.js\?v=102|renderer-board-themes\.js\?v=1&mvp19_6=board-themes|store-screen\.js\?v=45&intent_base=1|assets/js/games/battleship/renderer\.js\?v=56|assets/js/games/domino/renderer\.js\?v=74|assets/js/profile/mgw-account-link-ui\.js\?v=3' || true)"
          test -z "$manifest_changes" || {
            printf 'Unexpected manifest change outside bounded active-owner cache-busts:\n%s\n' "$manifest_changes" >&2
            exit 1
          }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

  android-build:
    name: Android build/lint/unit current candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test lint and assemble
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify accepted package signing identity
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/mgw-mvp26-6-signing.txt
          grep -F 'CN=MGW Acceptance, O=Mini Games World, C=PL' /tmp/mgw-mvp26-6-signing.txt
          grep -Fi 'efda9b86b0b0edfaa22064864aaddc025f15bdc063bf53cfb58d569f504f5484' /tmp/mgw-mvp26-6-signing.txt

      - name: Upload current candidate APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-product-parity-current-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-product-parity-current-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

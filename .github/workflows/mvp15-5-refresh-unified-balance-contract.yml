name: MVP-15.5 refresh unified-balance contract

on:
  push:
    branches:
      - agent/mvp-15-5-normal-match-economy
    paths:
      - '.github/workflows/mvp15-5-refresh-unified-balance-contract.yml'

permissions:
  contents: write

jobs:
  refresh-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-5-normal-match-economy
          fetch-depth: 1
      - name: Refresh exact v110 successor cache contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ops/checks/verify-mvp15-3-unified-balance-owner.py')
          text = path.read_text(encoding='utf-8')
          old = "    './assets/js/screens/home-screen.js?v=75&mvp15=unified-balance',\n"
          new = "    './assets/js/screens/home-screen.js?v=76&mvp15=match-economy',\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one old v110 Home cache contract, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 ops/checks/verify-mvp15-3-unified-balance-owner.py
      - name: Commit contract successor
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name manufact-test
          git config user.email manufact.test@gmail.com
          git add ops/checks/verify-mvp15-3-unified-balance-owner.py
          git diff --cached --check
          git commit -m 'MVP-15.5: advance v110 unified-balance cache contract'
          git push origin HEAD:agent/mvp-15-5-normal-match-economy

name: D1 focused legacy contract refresh

on:
  pull_request:
    branches:
      - agent/mvp14-d1-rewrite-trigger-base

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refresh five stale expectations
        run: python tools/d1_refresh_legacy_contracts.py

      - name: Run only previously failed contracts
        run: |
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php bot/tests/ProductionMvp14D1FeedbackLinkEntrySheetTest.php
          php bot/tests/ProductionMvp14DeferredNotificationFirstFrameE2ETest.php
          php bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php
          php bot/tests/ProductionV96RootCauseStabilizationTest.php
          php bot/tests/ProductionMvp14D1CanonicalOwnersArchitectureTest.php
          php bot/tests/ProductionMvp14D1DeepLinkCanonicalTransitionTest.php

      - name: Commit refresh and remove temporary runner
        run: |
          rm -f tools/d1_refresh_legacy_contracts.py .github/workflows/d1-legacy-contract-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh legacy contracts for canonical D1 owners"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Agent v110 PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/v110-invite-notification-presence-regression-root'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply embedded root patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/agent-v110-root-fix.yml').read_text(encoding='utf-8')
          marker = "python3 <<'PY'\n"
          if marker not in source:
              raise SystemExit('Embedded patch marker not found')
          script = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(script), 'embedded-root-fix.py', 'exec'))
          Path('.github/workflows/agent-v110-pr-trigger.yml').unlink()
          PY

      - name: Validate focused roots
        shell: bash
        run: |
          set -euo pipefail
          php -l bot/api.php
          php -l bot/presence.php
          php -l bot/tests/ProductionV110InvitePresenceNotificationProfileRootContractTest.php
          php -l bot/tests/ProductionV110InviteNotificationSpeedContractTest.php
          php -l bot/tests/ProductionV110PvpResultNotificationRootContractTest.php
          php -l bot/tests/ProductionV110InviteNotificationPresenceRegressionContractTest.php
          node --check app/assets/js/components/sheet.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/screens/notifications-screen-v110-root.js
          php bot/tests/ProductionV110InvitePresenceNotificationProfileRootContractTest.php
          php bot/tests/ProductionV110InviteNotificationSpeedContractTest.php
          php bot/tests/ProductionV110PvpResultNotificationRootContractTest.php
          php bot/tests/ProductionV110InviteNotificationPresenceRegressionContractTest.php

      - name: Commit corrected roots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix invite notification and presence roots"
          git push origin HEAD:${{ github.head_ref }}

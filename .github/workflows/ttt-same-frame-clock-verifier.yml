name: Tic Tac Toe Same Frame Clock Verifier
on:
  push:
    branches: [agent/tictactoe-clock-e2e-contract-v6]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check e2e/staging/two-context.spec.mjs
          php bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
          php bot/tests/StagingE2eSourceFingerprintTest.php

name: MVP-16.1C focused route lifecycle gate

on:
  push:
    branches:
      - agent/mvp-16-1c-route-scoped-polling
    paths:
      - '.github/workflows/mvp16-1c-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-16-1c-route-scoped-polling
          fetch-depth: 1

      - name: Focused route-scoped polling contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/v110.php
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp161ClientBootstrapRouterTest.php
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/screens/search-screen-v102.js
          node --check app/assets/js/screens/game-screen-v102-safe.js
          node ops/checks/mvp16_1_router_lifecycle_contract.mjs
          node ops/checks/mvp16_1c_route_scoped_polling_contract.mjs
          php bot/tests/Mvp161ClientBootstrapRouterTest.php
          php bot/tests/Mvp156UnifiedZoneCutoverTest.php
          php bot/tests/Mvp156NotificationSemanticScrollTest.php
          php bot/tests/Mvp156BonusUxPolishTest.php
          python3 ops/checks/verify-mvp15-3-unified-balance-owner.py
          python3 scripts/ci/staging-runtime-fingerprint.py
          echo 'MVP16_1C_FOCUSED=PASS'

# rerun after all known successor-contract refreshes

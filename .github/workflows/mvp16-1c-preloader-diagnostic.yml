name: MVP-16.1C preloader diagnostic

on:
  push:
    branches:
      - agent/mvp-16-1c-preloader-regression-fix
    paths:
      - '.github/workflows/mvp16-1c-preloader-diagnostic.yml'

permissions:
  contents: read

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-13-2-staging
          fetch-depth: 1
      - name: Check live entry graph and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "STAGING=$(git rev-parse HEAD)"
          curl -fsS "${MGW_STAGING_ORIGIN}/app/v110.php" -o /tmp/v110.html
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          html=open('/tmp/v110.html',encoding='utf-8').read()
          m=re.search(r'<script type="importmap">\s*(\{.*?\})\s*</script>',html,re.S)
          assert m, 'importmap missing'
          data=json.loads(m.group(1))
          base='https://seashell-okapi-889488.hostingersite.com/app/'
          targets=[data['imports']['@mgw/clean-entry'],data['imports']['@mgw/main']]
          for k,v in data['imports'].items():
              if 'main-v110-handoff-shell' in k or 'search-screen-v102' in k or 'game-screen-v102-safe' in k or 'router.js?v=27' in k:
                  targets.append(v)
          for target in dict.fromkeys(targets):
              url=urllib.parse.urljoin(base,target)
              with urllib.request.urlopen(url,timeout=15) as r:
                  body=r.read()
                  print(r.status, len(body), url)
                  assert r.status==200 and len(body)>0
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME=${CHROME}"
          if [ -n "${CHROME}" ]; then
            set +e
            timeout 25s "${CHROME}" --headless --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --dump-dom "${MGW_STAGING_ORIGIN}/app/v110.php" >/tmp/dom.txt 2>/tmp/chrome.log
            rc=$?
            set -e
            echo "CHROME_RC=${rc}"
            grep -Ei "(Uncaught|SyntaxError|ReferenceError|TypeError|Failed to load module|net::ERR|import map|console)" /tmp/chrome.log | tail -n 120 || true
            echo '--- DOM preloader marker ---'
            grep -o 'id="preloader"[^>]*' /tmp/dom.txt | head -n 3 || true
          fi

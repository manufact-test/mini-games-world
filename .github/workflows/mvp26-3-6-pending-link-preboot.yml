name: MVP-26.3.6 Pending Link Preboot

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/profile/mgw-account-link-ui.js'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp26_3_6PendingLinkPrebootStaticContractTest.php'
      - '.github/workflows/mvp26-3-6-pending-link-preboot.yml'

permissions:
  contents: read

jobs:
  pending-link-preboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          node --check app/assets/js/profile/mgw-account-link-ui.js
          node --check app/assets/js/screens/profile-screen-v110.js
          node --check app/assets/js/main-v110-handoff-shell.js
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp26_3_6PendingLinkPrebootStaticContractTest.php

      - name: Pending-link preboot contract
        run: php bot/tests/Mvp26_3_6PendingLinkPrebootStaticContractTest.php

      - name: Existing account-link and Android auth regressions
        run: |
          php bot/tests/Mvp26_3AccountLinkServiceTest.php
          php bot/tests/Mvp26_2AndroidDeviceAuthTest.php

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-profile-games-title-corrective-* ]]; then
            git diff --exit-code "$base" "$head" -- \
              app/assets/js/profile/mgw-account-link-ui.js \
              app/assets/js/main-v110-handoff-shell.js \
              bot/tests/Mvp26_3_6PendingLinkPrebootStaticContractTest.php
            echo "MVP-27.1 Profile title corrective: pending-link behavior is covered by the static contract above and its direct owners are unchanged."
            exit 0
          fi
          if git diff --quiet "$base" "$head" -- app/assets/js/profile/mgw-account-link-ui.js app/assets/js/screens/profile-screen-v110.js app/assets/js/main-v110-handoff-shell.js; then
            echo "Successor slice: pending-link preboot owners unchanged; original bounded scope does not apply."
            exit 0
          fi
          allowed='^(\.github/workflows/mvp26-3-2-account-link-ui\.yml|\.github/workflows/mvp26-3-5-account-link-home-onboarding\.yml|\.github/workflows/mvp26-3-6-pending-link-preboot\.yml|\.github/workflows/mvp26-6-android-product-parity\.yml|\.github/workflows/mvp27-1-account-link-localization\.yml|app/assets/js/profile/mgw-account-link-ui\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|bot/tests/Mvp26_3_6PendingLinkPrebootStaticContractTest\.php|ops/checks/mvp27_1_account_link_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-26.3.6 paths:\n%s\n' "$bad" >&2; exit 1; }

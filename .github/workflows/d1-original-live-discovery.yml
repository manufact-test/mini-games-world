name: D1 original live discovery

on:
  pull_request:
    branches:
      - agent/mvp14-original-live-discovery-base2

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-13-2-staging
          fetch-depth: 0

      - name: Locate every staging Telegram launch URL owner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== FILES WITH WEB APP / START BUTTON LOGIC ==='
          git grep -l -I -E 'web_app|setChatMenuButton|reply_markup|inline_keyboard|Открыть игру|Запустить|UserWelcome|startapp|base_url' -- bot app ops config . 2>/dev/null | sort -u | head -300 || true

          echo '=== EXACT MATCHES ==='
          git grep -n -I -E 'web_app|setChatMenuButton|reply_markup|inline_keyboard|Открыть игру|Запустить|UserWelcome|startapp|base_url' -- bot app ops config . 2>/dev/null | head -1000 || true

          echo '=== PUBLIC URL LITERALS ==='
          git grep -h -I -Eo 'https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' -- bot app ops config . 2>/dev/null \
            | sed -E 's/["'"'"'<>),;]+$//' \
            | sort -u | head -300 || true

          echo '=== APP ENTRY REFERENCES ==='
          git grep -n -I -E '/app/|v114\.php|index\.html|DirectoryIndex' -- bot app ops config . 2>/dev/null | head -1000 || true

name: D1 original live discovery

on:
  pull_request:
    branches:
      - agent/mvp14-original-live-discovery-base2

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact live notification owner implementations
        shell: bash
        run: |
          set -Eeuo pipefail
          original='https://lemonchiffon-gerbil-545102.hostingersite.com/app/assets/js/screens/notifications-screen-v110r12.js?v=1122'
          staging='https://seashell-okapi-889488.hostingersite.com/app/assets/js/screens/notifications-screen-v99.js?v=d1-bell-single-owner'
          nonce="$(date +%s%N)"
          curl --fail-with-body --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${original}&focused_audit=${nonce}" -o original-notifications.js
          curl --fail-with-body --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${staging}&focused_audit=${nonce}" -o staging-notifications.js

          echo '=== ORIGINAL LINES 1-175 ==='
          nl -ba original-notifications.js | sed -n '1,175p'
          echo '=== ORIGINAL LINES 430-530 ==='
          nl -ba original-notifications.js | sed -n '430,530p'
          echo '=== STAGING LINES 1-180 ==='
          nl -ba staging-notifications.js | sed -n '1,180p'
          echo '=== STAGING LINES 340-430 ==='
          nl -ba staging-notifications.js | sed -n '340,430p'

          echo '=== FOCUSED FUNCTION NAMES ==='
          grep -nE 'function handlePointerDown|function handleDocumentClick|function handleNotificationBellActivation|function handleNotificationToastActivation|lastBell|suppress|pointer' original-notifications.js staging-notifications.js | head -200

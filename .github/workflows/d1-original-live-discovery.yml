name: D1 original live discovery

on:
  pull_request:
    branches:
      - agent/mvp14-original-live-discovery-base2

concurrency:
  group: d1-original-live-discovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for and verify the exact deployed Start graph
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://seashell-okapi-889488.hostingersite.com'
          production='https://lemonchiffon-gerbil-545102.hostingersite.com'
          ok=0
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-${attempt}"
            rm -f entry.html main.js shell.js notifications.js production-notifications.js
            if curl --fail-with-body --silent --show-error --location \
              --connect-timeout 8 --max-time 20 \
              --header 'Cache-Control: no-cache' \
              "${origin}/app/v110.php?v=1123&verify=${nonce}" -o entry.html; then
              if grep -Fq './assets/js/main-v110.js?v=1125' entry.html; then
                curl --fail-with-body --silent --show-error --location \
                  --connect-timeout 8 --max-time 20 \
                  "${origin}/app/assets/js/main-v110.js?v=1125" -o main.js
                curl --fail-with-body --silent --show-error --location \
                  --connect-timeout 8 --max-time 20 \
                  "${origin}/app/assets/js/main-v110-handoff-shell.js?v=1125" -o shell.js
                curl --fail-with-body --silent --show-error --location \
                  --connect-timeout 8 --max-time 20 \
                  "${origin}/app/assets/js/screens/notifications-screen-v110r12.js?v=1125" -o notifications.js
                curl --fail-with-body --silent --show-error --location \
                  --connect-timeout 8 --max-time 20 \
                  "${production}/app/assets/js/screens/notifications-screen-v110r12.js?v=1122" -o production-notifications.js

                grep -Fq "import './main-v110-handoff-shell.js?v=1125';" main.js
                grep -Fq "./screens/notifications-screen-v110r12.js?v=1125" shell.js
                grep -Fq "document.addEventListener('pointerdown', handlePointerDown, true);" notifications.js
                grep -Fq "document.addEventListener('click', handleDocumentClick, true);" notifications.js
                grep -Fq "const bell = target.closest('#notificationsOpen');" notifications.js
                cmp -s notifications.js production-notifications.js

                echo "Exact Start graph 1125 verified on attempt ${attempt}."
                sha256sum notifications.js production-notifications.js
                ok=1
                break
              fi
            fi
            sleep 20
          done
          test "$ok" = '1'

name: TMP runtime invite repository history test patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/staging-invite-history-test-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-history-test-recovery
          fetch-depth: 0
      - name: Apply exact test patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-runtime-invite-repository-history-test-patch.py
          php -l bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          git diff --check
      - name: Commit test update only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/tests/RuntimeInviteRepositoryTest.php
          if git diff --cached --quiet; then
            echo 'Test patch already applied.'
            exit 0
          fi
          git commit -m 'Tests: split staging reconciliation from production strict parity'
          git push origin HEAD:agent/staging-invite-history-test-recovery

name: MVP-27.2.1 English Shell and Home

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/locales/en.json'
      - 'app/locales/ru.json'
      - 'app/locales/manifest.json'
      - 'ops/checks/mvp27_2_1_english_shell_home_contract.mjs'
      - '.github/workflows/mvp27-2-english-shell-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-shell-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: English Shell/Home contract
        run: |
          set -euo pipefail
          node --check ops/checks/mvp27_2_1_english_shell_home_contract.mjs
          node ops/checks/mvp27_2_1_english_shell_home_contract.mjs

      - name: Preserve localization architecture
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
          node ops/checks/mvp27_1_localization_architecture_contract.mjs

      - name: Preserve zero-debt Russian active owners
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded MVP-27.2.1 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/locales/en\.json|ops/checks/mvp27_2_1_english_shell_home_contract\.mjs|\.github/workflows/mvp27-2-english-shell-home\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-27.2.1 paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: TECH ONLY — apply notification read generation

on:
  push:
    branches:
      - agent/mvp14-notification-read-generation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-notification-read-generation
          fetch-depth: 1

      - name: Apply exact notification read-order correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/assets/js/screens/notifications-screen-v110r12.js')
          text = path.read_text(encoding='utf-8')

          old = """let pollTimer = null;
          let refreshPromise = null;
          let unreadHint = 0;
          """
          new = """let pollTimer = null;
          let refreshPromise = null;
          let notificationReadGeneration = 0;
          let unreadHint = 0;
          """
          if text.count(old) != 1:
              raise SystemExit('notification read declaration anchor mismatch')
          text = text.replace(old, new, 1)

          old = """async function refreshOpenSheet(generation){
            try {
              const result = await rawNotifications(false);
              const serverItems = normalizeItems(result?.items);
              mergeServerItems(serverItems);
              baselineLoaded = true;

              if (!isCurrentSheet(generation)) {
                setUnreadCount(Number(result?.unread_count || 0));
                return;
              }

              const visible = visibleSheetItems();
              renderNotifications(visible);
              rememberAnnouncedItems(visible);
              markVisibleReadLocally();
              setUnreadCount(0);
              void rawNotifications(true).catch(() => null);
            } catch (error) {
              if (isCurrentSheet(generation) && !visibleSheetItems().length) renderError();
            }
          }
          """
          new = """async function refreshOpenSheet(generation){
            const read = beginNotificationRead();
            try {
              const result = await read.promise;
              if (!isLatestNotificationRead(read.generation)) return;

              const serverItems = normalizeItems(result?.items);
              mergeServerItems(serverItems);
              baselineLoaded = true;

              if (!isCurrentSheet(generation)) {
                setUnreadCount(Number(result?.unread_count || 0));
                return;
              }

              const visible = visibleSheetItems();
              renderNotifications(visible);
              rememberAnnouncedItems(visible);
              markVisibleReadLocally();
              setUnreadCount(0);
              void rawNotifications(true).catch(() => null);
            } catch (error) {
              if (!isLatestNotificationRead(read.generation)) return;
              if (isCurrentSheet(generation) && !visibleSheetItems().length) renderError();
            }
          }
          """
          if text.count(old) != 1:
              raise SystemExit('refreshOpenSheet anchor mismatch')
          text = text.replace(old, new, 1)

          old = """async function refreshNotifications({ announce = false } = {}){
            if (refreshPromise) return refreshPromise;

            refreshPromise = (async () => {
              try {
                const result = await rawNotifications(false);
                const serverItems = normalizeItems(result?.items);
                mergeServerItems(serverItems);
                const unreadCount = Number(result?.unread_count || 0);

                if (isNotificationsSheetOpen()) {
                  renderNotifications(visibleSheetItems());
                  markVisibleReadLocally();
                  setUnreadCount(0);
                  return;
                }

                setUnreadCount(unreadCount);
                if (!baselineLoaded || !announce || !appReady) {
                  rememberAnnouncedItems(serverItems);
                  baselineLoaded = true;
                  return;
                }

                const next = nextUnannouncedItem(currentItems());
                if (next && showToast(next)) rememberAnnouncedId(next.id);
              } catch (error) {
                // Keep the most recent locally authoritative notification state.
              }
            })();

            try {
              return await refreshPromise;
            } finally {
              refreshPromise = null;
            }
          }
          """
          new = """async function refreshNotifications({ announce = false } = {}){
            if (refreshPromise) return refreshPromise;

            refreshPromise = (async () => {
              const read = beginNotificationRead();
              try {
                const result = await read.promise;
                if (!isLatestNotificationRead(read.generation)) return;

                const serverItems = normalizeItems(result?.items);
                mergeServerItems(serverItems);
                const unreadCount = Number(result?.unread_count || 0);

                if (isNotificationsSheetOpen()) {
                  renderNotifications(visibleSheetItems());
                  markVisibleReadLocally();
                  setUnreadCount(0);
                  return;
                }

                setUnreadCount(unreadCount);
                if (!baselineLoaded || !announce || !appReady) {
                  rememberAnnouncedItems(serverItems);
                  baselineLoaded = true;
                  return;
                }

                const next = nextUnannouncedItem(currentItems());
                if (next && showToast(next)) rememberAnnouncedId(next.id);
              } catch (error) {
                // Keep the most recent locally authoritative notification state.
              }
            })();

            try {
              return await refreshPromise;
            } finally {
              refreshPromise = null;
            }
          }
          """
          if text.count(old) != 1:
              raise SystemExit('refreshNotifications anchor mismatch')
          text = text.replace(old, new, 1)

          anchor = """async function rawNotifications(markRead){
          """
          helper = """function beginNotificationRead(){
            const generation = ++notificationReadGeneration;
            return {
              generation,
              promise:rawNotifications(false),
            };
          }

          function isLatestNotificationRead(generation){
            return Number(generation) === notificationReadGeneration;
          }

          async function rawNotifications(markRead){
          """
          if text.count(anchor) != 1:
              raise SystemExit('rawNotifications anchor mismatch')
          text = text.replace(anchor, helper, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > bot/tests/ProductionMvp14NotificationReadGenerationContractTest.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $source = file_get_contents($root . '/app/assets/js/screens/notifications-screen-v110r12.js');
          if (!is_string($source)) throw new RuntimeException('Cannot read canonical notification screen.');

          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $assert(str_contains($source, 'let notificationReadGeneration = 0;'),
              'The canonical notification owner must track issued read generations.');
          $assert(substr_count($source, 'const read = beginNotificationRead();') === 2,
              'Background refresh and open-sheet refresh must both issue ordered reads.');
          $assert(substr_count($source, 'if (!isLatestNotificationRead(read.generation)) return;') >= 2,
              'Stale reads must be rejected before merging or rendering.');
          $assert(str_contains($source, 'promise:rawNotifications(false)'),
              'Generation ordering must wrap the existing authoritative unread-preserving request.');
          $assert(str_contains($source, 'void rawNotifications(true).catch(() => null);'),
              'The separate authoritative mark-read request must remain unchanged.');
          $assert(!str_contains($source, 'setTimeout(() => renderNotifications'),
              'The correction must not hide the race with a presentation timer.');

          fwrite(STDOUT, 'ProductionMvp14NotificationReadGenerationContractTest: '
              . $assertions . " assertions passed\n");
          PHP

          cat > e2e/staging/notification-aged-overlap.spec.mjs <<'JS'
          import { test, expect } from '@playwright/test';
          import { STAGING_ORIGIN, APP_ROUTE } from './support/d3-shared-config.mjs';
          import {
            authorizeContext,
            openPlayerPage,
            revokeContext,
          } from './support/d3-shared-context.mjs';

          const NOTIFICATIONS_ROUTE = `${STAGING_ORIGIN}/bot/notifications.php`;

          function payload(item = null) {
            return {
              ok: true,
              items: item ? [item] : [],
              unread_count: item ? 1 : 0,
            };
          }

          test('aged background notification read cannot paint false empty over a newer bell read', async ({ browser }) => {
            test.setTimeout(90_000);
            let context;
            let player;
            let mode = 'initial';
            let initialReads = 0;
            const pending = [];
            const item = {
              id: 'staging_notification_generation_item',
              type: 'invite_cancelled',
              title: 'Приглашение отменено',
              message: 'Матч не начался.',
              tone: 'warning',
              invite_token: 'generation_test_token',
              invite_status: 'cancelled',
              invite_is_owner: false,
              actions: [],
              created_at: new Date().toISOString(),
              read: false,
            };

            try {
              context = await browser.newContext({
                locale: 'ru-RU',
                timezoneId: 'Europe/Vilnius',
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true,
              });
              await authorizeContext(context, 'A');

              await context.route(NOTIFICATIONS_ROUTE, async route => {
                let markRead = false;
                try {
                  markRead = Boolean(route.request().postDataJSON()?.markRead);
                } catch {}

                if (mode === 'initial') {
                  initialReads += 1;
                  await route.fulfill({
                    status: 200,
                    contentType: 'application/json',
                    body: JSON.stringify(payload()),
                  });
                  return;
                }

                if (markRead) {
                  await route.fulfill({
                    status: 200,
                    contentType: 'application/json',
                    body: JSON.stringify(payload(item)),
                  });
                  return;
                }

                if (pending.length < 2) {
                  pending.push(route);
                  return;
                }

                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify(payload(item)),
                });
              });

              player = await openPlayerPage(context, 'A', APP_ROUTE);
              await expect.poll(() => initialReads, {
                timeout: 20_000,
                message: 'Initial empty notification baseline must load',
              }).toBeGreaterThan(0);
              await player.page.waitForTimeout(500);
              mode = 'race';

              await player.page.evaluate(() => {
                document.dispatchEvent(new CustomEvent('mgw:notifications-refresh'));
              });
              await expect.poll(() => pending.length, {
                timeout: 10_000,
                message: 'The aged background notification read must be pending',
              }).toBe(1);

              await player.page.evaluate(() => {
                const frames = [];
                const sheet = document.getElementById('sheet');
                const capture = () => frames.push({
                  active: document.getElementById('sheetOverlay')?.classList.contains('active') === true,
                  empty: String(sheet?.querySelector('.notifications-empty strong')?.textContent || '').trim(),
                  loading: sheet?.querySelector('.notifications-loading') !== null,
                  ids: Array.from(sheet?.querySelectorAll('[data-notification-id]') || [])
                    .map(node => String(node.getAttribute('data-notification-id') || '')),
                });
                const observer = new MutationObserver(capture);
                observer.observe(sheet, { childList:true, subtree:true, characterData:true });
                window.__MGW_NOTIFICATION_GENERATION_FRAMES__ = frames;
                window.__MGW_NOTIFICATION_GENERATION_OBSERVER__ = observer;
                capture();
              });

              await player.page.locator('#notificationsOpen').click();
              await expect(player.page.locator('#sheet .sheet-head h2')).toHaveText('Уведомления');
              await expect.poll(() => pending.length, {
                timeout: 10_000,
                message: 'The newer bell notification read must be pending',
              }).toBe(2);
              await expect(player.page.locator('#sheet .notifications-loading')).toBeVisible();

              await pending[0].fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(payload()),
              });
              await player.page.waitForTimeout(250);
              await expect(player.page.locator('#sheet .notifications-empty')).toHaveCount(0);
              await expect(player.page.locator('#sheet .notifications-loading')).toBeVisible();

              await pending[1].fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(payload(item)),
              });
              await expect(player.page.locator(
                `[data-notification-id="${item.id}"]`,
              )).toBeVisible({ timeout: 15_000 });

              const frames = await player.page.evaluate(() => {
                window.__MGW_NOTIFICATION_GENERATION_OBSERVER__?.disconnect?.();
                return window.__MGW_NOTIFICATION_GENERATION_FRAMES__ || [];
              });
              const visibleFrames = frames.filter(frame => frame.active);
              expect(visibleFrames.some(frame => /Пока уведомлений нет/i.test(frame.empty))).toBe(false);
              expect(visibleFrames.some(frame => frame.ids.includes(item.id))).toBe(true);

              expect(player.diagnostics.pageErrors).toEqual([]);
              expect(player.diagnostics.failedRequests).toEqual([]);
              expect(player.diagnostics.serverErrors).toEqual([]);
            } finally {
              if (context) {
                await revokeContext(context);
                await context.close();
              }
            }
          });
          JS

          rm .github/workflows/tech-apply-notification-read-generation.yml

      - name: Commit exact task result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/js/screens/notifications-screen-v110r12.js \
            bot/tests/ProductionMvp14NotificationReadGenerationContractTest.php \
            e2e/staging/notification-aged-overlap.spec.mjs \
            .github/workflows/tech-apply-notification-read-generation.yml
          git commit -m 'MVP-14: reject stale notification reads after newer bell opens'
          git push origin HEAD:agent/mvp14-notification-read-generation

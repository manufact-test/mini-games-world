name: MVP-15.5 apply runtime wiring

on:
  push:
    branches:
      - agent/mvp-15-5-normal-match-economy
    paths:
      - '.github/workflows/mvp15-5-apply-runtime-wiring.yml'

permissions:
  contents: write

jobs:
  apply-focused-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-5-normal-match-economy
          fetch-depth: 1
      - name: Apply accepted v110 ownership wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/assets/js/main-v110-handoff-shell.js',
              "    setRoom(APP_CONFIG.defaultRoom);\n    const statsTicket = beginStatsRequest('api');\n    const result = await api.bootstrap();\n    const mgwProfileResult = await api.mgwProfile();\n",
              "    const statsTicket = beginStatsRequest('api');\n"
              "    const result = await api.bootstrap();\n"
              "    const matchEntryCost = Number(result.match_economy?.entry_cost);\n"
              "    if (!Number.isFinite(matchEntryCost) || matchEntryCost <= 0) {\n"
              "      throw new Error('Серверная стоимость участия недоступна.');\n"
              "    }\n"
              "    APP_CONFIG.matchBet = matchEntryCost;\n"
              "    state.selectedBet = matchEntryCost;\n"
              "    setRoom(APP_CONFIG.defaultRoom);\n"
              "    const mgwProfileResult = await api.mgwProfile();\n"
          )

          replace_once(
              'app/v110.php',
              '    "./assets/js/state.js?v=27": "./assets/js/state.js?v=28&mvp15=unified-profile",\n',
              '    "./assets/js/config.js?v=38": "./assets/js/config.js?v=39&mvp15=match-economy",\n'
              '    "./assets/js/state.js?v=27": "./assets/js/state.js?v=29&mvp15=match-economy",\n'
          )
          replace_once(
              'app/v110.php',
              '    "./assets/js/screens/home-screen.js?v=74": "./assets/js/screens/home-screen.js?v=75&mvp15=unified-balance",\n',
              '    "./assets/js/screens/home-screen.js?v=74": "./assets/js/screens/home-screen.js?v=76&mvp15=match-economy",\n'
          )
          replace_once(
              'app/v110.php',
              '    "./assets/js/main-v110-handoff-shell.js?v=1137&ux=1&sk=3&icons=c1efd5af&render=5": "./assets/js/main-v110-handoff-shell.js?v=1139&mvp15=unified-balance",\n',
              '    "./assets/js/main-v110-handoff-shell.js?v=1137&ux=1&sk=3&icons=c1efd5af&render=5": "./assets/js/main-v110-handoff-shell.js?v=1140&mvp15=match-economy",\n'
          )
          replace_once(
              'app/v110.php',
              "    'unified_home_cache' => './assets/js/screens/home-screen.js?v=75&mvp15=unified-balance',\n",
              "    'match_config_cache' => './assets/js/config.js?v=39&mvp15=match-economy',\n"
              "    'match_state_cache' => './assets/js/state.js?v=29&mvp15=match-economy',\n"
              "    'unified_home_cache' => './assets/js/screens/home-screen.js?v=76&mvp15=match-economy',\n"
              "    'match_shell_cache' => './assets/js/main-v110-handoff-shell.js?v=1140&mvp15=match-economy',\n"
          )
          replace_once(
              'app/v110.php',
              "header('X-MGW-Balance-UI: unified-balance-v1');\n",
              "header('X-MGW-Balance-UI: unified-balance-v1');\n"
              "header('X-MGW-Match-Economy: server-config-v1');\n"
          )

          replace_once(
              'bot/helpers/staging-e2e-runtime-files.txt',
              'app/assets/js/state.js\napp/assets/js/ui.js\n',
              'app/assets/js/state.js\napp/assets/js/config.js\napp/assets/js/ui.js\n'
          )
          replace_once(
              'bot/helpers/staging-e2e-runtime-files.txt',
              'bot/services/NotificationService.php\n\n# MVP-15.8 single server-side economy configuration owner.',
              'bot/services/NotificationService.php\n\n'
              '# MVP-15.5 canonical normal-match activation. The adapter projects the current\n'
              '# versioned server economy config into the accepted legacy executors; the real\n'
              '# Telegram v110 shell and client config must deploy in the same exact tree.\n'
              'bot/economy/MatchEconomyRuntimeConfig.php\n\n'
              '# MVP-15.8 single server-side economy configuration owner.'
          )
          PY

      - name: Commit accepted-route wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name manufact-test
          git config user.email manufact.test@gmail.com
          git add app/v110.php app/assets/js/main-v110-handoff-shell.js bot/helpers/staging-e2e-runtime-files.txt
          git diff --cached --check
          git commit -m 'MVP-15.5: wire canonical Match price into v110 entry'
          git push origin HEAD:agent/mvp-15-5-normal-match-economy

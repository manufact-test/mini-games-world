name: MVP-27.1 Legacy Tic-Tac-Toe Entry Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v99.php'
      - 'app/v100.php'
      - 'app/v101.php'
      - 'app/v102.php'
      - 'app/v103.php'
      - 'app/v104.php'
      - 'app/v105.php'
      - 'app/v106.php'
      - 'app/v107.php'
      - 'app/v108.php'
      - 'app/v109.php'
      - 'app/v110.php'
      - 'app/v120.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/main*.js'
      - 'app/assets/js/games/tictactoe/entry.js'
      - 'app/assets/js/games/tictactoe/meta.js'
      - 'app/assets/js/games/game-card-copy.js'
      - 'app/assets/js/games/unified-game-launcher.js'
      - 'ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-legacy-tictactoe-entry-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-tictactoe-entry-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and exhaustive reachability proof
        run: |
          set -euo pipefail
          node --check app/assets/js/games/tictactoe/entry.js
          node --check app/assets/js/games/tictactoe/meta.js
          node --check ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract.mjs
          node ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract.mjs

      - name: Preserve active Tic-Tac-Toe ownership
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_game_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-legacy-tictactoe-entry-reachability')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_legacy_tictactoe_entry_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-legacy-tictactoe-entry-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected legacy Tic-Tac-Toe entry reachability paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

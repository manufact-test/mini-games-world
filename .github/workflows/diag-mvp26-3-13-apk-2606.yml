name: DIAG MVP-26.3.13 Android APK 2606
# staging-only installable candidate

on:
  push:
    branches:
      - diag/mvp26-3-13-apk-2606-v1

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare installable diagnostic version
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/versionCode 2604/versionCode 2606/" app/build.gradle
          sed -i "s/versionName '0.26.3.4-orientation-lifecycle'/versionName '0.26.3.6-restored-webview-handoff'/" app/build.gradle
          grep -F "versionCode 2606" app/build.gradle
          grep -F "versionName '0.26.3.6-restored-webview-handoff'" app/build.gradle

      - name: Test lint assemble staging APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify package and signing
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          aapt2="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$aapt2" dump badging "$apk" | tee /tmp/mgw-apk-badging.txt
          grep -F "package: name='com.minigamesworld.app.acceptance' versionCode='2606'" /tmp/mgw-apk-badging.txt
          "$apksigner" verify --print-certs "$apk" | tee /tmp/mgw-apk-signing.txt
          grep -F 'CN=MGW Acceptance, O=Mini Games World, C=PL' /tmp/mgw-apk-signing.txt

      - name: Upload installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-3-13-restored-handoff-v2606-staging-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: MVP-26.3.7 Linked-Retired Zero Balance

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/economy/UnifiedEconomyRuntimeSyncService.php'
      - 'bot/tests/UnifiedEconomyRuntimeSyncTest.php'
      - 'bot/tests/Mvp26_3AccountLinkServiceTest.php'
      - '.github/workflows/mvp26-3-7-linked-retired-zero-balance.yml'

permissions:
  contents: read

jobs:
  linked-retired-zero-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/economy/UnifiedEconomyRuntimeSyncService.php
          php -l bot/tests/UnifiedEconomyRuntimeSyncTest.php
          php -l bot/tests/Mvp26_3AccountLinkServiceTest.php

      - name: Unified economy runtime regression
        run: php bot/tests/UnifiedEconomyRuntimeSyncTest.php

      - name: Account-link retirement regression
        run: php bot/tests/Mvp26_3AccountLinkServiceTest.php

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp26-3-7-linked-retired-zero-balance\.yml|bot/economy/UnifiedEconomyRuntimeSyncService\.php|bot/tests/UnifiedEconomyRuntimeSyncTest\.php)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-26.3.7 paths:\n%s\n' "$bad" >&2; exit 1; }

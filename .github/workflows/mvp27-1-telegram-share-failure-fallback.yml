name: MVP-27.1 Telegram Share Failure Fallback

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_telegram_share_failure_fallback_contract.mjs'
      - '.github/workflows/mvp27-1-telegram-share-failure-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-share-failure-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Syntax and focused Share contracts
        run: |
          set -euo pipefail
          node --check app/assets/js/games/game-invites-v110.js
          php -l app/runtime/client/version-manifest.php
          node --check ops/checks/mvp27_1_telegram_share_failure_fallback_contract.mjs
          node ops/checks/mvp27_1_telegram_share_failure_fallback_contract.mjs
          node ops/checks/mvp27_1_game_invites_localization_contract.mjs
          php bot/tests/ProductionV110CanonicalShareNotificationRootContractTest.php
          php bot/tests/ProductionV110InviteActionsRootContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

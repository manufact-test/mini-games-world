name: TMP Phase B loader whitespace normalization

on:
  push:
    branches:
      - agent/e2e-phase-b-loader-whitespace-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e2e-phase-b-loader-whitespace-normalization
          fetch-depth: 0

      - name: Apply exact E2E owner fix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/staging/phase-b-all-games-loader.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = "        expect(trace.some(entry => entry.game === game.title)).toBe(true);"
          new = "        expect(trace.some(entry => String(entry.game).replace(/\\s+/gu, ' ').trim() === String(game.title).replace(/\\s+/gu, ' ').trim())).toBe(true);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one title assertion anchor, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check e2e/staging/phase-b-all-games-loader.spec.mjs
          git diff --check
          git diff -- e2e/staging/phase-b-all-games-loader.spec.mjs

      - name: Commit exact E2E patch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/staging/phase-b-all-games-loader.spec.mjs
          git commit -m 'E2E: normalize loader game-title whitespace'
          git push origin HEAD:agent/e2e-phase-b-loader-whitespace-normalization

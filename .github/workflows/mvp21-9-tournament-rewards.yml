name: MVP-21.9 Tournament rewards and terminal results

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp21-9-tournament-rewards.yml'
      - 'bot/database/migrations/20260922_0057_create_tournament_results_rewards.php'
      - 'bot/tournaments/TournamentSettlementService.php'
      - 'bot/tournaments/TournamentRewardProjectionService.php'
      - 'bot/profile-v2.php'
      - 'bot/ratings/RatingArchiveService.php'
      - 'app/assets/js/state.js'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/ui.js'
      - 'app/assets/js/screens/game-screen-v102.js'
      - 'app/assets/css/components/mgw-tournament-honors.css'
      - 'app/index.html'
      - 'bot/helpers/response.php'
      - 'bot/tests/GamePublicIdentityResponseProjectionTest.php'
      - 'bot/tests/Mvp21_9TournamentRewardProjectionTest.php'
      - 'bot/tests/Mvp21_9TournamentProductProjectionContractTest.php'
      - 'bot/tournaments/StagingTournamentManualAcceptanceService.php'
      - 'bot/core/bootstrap.php'
      - 'bot/api.php'
      - 'app/assets/js/screens/tournaments-screen-v1.js'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp21_9TournamentSettlementTest.php'
      - 'bot/tests/Mvp21_9TerminalUxContractTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp21-9-rewards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Settlement, terminal UX and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint MVP-21.9 slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/database/migrations/20260922_0057_create_tournament_results_rewards.php
            bot/tournaments/TournamentSettlementService.php
            bot/tournaments/TournamentRewardProjectionService.php
            bot/tournaments/StagingTournamentManualAcceptanceService.php
            bot/profile-v2.php
            bot/ratings/RatingArchiveService.php
            bot/core/bootstrap.php
            bot/api.php
            bot/tests/Mvp21_9TournamentSettlementTest.php
            bot/tests/Mvp21_9TerminalUxContractTest.php
            bot/tests/Mvp21_9TournamentRewardProjectionTest.php
            bot/tests/Mvp21_9TournamentProductProjectionContractTest.php
            bot/tests/GamePublicIdentityResponseProjectionTest.php
            bot/helpers/response.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check app/assets/js/screens/tournaments-screen-v1.js
          node --check app/assets/js/screens/profile-screen-v110.js
          node --check app/assets/js/screens/game-screen-v102.js
          node --check app/assets/js/ui.js
          node --check app/assets/js/state.js

      - name: Run MVP-21.9 settlement and terminal UX
        run: |
          php bot/tests/Mvp21_9TournamentSettlementTest.php
          php bot/tests/Mvp21_9TerminalUxContractTest.php
          php bot/tests/Mvp21_9TournamentRewardProjectionTest.php
          php bot/tests/Mvp21_9TournamentProductProjectionContractTest.php
          php bot/tests/GamePublicIdentityResponseProjectionTest.php

      - name: Preserve rating Profile and archive owners
        run: |
          php bot/tests/Mvp20_7RatingArchiveTest.php
          php bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php

      - name: Preserve tournament registration and ledger reservation semantics
        run: |
          php bot/tests/Mvp21_1TournamentRegistrationTest.php
          php bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php
          php bot/tests/Mvp21_1TournamentReservationRuntimeCompatibilityTest.php

      - name: Preserve tournament Hall, Ready and progression owners
        run: |
          php bot/tests/Mvp21_4TournamentHallBracketTest.php
          php bot/tests/Mvp21_4TournamentHallUxContractTest.php
          php bot/tests/Mvp21_5TournamentMatchReadinessTest.php
          php bot/tests/Mvp21_5TournamentReadyUxContractTest.php
          php bot/tests/Mvp21_6TournamentRoundProgressionTest.php
          php bot/tests/Mvp21_6TournamentRuntimeContractTest.php
          php bot/tests/Mvp21_6TournamentProgressionUxContractTest.php
          php bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php

      - name: Preserve all-game runtime baseline
        run: |
          php bot/tests/Mvp167AllGamesRegressionContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php
          php bot/tests/Mvp14r2GamesContractTest.php

      - name: Guard MVP-21.9 scope and frozen game engines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp21-5-tournament-ready.yml|\
              .github/workflows/mvp20-7-rating-archives.yml|\
              .github/workflows/mvp21-6-tournament-rounds.yml|\
              .github/workflows/mvp21-7-tournament-technical-outcomes.yml|\
              .github/workflows/mvp21-8-tournament-cancellation.yml|\
              bot/database/migrations/20260922_0059_add_tournament_cancellation_emergency.php|\
              bot/tournaments/TournamentCancellationService.php|\
              bot/tournaments/TournamentRegistrationService.php|\
              bot/admin-tournaments.php|\
              bot/tournament-status.php|\
              app/admin.php|\
              app/assets/js/admin-tournaments.js|\
              bot/tests/Mvp21_8TournamentCancellationTest.php|\
              bot/tests/Mvp21_8TournamentCancellationUxContractTest.php|\
              bot/database/migrations/20260922_0058_add_tournament_technical_outcomes.php|\
              bot/services/ReconnectLifecycleService.php|\
              bot/tests/Mvp21_7TournamentTechnicalOutcomesTest.php|\
              .github/workflows/mvp21-10-tournament-prize-review.yml|\
              .github/workflows/mvp21-11-tournament-release-proof.yml|\
              bot/database/migrations/20260922_0060_create_tournament_prize_review.php|\
              bot/tournaments/TournamentPrizeReviewService.php|\
              bot/tests/Mvp21_10TournamentPrizeReviewTest.php|\
              bot/tests/Mvp21_10TournamentPrizeReviewContractTest.php|\
              app/assets/css/admin-shell.css|\
              .github/workflows/mvp21-9-tournament-rewards.yml|\
              .github/workflows/mvp19-6-checkers-boards.yml|\
              bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs|\
              bot/database/migrations/20260922_0057_create_tournament_results_rewards.php|\
              bot/tournaments/TournamentSettlementService.php|\
              bot/tournaments/TournamentRewardProjectionService.php|\
              bot/tournaments/StagingTournamentManualAcceptanceService.php|\
              bot/profile-v2.php|\
              bot/ratings/RatingArchiveService.php|\
              app/assets/js/state.js|\
              app/assets/js/api/client.js|\
              app/assets/js/main-v110-handoff-shell.js|\
              app/assets/js/screens/profile-screen-v110.js|\
              app/assets/js/ui.js|\
              app/assets/js/screens/game-screen-v102.js|\
              app/assets/css/components/mgw-tournament-honors.css|\
              app/index.html|\
              bot/helpers/response.php|\
              bot/tests/GamePublicIdentityResponseProjectionTest.php|\
              bot/core/bootstrap.php|\
              bot/api.php|\
              app/assets/js/screens/tournaments-screen-v1.js|\
              app/assets/css/main.css|\
              app/runtime/client/version-manifest.php|\
              bot/tests/Mvp21_9TournamentSettlementTest.php|\
              bot/tests/Mvp21_9TerminalUxContractTest.php|\
              bot/tests/Mvp21_9TournamentRewardProjectionTest.php|\
              bot/tests/Mvp21_9TournamentProductProjectionContractTest.php|\
              bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php|\
              bot/tests/Mvp21_5_6CorrectiveV7ContractTest.php|\
              bot/tests/Mvp21_6TournamentRoundProgressionTest.php|\
              bot/tournaments/TournamentRoundProgressionService.php)
                ;;
              # Manual acceptance coordinated UI corrective
              .github/workflows/mvp21-5-tournament-ready.yml|\
              .github/workflows/mvp21-6-tournament-rounds.yml|\
              .github/workflows/mvp21-7-tournament-technical-outcomes.yml|\
              .github/workflows/mvp21-8-tournament-cancellation.yml|\
              .github/workflows/mvp21-9-tournament-rewards.yml|\
              .github/workflows/mvp21-10-tournament-prize-review.yml|\
              app/assets/css/main.css|\
              app/assets/js/screens/game-screen-v102.js|\
              app/assets/js/screens/tournaments-screen-v1.js|\
              app/runtime/client/version-manifest.php|\
              bot/tests/Mvp21_5TournamentReadyUxContractTest.php|\
              bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php|\
              bot/tests/Mvp21_6TournamentProgressionUxContractTest.php|\
              bot/tests/Mvp21_8CorrectiveContractTest.php|\
              bot/tests/Mvp21_8TournamentCancellationUxContractTest.php|\
              bot/tests/Mvp21_9TerminalUxContractTest.php|\
              bot/tests/Mvp21_4TournamentHallUxContractTest.php|\
              bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php)
                ;;
              *)
                echo "Unexpected MVP-21.9 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0

          git diff --exit-code "$base" "$head" -- \
            bot/games app/assets/js/games app/assets/css/games \
            bot/shop bot/ledger/LedgerWriteService.php \
            bot/runtime/ProductionPrimaryApplicationEntrypoints.php \
            bot/cron

  mysql:
    name: Settlement owner on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Run exact MVP-21.9 settlement on MySQL
        env:
          MGW_TEST_MYSQL_HOST: 127.0.0.1
          MGW_TEST_MYSQL_PORT: 3306
          MGW_TEST_MYSQL_DATABASE: mgw_test
          MGW_TEST_MYSQL_USER: root
          MGW_TEST_MYSQL_PASSWORD: root
        run: |
          php bot/tests/Mvp21_9TournamentSettlementTest.php
          php bot/tests/Mvp21_9TournamentRewardProjectionTest.php

name: TMP Entry03 Openface Art Worker

on:
  push:
    branches:
      - agent/mvp19-3-entry03-openface-art-worker
    paths:
      - .github/workflows/tmp-entry03-openface-art-worker.yml

permissions:
  contents: write

jobs:
  build-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Build open-face black-gold lord WebP
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://cdn.pixabay.com/photo/2023/08/10/12/20/knight-8181562_1280.png' \
            -o /tmp/lord-source.png
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps
          import numpy as np, cv2
          from pathlib import Path

          src = Image.open('/tmp/lord-source.png').convert('RGB')
          src = src.resize((900, 900), Image.Resampling.LANCZOS)
          rgb = np.array(src)

          # GrabCut: strong foreground seeds for head + torso, background on outer frame.
          mask = np.full(rgb.shape[:2], cv2.GC_PR_BGD, np.uint8)
          mask[:28,:] = cv2.GC_BGD
          mask[-8:,:] = cv2.GC_BGD
          mask[:,:24] = cv2.GC_BGD
          mask[:,-24:] = cv2.GC_BGD
          cv2.ellipse(mask, (450,230), (175,205), 0, 0, 360, cv2.GC_FGD, -1)
          cv2.ellipse(mask, (450,600), (335,355), 0, 0, 360, cv2.GC_PR_FGD, -1)
          cv2.rectangle(mask, (240,360), (660,890), cv2.GC_FGD, -1)
          bgd = np.zeros((1,65), np.float64)
          fgd = np.zeros((1,65), np.float64)
          cv2.grabCut(rgb, mask, None, bgd, fgd, 7, cv2.GC_INIT_WITH_MASK)
          alpha = np.where((mask==cv2.GC_FGD)|(mask==cv2.GC_PR_FGD),255,0).astype(np.uint8)
          alpha = cv2.GaussianBlur(alpha,(0,0),2.2)

          base = Image.fromarray(rgb).convert('RGBA')
          base.putalpha(Image.fromarray(alpha))

          # Black/gold grade on armor/body while preserving a natural human face.
          gray = ImageOps.grayscale(base.convert('RGB'))
          gold = ImageOps.colorize(gray, black='#030407', white='#d7a43f').convert('RGB')
          original = ImageEnhance.Color(base.convert('RGB')).enhance(0.68)
          graded = Image.blend(original, gold, 0.44)
          graded = ImageEnhance.Contrast(graded).enhance(1.18)
          graded = ImageEnhance.Brightness(graded).enhance(0.83)

          # Face/hair keep natural color with a soft transition.
          face_mask = Image.new('L',(900,900),0)
          fm = np.zeros((900,900),np.uint8)
          cv2.ellipse(fm,(450,230),(185,220),0,0,360,255,-1)
          fm = cv2.GaussianBlur(fm,(0,0),24)
          face_mask = Image.fromarray(fm)
          natural = ImageEnhance.Contrast(base.convert('RGB')).enhance(1.08)
          natural = ImageEnhance.Color(natural).enhance(0.94)
          graded.paste(natural,(0,0),face_mask)

          result = graded.convert('RGBA')
          result.putalpha(base.getchannel('A'))

          # Darken lower plate and add warm royal rim without baking scene FX.
          dark = Image.new('RGBA',(900,900),(3,4,7,0))
          lower = Image.new('L',(900,900),0)
          la = np.zeros((900,900),np.uint8)
          for y in range(360,900):
              la[y,:] = min(125, int((y-360)/540*125))
          lower = Image.fromarray(la)
          dark.putalpha(lower)
          result = Image.alpha_composite(result,dark)

          bbox = result.getbbox()
          if not bbox:
              raise SystemExit('empty segmentation')
          result = result.crop((max(0,bbox[0]-18),max(0,bbox[1]-18),min(900,bbox[2]+18),min(900,bbox[3]+8)))
          result.thumbnail((700,700), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA',(720,720),(0,0,0,0))
          canvas.alpha_composite(result,((720-result.width)//2,720-result.height))

          out = Path('app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-body.webp')
          out.parent.mkdir(parents=True,exist_ok=True)
          canvas.save(out,'WEBP',quality=93,method=6)
          # Validate decode + dimensions.
          check = Image.open(out); check.load()
          assert check.size == (720,720)
          assert check.mode in ('RGBA','RGB')
          print(out, out.stat().st_size, check.size, check.mode)
          PY
      - name: Replace SVG body and self-delete worker
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/assets/media/cosmetics/entry-effects/v8/entry-03-lord-entrance-body.svg
          rm -f .github/workflows/tmp-entry03-openface-art-worker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MVP-19.3: build open-face raster lord art'
          git push origin HEAD:agent/mvp19-3-entry03-openface-art-worker

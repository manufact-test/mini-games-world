name: MVP-19.5 Chess cosmetics

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/tests/Mvp19_5ChessCosmeticsTest.php'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/screens/store-screen-intent-wrapper.js'
      - 'app/assets/js/screens/store-screen-checkers-wrapper.js'
      - 'app/assets/js/games/chess/renderer.js'
      - 'app/assets/js/games/chess/renderer-move-effect-v3.js'
      - 'app/assets/css/games/chess/game.css'
      - 'app/assets/css/games/chess/cosmetics.css'
      - 'app/assets/css/games/chess/profile-cosmetics.css'
      - 'app/assets/css/games/chess/runtime-cosmetics.css'
      - 'app/assets/css/games/chess/store-board-previews.css'
      - 'app/assets/css/games/chess/store-effect-previews.css'
      - 'app/assets/css/games/chess/capture-preview-parity-v1.css'
      - 'app/assets/css/games/chess/board-previews/**'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - 'app/v110.php'
      - '.github/workflows/mvp19-5-chess-cosmetics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-5-chess-cosmetics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chess-cosmetics:
    name: Catalogue Store Profile and live Chess presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint backend and client
        run: |
          php -l bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/tests/Mvp19_5ChessCosmeticsTest.php
          php -l app/runtime/client/version-manifest.php
          php -l app/v110.php
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/store-screen-intent-wrapper.js
          node --check app/assets/js/screens/store-screen-checkers-wrapper.js
          node --check app/assets/js/games/chess/renderer.js
          node --check app/assets/js/games/chess/renderer-move-effect-v3.js

      - name: Run Chess cosmetics contract
        run: php bot/tests/Mvp19_5ChessCosmeticsTest.php

      - name: Re-run shared cosmetics contracts
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          node bot/tests/Mvp19_4EffectsV2ContractTest.mjs

      - name: Guard canonical product scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'game-chess-board-wood'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-tournament-dark'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-marble'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-neon'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-wood'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-marble'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-metal'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-neon'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-move'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-capture'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-check'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          if grep -Fq "offer_type' => 'bundle'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php; then
            echo 'Chess bundle composition was published without the product-owner gate.' >&2
            exit 1
          fi

      - name: Guard active v110 graph
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; $s=$m["imports"]["./assets/js/screens/store-screen.js?v=34"]??""; if(!str_contains($s,"store-screen-checkers-wrapper.js?v=3") || !str_contains($s,"mvp19_6=visual-corrective-v2")) exit(1); if(!str_contains($m["imports"]["./assets/js/games/chess/renderer.js?v=68"]??"","mvp19_5=cosmetics")) exit(2); $css=$m["assets"]["main_css"]??""; if(!str_contains($css,"main.css?v=190") || !str_contains($css,"mvp19_5=chess-cosmetics")) exit(3);'
          grep -F "from './store-screen-intent-wrapper.js?v=19&mvp19_6=accepted-base-preserved';" app/assets/js/screens/store-screen-checkers-wrapper.js
          grep -F "from './store-screen.js?v=45&intent_base=1&mvp19_5=chess-catalog';" app/assets/js/screens/store-screen-intent-wrapper.js
          grep -F "from './store-screen.js?v=44&intent_base=1';" app/assets/js/screens/store-screen-intent-wrapper.js
          grep -F "runtime-cosmetics.css?v=3&mvp19_5=native-board-preview&fx_preview=move-live-parity-v4" app/assets/js/screens/store-screen-intent-wrapper.js
          grep -F "@import url('./games/chess/game.css?v=68');" app/assets/css/main.css
          grep -F "@import url('./cosmetics.css?v=1&mvp19_5=chess-cosmetics');" app/assets/css/games/chess/game.css
          grep -F "@import url('./profile-cosmetics.css?v=1&mvp19_5=chess-profile-polish');" app/assets/css/games/chess/game.css
          grep -F "@import url('./store-board-previews.css?v=5&mvp19_5=native-static-board-preview');" app/assets/css/games/chess/runtime-cosmetics.css
          grep -F "@import url('./store-effect-previews.css?v=4&mvp19_5=move-live-parity-v4');" app/assets/css/games/chess/runtime-cosmetics.css
          grep -F "MOVE: accepted live parity" app/assets/css/games/chess/store-effect-previews.css
          grep -F "chessStoreMoveTrailV4" app/assets/css/games/chess/store-effect-previews.css
          grep -F "chessStoreMoveGatherV4" app/assets/css/games/chess/store-effect-previews.css
          grep -F "chessStoreMoveCoreV4" app/assets/css/games/chess/store-effect-previews.css
          grep -F "dominant central flash + compact radial burst + expanding ring" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "width:104%;" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "width:168%;" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "height:18%;" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "chessCaptureParityFlash" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "chessCaptureParityBurst" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "chessCaptureParityRing" app/assets/css/games/chess/capture-preview-parity-v1.css
          grep -F "capture-preview-parity-v1.css?v=2&mvp19_5=capture-store-parity-explosion-v2" app/v110.php
          grep -F "background-image:url('./board-previews/wood.svg')" app/assets/css/games/chess/store-board-previews.css
          grep -F "background-image:url('./board-previews/tournament-dark.svg')" app/assets/css/games/chess/store-board-previews.css
          grep -F "background-image:url('./board-previews/marble.svg')" app/assets/css/games/chess/store-board-previews.css
          grep -F "background-image:url('./board-previews/neon.svg')" app/assets/css/games/chess/store-board-previews.css
          test -f app/assets/css/games/chess/board-previews/wood.svg
          test -f app/assets/css/games/chess/board-previews/tournament-dark.svg
          test -f app/assets/css/games/chess/board-previews/marble.svg
          test -f app/assets/css/games/chess/board-previews/neon.svg
          if grep -Fq 'upgradeChessBoardPreviews' app/assets/js/screens/store-screen-intent-wrapper.js; then
            echo 'Post-render Chess board reconstruction returned.' >&2
            exit 4
          fi
          if grep -Fq 'MutationObserver' app/assets/js/screens/store-screen-intent-wrapper.js; then
            echo 'MutationObserver is forbidden in the Store corrective.' >&2
            exit 5
          fi
          grep -F 'data-profile-game-panel="chess"' app/assets/css/games/chess/profile-cosmetics.css
          grep -F 'content:"Доски"' app/assets/css/games/chess/profile-cosmetics.css
          grep -F 'content:"Фигуры"' app/assets/css/games/chess/profile-cosmetics.css

      - name: Guard frozen game owners
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- bot/games
          git diff --exit-code "$base" "$head" -- app/assets/js/screens/game-screen-v102.js

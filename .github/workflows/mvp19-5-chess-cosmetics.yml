name: MVP-19.5 Chess cosmetics

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php'
      - 'bot/catalog/CosmeticStoreService.php'
      - 'bot/tests/Mvp19_5ChessCosmeticsTest.php'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/screens/store-screen-intent-wrapper.js'
      - 'app/assets/js/games/chess/renderer.js'
      - 'app/assets/css/games/chess/game.css'
      - 'app/assets/css/games/chess/cosmetics.css'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp19-5-chess-cosmetics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-5-chess-cosmetics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chess-cosmetics:
    name: Catalogue Store Profile and live Chess presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Lint backend and client
        run: |
          php -l bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          php -l bot/catalog/CosmeticStoreService.php
          php -l bot/tests/Mvp19_5ChessCosmeticsTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/store-screen-intent-wrapper.js
          node --check app/assets/js/games/chess/renderer.js

      - name: Run Chess cosmetics contract
        run: php bot/tests/Mvp19_5ChessCosmeticsTest.php

      - name: Re-run shared cosmetics contracts
        run: |
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_2CosmeticStoreTest.php
          php bot/tests/Mvp19_3ProfileAvatarsTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          node bot/tests/Mvp19_4EffectsV2ContractTest.mjs

      - name: Guard canonical product scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'game-chess-board-wood'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-tournament-dark'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-marble'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-board-neon'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-wood'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-marble'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-metal'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-pieces-neon'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-move'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-capture'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          grep -F "'game-chess-effect-check'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php
          if grep -Fq "offer_type' => 'bundle'" bot/database/migrations/20260911_0030_add_chess_game_cosmetics.php; then
            echo 'Chess bundle composition was published without the product-owner gate.' >&2
            exit 1
          fi

      - name: Guard active v110 graph
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; $s=$m["imports"]["./assets/js/screens/store-screen.js?v=34"]??""; if(!str_contains($s,"store-screen-intent-wrapper.js?v=1") || !str_contains($s,"mvp19_5=chess-catalog")) exit(1); if(!str_contains($m["imports"]["./assets/js/games/chess/renderer.js?v=68"]??"","mvp19_5=cosmetics")) exit(2); $css=$m["assets"]["main_css"]??""; if(!str_contains($css,"main.css?v=190") || !str_contains($css,"mvp19_5=chess-cosmetics")) exit(3);'
          grep -F "from './store-screen.js?v=45&intent_base=1&mvp19_5=chess-catalog';" app/assets/js/screens/store-screen-intent-wrapper.js
          grep -F "from './store-screen.js?v=44&intent_base=1';" app/assets/js/screens/store-screen-intent-wrapper.js
          grep -F "@import url('./games/chess/game.css?v=68');" app/assets/css/main.css
          grep -F "@import url('./cosmetics.css?v=1&mvp19_5=chess-cosmetics');" app/assets/css/games/chess/game.css

      - name: Guard frozen game owners
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- bot/games
          git diff --exit-code "$base" "$head" -- app/assets/js/screens/game-screen-v102.js

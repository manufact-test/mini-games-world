name: MVP-27.1 Go Renderer Localization

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/games/go/renderer.js'
      - 'app/assets/js/games/go/renderer-cosmetics-v1.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_go_renderer_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/Mvp19_8GoLiveCosmeticsContractTest.mjs'
      - '.github/workflows/mvp27-1-go-renderer-localization.yml'
      - '.github/workflows/mvp19-8-go-live-cosmetics.yml'
      - '.github/workflows/mvp19-8-go-profile-parity.yml'
      - '.github/workflows/mvp25-6-monetization-disabled-store.yml'
      - '.github/workflows/mvp25-4-startup-performance.yml'
      - '.github/workflows/mvp19-6-profile-game-cosmetics-parity.yml'
      - '.github/workflows/mvp25-4-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-renderer-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/go/renderer.js
          node --check app/assets/js/games/go/renderer-cosmetics-v1.js
          node --check ops/checks/mvp27_1_go_renderer_localization_contract.mjs
          node --check bot/tests/Mvp19_8GoLiveCosmeticsContractTest.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_go_renderer_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve accepted Go mechanics and cosmetics owners
        run: |
          set -euo pipefail
          node bot/tests/Mvp19_8GoLiveCosmeticsContractTest.mjs
          node bot/tests/Mvp19_8GoProfileParityContractTest.mjs
          php bot/tests/Mvp19_8GoStoreTest.php
          php bot/tests/Mvp14r2GamesContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded localization scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/games/go/renderer\.js|app/assets/js/games/go/renderer-cosmetics-v1\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_go_renderer_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/Mvp19_8GoLiveCosmeticsContractTest\.mjs|\.github/workflows/mvp27-1-go-renderer-localization\.yml|\.github/workflows/mvp19-8-go-live-cosmetics\.yml|\.github/workflows/mvp19-8-go-profile-parity\.yml|\.github/workflows/mvp25-6-monetization-disabled-store\.yml|\.github/workflows/mvp25-4-startup-performance\.yml|\.github/workflows/mvp19-6-profile-game-cosmetics-parity\.yml|\.github/workflows/mvp25-4-reliability\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Go localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

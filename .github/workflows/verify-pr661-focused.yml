name: Verify PR661 Start Search Stats Ownership

on:
  push:
    branches:
      - agent/verify-pr661-focused

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc '{state:"pending",context:"phase-b-pr661-focused",description:"Start-search stats ownership tests are running"}')"

      - name: Checkout exact verification commit
        uses: actions/checkout@v4

      - name: Run focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check e2e/staging/support/d3-shared-context.mjs
          node --check e2e/staging/owner-pending-passive.spec.mjs
          php -l bot/tests/OwnerPendingStartSearchStatsAbortOwnershipContractTest.php
          php bot/tests/OwnerPendingStartSearchStatsAbortOwnershipContractTest.php

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [[ "${JOB_STATUS}" == 'success' ]]; then state='success'; description='Start-search stats ownership tests passed'; else state='failure'; description='Start-search stats ownership tests failed'; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -nc --arg state "${state}" --arg description "${description}" '{state:$state,context:"phase-b-pr661-focused",description:$description}')"
          test "${state}" = 'success'

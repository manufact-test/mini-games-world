name: MVP-15.7 targeted read-only gate audit

on:
  push:
    branches:
      - agent/mvp-15-7-legacy-cleanup-audit
    paths:
      - '.github/workflows/mvp15-7-targeted-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-15-7-legacy-cleanup-audit
          fetch-depth: 1

      - name: Targeted code and live public readiness audit
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== AUDIT BRANCH ==='
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo '=== auditParity CALLERS / OWNERS ==='
          git grep -n 'auditParity' -- bot app ops scripts || true

          echo '=== RuntimeEconomyRepository CONSTRUCTION / synchronize CALLERS ==='
          git grep -nE 'new RuntimeEconomyRepository|->synchronize\(' -- bot app ops scripts || true

          echo '=== LEGACY RECONCILIATION / DELTA CALLERS ==='
          git grep -nE 'LegacyEconomyDeltaImportService|LegacyEconomyRuntimeReconciliationService|LegacyEconomyShadowSyncService|RuntimeEconomyBalanceBootstrapService' -- bot app ops scripts || true

          echo '=== ROLLBACK MATERIALIZER CALLERS ==='
          git grep -nE 'ProductionPrimaryRollback(MaterializedStateConnection|SnapshotMaterializer)' -- bot app ops scripts || true

          echo '=== MIGRATION FILES ==='
          find bot/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort

          echo '=== PUBLIC STAGING HEALTH ==='
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            'https://seashell-okapi-889488.hostingersite.com/bot/health.php' \
            | python3 -m json.tool

          echo '=== MVP15.7_TARGETED_READONLY_AUDIT=PASS ==='

name: MVP-16.1C browser bootstrap diagnostic

on:
  push:
    branches:
      - agent/mvp-16-1c-preloader-regression-fix
    paths:
      - '.github/workflows/mvp16-1c-browser-diagnostic.yml'

permissions:
  contents: read

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-13-2-staging
          fetch-depth: 1
      - name: Inspect bootstrap markers and browser console
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import json, os, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--disable-dev-shm-usage')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=opts)
          try:
              d.get(os.environ['MGW_STAGING_ORIGIN'] + '/app/v110.php')
              for delay in (1,3,8):
                  time.sleep(delay)
                  state=d.execute_script('''return {
                    ready: document.readyState,
                    bootstrap: window.__MGW_APP_BOOTSTRAP_V2__ || null,
                    build: window.__MGW_BUILD__ || null,
                    regression: window.__MGW_REGRESSION_BUILD__ || null,
                    preloaderClass: document.getElementById('preloader')?.className || null,
                    preloaderDisplay: document.getElementById('preloader') ? getComputedStyle(document.getElementById('preloader')).display : null,
                    preloaderOpacity: document.getElementById('preloader') ? getComputedStyle(document.getElementById('preloader')).opacity : null,
                    activeScreen: document.querySelector('.screen.active')?.dataset?.screen || null
                  };''')
                  print('STATE', delay, json.dumps(state, ensure_ascii=False, sort_keys=True))
              for entry in d.get_log('browser'):
                  print('BROWSER_LOG', json.dumps(entry, ensure_ascii=False, sort_keys=True))
          finally:
              d.quit()
          PY

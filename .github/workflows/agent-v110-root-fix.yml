name: Agent v110 root fix

on:
  push:
    branches:
      - agent/v110-invite-notification-presence-regression-root

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v110-invite-notification-presence-regression-root
          fetch-depth: 0

      - name: Apply root fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          OLD_BUILD = 'v110-mvp14r3-invite-presence-notification-profile-root'
          NEW_BUILD = 'v110-mvp14r4-invite-notification-presence-root'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new))

          # Sheet lifecycle is authoritative: a closed sheet owns no hidden stale state.
          replace_once(
              'app/assets/js/components/sheet.js',
              "export function closeSheet(){ overlay()?.classList.remove('active'); }",
              """export function closeSheet(){
            const o = overlay();
            const s = sheet();
            if (!o || !s) return;
            const wasActive = o.classList.contains('active');
            o.classList.remove('active');
            s.replaceChildren();
            if (wasActive) document.dispatchEvent(new CustomEvent('mgw:sheet-closed'));
          }"""
          )

          # Invitation owner: closed sheets are never background-render targets; own cancel is silent.
          replace_once(
              'app/assets/js/games/game-invites-v110.js',
              "import { openSheet, closeSheet } from '../components/sheet.js?v=68';",
              "import { openSheet, closeSheet } from '../components/sheet.js?v=1109';"
          )
          replace_once(
              'app/assets/js/games/game-invites-v110.js',
              "      toast(action === 'decline' ? 'Приглашение отклонено.' : 'Приглашение отменено.');",
              "      if (action === 'decline') toast('Приглашение отклонено.');"
          )
          replace_once(
              'app/assets/js/games/game-invites-v110.js',
              """function openSheetInviteToken(){
            return String(document.querySelector('#sheet [data-invite-sheet][data-invite-token]')?.dataset.inviteToken || '');
          }

          function openSheetInviteState(){
            return String(document.querySelector('#sheet [data-invite-sheet][data-invite-state]')?.dataset.inviteState || '');
          }""",
              """function openSheetInviteToken(){
            if (!document.getElementById('sheetOverlay')?.classList.contains('active')) return '';
            return String(document.querySelector('#sheet [data-invite-sheet][data-invite-token]')?.dataset.inviteToken || '');
          }

          function openSheetInviteState(){
            if (!document.getElementById('sheetOverlay')?.classList.contains('active')) return '';
            return String(document.querySelector('#sheet [data-invite-sheet][data-invite-state]')?.dataset.inviteState || '');
          }"""
          )

          # Notification owner: immediate bell opening, honest toast delivery, no transport interceptor.
          replace_once(
              'app/assets/js/screens/notifications-screen-v110-root.js',
              "import { openSheet } from '../components/sheet.js?v=68';",
              "import { openSheet } from '../components/sheet.js?v=1109';"
          )
          replace_once(
              'app/assets/js/screens/notifications-screen-v110-root.js',
              """    if (isNotificationsSheetOpen()) {
              renderNotifications(currentItems());
              return;
            }

            const id = String(item.id || '');
            if (!id || announcedIds.has(id)) return;
            rememberAnnouncedId(id);
            if (appReady) showToast(item);""",
              """    if (isNotificationsSheetOpen()) {
              renderNotifications(currentItems());
              rememberAnnouncedId(String(item.id || ''));
              return;
            }

            const id = String(item.id || '');
            if (!id || announcedIds.has(id) || !appReady) return;
            if (showToast(item)) rememberAnnouncedId(id);"""
          )
          replace_once(
              'app/assets/js/screens/notifications-screen-v110-root.js',
              """    if (item) {
              rememberAnnouncedId(String(item.id || ''));
              showToast(item);
            }""",
              """    if (item && showToast(item)) {
              rememberAnnouncedId(String(item.id || ''));
            }"""
          )
          replace_once(
              'app/assets/js/screens/notifications-screen-v110-root.js',
              """function canShowToast(){
            if (!appReady || document.visibilityState !== 'visible') return false;
            const screen = document.querySelector('.screen.active');
            if (String(screen?.dataset.screen || '') !== 'home') return false;
            return !document.getElementById('sheetOverlay')?.classList.contains('active');
          }""",
              """function canShowToast(){
            if (!appReady || document.visibilityState !== 'visible') return false;
            const screenName = String(document.querySelector('.screen.active')?.dataset.screen || '');
            if (!['home', 'profile'].includes(screenName)) return false;
            return !document.getElementById('sheetOverlay')?.classList.contains('active');
          }"""
          )

          # Active shell has exactly one notification owner and no obsolete cancel guard.
          shell = 'app/assets/js/main-v110-handoff-shell.js'
          replace_once(shell, "import { initSheet } from './components/sheet.js?v=68';", "import { initSheet } from './components/sheet.js?v=1109';")
          replace_once(shell, "import { initNotificationsScreen } from './screens/notifications-screen-v110-root.js?v=1107';", "import { initNotificationsScreen } from './screens/notifications-screen-v110-root.js?v=1109';")
          replace_once(shell, "import { initGameInvites, openIncomingInviteIfPresent } from './games/game-invites-v110.js?v=1105';", "import { initGameInvites, openIncomingInviteIfPresent } from './games/game-invites-v110.js?v=1109';")
          replace_once(shell, "import { initV110NotificationPreflight } from './production-v110-notification-preflight.js?v=1108';\n", '')
          replace_once(shell, "// The preflight capture listener must register before the notification owner.\ninitV110NotificationPreflight();\ninitNotificationsScreen();", "initNotificationsScreen();")
          replace_all(shell, OLD_BUILD, NEW_BUILD)

          entry = 'app/assets/js/production-clean-entry-v110.js'
          replace_once(entry, "import { initV109SelfCancelRefreshGuard } from './production-v109-self-cancel-refresh-guard.js?v=109';\n", '')
          replace_once(entry, "initV109SelfCancelRefreshGuard();\n", '')
          replace_all(entry, OLD_BUILD, NEW_BUILD)
          replace_once(
              entry,
              "// The notification preflight is transport only and never renders a second sheet.",
              "// Closed sheets own no stale state; notification and invitation transitions each have one active owner."
          )

          replace_all('app/assets/js/main-v110.js', OLD_BUILD, NEW_BUILD)
          replace_once('app/assets/js/main-v110.js', "main-v110-handoff-shell.js?v=1108", "main-v110-handoff-shell.js?v=1109")
          replace_all('app/v110.php', OLD_BUILD, NEW_BUILD)
          replace_once('app/v110.php', "production-clean-entry-v110.js?v=1108", "production-clean-entry-v110.js?v=1109")
          replace_once('app/v110.php', "main-v110.js?v=1108", "main-v110.js?v=1109")
          replace_once('bot/helpers/WebAppLaunchUrl.php', "/app/v110.php?v=1108", "/app/v110.php?v=1109")

          # Presence uses one configured shared root everywhere and bootstrap confirms the authenticated session.
          replace_once(
              'bot/presence.php',
              "    $presence = new PresenceService();",
              "    $presenceRoot = rtrim((string)($config['data_dir'] ?? (__DIR__ . '/data')), DIRECTORY_SEPARATOR)\n        . DIRECTORY_SEPARATOR . '.runtime' . DIRECTORY_SEPARATOR . 'presence';\n    $presence = new PresenceService($presenceRoot);"
          )
          replace_once(
              'bot/api.php',
              "require __DIR__ . '/core/bootstrap.php';",
              "require __DIR__ . '/core/bootstrap.php';\nrequire_once __DIR__ . '/services/PresenceService.php';"
          )
          replace_once(
              'bot/api.php',
              "    $statsService = new StatsService();",
              "    $presenceRoot = rtrim((string)($config['data_dir'] ?? (__DIR__ . '/data')), DIRECTORY_SEPARATOR)\n        . DIRECTORY_SEPARATOR . '.runtime' . DIRECTORY_SEPARATOR . 'presence';\n    $presence = new PresenceService($presenceRoot);\n    $statsService = new StatsService($presence);"
          )
          replace_once(
              'bot/api.php',
              "$result = $db->transaction(function (array &$data) use ($action, $payload, $tgUser, $users, $games, $gameActions, $shop, $payments, $sessions, $statsService, $history, $weeklyMatch, $sessionId) {",
              "$result = $db->transaction(function (array &$data) use ($action, $payload, $tgUser, $users, $games, $gameActions, $shop, $payments, $sessions, $presence, $statsService, $history, $weeklyMatch, $sessionId) {"
          )
          replace_once(
              'bot/api.php',
              """        $data['users'][$userId] = $user;
            $user =& $data['users'][$userId];

            $sessions->ensureSessionShape($user);""",
              """        $data['users'][$userId] = $user;
            $user =& $data['users'][$userId];

            if (in_array($action, ['bootstrap', 'stats'], true) && $sessionId !== '') {
                try {
                    $presence->touch($userId, $sessionId);
                } catch (Throwable $presenceError) {
                    error_log('Mini Games World presence touch failed: ' . $presenceError->getMessage());
                }
            }

            $sessions->ensureSessionShape($user);"""
          )

          # Current contracts must protect the corrected architecture rather than the removed interceptor.
          common = r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static function (string $path) use ($root): string {
              $content = file_get_contents($root . '/' . $path);
              if (!is_string($content)) throw new RuntimeException('Cannot read production v110 source: ' . $path);
              return $content;
          };
          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };
          '''

          test1 = common + r'''
          $presence = $read('bot/services/PresenceService.php');
          $presenceEndpoint = $read('bot/presence.php');
          $api = $read('bot/api.php');
          $profile = $read('app/assets/js/screens/profile-screen-v110.js');
          $legacyProfile = $read('app/assets/js/screens/profile-screen.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $main = $read('app/assets/js/main-v110.js');
          $entry = $read('app/v110.php');
          $launch = $read('bot/helpers/WebAppLaunchUrl.php');
          $clean = $read('app/assets/js/production-clean-entry-v110.js');

          $assert(!str_contains($presence, 'sys_get_temp_dir'), 'Presence must never use worker-local temp storage.');
          $assert(str_contains($presenceEndpoint, "'.runtime' . DIRECTORY_SEPARATOR . 'presence'")
              && str_contains($api, "'.runtime' . DIRECTORY_SEPARATOR . 'presence'"),
              'Presence endpoint and bootstrap must resolve the same configured runtime root.');
          $assert(str_contains($api, '$presence->touch($userId, $sessionId);')
              && str_contains($api, "in_array($action, ['bootstrap', 'stats'], true)"),
              'Authenticated bootstrap and stats must confirm the visible session before statistics are built.');
          $assert(str_contains($api, '$statsService = new StatsService($presence);'),
              'Stats must read the same presence owner that bootstrap writes.');

          $assert(!str_contains($shell, 'initV110NotificationPreflight')
              && !str_contains($shell, 'production-v110-notification-preflight.js')
              && substr_count($shell, 'initNotificationsScreen();') === 1,
              'The active graph must have one notification owner and no click interceptor.');
          $assert(!str_contains($clean, 'initV109SelfCancelRefreshGuard'),
              'The inactive v109 cancel guard must not remain in the active graph.');

          $assert(str_contains($profile, "PROFILE_STATS_CACHE_KEY = 'mgw_profile_stats_v1'")
              && str_contains($profile, "renderProfileStats(state.profileStats || null);")
              && !str_contains($legacyProfile, 'PROFILE_STATS_CACHE_KEY'),
              'The accepted isolated profile first frame must remain unchanged.');

          $build = 'v110-mvp14r4-invite-notification-presence-root';
          $assert(str_contains($shell, $build) && str_contains($main, $build) && str_contains($entry, $build) && str_contains($clean, $build),
              'Every active v110 entry owner must expose the same build identity.');
          $assert(str_contains($main, 'main-v110-handoff-shell.js?v=1109')
              && str_contains($entry, 'production-clean-entry-v110.js?v=1109')
              && str_contains($entry, 'main-v110.js?v=1109')
              && str_contains($launch, '/app/v110.php?v=1109'),
              'Telegram launch and active modules must use the fresh outer revision.');

          fwrite(STDOUT, 'ProductionV110InvitePresenceNotificationProfileRootContractTest: ' . $assertions . " assertions passed\n");
          '''
          write('bot/tests/ProductionV110InvitePresenceNotificationProfileRootContractTest.php', test1)

          test2 = common + r'''
          $invites = $read('app/assets/js/games/game-invites-v110.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110-root.js');
          $sheet = $read('app/assets/js/components/sheet.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $clean = $read('app/assets/js/production-clean-entry-v110.js');

          $assert(str_contains($invites, 'const WATCH_INTERVAL_MS = 400;')
              && str_contains($invites, 'const ACTIVE_SYNC_INTERVAL_MS = 500;')
              && str_contains($invites, 'const IDLE_SYNC_INTERVAL_MS = 1500;'),
              'The accepted lightweight invite signal and bounded sync cadences must remain.');
          $assert(str_contains($sheet, 's.replaceChildren();'),
              'Closing the canonical sheet must remove hidden stale ownership state.');
          $assert(substr_count($invites, "if (!document.getElementById('sheetOverlay')?.classList.contains('active')) return '';" ) === 2,
              'Invite token and state lookup must reject a closed sheet.');
          $assert(str_contains($invites, "if (action === 'decline') toast('Приглашение отклонено.');")
              && !str_contains($invites, "toast(action === 'decline' ?"),
              'A user cancelling their own invitation must not receive a redundant local confirmation.');

          $assert(str_contains($notifications, "if (showToast(item)) rememberAnnouncedId(id);")
              && str_contains($notifications, "if (item && showToast(item))")
              && str_contains($notifications, "['home', 'profile'].includes(screenName)"),
              'A notification may be marked announced only after it was actually shown on an allowed screen.');
          $bell = strpos($notifications, "event.target.closest('#notificationsOpen')");
          $open = strpos($notifications, 'void openNotificationsSheet(currentItems());', $bell ?: 0);
          $assert($bell !== false && $open !== false && $bell < $open,
              'The single notification owner must open the bell surface immediately on the first click.');
          $assert(!str_contains($shell, 'NotificationPreflight')
              && substr_count($shell, 'initGameInvites();') === 1
              && substr_count($shell, 'initNotificationsScreen();') === 1
              && !str_contains($clean, 'initV109SelfCancelRefreshGuard'),
              'The active graph must contain one invite owner and one notification owner without overlay guards.');

          fwrite(STDOUT, 'ProductionV110InviteNotificationSpeedContractTest: ' . $assertions . " assertions passed\n");
          '''
          write('bot/tests/ProductionV110InviteNotificationSpeedContractTest.php', test2)

          test3 = common + r'''
          $watch = $read('bot/game-watch.php');
          $sync = $read('app/assets/js/production-v110-readonly-game-sync.js');
          $presence = $read('app/assets/js/production-v110-presence.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110-root.js');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');
          $launch = $read('bot/helpers/WebAppLaunchUrl.php');

          $assert(str_contains($watch, "if ($driver === 'json')")
              && str_contains($watch, "fopen($path, 'rb')")
              && str_contains($watch, 'flock($handle, LOCK_SH)')
              && !str_contains($watch, 'app.lock'),
              'The accepted lock-free PvP watch must remain unchanged.');
          $assert(str_contains($sync, 'const WATCH_INTERVAL_MS = 250;')
              && str_contains($sync, 'const FALLBACK_GAME_POLL_MS = 1500;')
              && !str_contains($sync, 'openSheet('),
              'PvP freshness remains a non-rendering transport.');
          $assert(str_contains($presence, '// Start immediately.')
              && str_contains($presence, 'startPresence();')
              && !str_contains($presence, 'mgwPrefetch'),
              'The single client presence owner must still start before boot.');
          $assert(str_contains($notifications, 'renderNotifications(mergeNotificationItems([item], currentItems()));')
              && str_contains($notifications, 'void refreshOpenSheet();'),
              'The exact blue-toast item must still paint before authoritative refresh.');
          $assert(!str_contains($shell, 'NotificationPreflight')
              && substr_count($shell, 'initNotificationsScreen();') === 1
              && substr_count($shell, 'initV110ReadonlyGameSync();') === 1,
              'The active graph must retain one notification owner and one non-rendering PvP transport.');
          $assert(str_contains($launch, "/app/v110.php?v=1109"),
              'Telegram launches must use the corrected outer revision.');

          fwrite(STDOUT, 'ProductionV110PvpResultNotificationRootContractTest: ' . $assertions . " assertions passed\n");
          '''
          write('bot/tests/ProductionV110PvpResultNotificationRootContractTest.php', test3)

          focused = common + r'''
          $sheet = $read('app/assets/js/components/sheet.js');
          $invites = $read('app/assets/js/games/game-invites-v110.js');
          $notifications = $read('app/assets/js/screens/notifications-screen-v110-root.js');
          $api = $read('bot/api.php');
          $presenceEndpoint = $read('bot/presence.php');
          $shell = $read('app/assets/js/main-v110-handoff-shell.js');

          $assert(str_contains($sheet, 's.replaceChildren();'), 'Closed sheets must not retain hidden content.');
          $assert(str_contains($invites, "if (action === 'decline') toast('Приглашение отклонено.');"), 'Only decline keeps local feedback.');
          $assert(!str_contains($invites, "'Приглашение отменено.'"), 'Own cancel must be silent.');
          $assert(str_contains($notifications, 'if (showToast(item)) rememberAnnouncedId(id);'), 'Suppressed notifications must remain deliverable.');
          $assert(!str_contains($shell, 'production-v110-notification-preflight.js'), 'Network preflight must be inactive.');
          $assert(str_contains($api, '$presence->touch($userId, $sessionId);'), 'Bootstrap must confirm presence.');
          $assert(str_contains($presenceEndpoint, '$presence = new PresenceService($presenceRoot);'), 'Presence endpoint must share configured runtime root.');

          fwrite(STDOUT, 'ProductionV110InviteNotificationPresenceRegressionContractTest: ' . $assertions . " assertions passed\n");
          '''
          write('bot/tests/ProductionV110InviteNotificationPresenceRegressionContractTest.php', focused)

          # Update active-build literals in any remaining v110 contracts without altering the accepted profile module revision.
          for path in Path('bot/tests').glob('ProductionV110*Test.php'):
              text = read(path)
              text = text.replace(OLD_BUILD, NEW_BUILD)
              text = text.replace('/app/v110.php?v=1108', '/app/v110.php?v=1109')
              text = text.replace('production-clean-entry-v110.js?v=1108', 'production-clean-entry-v110.js?v=1109')
              text = text.replace('main-v110.js?v=1108', 'main-v110.js?v=1109')
              text = text.replace('main-v110-handoff-shell.js?v=1108', 'main-v110-handoff-shell.js?v=1109')
              text = text.replace('game-invites-v110.js?v=1105', 'game-invites-v110.js?v=1109')
              text = text.replace('notifications-screen-v110-root.js?v=1107', 'notifications-screen-v110-root.js?v=1109')
              write(path, text)

          workflow = Path('.github/workflows/agent-v110-root-fix.yml')
          workflow.unlink()
          PY

      - name: Validate focused roots
        shell: bash
        run: |
          set -euo pipefail
          php -l bot/api.php
          php -l bot/presence.php
          php -l bot/tests/ProductionV110InvitePresenceNotificationProfileRootContractTest.php
          php -l bot/tests/ProductionV110InviteNotificationSpeedContractTest.php
          php -l bot/tests/ProductionV110PvpResultNotificationRootContractTest.php
          php -l bot/tests/ProductionV110InviteNotificationPresenceRegressionContractTest.php
          node --check app/assets/js/components/sheet.js
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/screens/notifications-screen-v110-root.js
          php bot/tests/ProductionV110InvitePresenceNotificationProfileRootContractTest.php
          php bot/tests/ProductionV110InviteNotificationSpeedContractTest.php
          php bot/tests/ProductionV110PvpResultNotificationRootContractTest.php
          php bot/tests/ProductionV110InviteNotificationPresenceRegressionContractTest.php

      - name: Commit corrected roots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix invite notification and presence roots"
          git push origin HEAD:agent/v110-invite-notification-presence-regression-root

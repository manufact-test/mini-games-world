name: Android Branding Pack Build Verify

on:
  pull_request:
    branches:
      - agent/android-branding-pack
    paths:
      - android-app/**
      - .github/workflows/android-branding-pack-build-verify.yml

permissions:
  contents: read

jobs:
  android-branding-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout verifier head
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable on the hosted Android runner' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify isolated foundation contracts
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test, lint and assemble branded staging APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/app/v110.php?v=1123
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Upload branded debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-branding-pack-staging-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-branding-pack-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn

name: Telegram single entry and loader v121 focused

on:
  pull_request:
    branches:
      - agent/telegram-single-entry-loader-v121

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: df1adb11f53c592bca4d9064931c6117fe2931a3
  STATUS_CONTEXT: telegram-single-entry-loader-v121-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Single Telegram entry and loader verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Product and contract syntax
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/phase-b-current-entry.js
          node --check app/assets/js/phase-b-current-runtime.js
          node --check e2e/staging/frontend-immutable-core.spec.mjs
          node --check e2e/staging/two-context.spec.mjs
          php -l app/v114.php
          php -l bot/services/TelegramService.php
          php -l bot/helpers/StagingMenuButtonReconciler.php
          php -l bot/webhook.php
          php -l bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php

      - name: Canonical entry and fingerprint contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
          grep -Fq "/app/?v=121" bot/services/TelegramService.php
          ! grep -Fq "/app/?v=120" bot/services/TelegramService.php
          grep -Fq "'type' => 'commands'" bot/helpers/StagingMenuButtonReconciler.php
          ! grep -Fq "'type' => 'web_app'" bot/helpers/StagingMenuButtonReconciler.php
          ! grep -Fq "/app/" bot/helpers/StagingMenuButtonReconciler.php
          grep -Fq 'bot/webhook.php' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fq 'bot/helpers/StagingMenuButtonReconciler.php' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fq 'phase-b-current-v121' app/v114.php
          grep -Fq 'phase-b-current-v121' app/assets/js/phase-b-current-entry.js
          grep -Fq 'mgw-phase-b-launch-ring' app/assets/js/phase-b-current-runtime.js
          ! grep -Fq 'mgw-phase-b-launch-shape' app/assets/js/phase-b-current-runtime.js
          ! grep -Fq 'mgwPhaseBFloat' app/assets/js/phase-b-current-runtime.js

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Single Telegram entry and loader verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Single Telegram entry and loader verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

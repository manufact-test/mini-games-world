name: MVP-25.5 Sensitive write replay safety

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp25-5-write-replay-safety.yml'
      - 'bot/support/SupportTicketService.php'
      - 'bot/social/PlayerReportService.php'
      - 'bot/support.php'
      - 'bot/tests/Mvp25_5WriteReplaySafetyTest.php'
      - 'bot/tests/Mvp25_5WriteReplaySafetyContractTest.php'
      - 'docs/MVP25_5_SECURITY_RESILIENCE_AUDIT.md'

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-5-write-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Sensitive write replay safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          php -l bot/support/SupportTicketService.php
          php -l bot/social/PlayerReportService.php
          php -l bot/support.php
          php -l bot/tests/Mvp25_5WriteReplaySafetyTest.php
          php -l bot/tests/Mvp25_5WriteReplaySafetyContractTest.php

      - name: Replay safety model
        run: php bot/tests/Mvp25_5WriteReplaySafetyTest.php

      - name: Replay ownership contract
        run: php bot/tests/Mvp25_5WriteReplaySafetyContractTest.php

      - name: Preserve Support owner
        run: php bot/tests/SupportTicketServiceTest.php

      - name: Preserve player report/moderation owner
        run: |
          php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php
          php bot/tests/Mvp22_3ModerationWorkflowTest.php

      - name: Frozen game/economy/tournament guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-baseline-player-localization-bundle-* ]]; then
            git diff --exit-code "$base" "$head" -- \
              bot/games bot/economy bot/ledger bot/tournaments \
              ':(exclude)bot/tournaments/TournamentRegistrationService.php' \
              app/assets/js/games app/assets/css/games
          else
            git diff --exit-code "$base" "$head" -- bot/games bot/economy bot/ledger bot/tournaments app/assets/js/games app/assets/css/games
          fi

      - name: Bounded slice guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"

          if [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-baseline-player-localization-bundle-* ]]; then
            echo 'Backend localization bundle scope is enforced by its exact dedicated bundle workflow.'
          elif [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-moderation-player-runtime-localization-* ]]; then
            bad=()
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/mvp18-2-friends-ui.yml|.github/workflows/mvp25-5-write-replay-safety.yml|.github/workflows/mvp27-1-backend-moderation-player-runtime-localization.yml|app/locales/ru.json|bot/moderation.php|bot/moderation/ModerationService.php|bot/social/PlayerReportService.php|bot/tests/Mvp22_3ModerationContractTest.php|ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs|ops/checks/mvp27_1_backend_tournament_player_runtime_localization_contract.mjs|ops/checks/mvp27_1_hardcoded_text_baseline.json)
                  ;;
                *)
                  bad+=("$file")
                  ;;
              esac
            done <<< "$changed"
            if (("${#bad[@]}" > 0)); then
              printf 'Unexpected MVP-25.5 replay-safety paths:\n' >&2
              printf '%s\n' "${bad[@]}" >&2
              exit 1
            fi
          elif [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-support-player-runtime-localization-* ]]; then
            bad=()
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/mvp25-5-write-replay-safety.yml|.github/workflows/mvp26-6-android-product-parity.yml|.github/workflows/mvp27-1-backend-support-player-runtime-localization.yml|app/locales/ru.json|bot/support.php|bot/support-attachment-download.php|bot/support/SupportNotificationBridge.php|bot/support/SupportTicketService.php|ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs|ops/checks/mvp27_1_backend_support_player_runtime_localization_contract.mjs|ops/checks/mvp27_1_hardcoded_text_baseline.json)
                  ;;
                *)
                  bad+=("$file")
                  ;;
              esac
            done <<< "$changed"
            if (("${#bad[@]}" > 0)); then
              printf 'Unexpected MVP-25.5 replay-safety paths:\n' >&2
              printf '%s\n' "${bad[@]}" >&2
              exit 1
            fi
          else
            allowed='^(\.github/workflows/mvp25-5-write-replay-safety\.yml|bot/(support/SupportTicketService\.php|social/PlayerReportService\.php|support\.php|tests/(Mvp25_5WriteReplaySafetyTest\.php|Mvp25_5WriteReplaySafetyContractTest\.php))|docs/MVP25_5_SECURITY_RESILIENCE_AUDIT\.md)$'
            bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
            test -z "$bad" || { printf 'Unexpected MVP-25.5 replay-safety paths:\n%s\n' "$bad" >&2; exit 1; }
          fi

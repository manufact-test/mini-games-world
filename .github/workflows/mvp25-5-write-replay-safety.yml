name: MVP-25.5 Sensitive write replay safety

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp25-5-write-replay-safety.yml'
      - 'bot/support/SupportTicketService.php'
      - 'bot/social/PlayerReportService.php'
      - 'bot/support.php'
      - 'bot/tests/Mvp25_5WriteReplaySafetyTest.php'
      - 'bot/tests/Mvp25_5WriteReplaySafetyContractTest.php'
      - 'docs/MVP25_5_SECURITY_RESILIENCE_AUDIT.md'

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-5-write-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Sensitive write replay safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          php -l bot/support/SupportTicketService.php
          php -l bot/social/PlayerReportService.php
          php -l bot/support.php
          php -l bot/tests/Mvp25_5WriteReplaySafetyTest.php
          php -l bot/tests/Mvp25_5WriteReplaySafetyContractTest.php

      - name: Replay safety model
        run: php bot/tests/Mvp25_5WriteReplaySafetyTest.php

      - name: Replay ownership contract
        run: php bot/tests/Mvp25_5WriteReplaySafetyContractTest.php

      - name: Preserve Support owner
        run: php bot/tests/SupportTicketServiceTest.php

      - name: Preserve player report/moderation owner
        run: |
          php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php
          php bot/tests/Mvp22_3ModerationWorkflowTest.php

      - name: Frozen game/economy/tournament guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- bot/games bot/economy bot/ledger bot/tournaments app/assets/js/games app/assets/css/games

      - name: Bounded slice guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp25-5-write-replay-safety\.yml|bot/(support/SupportTicketService\.php|social/PlayerReportService\.php|support\.php|tests/(Mvp25_5WriteReplaySafetyTest\.php|Mvp25_5WriteReplaySafetyContractTest\.php))|docs/MVP25_5_SECURITY_RESILIENCE_AUDIT\.md)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.5 replay-safety paths:\n%s\n' "$bad" >&2; exit 1; }

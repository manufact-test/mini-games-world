name: MVP-26.1 Android Foundation

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'android-app/**'
      - '.github/workflows/mvp26-1-android-foundation.yml'

permissions:
  contents: read

jobs:
  android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify Android foundation ownership/security
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test, lint and assemble foundation APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://staging.invalid/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify no tracked secrets
        run: node scripts/ci/check-secrets.mjs

      - name: Upload foundation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-1-foundation-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-1-foundation-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

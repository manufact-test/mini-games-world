name: MVP-25.6 Closure

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - '.github/workflows/mvp25-6-closure.yml'
      - 'bot/tests/Mvp25_6ClosureContractTest.php'
      - 'docs/MVP25_6_MONETIZATION_DISABLED_COMPLETE_PRODUCT.md'

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-6-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: MVP-25.6 final closure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Closure syntax and contract
        run: |
          php -l bot/tests/Mvp25_6ClosureContractTest.php
          php bot/tests/Mvp25_6ClosureContractTest.php

      - name: Re-prove disabled-billing Store
        run: |
          php bot/tests/Mvp25_6MonetizationDisabledStoreTest.php
          node bot/tests/Mvp25_6StoreClientContractTest.mjs

      - name: Re-prove accepted Store mechanics
        run: php bot/tests/Mvp19_2CosmeticStoreTest.php

      - name: Re-prove final Gold retirement
        run: php bot/tests/Mvp24FinalGoldRemovalClosureContractTest.php

      - name: Re-prove canonical manifest
        run: php bot/tests/Mvp25_1V110ManifestNormalizationContractTest.php

      - name: Re-prove tracked-secret gate
        run: |
          node scripts/ci/check-secrets-contract.mjs
          node scripts/ci/check-secrets.mjs

      - name: Closure-only scope guard
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp25-6-closure\.yml|bot/tests/Mvp25_6ClosureContractTest\.php|docs/MVP25_6_MONETIZATION_DISABLED_COMPLETE_PRODUCT\.md)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.6 closure paths:\n%s\n' "$bad" >&2; exit 1; }

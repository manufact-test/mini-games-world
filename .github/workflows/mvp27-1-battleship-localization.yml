name: MVP-27.1 Battleship Localization
on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/games/battleship/renderer.js'
      - 'app/assets/js/games/battleship/renderer-cosmetics-v1.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_battleship_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs'
      - 'bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs'
      - 'bot/tests/ProductionV110BattleshipSetupPresentationContractTest.php'
      - 'bot/tests/ProductionV110BattleshipShotFeedbackContractTest.php'
      - 'bot/tests/ProductionV110BattleshipMissHandoffContractTest.php'
      - '.github/workflows/mvp27-1-battleship-localization.yml'
      - '.github/workflows/mvp26-6-android-product-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battleship-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/battleship/renderer.js
          node --check app/assets/js/games/battleship/renderer-cosmetics-v1.js
          node --check ops/checks/mvp27_1_battleship_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_battleship_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
      - name: Preserve Battleship LIVE owners
        run: |
          set -euo pipefail
          node bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest.mjs
          node bot/tests/Mvp19_12BattleshipLiveShotEffectTest.mjs
          node bot/tests/Mvp19_12BattleshipLiveResultEffectsTest.mjs
          node bot/tests/Mvp19_12BattleshipFireReliabilityTest.mjs
          php bot/tests/ProductionV110BattleshipSetupPresentationContractTest.php
          php bot/tests/ProductionV110BattleshipShotFeedbackContractTest.php
          php bot/tests/ProductionV110BattleshipMissHandoffContractTest.php
          php bot/tests/Mvp14r2GamesContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php
      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs
      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/games/battleship/renderer\.js|app/assets/js/games/battleship/renderer-cosmetics-v1\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_battleship_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/Mvp19_12BattleshipLiveMapsFleetsTest\.mjs|bot/tests/Mvp19_12BattleshipLiveShotEffectTest\.mjs|bot/tests/Mvp19_12BattleshipLiveResultEffectsTest\.mjs|bot/tests/ProductionV110BattleshipSetupPresentationContractTest\.php|bot/tests/ProductionV110BattleshipShotFeedbackContractTest\.php|bot/tests/ProductionV110BattleshipMissHandoffContractTest\.php|\.github/workflows/mvp27-1-battleship-localization\.yml|\.github/workflows/mvp26-6-android-product-parity\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Battleship localization paths:\n%s\n' "$bad" >&2; exit 1; }
      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

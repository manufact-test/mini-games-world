name: MVP-15.4 exact live fingerprint proof

on:
  push:
    branches:
      - agent/mvp-15-4-canonical-bonuses
    paths:
      - '.github/workflows/mvp15-4-live-fingerprint-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  prove-exact-live-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Calculate expected runtime fingerprint
        id: expected
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected}" = '64'
          echo "sha256=${expected}" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_RUNTIME_FINGERPRINT=${expected}"

      - name: Fetch live staging readiness once
        shell: bash
        run: |
          set -Eeuo pipefail
          curl \
            --fail-with-body \
            --silent --show-error \
            --connect-timeout 10 \
            --max-time 25 \
            --header 'Accept: application/json' \
            "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
            --output live-staging-readiness.json
          cat live-staging-readiness.json

      - name: Assert exact deployed runtime
        env:
          EXPECTED_FINGERPRINT: ${{ steps.expected.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('live-staging-readiness.json').read_text(encoding='utf-8'))
          expected = os.environ['EXPECTED_FINGERPRINT']
          actual = payload.get('source_fingerprint_sha256')

          assert payload.get('ok') is True, payload
          assert payload.get('build') == 'mgw-staging-playwright-r15.3-v1', payload
          assert payload.get('environment') == 'staging', payload
          assert payload.get('base_host') == 'seashell-okapi-889488.hostingersite.com', payload
          assert actual == expected, {'expected': expected, 'actual': actual}
          assert int(payload.get('runtime_file_count') or 0) > 0, payload
          assert payload.get('isolation', {}).get('live_payments_disabled') is True, payload
          capabilities = payload.get('capabilities', {})
          assert capabilities and all(value is True for value in capabilities.values()), capabilities
          assert capabilities.get('exact_runtime_fingerprint') is True, capabilities

          print(f'EXPECTED_RUNTIME_FINGERPRINT={expected}')
          print(f'LIVE_RUNTIME_FINGERPRINT={actual}')
          print('MVP15_4_EXACT_LIVE_FINGERPRINT_PROOF=PASS')
          PY

      - name: Upload exact readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: mvp15-4-live-fingerprint-${{ github.run_id }}
          path: live-staging-readiness.json
          if-no-files-found: error
          retention-days: 7

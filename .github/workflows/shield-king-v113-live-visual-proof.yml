name: Shield King V113 live visual proof

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/shield-king-v113-live-visual-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d96232721159ea4c0f8c26844295e1874a7f21a0
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.62.0
          npx --no-install playwright install --with-deps chromium
      - name: Wait for exact V113 Hostinger identity
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://seashell-okapi-889488.hostingersite.com'
          for attempt in $(seq 1 35); do
            headers="$(curl --silent --show-error --connect-timeout 10 --max-time 20 -D - -o /dev/null "$origin/app/v110.php?v=1123&v113_visual_proof=1" | tr -d '\r' || true)"
            render="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="x-mgw-icon-render"{print $2}' | tail -n1)"
            intro="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="x-mgw-app-entry-presentation"{print $2}' | tail -n1)"
            if [ "$render" = 'accepted-v113-painted-geometry' ] && [ "$intro" = 'shield-king-v113-fullscreen-assembly' ]; then
              echo "Exact V113 live identity present on attempt $attempt."
              exit 0
            fi
            echo "waiting: render='${render:-none}' intro='${intro:-none}' attempt=$attempt"
            sleep 8
          done
          exit 1
      - name: Prove actual painted geometry and loader assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p v113-visual-proof
          cat > .tmp-v113-live-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const origin='https://seashell-okapi-889488.hostingersite.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},locale:'ru-RU',deviceScaleFactor:1});
          const response=await page.goto(`${origin}/app/v110.php?v=1123&v113_visual_proof=1`,{waitUntil:'domcontentloaded',timeout:35000});
          if(!response?.ok()) throw new Error(`v110 response ${response?.status()}`);
          const headers=response.headers();
          if((headers['x-mgw-icon-render']||'')!=='accepted-v113-painted-geometry') throw new Error('wrong V113 render identity');
          if((headers['x-mgw-app-entry-presentation']||'')!=='shield-king-v113-fullscreen-assembly') throw new Error('wrong V113 intro identity');

          const gameSelector='.game-card img.shield-king-game-art[data-sk-delivery="static"]';
          await page.waitForFunction(sel=>document.querySelectorAll(sel).length===8,gameSelector,{timeout:15000});
          await page.waitForFunction(sel=>[...document.querySelectorAll(sel)].every(img=>img.complete&&img.naturalWidth===384&&img.naturalHeight===512),gameSelector,{timeout:15000});
          await page.waitForFunction(()=>document.querySelectorAll('.game-rules-button > img[data-sk-asset="ui/actions/rules.webp"]').length>=8,null,{timeout:10000});

          const metrics=await page.evaluate(()=>{
            const alphaBounds=img=>{
              const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
              const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
              const data=ctx.getImageData(0,0,c.width,c.height).data;
              let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
              for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
                if(data[(y*c.width+x)*4+3]<12)continue;
                minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
              }
              if(maxX<0)throw new Error('empty alpha image');
              return{minX,minY,maxX,maxY,width:c.width,height:c.height};
            };
            const painted=img=>{
              const a=alphaBounds(img),r=img.getBoundingClientRect(),sx=r.width/a.width,sy=r.height/a.height;
              return{left:r.left+a.minX*sx,top:r.top+a.minY*sy,right:r.left+(a.maxX+1)*sx,bottom:r.top+(a.maxY+1)*sy,width:(a.maxX-a.minX+1)*sx,height:(a.maxY-a.minY+1)*sy,alpha:a};
            };
            const cards=[...document.querySelectorAll('.game-card')];
            const games=cards.map((card,i)=>{
              const img=card.querySelector('img.shield-king-game-art[data-sk-delivery="static"]');
              const pr=painted(img),cr=card.getBoundingClientRect(),hr=card.querySelector('h3').getBoundingClientRect();
              const previous=i?cards[i-1].getBoundingClientRect():null;
              const prevEl=card.previousElementSibling;
              const titleRect=!i&&prevEl?.classList.contains('section-title')?prevEl.getBoundingClientRect():null;
              const cs=getComputedStyle(card),after=getComputedStyle(card,'::after');
              return{game:card.dataset.gameCard,paintedLeftDelta:pr.left-cr.left,paintedTopProtrusion:cr.top-pr.top,copyGap:hr.left-pr.right,clearanceBefore:previous?pr.top-previous.bottom:(titleRect?pr.top-titleRect.bottom:null),radius:cs.borderRadius,clipPath:cs.clipPath,borderTopStyle:cs.borderTopStyle,borderTopWidth:cs.borderTopWidth,afterBackground:after.backgroundImage,painted:pr};
            });
            const books=[...document.querySelectorAll('.game-rules-button')].map(button=>{
              const img=button.querySelector('img[data-sk-asset="ui/actions/rules.webp"]');
              if(!img||!img.complete||!img.naturalWidth)return null;
              const br=button.getBoundingClientRect(),pr=painted(img);
              return{context:button.closest('.game-card')?'card':(button.closest('.turn-actions')?'game-top':'other'),dx:((pr.left+pr.right)/2)-((br.left+br.right)/2),dy:((pr.top+pr.bottom)/2)-((br.top+br.bottom)/2)};
            }).filter(Boolean);
            return{games,books};
          });

          if(metrics.games.length!==8)throw new Error(`expected 8 cards, got ${metrics.games.length}`);
          for(const m of metrics.games){
            if(Math.abs(m.paintedLeftDelta)>3)throw new Error(`painted art is not flush-left: ${JSON.stringify(m)}`);
            if(m.paintedTopProtrusion<44)throw new Error(`painted crown/art does not protrude enough: ${JSON.stringify(m)}`);
            if(m.copyGap<8)throw new Error(`copy remains cramped against art: ${JSON.stringify(m)}`);
            if(m.clearanceBefore!==null&&m.clearanceBefore<24)throw new Error(`visible art lacks vertical clearance: ${JSON.stringify(m)}`);
            if(!m.radius.includes('20px')||m.clipPath!=='none'||m.borderTopStyle!=='solid'||parseFloat(m.borderTopWidth)<1)throw new Error(`normal rounded frame contract failed: ${JSON.stringify(m)}`);
            if(m.afterBackground!=='none')throw new Error(`broken V9 gradient rail still visible: ${JSON.stringify(m)}`);
          }
          const cardBooks=metrics.books.filter(x=>x.context==='card');
          if(cardBooks.length!==8)throw new Error(`expected 8 card books, got ${cardBooks.length}`);
          for(const b of metrics.books){
            if(Math.abs(b.dx)>1||Math.abs(b.dy)>1)throw new Error(`painted book not centered: ${JSON.stringify(b)}`);
          }

          await page.addStyleTag({content:'.preloader{display:none!important}'});
          await page.screenshot({path:'v113-visual-proof/home.png',fullPage:true});

          const loaderPage=await browser.newPage({viewport:{width:390,height:844},locale:'ru-RU',deviceScaleFactor:1});
          await loaderPage.addInitScript(()=>document.addEventListener('DOMContentLoaded',()=>{const s=document.createElement('style');s.textContent='.preloader.hidden{opacity:1!important;visibility:visible!important;pointer-events:none!important}';document.head.appendChild(s)},{once:true}));
          await loaderPage.goto(`${origin}/app/v110.php?v=1123&v113_loader_proof=1`,{waitUntil:'domcontentloaded',timeout:35000});
          await loaderPage.waitForSelector('.preloader .abstract-loader');
          await loaderPage.evaluate(()=>{
            const animations=document.querySelector('.preloader .load-card').getAnimations({subtree:true});
            for(const a of animations){a.pause();a.currentTime=650;}
          });
          await loaderPage.screenshot({path:'v113-visual-proof/loader-mid.png',fullPage:true});
          const mid=await loaderPage.evaluate(()=>{
            const el=document.querySelector('.preloader .abstract-loader');
            const s1=el.querySelector('.s1').getBoundingClientRect(),s2=el.querySelector('.s2').getBoundingClientRect(),s3=el.querySelector('.s3').getBoundingClientRect();
            return{s1:{left:s1.left,top:s1.top},s2:{left:s2.left,top:s2.top},s3:{left:s3.left,top:s3.top}};
          });
          await loaderPage.evaluate(()=>{
            const animations=document.querySelector('.preloader .load-card').getAnimations({subtree:true});
            for(const a of animations){a.currentTime=1600;}
          });
          await loaderPage.screenshot({path:'v113-visual-proof/loader-final.png',fullPage:true});
          const finalLoader=await loaderPage.evaluate(()=>{
            const el=document.querySelector('.preloader .abstract-loader'),after=getComputedStyle(el,'::after');
            const s1=getComputedStyle(el.querySelector('.s1')),s2=getComputedStyle(el.querySelector('.s2')),s3=getComputedStyle(el.querySelector('.s3'));
            return{afterOpacity:parseFloat(after.opacity),afterBackground:after.backgroundImage,s1Opacity:parseFloat(s1.opacity),s2Opacity:parseFloat(s2.opacity),s3Opacity:parseFloat(s3.opacity)};
          });
          if(finalLoader.afterOpacity<.98||!finalLoader.afterBackground.includes('/app/assets/icons/shield-king/mgw-mark.svg'))throw new Error(`completed Shield King mark missing: ${JSON.stringify(finalLoader)}`);
          if(finalLoader.s1Opacity>.08||finalLoader.s2Opacity>.08||finalLoader.s3Opacity>.08)throw new Error(`fragments remain over completed mark: ${JSON.stringify(finalLoader)}`);

          const output={metrics,mid,finalLoader};
          fs.writeFileSync('v113-visual-proof/metrics.json',JSON.stringify(output,null,2));
          console.log('[MGW_SHIELD_KING_V113_LIVE_VISUAL_PASS]',JSON.stringify(output));
          await browser.close();
          JS
          node .tmp-v113-live-proof.mjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-king-v113-live-visual-proof-${{ github.run_id }}
          path: v113-visual-proof
          if-no-files-found: warn
          retention-days: 3

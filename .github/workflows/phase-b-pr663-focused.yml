name: Phase B PR663 focused

on:
  push:
    branches:
      - agent/mvp14r2-pr663-focused-verifier
  pull_request:
    branches:
      - agent/mvp14r2-primary-api-preparation-owner

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 93b673dac3299545ee663a3f07d8f4cc98c24bce
  STATUS_CONTEXT: phase-b-pr663-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused Phase B primary-owner verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l bot/api.php
          php -l bot/services/MatchPreparationRuntimeService.php
          php -l bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
          php -l bot/tests/PhaseBPrimaryApiPreparationOwnerContractTest.php
          php -l bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php

      - name: Focused behavior and ownership contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php
          php bot/tests/PhaseBPrimaryApiPreparationOwnerContractTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
          php bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php bot/tests/PhaseBPreparationTimeoutSettlementTest.php
          php bot/tests/PhaseBPreparationCancellationLateFinishSafetyTest.php
          php bot/tests/PhaseBPreparationCancellationDeadlineGuardTest.php

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused Phase B primary-owner verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Focused Phase B primary-owner verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

name: Telegram v122 v110 owner focused

on:
  pull_request:
    branches:
      - agent/telegram-entry-v122-v110-loader-owner-fix

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: a41d9a134885268b9ea6e269b963dfb6f686d6e8
  STATUS_CONTEXT: telegram-entry-v122-v110-owner-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Telegram v110 owner verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Product and contract syntax
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/production-v110-acceptance-runtime.js
          php -l app/v110.php
          php -l bot/helpers/WebAppLaunchUrl.php
          php -l bot/helpers/UserWelcomeGuard.php
          php -l bot/helpers/StagingMenuButtonReconciler.php
          php -l bot/webhook.php
          php -l bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php

      - name: Real owner and presentation contracts
        run: |
          set -Eeuo pipefail
          php bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
          grep -Fq "private const ENTRY_PATH = '/app/v110.php?v=1123';" bot/helpers/WebAppLaunchUrl.php
          grep -Fq "'type' => 'default'" bot/helpers/UserWelcomeGuard.php
          ! grep -Fq "'text' => 'Играть'" bot/helpers/UserWelcomeGuard.php
          grep -Fq "'type' => 'commands'" bot/helpers/StagingMenuButtonReconciler.php
          ! grep -Fq "'type' => 'web_app'" bot/helpers/StagingMenuButtonReconciler.php
          grep -Fq 'X-MGW-Phase-B-Presentation: v122-v110-fixed-loader' app/v110.php
          grep -Fq 'mgw-phase-b-launch-ring' app/assets/js/production-v110-acceptance-runtime.js
          grep -Fq "countdown.textContent = 'VS';" app/assets/js/production-v110-acceptance-runtime.js
          grep -Fq "readyForServer ? 'СТАРТ' : String(seconds)" app/assets/js/production-v110-acceptance-runtime.js
          ! grep -Fq 'mgw-phase-b-launch-shape' app/assets/js/production-v110-acceptance-runtime.js
          ! grep -Fq 'mgwPhaseBFloat' app/assets/js/production-v110-acceptance-runtime.js
          grep -Fq 'bot/helpers/UserWelcomeGuard.php' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fq 'bot/helpers/WebAppLaunchUrl.php' bot/helpers/staging-e2e-runtime-files.txt

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Telegram v110 owner verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Telegram v110 owner verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

name: Staging test reset stage diagnostic focused

on:
  pull_request:
    branches:
      - agent/staging-test-reset-stage-diagnostic

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: a8e68d4a137216a617d935714296d1e158cb2247
  STATUS_CONTEXT: staging-test-reset-stage-diagnostic-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Reset stage diagnostic verification running\"}"
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-test-reset-stage-diagnostic-verifier
          fetch-depth: 0
      - name: Syntax and contracts
        run: |
          set -Eeuo pipefail
          php -l bot/services/StagingTestPlayerStateResetService.php
          php -l bot/staging-test-auth.php
          php -l bot/tests/StagingTestPlayerResetStageDiagnosticContractTest.php
          php -l bot/tests/StagingTestPlayerScopedInviteIsolationContractTest.php
          php bot/tests/StagingTestPlayerResetStageDiagnosticContractTest.php
          php bot/tests/StagingTestPlayerScopedInviteIsolationContractTest.php
      - name: Safe diagnostic boundary
        run: |
          set -Eeuo pipefail
          grep -F "'test_player_reset_unavailable'" bot/staging-test-auth.php
          grep -F "'stage' => \$error->stage()" bot/staging-test-auth.php
          ! grep -F '\$error->getMessage()' bot/staging-test-auth.php
          grep -F "private const ALLOWED_STAGES" bot/services/StagingTestPlayerStateResetService.php
          git diff --quiet 972d7da74fc9f751326cceddf807b10a14186f27...a8e68d4a137216a617d935714296d1e158cb2247 -- \
            bot/invites/RuntimeInviteRepository.php \
            bot/services/StagingTestOnlyInviteOrphanRecoveryService.php \
            app
          ! git diff 972d7da74fc9f751326cceddf807b10a14186f27...a8e68d4a137216a617d935714296d1e158cb2247 | grep -E '^\+.*(DELETE FROM|UPDATE |INSERT INTO|TRUNCATE|DROP TABLE|retry|sleep\()'
          git diff --check 972d7da74fc9f751326cceddf807b10a14186f27...a8e68d4a137216a617d935714296d1e158cb2247
      - name: Exact verifier diff
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only a8e68d4a137216a617d935714296d1e158cb2247...HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only a8e68d4a137216a617d935714296d1e158cb2247...HEAD)" = '.github/workflows/staging-test-reset-stage-diagnostic-focused.yml'
      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Reset stage diagnostic verification passed\"}"
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Reset stage diagnostic verification failed\"}" || true

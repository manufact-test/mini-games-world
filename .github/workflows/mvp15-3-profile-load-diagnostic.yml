name: MVP-15.3 profile load diagnostic

on:
  push:
    branches:
      - agent/mvp-15-3-profile-load-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify critical MVP-15.3 files exist
        run: |
          set -Eeuo pipefail
          test -f bot/profile.php
          test -f bot/accounts/MgwProfileService.php
          test -f bot/economy/UnifiedBalanceMigrationRule.php
          test -f bot/economy/UnifiedBalanceMigrationPlanner.php
          test -f bot/economy/UnifiedBalanceMigrationExecutor.php
          test -f bot/economy/UnifiedBalanceRuntimeState.php
          test -f bot/economy/UnifiedBalanceMigrationCoordinator.php
          test -f bot/economy/UnifiedEconomyRuntimeSyncService.php
          test -f bot/economy/unified_balance_mapping.php
          test -f bot/ledger/LegacyEconomyDeltaImportService.php

      - name: Verify deployment fingerprint owns profile and unified balance
        run: |
          set -Eeuo pipefail
          manifest='bot/helpers/staging-e2e-runtime-files.txt'
          grep -Fx 'bot/profile.php' "$manifest"
          grep -Fx 'bot/economy/UnifiedBalanceMigrationRule.php' "$manifest"
          grep -Fx 'bot/economy/UnifiedBalanceMigrationCoordinator.php' "$manifest"
          grep -Fx 'bot/economy/UnifiedEconomyRuntimeSyncService.php' "$manifest"
          grep -Fx 'bot/economy/unified_balance_mapping.php' "$manifest"
          grep -Fx 'app/assets/js/screens/home-screen.js' "$manifest"
          grep -Fx 'app/assets/js/screens/store-screen.js' "$manifest"
          python3 scripts/ci/staging-runtime-fingerprint.py | grep -E '^[a-f0-9]{64}$'

      - name: Syntax-check deployment health and readiness
        run: |
          set -Eeuo pipefail
          php -l bot/health.php
          php -l bot/staging-e2e-readiness.php
          php -l bot/profile.php

      - name: Include exact profile bootstrap under local-safe config
        env:
          MGW_ENV: local
          MGW_CONFIG_FILE: ${{ github.workspace }}/bot/config/config.environment.example.php
        run: |
          set -Eeuo pipefail
          php -d display_errors=1 -d error_reporting=E_ALL -r '
            $_SERVER["SCRIPT_FILENAME"] = __DIR__ . "/bot/profile.php";
            $_SERVER["PHP_SELF"] = "/bot/profile.php";
            $_SERVER["HTTP_HOST"] = "localhost";
            require __DIR__ . "/bot/core/bootstrap.php";
            if (!isset($config) || !is_array($config)) { throw new RuntimeException("Bootstrap config missing"); }
            if (!class_exists("MgwProfileService")) { require __DIR__ . "/bot/accounts/MgwProfileService.php"; }
            echo "MVP-15.3 profile bootstrap diagnostic: PASS\n";
          '

      - name: Verify health source checks the missing-profile failure class
        run: |
          set -Eeuo pipefail
          grep -F "__DIR__ . '/profile.php'" bot/health.php
          grep -F "'runtime_sources'" bot/health.php
          grep -F "'missing_count'" bot/health.php
          grep -F "'canonical_profile_endpoint'" bot/staging-e2e-readiness.php

name: MVP-26.2 Android Live Auth Probe

on:
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/accounts/AndroidDeviceAuthService.php'
      - 'bot/services/AuthService.php'
      - 'bot/android-auth.php'
      - 'bot/profile.php'
      - 'bot/profile-v2.php'
      - 'bot/weekly/WeeklyBonusRuntimeBridge.php'
      - 'bot/weekly/RuntimeWeeklyBonusRepository.php'
      - 'android-app/**'
      - '.github/workflows/mvp26-2-android-live-auth-probe.yml'

permissions:
  contents: read

jobs:
  live-android-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact Hostinger deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 24); do
            rm -f /tmp/mgw-android-readiness.json
            if curl --fail-with-body --silent --show-error               --connect-timeout 10 --max-time 25               --retry 1 --retry-delay 2 --retry-connrefused               --header 'Accept: application/json'               "$MGW_STAGING_ORIGIN/bot/staging-e2e-readiness.php"               --output /tmp/mgw-android-readiness.json; then
              if python3 - /tmp/mgw-android-readiness.json "$expected_fingerprint" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          PY
              then
                ready=1
                break
              fi
            fi
            if [[ "$attempt" -lt 24 ]]; then sleep 15; fi
          done
          test "$ready" = '1'

      - name: Probe Android session through canonical product APIs
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          credential="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          test "${#credential}" -eq 43

          status="$(
            curl -sS               -o "$tmp/auth-body.txt"               -D "$tmp/auth-headers.txt"               -c "$tmp/cookies.txt"               -w '%{http_code}'               -X POST               -H 'Content-Type: application/x-www-form-urlencoded'               --data "credential=$credential"               "$MGW_STAGING_ORIGIN/bot/android-auth.php"
          )"
          echo "android-auth status=$status"
          test "$status" = "303"
          grep -qi '^set-cookie: mgw_android_auth=' "$tmp/auth-headers.txt"
          grep -qi '^location: .*\/app\/v110\.php' "$tmp/auth-headers.txt"

          common='{"initData":"","sessionId":"android-live-probe","deviceId":"android-live-probe"}'
          bootstrap='{"action":"bootstrap","initData":"","sessionId":"android-live-probe","deviceId":"android-live-probe"}'

          curl -sS -b "$tmp/cookies.txt" -H 'Content-Type: application/json'             --data "$bootstrap" "$MGW_STAGING_ORIGIN/bot/api.php" > "$tmp/bootstrap.json"
          curl -sS -b "$tmp/cookies.txt" -H 'Content-Type: application/json'             --data "$common" "$MGW_STAGING_ORIGIN/bot/profile.php" > "$tmp/profile.json"
          curl -sS -b "$tmp/cookies.txt" -H 'Content-Type: application/json'             --data "$common" "$MGW_STAGING_ORIGIN/bot/profile-v2.php" > "$tmp/profile-v2.json"

          echo '--- sanitized bootstrap ---'
          jq '{ok,error,user:{id:(.user.id // null),mgw_id:(.user.mgw_id // null)},weekly_match:(.weekly_match // null)}' "$tmp/bootstrap.json"
          echo '--- sanitized profile ---'
          jq '{ok,error,auth,profile:{mgw_id:(.profile.mgw_id // null),nickname:(.profile.nickname // null)}}' "$tmp/profile.json"
          echo '--- sanitized profile-v2 ---'
          jq '{ok,error,auth,profile:{mgw_id:(.profile.mgw_id // null),nickname:(.profile.nickname // null)},user:{id:(.user.id // null)}}' "$tmp/profile-v2.json"

          jq -e '.ok == true and (.user.id | startswith("android_")) and (.user.mgw_id | startswith("MGW-"))' "$tmp/bootstrap.json" >/dev/null
          jq -e '.ok == true and .auth.provider == "android_device" and (.profile.mgw_id | startswith("MGW-"))' "$tmp/profile.json" >/dev/null
          jq -e '.ok == true and .auth.provider == "android_device" and (.profile.mgw_id | startswith("MGW-")) and (.user.id | startswith("android_"))' "$tmp/profile-v2.json" >/dev/null

          bootstrap_mgw="$(jq -r '.user.mgw_id' "$tmp/bootstrap.json")"
          test "$bootstrap_mgw" = "$(jq -r '.profile.mgw_id' "$tmp/profile.json")"
          test "$bootstrap_mgw" = "$(jq -r '.profile.mgw_id' "$tmp/profile-v2.json")"
          echo "Android live auth chain PASS"

name: D1 bell capture-only correction

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore only the working bell click path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'app/assets/js/screens/notifications-screen-v99.js',
              "document.addEventListener('click', handleNotificationActivation);",
              "document.addEventListener('click', handleNotificationActivation, true);",
          )
          replace_exact(
              'app/assets/js/screens/notifications-screen-v99.js',
              'event.stopPropagation();',
              'event.stopImmediatePropagation();',
          )
          replace_exact(
              'app/assets/js/main.js',
              "./screens/notifications-screen-v99.js?v=d1-canonical-toast-seed",
              "./screens/notifications-screen-v99.js?v=d1-bell-capture",
          )
          replace_exact(
              'app/v114.php',
              './assets/js/main.js?v=d1-canonical-toast-seed',
              './assets/js/main.js?v=d1-bell-capture',
              expected=2,
          )
          PY

      - name: Validate exact narrow diff
        run: |
          node --check app/assets/js/screens/notifications-screen-v99.js
          node --check app/assets/js/main.js
          grep -Fq "document.addEventListener('click', handleNotificationActivation, true);" app/assets/js/screens/notifications-screen-v99.js
          grep -Fq 'event.stopImmediatePropagation();' app/assets/js/screens/notifications-screen-v99.js
          grep -Fq './screens/notifications-screen-v99.js?v=d1-bell-capture' app/assets/js/main.js
          test "$(grep -Fo './assets/js/main.js?v=d1-bell-capture' app/v114.php | wc -l | tr -d ' ')" = '2'
          git diff --check

      - name: Commit only bell path and cache identities
        run: |
          rm -f .github/workflows/d1-bell-capture-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' app/assets/js/main.js app/assets/js/screens/notifications-screen-v99.js app/v114.php | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git commit -m "Restore original bell click capture path"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

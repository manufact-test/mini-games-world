name: TEMP readiness Share owner patch

on:
  push:
    branches:
      - agent/mvp14r13-staging-readiness-share-single-owner

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14r13-staging-readiness-share-single-owner
          fetch-depth: 0

      - name: Publish read-only readiness module
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          source_path = Path('app/assets/js/first-interaction-readiness.js')
          target_path = Path('app/assets/js/first-interaction-readiness-v103.js')
          source = source_path.read_text(encoding='utf-8')

          source = replace_once(source, "import { APP_CONFIG } from './config.js?v=38';\n", '', 'APP config import')
          source = replace_once(
              source,
              "import { openSheet, closeSheet } from './components/sheet.js?v=68';\n"
              "import { toast } from './components/toast.js?v=41';\n"
              "import { getTelegram, getInitData, haptic } from './telegram/telegram-app.js?v=27';",
              "import { openSheet } from './components/sheet.js?v=68';\n"
              "import { getInitData } from './telegram/telegram-app.js?v=27';",
              'Share-only imports',
          )
          source = replace_once(source, "const INVITES_URL = `${window.location.origin}/bot/invites.php`;\n", '', 'invite URL')
          source = replace_once(source, 'const DRAFT_WARM_DELAY_MS = 60;\n', '', 'draft warm delay')
          for line in [
              'let draftWarmTimer = null;\n',
              'let draftSerial = Promise.resolve();\n',
              'let draftGeneration = 0;\n',
              'let preparedDraft = null;\n',
              'let shareBusy = false;\n',
          ]:
              source = replace_once(source, line, '', line.strip())

          old_click = '''  if (target.matches('[data-invite-friend]')) {
            refreshOpponentsNetwork(false);
            queueMicrotask(() => scheduleCurrentDraftWarm(0));
            return;
          }

          if (target.matches('[data-invite-size], [data-invite-bet]')) {
            queueMicrotask(() => scheduleCurrentDraftWarm(DRAFT_WARM_DELAY_MS));
            return;
          }

          if (target.matches('[data-open-player-picker]')) {
            refreshOpponentsNetwork(false);
            return;
          }

          if (!target.matches('[data-create-link-invite]')) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          sharePreparedLink(target);
          }'''
          new_click = '''  if (target.matches('[data-invite-friend], [data-open-player-picker]')) {
            refreshOpponentsNetwork(false);
          }
          }'''
          source = replace_once(source, old_click, new_click, 'early Share click ownership')

          start = source.find('function scheduleCurrentDraftWarm(')
          end = source.find('function refreshHistorySnapshot(', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Share helper block markers not found')
          source = source[:start] + source[end:]

          source = replace_once(
              source,
              "async function inviteRequest(action, payload = {}){\n"
              "  return requestUrl(INVITES_URL, { action, ...payload });\n"
              "}\n\n",
              '',
              'invite request helper',
          )

          forbidden = [
              'data-create-link-invite',
              'create_link_draft',
              'sharePreparedLink',
              'openTelegramShare',
              'scheduleCurrentDraftWarm',
              'preparedDraft',
              'INVITES_URL',
              'DRAFT_WARM_DELAY_MS',
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'Active readiness module still contains Share owner token: {token}')

          target_path.write_text(source, encoding='utf-8')

          main_path = Path('app/assets/js/main.js')
          main = main_path.read_text(encoding='utf-8')
          main = replace_once(
              main,
              "from './first-interaction-readiness.js?v=98';",
              "from './first-interaction-readiness-v103.js?v=103';",
              'main readiness import',
          )
          main_path.write_text(main, encoding='utf-8')

          for relative in ['app/index.html', 'app/v110.php']:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              text = replace_once(text, 'main.js?v=98.2', 'main.js?v=98.3', relative + ' main cache identity')
              path.write_text(text, encoding='utf-8')

          for path in Path('bot/tests').glob('*.php'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('main.js?v=98.2', 'main.js?v=98.3')
              text = text.replace(
                  "./first-interaction-readiness.js?v=98",
                  "./first-interaction-readiness-v103.js?v=103",
              )
              if path.name.startswith('ProductionMvp14R13'):
                  text = text.replace(
                      "app/assets/js/first-interaction-readiness.js",
                      "app/assets/js/first-interaction-readiness-v103.js",
                  )
              path.write_text(text, encoding='utf-8')

          share_contract_path = Path('bot/tests/ProductionMvp14R13ShareSingleOwnerTest.php')
          share_contract = share_contract_path.read_text(encoding='utf-8')
          share_contract = replace_once(
              share_contract,
              "$historical = file_get_contents($root . '/app/assets/js/production-prepared-share-fix.js');\n"
              "$index = file_get_contents($root . '/app/index.html');",
              "$historical = file_get_contents($root . '/app/assets/js/production-prepared-share-fix.js');\n"
              "$readiness = file_get_contents($root . '/app/assets/js/first-interaction-readiness-v103.js');\n"
              "$index = file_get_contents($root . '/app/index.html');",
              'readiness source in Share contract',
          )
          share_contract = replace_once(
              share_contract,
              "if (!is_string($entry) || !is_string($main) || !is_string($invites)\n"
              "    || !is_string($historical) || !is_string($index) || !is_string($v110)) {",
              "if (!is_string($entry) || !is_string($main) || !is_string($invites)\n"
              "    || !is_string($historical) || !is_string($readiness)\n"
              "    || !is_string($index) || !is_string($v110)) {",
              'readiness validation',
          )
          marker = "$assert(substr_count($main, 'initGameInvites();') === 1"
          assertion = "$assert(str_contains($main, \"./first-interaction-readiness-v103.js?v=103\")\n"
          assertion += "    && !str_contains($readiness, 'data-create-link-invite')\n"
          assertion += "    && !str_contains($readiness, 'create_link_draft')\n"
          assertion += "    && !str_contains($readiness, 'openTelegramShare')\n"
          assertion += "    && str_contains($readiness, \"[data-invite-friend], [data-open-player-picker]\"),\n"
          assertion += "    'Readiness may warm opponents but must not create or open Share drafts.');\n\n"
          share_contract = replace_once(share_contract, marker, assertion + marker, 'readiness single-owner assertion')
          share_contract_path.write_text(share_contract, encoding='utf-8')

          contract = '''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $main = file_get_contents($root . '/app/assets/js/main.js');
          $readiness = file_get_contents($root . '/app/assets/js/first-interaction-readiness-v103.js');
          $invites = file_get_contents($root . '/app/assets/js/games/game-invites.js');
          $index = file_get_contents($root . '/app/index.html');
          $v110 = file_get_contents($root . '/app/v110.php');
          if (!is_string($main) || !is_string($readiness) || !is_string($invites)
              || !is_string($index) || !is_string($v110)) {
              throw new RuntimeException('Missing readiness Share ownership source.');
          }

          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $assert(str_contains($main, "./first-interaction-readiness-v103.js?v=103")
              && substr_count($main, 'initFirstInteractionReadinessEarly();') === 1
              && substr_count($main, 'initGameInvites();') === 1,
              'Active main must install one read-only readiness owner and one invite coordinator.');

          $assert(!str_contains($readiness, 'data-create-link-invite')
              && !str_contains($readiness, 'create_link_draft')
              && !str_contains($readiness, 'sharePreparedLink')
              && !str_contains($readiness, 'openTelegramShare')
              && !str_contains($readiness, 'event.stopImmediatePropagation();'),
              'Readiness must not intercept, create, close or navigate Share.');

          $assert(str_contains($readiness, "[data-invite-friend], [data-open-player-picker]")
              && str_contains($readiness, 'refreshOpponentsNetwork(false)')
              && str_contains($readiness, 'warmNotificationsSnapshot()'),
              'Readiness must retain only read-only first-click warming.');

          $assert(str_contains($invites, "target.matches('[data-create-link-invite]')")
              && str_contains($invites, 'async function createLinkDraft(context, button)')
              && str_contains($invites, 'showPreparedLink(draftInvite, context);')
              && str_contains($invites, 'data-copy-invite-link')
              && str_contains($invites, 'data-discard-draft'),
              'The invite coordinator must be the sole complete Share owner.');

          $assert(str_contains($index, 'main.js?v=98.3')
              && !str_contains($index, 'main.js?v=98.2'),
              'The HTML shell must publish a fresh main graph for the new readiness module.');

          $assert(str_contains($v110, "'./assets/js/main.js?v=98.3'")
              && str_contains($v110, "'./assets/js/main-v110.js?v=1124'"),
              'The v110 wrapper must replace the exact fresh base main and retain its own graph.');

          fwrite(STDOUT, "ProductionMvp14R13ReadinessShareSingleOwnerTest: {$assertions} assertions passed\n");
          '''
          Path('bot/tests/ProductionMvp14R13ReadinessShareSingleOwnerTest.php').write_text(contract, encoding='utf-8')
          PY

          node --check app/assets/js/first-interaction-readiness-v103.js
          node --check app/assets/js/main.js
          php bot/tests/ProductionMvp14R13ReadinessShareSingleOwnerTest.php
          php bot/tests/ProductionMvp14R13ShareSingleOwnerTest.php
          php bot/tests/ProductionMvp14R13NotificationSingleOwnerTest.php
          ! grep -Fq 'data-create-link-invite' app/assets/js/first-interaction-readiness-v103.js
          ! grep -Fq 'create_link_draft' app/assets/js/first-interaction-readiness-v103.js

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-readiness-share-single-owner-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/js/first-interaction-readiness-v103.js \
            app/assets/js/main.js app/index.html app/v110.php bot/tests \
            .github/workflows/temporary-readiness-share-single-owner-patch.yml
          git diff --cached --check
          git commit -m 'Keep first-interaction readiness read-only for Share'
          git push origin HEAD:agent/mvp14r13-staging-readiness-share-single-owner

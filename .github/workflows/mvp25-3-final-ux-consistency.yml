name: MVP-25.3 Final UX consistency

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/css/main.css'
      - 'app/assets/css/mvp25-3-ux-consistency-v1.css'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/screens/home-screen.js'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_3_FINAL_UX_CONSISTENCY.md'
      - 'docs/MVP25_3_MANUAL_ACCEPTANCE.md'
      - 'bot/tests/Mvp25_3FinalUxConsistencyContractTest.php'
      - 'bot/tests/Mvp25_3RulesGuideContractTest.php'
      - '.github/workflows/mvp25-3-final-ux-consistency.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/css/main.css'
      - 'app/assets/css/mvp25-3-ux-consistency-v1.css'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/screens/home-screen.js'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_3_FINAL_UX_CONSISTENCY.md'
      - 'docs/MVP25_3_MANUAL_ACCEPTANCE.md'
      - 'bot/tests/Mvp25_3FinalUxConsistencyContractTest.php'
      - 'bot/tests/Mvp25_3RulesGuideContractTest.php'
      - '.github/workflows/mvp25-3-final-ux-consistency.yml'

permissions:
  contents: read

jobs:
  ux-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp25_3FinalUxConsistencyContractTest.php
          php -l bot/tests/Mvp25_3RulesGuideContractTest.php
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/screens/home-screen.js

      - name: Final MVP-25.3 UX proof
        run: |
          php bot/tests/Mvp25_3FinalUxConsistencyContractTest.php
          php bot/tests/Mvp25_3RulesGuideContractTest.php

      - name: Guard MVP-25.3 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(app/assets/css/(main\.css|mvp25-3-ux-consistency-v1\.css)|app/assets/js/(main-v110-handoff-shell\.js|screens/home-screen\.js)|app/runtime/client/version-manifest\.php|docs/MVP25_3_(FINAL_UX_CONSISTENCY|MANUAL_ACCEPTANCE)\.md|bot/tests/(Mvp25_3FinalUxConsistencyContractTest|Mvp25_3RulesGuideContractTest)\.php|\.github/workflows/mvp25-3-final-ux-consistency\.yml)
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.3 paths:\n%s\n' "$bad" >&2; exit 1; }

          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.3 paths:\n%s\n' "$bad" >&2; exit 1; }

name: Checkers live layout diagnostic

on:
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mgw-checkers-live-layout-diagnostic
  cancel-in-progress: true

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact staging runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output /tmp/mgw-readiness.json; then
              live_fingerprint="$(jq -r '.source_fingerprint_sha256 // ""' /tmp/mgw-readiness.json)"
              ok="$(jq -r '.ok // false' /tmp/mgw-readiness.json)"
              if [[ "$ok" == 'true' && "$live_fingerprint" == "$expected_fingerprint" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Capture live Checkers geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install playwright test --config=e2e/playwright.checkers-layout-diagnostic.config.mjs

name: Apply serialized invite bridge root fix

on:
  push:
    branches:
      - agent/mvp14-invite-bridge-serialized-snapshot
    paths:
      - .github/workflows/mvp14-invite-bridge-serialized-snapshot-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-invite-bridge-serialized-snapshot
          fetch-depth: 0

      - name: Apply architecture fix and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding='utf-8')

          interface = '''<?php
          declare(strict_types=1);

          interface ExclusiveSnapshotStorageInterface
          {
              public function exclusiveReadOnly(callable $callback): mixed;

              /** @param list<string> $sections */
              public function exclusiveReadOnlySections(array $sections, callable $callback): mixed;
          }
          '''
          write(
              'bot/storage/contracts/ExclusiveSnapshotStorageInterface.php',
              re.sub(r'^          ', '', interface, flags=re.M),
          )

          json_db_path = 'bot/storage/JsonDatabase.php'
          json_db = read(json_db_path)
          replacement = '''public function readOnly(callable $callback): mixed
              {
                  return $this->readOnlySections(array_keys(self::FILES), $callback);
              }

              /**
               * @param list<string> $sections
               */
              public function readOnlySections(array $sections, callable $callback): mixed
              {
                  return $this->readSectionsWithLock($sections, LOCK_SH, $callback);
              }

              public function exclusiveReadOnly(callable $callback): mixed
              {
                  return $this->exclusiveReadOnlySections(array_keys(self::FILES), $callback);
              }

              /**
               * Hold the JSON lock exclusively while a stable snapshot is consumed by
               * an external bridge. The callback receives data by value and therefore
               * cannot mutate the JSON source. Writers remain blocked until the bridge
               * has completed, so no stale snapshot can race a newer JSON transaction.
               *
               * @param list<string> $sections
               */
              public function exclusiveReadOnlySections(array $sections, callable $callback): mixed
              {
                  return $this->readSectionsWithLock($sections, LOCK_EX, $callback);
              }

              /** @param list<string> $sections */
              private function readSectionsWithLock(array $sections, int $lockMode, callable $callback): mixed
              {
                  if (!in_array($lockMode, [LOCK_SH, LOCK_EX], true)) {
                      throw new InvalidArgumentException('Некорректный режим блокировки JSON-хранилища.');
                  }

                  $lockHandle = fopen($this->lockFile, 'c+');
                  if (!$lockHandle) {
                      throw new RuntimeException('Не удалось открыть lock-файл.');
                  }
                  try {
                      if (!flock($lockHandle, $lockMode)) {
                          throw new RuntimeException('Не удалось заблокировать хранилище.');
                      }
                      $db = $this->loadSections($sections);
                      $result = $callback($db);
                      flock($lockHandle, LOCK_UN);
                      fclose($lockHandle);
                      return $result;
                  } catch (Throwable $e) {
                      flock($lockHandle, LOCK_UN);
                      fclose($lockHandle);
                      throw $e;
                  }
              }

              private function ensureFiles'''
          json_db, count = re.subn(
              r'public function readOnly\(callable \$callback\): mixed.*?\n    private function ensureFiles',
              replacement,
              json_db,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'JsonDatabase read block replacement count: {count}')
          write(json_db_path, json_db)

          adapter_path = 'bot/storage/JsonStorageAdapter.php'
          adapter = read(adapter_path)
          adapter = adapter.replace(
              "require_once __DIR__ . '/contracts/SelectiveReadStorageInterface.php';\n",
              "require_once __DIR__ . '/contracts/SelectiveReadStorageInterface.php';\n"
              "require_once __DIR__ . '/contracts/ExclusiveSnapshotStorageInterface.php';\n",
              1,
          )
          adapter = adapter.replace(
              'final class JsonStorageAdapter implements StorageAdapterInterface, SelectiveReadStorageInterface',
              'final class JsonStorageAdapter implements StorageAdapterInterface, SelectiveReadStorageInterface, ExclusiveSnapshotStorageInterface',
              1,
          )
          marker = '''    public function driver(): string
              {
                  return 'json';
              }'''
          insert = '''    public function exclusiveReadOnly(callable $callback): mixed
              {
                  return $this->database->exclusiveReadOnly($callback);
              }

              public function exclusiveReadOnlySections(array $sections, callable $callback): mixed
              {
                  return $this->database->exclusiveReadOnlySections($sections, $callback);
              }

              public function driver(): string
              {
                  return 'json';
              }'''
          if adapter.count(marker) != 1:
              raise SystemExit('JsonStorageAdapter driver marker changed unexpectedly.')
          adapter = adapter.replace(marker, insert)
          write(adapter_path, adapter)

          repository_path = 'bot/invites/RuntimeInviteRepository.php'
          repository = read(repository_path)
          repository_block = '''public function synchronize(array $jsonData): array
              {
                  $this->assertDatabaseRoute();
                  $database = $this->database();

                  return $this->withSynchronizationLock(
                      $database,
                      function (DatabaseConnectionInterface $database) use ($jsonData): array {
                          $store = new RealtimeDatabaseStore($database);
                          $source = $this->sourceRows($jsonData, $database);
                          $created = 0;
                          $updated = 0;
                          $unchanged = 0;

                          foreach ($source as $inviteId => $expected) {
                              $existingRows = $database->fetchAll(
                                  'SELECT * FROM mgw_invites WHERE invite_id = :invite_id',
                                  ['invite_id' => $inviteId]
                              );

                              if ($existingRows === []) {
                                  $stored = $store->upsertInvite($expected);
                                  $this->assertRowMatches($expected, $stored);
                                  $created++;
                                  continue;
                              }

                              $existing = $this->normalizeDatabaseRow($existingRows[0]);
                              $this->assertImmutableIdentity($expected, $existing);
                              if ($existing === $expected) {
                                  $unchanged++;
                                  continue;
                              }

                              if ($this->timestampSortValue($existing['updated_at_utc'])
                                  > $this->timestampSortValue($expected['updated_at_utc'])) {
                                  throw new RuntimeException('Invite DB state is ahead of the JSON rollback source.');
                              }

                              $stored = $store->upsertInvite($expected);
                              $this->assertRowMatches($expected, $stored);
                              $updated++;
                          }

                          $comparison = $this->compare($source, $this->databaseRows($database));
                          if (!$comparison['ok']) {
                              throw new RuntimeException(implode(' ', $comparison['blockers']));
                          }

                          return [
                              'source_count' => count($source),
                              'database_count' => $comparison['database_count'],
                              'created_count' => $created,
                              'updated_count' => $updated,
                              'unchanged_count' => $unchanged,
                              'source_fingerprint' => $comparison['source_fingerprint'],
                              'database_fingerprint' => $comparison['database_fingerprint'],
                              'parity' => true,
                          ];
                      }
                  );
              }

              public function auditParity(array $jsonData): array
              {
                  $this->assertDatabaseRoute();
                  $database = $this->database();

                  return $this->withSynchronizationLock(
                      $database,
                      function (DatabaseConnectionInterface $database) use ($jsonData): array {
                          $source = $this->sourceRows($jsonData, $database);
                          $comparison = $this->compare($source, $this->databaseRows($database));

                          return [
                              'ok' => $comparison['ok'],
                              'read_only' => true,
                              'source_count' => $comparison['source_count'],
                              'database_count' => $comparison['database_count'],
                              'source_fingerprint' => $comparison['source_fingerprint'],
                              'database_fingerprint' => $comparison['database_fingerprint'],
                              'blockers' => $comparison['blockers'],
                          ];
                      }
                  );
              }

              private function withSynchronizationLock(
                  DatabaseConnectionInterface $database,
                  callable $callback
              ): mixed {
                  $lockName = null;
                  if ($database->driver() === 'mysql') {
                      $lockName = $this->synchronizationLockName();
                      $acquired = $database->fetchValue(
                          'SELECT GET_LOCK(:lock_name, 10)',
                          ['lock_name' => $lockName]
                      );
                      if ((int)$acquired !== 1) {
                          throw new RuntimeException('Invite DB synchronization lock is unavailable.');
                      }
                  }

                  try {
                      return $database->transaction(
                          static fn(DatabaseConnectionInterface $transaction): mixed => $callback($transaction)
                      );
                  } finally {
                      if ($lockName !== null) {
                          try {
                              $database->fetchValue(
                                  'SELECT RELEASE_LOCK(:lock_name)',
                                  ['lock_name' => $lockName]
                              );
                          } catch (Throwable $error) {
                              error_log('Mini Games World invite DB lock release failed: ' . $error->getMessage());
                          }
                      }
                  }
              }

              private function synchronizationLockName(): string
              {
                  $scope = trim((string)($this->config['environment'] ?? ''))
                      . '|'
                      . trim((string)($this->config['database']['name'] ?? ''));
                  return 'mgw_invites_sync_' . substr(hash('sha256', $scope), 0, 40);
              }

              private function assertDatabaseRoute'''
          repository, count = re.subn(
              r'public function synchronize\(array \$jsonData\): array.*?\n    private function assertDatabaseRoute',
              repository_block,
              repository,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'RuntimeInviteRepository method replacement count: {count}')
          write(repository_path, repository)

          endpoint_path = 'bot/invites.php'
          endpoint = read(endpoint_path)
          old_endpoint = '''    if ($runtimeInvites instanceof RuntimeInviteRepository) {
                  $snapshot = $db->readOnly(static fn(array $data): array => $data);
                  $runtimeInvites->synchronize($snapshot);
              }'''
          new_endpoint = '''    if ($runtimeInvites instanceof RuntimeInviteRepository) {
                  if (!($db instanceof ExclusiveSnapshotStorageInterface)) {
                      throw new RuntimeException(
                          'Invite DB bridge requires an exclusive JSON snapshot capability.'
                      );
                  }
                  $db->exclusiveReadOnlySections(
                      ['invites'],
                      static fn(array $data): array => $runtimeInvites->synchronize($data)
                  );
              }'''
          if endpoint.count(old_endpoint) != 1:
              raise SystemExit('Detached invite snapshot block changed unexpectedly.')
          endpoint = endpoint.replace(old_endpoint, new_endpoint)
          write(endpoint_path, endpoint)

          runtime_test_path = 'bot/tests/RuntimeInviteRepositoryTest.php'
          runtime_test = read(runtime_test_path)
          tamper_marker = '''$database->execute(
              'UPDATE mgw_invites SET token = :token WHERE invite_id = :invite_id',
              ['token' => 'tampered-token', 'invite_id' => 'invite-runtime-1']
          );'''
          rollback_test = '''$existingRow = $database->fetchAll(
              'SELECT * FROM mgw_invites WHERE invite_id = :invite_id',
              ['invite_id' => 'invite-runtime-1']
          )[0] ?? [];
          $extraRow = $existingRow;
          $extraRow['invite_id'] = 'invite-runtime-extra';
          $extraRow['token'] = 'invite-token-extra';
          $extraRow['version'] = 1;
          $extraRow['created_at_utc'] = '2026-07-18 18:32:00.000000';
          $extraRow['updated_at_utc'] = '2026-07-18 18:32:00.000000';
          (new RealtimeDatabaseStore($database))->upsertInvite($extraRow);

          $raceData = $data;
          $secondInvite = $data['invites'][0];
          $secondInvite['id'] = 'invite-runtime-2';
          $secondInvite['token'] = 'invite-token-2';
          $secondInvite['status'] = 'pending';
          $secondInvite['created_at'] = '2026-07-18T18:32:00+00:00';
          $secondInvite['updated_at'] = '2026-07-18T18:32:00+00:00';
          $secondInvite['expires_at'] = '2026-07-18T18:47:00+00:00';
          $secondInvite['cancelled_at'] = null;
          $secondInvite['cancelled_by'] = null;
          $raceData['invites'][] = $secondInvite;

          $assertThrows(
              static fn() => $repository->synchronize($raceData),
              'counts differ',
              'A parity failure after an insert must abort the whole DB synchronization'
          );
          $assertSame(
              [],
              $database->fetchAll(
                  'SELECT invite_id FROM mgw_invites WHERE invite_id = :invite_id',
                  ['invite_id' => 'invite-runtime-2']
              ),
              'A failed full synchronization must roll back rows inserted earlier in the same pass'
          );
          $database->execute(
              'DELETE FROM mgw_invites WHERE invite_id = :invite_id',
              ['invite_id' => 'invite-runtime-extra']
          );

          $database->execute(
              'UPDATE mgw_invites SET token = :token WHERE invite_id = :invite_id',
              ['token' => 'tampered-token', 'invite_id' => 'invite-runtime-1']
          );'''
          if runtime_test.count(tamper_marker) != 1:
              raise SystemExit('RuntimeInviteRepositoryTest tamper marker changed unexpectedly.')
          runtime_test = runtime_test.replace(tamper_marker, rollback_test)
          write(runtime_test_path, runtime_test)

          e2e_path = 'e2e/staging/d2-d3-d5-integration.spec.mjs'
          e2e = read(e2e_path)
          old_e2e = '''    const createResponse = await createPromise;
              const created = await createResponse.json().catch(() => null);
              expect(createResponse.status()).toBe(200);
              expect(created?.ok).toBe(true);'''
          new_e2e = '''    const createResponse = await createPromise;
              const created = await createResponse.json().catch(() => null);
              const createPublicError = typeof created?.error === 'string'
                ? created.error.slice(0, 300)
                : 'no_public_error';
              expect(
                createResponse.status(),
                `create_direct status; public error: ${createPublicError}`,
              ).toBe(200);
              expect(created?.ok, `create_direct payload; public error: ${createPublicError}`).toBe(true);'''
          if e2e.count(old_e2e) != 1:
              raise SystemExit('D2-D3-D5 create_direct assertion changed unexpectedly.')
          e2e = e2e.replace(old_e2e, new_e2e)
          write(e2e_path, e2e)

          lock_test = r'''<?php
          declare(strict_types=1);

          require dirname(__DIR__) . '/storage/JsonDatabase.php';

          $mode = (string)($argv[1] ?? 'parent');
          if ($mode === 'child') {
              $dataDir = (string)($argv[2] ?? '');
              $readyFile = (string)($argv[3] ?? '');
              $resultFile = (string)($argv[4] ?? '');
              $database = new JsonDatabase($dataDir);
              file_put_contents($readyFile, 'ready');
              $started = microtime(true);
              $database->transaction(static function (array &$data): void {
                  $data['invites'][] = ['id' => 'child-write'];
              });
              file_put_contents($resultFile, json_encode([
                  'elapsed' => microtime(true) - $started,
              ], JSON_THROW_ON_ERROR));
              exit(0);
          }

          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $root = sys_get_temp_dir() . '/mgw-exclusive-snapshot-' . bin2hex(random_bytes(8));
          $readyFile = $root . '/child.ready';
          $resultFile = $root . '/child.result.json';
          $process = null;
          $pipes = [];

          $removeTree = static function (string $path) use (&$removeTree): void {
              if (!is_dir($path)) {
                  if (is_file($path)) @unlink($path);
                  return;
              }
              foreach (scandir($path) ?: [] as $entry) {
                  if ($entry === '.' || $entry === '..') continue;
                  $removeTree($path . DIRECTORY_SEPARATOR . $entry);
              }
              @rmdir($path);
          };

          try {
              $database = new JsonDatabase($root);
              $database->transaction(static function (array &$data): void {
                  $data['invites'] = [['id' => 'initial']];
              });

              $database->exclusiveReadOnlySections(
                  ['invites'],
                  function (array $snapshot) use (
                      &$process,
                      &$pipes,
                      $root,
                      $readyFile,
                      $resultFile,
                      $assert
                  ): void {
                      $assert(array_keys($snapshot) === ['invites'],
                          'Exclusive snapshot must decode only requested sections.');
                      $assert(($snapshot['invites'][0]['id'] ?? '') === 'initial',
                          'Exclusive snapshot must expose the stable pre-writer state.');

                      $process = proc_open(
                          [PHP_BINARY, __FILE__, 'child', $root, $readyFile, $resultFile],
                          [
                              0 => ['pipe', 'r'],
                              1 => ['pipe', 'w'],
                              2 => ['pipe', 'w'],
                          ],
                          $pipes
                      );
                      $assert(is_resource($process), 'Child JSON writer must start.');
                      fclose($pipes[0]);

                      $deadline = microtime(true) + 3.0;
                      while (!is_file($readyFile) && microtime(true) < $deadline) usleep(10000);
                      $assert(is_file($readyFile), 'Child writer must reach the lock attempt.');
                      usleep(180000);
                      $status = proc_get_status($process);
                      $assert(!empty($status['running']),
                          'JSON writer must remain blocked while the exclusive snapshot callback runs.');
                  }
              );

              $stdout = stream_get_contents($pipes[1]);
              $stderr = stream_get_contents($pipes[2]);
              fclose($pipes[1]);
              fclose($pipes[2]);
              $exitCode = proc_close($process);
              $assert($exitCode === 0, 'Child JSON writer must finish after lock release: ' . $stderr . $stdout);
              $timing = json_decode(file_get_contents($resultFile) ?: '{}', true);
              $assert(is_array($timing) && (float)($timing['elapsed'] ?? 0) >= 0.15,
                  'Child writer must measure the exclusive snapshot blocking interval.');

              $final = $database->readOnlySections(
                  ['invites'],
                  static fn(array $data): array => $data['invites'] ?? []
              );
              $assert(count($final) === 2 && ($final[1]['id'] ?? '') === 'child-write',
                  'Blocked writer must commit normally after the snapshot lock is released.');

              fwrite(STDOUT, "JsonDatabaseExclusiveSnapshotTest: {$assertions} assertions passed\n");
          } finally {
              if (is_resource($process)) @proc_terminate($process);
              $removeTree($root);
          }
          '''
          write(
              'bot/tests/JsonDatabaseExclusiveSnapshotTest.php',
              re.sub(r'^          ', '', lock_test, flags=re.M),
          )

          contract = r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $read = static function (string $path) use ($root): string {
              $content = file_get_contents($root . '/' . $path);
              if (!is_string($content)) throw new RuntimeException('Cannot read ' . $path);
              return $content;
          };
          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $interface = $read('bot/storage/contracts/ExclusiveSnapshotStorageInterface.php');
          $database = $read('bot/storage/JsonDatabase.php');
          $adapter = $read('bot/storage/JsonStorageAdapter.php');
          $endpoint = $read('bot/invites.php');
          $repository = $read('bot/invites/RuntimeInviteRepository.php');
          $runtimeTest = $read('bot/tests/RuntimeInviteRepositoryTest.php');
          $lockTest = $read('bot/tests/JsonDatabaseExclusiveSnapshotTest.php');
          $e2e = $read('e2e/staging/d2-d3-d5-integration.spec.mjs');

          $assert(str_contains($interface, 'interface ExclusiveSnapshotStorageInterface')
              && str_contains($interface, 'exclusiveReadOnlySections'),
              'The storage contract must expose an explicit exclusive snapshot capability.');
          $assert(str_contains($adapter, 'ExclusiveSnapshotStorageInterface')
              && str_contains($adapter, '$this->database->exclusiveReadOnlySections('),
              'The JSON adapter must implement the exclusive snapshot contract.');
          $assert(str_contains($database, 'return $this->readSectionsWithLock($sections, LOCK_EX, $callback);')
              && str_contains($database, 'flock($lockHandle, $lockMode)'),
              'The JSON database must hold one exclusive file lock through the bridge callback.');

          $detached = '$snapshot = $db->readOnly(static fn(array $data): array => $data);';
          $assert(!str_contains($endpoint, $detached)
              && str_contains($endpoint, '$db->exclusiveReadOnlySections(')
              && str_contains($endpoint, "['invites']")
              && str_contains($endpoint, 'static fn(array $data): array => $runtimeInvites->synchronize($data)'),
              'Invite synchronization must consume the snapshot while its exclusive JSON lock is still held.');

          $assert(str_contains($repository, "SELECT GET_LOCK(:lock_name, 10)")
              && str_contains($repository, "SELECT RELEASE_LOCK(:lock_name)")
              && str_contains($repository, 'return $database->transaction(')
              && str_contains($repository, 'Invite DB synchronization lock is unavailable.'),
              'The DB mirror must use one process-wide lock and one outer transaction.');
          $assert(str_contains($runtimeTest, 'A failed full synchronization must roll back rows inserted earlier in the same pass')
              && str_contains($lockTest, 'JSON writer must remain blocked while the exclusive snapshot callback runs.'),
              'Focused tests must prove DB rollback and JSON writer serialization.');
          $assert(str_contains($e2e, 'create_direct status; public error: ${createPublicError}')
              && str_contains($e2e, 'Share, picker and cancellation keep terminal card in place'),
              'The live two-player regression must preserve the exact rapid Share-to-direct path.');

          fwrite(STDOUT, "ProductionMvp14InviteBridgeSerializedSnapshotTest: {$assertions} assertions passed\n");
          '''
          write(
              'bot/tests/ProductionMvp14InviteBridgeSerializedSnapshotTest.php',
              re.sub(r'^          ', '', contract, flags=re.M),
          )
          PY

      - name: Run focused syntax and architecture checks
        shell: bash
        run: |
          php -l bot/storage/contracts/ExclusiveSnapshotStorageInterface.php
          php -l bot/storage/JsonDatabase.php
          php -l bot/storage/JsonStorageAdapter.php
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/invites.php
          php -l bot/tests/JsonDatabaseExclusiveSnapshotTest.php
          php -l bot/tests/ProductionMvp14InviteBridgeSerializedSnapshotTest.php
          node --check e2e/staging/d2-d3-d5-integration.spec.mjs
          php bot/tests/JsonDatabaseExclusiveSnapshotTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/ProductionMvp14InviteBridgeSerializedSnapshotTest.php

      - name: Commit isolated root fix
        shell: bash
        run: |
          rm .github/workflows/mvp14-invite-bridge-serialized-snapshot-apply.yml
          git config user.name "manufact-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize invite JSON to DB snapshots"
          git push origin HEAD:agent/mvp14-invite-bridge-serialized-snapshot

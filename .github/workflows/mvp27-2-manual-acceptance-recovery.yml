name: MVP-27.2 Manual Acceptance Recovery

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/games/game-card-copy.js'
      - 'app/assets/js/localization/i18n.js'
      - 'app/assets/js/localization/runtime-dom.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/profile/mgw-avatar-registry.js'
      - 'app/assets/js/profile/mgw-profile-backgrounds.js'
      - 'app/assets/js/profile/mgw-profile-badges.js'
      - 'app/assets/js/profile/mgw-profile-frames.js'
      - 'app/assets/js/profile/mgw-profile-entry-effects.js'
      - 'app/assets/js/profile/mgw-profile-reactions.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-v4.js'
      - 'app/assets/js/profile/mgw-profile-victory-effects-card-parity.js'
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/js/screens/weekly-match-info.js'
      - 'app/assets/js/screens/game-screen-v102.js'
      - 'app/assets/js/screens/home-screen.js'
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/assets/js/screens/search-screen-v102.js'
      - 'app/locales/en.json'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/history/RuntimeHistoryRepository.php'
      - 'bot/notifications.php'
      - 'bot/services/NotificationService.php'
      - 'bot/tests/Mvp27_2ManualRecoveryHistoryTest.php'
      - 'ops/checks/mvp27_2_manual_acceptance_recovery_contract.mjs'
      - 'ops/checks/mvp27_2_locale_cards_inplace_contract.mjs'
      - '.github/workflows/mvp27-2-manual-acceptance-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          for file in             app/assets/js/api/client.js             app/assets/js/games/game-card-copy.js             app/assets/js/localization/i18n.js             app/assets/js/localization/runtime-dom.js             app/assets/js/main-v110-handoff-shell.js             app/assets/js/profile/mgw-avatar-registry.js             app/assets/js/profile/mgw-profile-backgrounds.js             app/assets/js/profile/mgw-profile-badges.js             app/assets/js/profile/mgw-profile-frames.js             app/assets/js/screens/game-screen-v102.js             app/assets/js/screens/home-screen.js             app/assets/js/screens/notifications-screen-v110r13.js             app/assets/js/screens/profile-screen-v110.js             app/assets/js/screens/search-screen-v102.js
          do
            node --input-type=module --check < "$file"
          done
          node --check ops/checks/mvp27_2_manual_acceptance_recovery_contract.mjs
          node --check ops/checks/mvp27_2_locale_cards_inplace_contract.mjs
          for file in app/assets/js/profile/mgw-profile-entry-effects.js app/assets/js/profile/mgw-profile-reactions.js app/assets/js/profile/mgw-profile-victory-effects-v4.js app/assets/js/profile/mgw-profile-victory-effects-card-parity.js app/assets/js/screens/store-screen.js app/assets/js/screens/weekly-match-info.js; do node --input-type=module --check < "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('app/locales/ru.json','utf8')); JSON.parse(require('fs').readFileSync('app/locales/en.json','utf8'))"
          php -l app/runtime/client/version-manifest.php
          php -l bot/history/RuntimeHistoryRepository.php
          php -l bot/notifications.php
          php -l bot/services/NotificationService.php
          php -l bot/tests/Mvp27_2ManualRecoveryHistoryTest.php

      - name: Recovery ownership contract
        run: node ops/checks/mvp27_2_manual_acceptance_recovery_contract.mjs

      - name: In-place locale and cosmetic card ownership
        run: node ops/checks/mvp27_2_locale_cards_inplace_contract.mjs

      - name: Canonical history projection
        run: php bot/tests/Mvp27_2ManualRecoveryHistoryTest.php

      - name: Preserve accepted history behavior
        run: |
          set -euo pipefail
          php bot/tests/Mvp17_5HistoryChronologyRegressionTest.php
          php bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php
          php bot/tests/Mvp17_5ResultHistoryFix2ContractTest.php
          php bot/tests/Mvp17_5ResultHistorySingleOwnerRaceContractTest.php
          php bot/tests/RuntimeHistoryProductionContractTest.php

      - name: Preserve localization foundations
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
          node ops/checks/mvp27_2_1_english_shell_home_contract.mjs
          node ops/checks/mvp27_2_english_catalog_draft_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs --sample

      - name: Diff hygiene and secret scan
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha || github.sha^ }}" "${{ github.event.pull_request.head.sha || github.sha }}"
          node scripts/ci/check-secrets.mjs

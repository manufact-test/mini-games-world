name: Checkers single-flight live owner probe

on:
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-single-flight-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify single-flight contract locally
        shell: bash
        run: |
          set -Eeuo pipefail
          owner='app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js'
          manifest='app/runtime/client/version-manifest.php'
          node --check "$owner"
          grep -F 'shouldPreserveSingleFlight' "$owner"
          grep -F "container.dataset.mgwCheckersRealMove !== '1'" "$owner"
          grep -F '.checkers-piece.mgw-checkers-live-real-move-piece' "$owner"
          grep -F 'activeMove.from !== incomingMove.from || activeMove.to !== incomingMove.to' "$owner"
          grep -F "renderer-single-flight-v1.js?v=2&mvp19_6=single-flight-dom-v1&real_flight=css-cascade-v1" "$manifest"
          grep -F 'single_flight=dom-v1&real_flight=css-cascade-v1' "$manifest"

      - name: Wait for exact staging deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output /tmp/mgw-readiness.json; then
              ok="$(jq -r '.ok // false' /tmp/mgw-readiness.json)"
              environment="$(jq -r '.environment // ""' /tmp/mgw-readiness.json)"
              base_host="$(jq -r '.base_host // ""' /tmp/mgw-readiness.json)"
              live_fingerprint="$(jq -r '.source_fingerprint_sha256 // ""' /tmp/mgw-readiness.json)"
              if [[ "$ok" == 'true' && "$environment" == 'staging' && "$base_host" == 'seashell-okapi-889488.hostingersite.com' && "$live_fingerprint" == "$expected_fingerprint" ]]; then
                ready=1
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Compare single-flight owner byte-for-byte
        shell: bash
        run: |
          set -Eeuo pipefail
          local_file='app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js'
          live_file='/tmp/live-checkers-single-flight.js'
          matched=0
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --header 'Cache-Control: no-cache' \
              "${MGW_STAGING_ORIGIN}/app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js?probe=${GITHUB_SHA}-${attempt}" \
              --output "$live_file"
            if cmp -s "$local_file" "$live_file"; then matched=1; break; fi
            sleep 5
          done
          test "$matched" = '1'
          grep -F 'one physical moving checker' "$live_file"
          grep -F 'shouldPreserveSingleFlight' "$live_file"
          grep -F 'incomingMoveCoordinates' "$live_file"
          grep -F 'activeMoveCoordinates' "$live_file"

name: Align D1 canonical contracts

on:
  pull_request:
    branches:
      - agent/mvp14-d1-contract-trigger-base

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align historical contracts
        run: python tools/align_d1_canonical_contracts.py

      - name: Run focused contracts
        run: |
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php
          php bot/tests/ProductionHotPathLatencyFixContractTest.php
          php bot/tests/ProductionMvp14D1FollowupStressE2ETest.php
          php bot/tests/ProductionMvp14D1StressObserverV118Test.php
          php bot/tests/ProductionMvp14DeferredNotificationFirstFrameE2ETest.php
          php bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php
          php bot/tests/ProductionV96RootCauseStabilizationTest.php

      - name: Commit alignment and remove temporary runner
        run: |
          rm -f tools/align_d1_canonical_contracts.py .github/workflows/align-d1-canonical-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align historical contracts with canonical cache identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

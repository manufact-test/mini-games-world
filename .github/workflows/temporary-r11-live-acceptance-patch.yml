name: TEMP R11 live acceptance patch

on:
  push:
    branches:
      - agent/mvp14r13-staging-r11-live-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14r13-staging-r11-live-acceptance
          fetch-depth: 0

      - name: Apply exact live acceptance patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          spec_path = Path('e2e/staging/two-context.spec.mjs')
          spec = spec_path.read_text(encoding='utf-8')

          spec = replace_once(
              spec,
              "    expect(playerA.cookie.value).not.toBe(playerB.cookie.value);\n\n"
              "    expect(playerA.diagnostics.pageErrors).toEqual([]);",
              "    expect(playerA.cookie.value).not.toBe(playerB.cookie.value);\n\n"
              "    await playerA.page.locator('#profileOpen').click();\n"
              "    await expect(playerA.page.locator('#screen-profile')).toHaveClass(/active/, { timeout: 20_000 });\n"
              "    await expect(playerA.page.locator('#profileName')).toHaveText(/\\S+/, { timeout: 20_000 });\n"
              "    expect((await playerA.page.locator('#profileName').innerText()).trim()).not.toBe('Игрок');\n"
              "    await playerA.page.locator('[data-back-home]').click();\n"
              "    await expect(playerA.page.locator('#screen-home')).toHaveClass(/active/, { timeout: 20_000 });\n\n"
              "    expect(playerA.diagnostics.pageErrors).toEqual([]);",
              'profile UI acceptance',
          )

          helper_anchor = "async function clickInviteAction(page, button, action) {"
          helpers = r'''async function openNotificationToastAndWaitForAction(page, token, action) {
            const toast = page.locator('#notificationToast');
            await expect(toast).toBeVisible({ timeout: 25_000 });
            await expect(toast).toHaveClass(/show/, { timeout: 25_000 });
            await toast.click();
            await expect(page.locator('#sheet .sheet-head h2')).toHaveText('Уведомления', { timeout: 20_000 });

            const selector = `[data-invite-action="${action}"][data-invite-token="${token}"]`;
            const actionButton = page.locator(selector);
            await expect(actionButton).toBeVisible({ timeout: 25_000 });
            await expect(actionButton).toBeEnabled();
            return actionButton;
          }

          async function closeNotificationSheetAndAssertStable(page) {
            const overlay = page.locator('#sheetOverlay');
            const close = page.locator('#sheet [data-close-sheet]').first();
            await expect(close).toBeVisible({ timeout: 15_000 });
            await close.click();
            await expect(overlay).not.toHaveClass(/active/, { timeout: 15_000 });
            await page.waitForTimeout(3_500);
            await expect(overlay).not.toHaveClass(/active/);
            await expect(page.locator('#notificationToast')).not.toHaveClass(/show/);
          }

          '''
          spec = replace_once(spec, helper_anchor, helpers + helper_anchor, 'notification toast helpers')

          old_accept = "    const acceptButton = await openNotificationsAndWaitForAction(\n"
          old_accept += "      playerB.page,\n      inviteToken,\n      'accept',\n    );\n"
          old_accept += "    const accepted = await clickInviteAction(playerB.page, acceptButton, 'accept');"
          new_accept = "    const toastActionButton = await openNotificationToastAndWaitForAction(\n"
          new_accept += "      playerB.page,\n      inviteToken,\n      'accept',\n    );\n"
          new_accept += "    await expect(toastActionButton).toBeVisible();\n"
          new_accept += "    await closeNotificationSheetAndAssertStable(playerB.page);\n\n"
          new_accept += "    const acceptButton = await openNotificationsAndWaitForAction(\n"
          new_accept += "      playerB.page,\n      inviteToken,\n      'accept',\n    );\n"
          new_accept += "    const accepted = await clickInviteAction(playerB.page, acceptButton, 'accept');"
          spec = replace_once(spec, old_accept, new_accept, 'one-shot mobile notification acceptance')

          match_marker = "test('A invites B through notifications and they finish a Tic Tac Toe match'"
          ui_test = r'''test('Player A uses Share, player picker and cancellation through the live UI', async ({ browser }, testInfo) => {
            let playerA;
            let playerB;
            let directToken = '';

            try {
              playerA = await openPlayer(browser, 'A', testInfo);
              playerB = await openPlayer(browser, 'B', testInfo);
              await cleanupPlayer(playerA);
              await cleanupPlayer(playerB);

              await playerA.page.evaluate(() => {
                if (window.Telegram?.WebApp) window.Telegram.WebApp.shareMessage = undefined;
              });

              await playerA.page.locator('[data-invite-friend="tictactoe"]').click();
              await expect(playerA.page.locator('#sheet .sheet-head h2')).toContainText('Пригласить в', { timeout: 20_000 });

              const draftPromise = playerA.page.waitForResponse(isActionResponse(INVITES_ROUTE, 'create_link_draft'), {
                timeout: 30_000,
              });
              await playerA.page.locator('[data-create-link-invite]').click();
              const draftResponse = await draftPromise;
              const draftPayload = await draftResponse.json().catch(() => null);
              expect(draftResponse.status()).toBe(200);
              expect(draftPayload?.ok).toBe(true);
              expect(String(draftPayload?.invite?.token || '')).toMatch(/^[A-Za-z0-9_-]{12,80}$/);

              await expect(playerA.page.locator('#sheet .sheet-head h2')).toHaveText('Ссылка подготовлена', {
                timeout: 20_000,
              });
              await expect(playerA.page.locator('[data-copy-invite-link]')).toBeVisible();
              await expect(playerA.page.locator('[data-discard-draft]')).toBeVisible();

              const discardPromise = playerA.page.waitForResponse(isActionResponse(INVITES_ROUTE, 'discard_draft'), {
                timeout: 30_000,
              });
              await playerA.page.locator('[data-discard-draft]').click();
              const discardResponse = await discardPromise;
              expect(discardResponse.status()).toBe(200);
              expect((await discardResponse.json().catch(() => null))?.ok).toBe(true);
              await expect(playerA.page.locator('#sheet .sheet-head h2')).toContainText('Пригласить в', {
                timeout: 20_000,
              });

              await playerA.page.locator('[data-open-player-picker]').click();
              await expect(playerA.page.locator('#sheet .sheet-head h2')).toHaveText('Выберите игрока', {
                timeout: 20_000,
              });
              const opponent = playerA.page.locator('[data-direct-opponent="stg_test_player_b"]');
              await expect(opponent).toBeVisible({ timeout: 25_000 });
              await expect(opponent).toBeEnabled();

              const createPromise = playerA.page.waitForResponse(isActionResponse(INVITES_ROUTE, 'create_direct'), {
                timeout: 30_000,
              });
              await opponent.click();
              const createResponse = await createPromise;
              const created = await createResponse.json().catch(() => null);
              expect(createResponse.status()).toBe(200);
              expect(created?.ok).toBe(true);
              directToken = String(created?.invite?.token || '');
              expect(directToken).toMatch(/^[A-Za-z0-9_-]{12,80}$/);
              await expect(playerA.page.locator('#sheet .sheet-head h2')).toHaveText('Приглашение отправлено', {
                timeout: 20_000,
              });

              const cancelButton = playerA.page.locator(
                `[data-invite-action="cancel"][data-invite-token="${directToken}"]`,
              );
              await expect(cancelButton).toBeVisible();
              const cancelled = await clickInviteAction(playerA.page, cancelButton, 'cancel');
              expect(['cancelled', 'canceled']).toContain(String(cancelled?.invite?.status || ''));
              await expect(playerA.page.locator('#sheetOverlay')).not.toHaveClass(/active/, { timeout: 15_000 });

              const bNotifications = await expectPlayerRequest(
                playerB.page,
                '/bot/notifications.php',
                { markRead: true },
                'Player B cancelled invitation notifications',
              );
              const cancelledItem = (Array.isArray(bNotifications.items) ? bNotifications.items : [])
                .find(item => String(item?.invite_token || '') === directToken);
              expect(cancelledItem).toBeTruthy();
              expect(Array.isArray(cancelledItem.actions) ? cancelledItem.actions : []).toEqual([]);

              expect(playerA.diagnostics.pageErrors).toEqual([]);
              expect(playerB.diagnostics.pageErrors).toEqual([]);
              expect(playerA.diagnostics.failedRequests).toEqual([]);
              expect(playerB.diagnostics.failedRequests).toEqual([]);
              expect(playerA.diagnostics.serverErrors).toEqual([]);
              expect(playerB.diagnostics.serverErrors).toEqual([]);

              await testInfo.attach('staging-r11-live-ui-report', {
                body: Buffer.from(`${JSON.stringify({
                  ok: true,
                  profileUiCovered: true,
                  shareDraftPrepared: true,
                  shareDraftDiscarded: true,
                  playerPickerUsed: true,
                  directInviteCancelled: true,
                  cancelledInviteActionsRemoved: true,
                  directTokenSha256: sha256(directToken),
                  productionChanged: false,
                  livePaymentsUsed: false,
                }, null, 2)}\n`, 'utf8'),
                contentType: 'application/json',
              });
            } finally {
              if (playerA) await cleanupPlayer(playerA);
              if (playerB) await cleanupPlayer(playerB);
              if (playerA?.context) {
                await revokeContext(playerA.context);
                await playerA.context.close();
              }
              if (playerB?.context) {
                await revokeContext(playerB.context);
                await playerB.context.close();
              }
            }
          });

          '''
          spec = replace_once(spec, match_marker, ui_test + match_marker, 'live Share/player-picker/cancel test')
          spec_path.write_text(spec, encoding='utf-8')

          contract = r'''<?php
          declare(strict_types=1);

          $root = dirname(__DIR__, 2);
          $spec = file_get_contents($root . '/e2e/staging/two-context.spec.mjs');
          $notifications = file_get_contents($root . '/app/assets/js/screens/notifications-screen-v99.js');
          $invites = file_get_contents($root . '/app/assets/js/games/game-invites.js');
          if (!is_string($spec) || !is_string($notifications) || !is_string($invites)) {
              throw new RuntimeException('Missing live R11 acceptance source.');
          }

          $assertions = 0;
          $assert = static function (bool $condition, string $message) use (&$assertions): void {
              $assertions++;
              if (!$condition) throw new RuntimeException($message);
          };

          $assert(str_contains($spec, "locator('#profileOpen').click()")
              && str_contains($spec, "locator('#screen-profile')")
              && str_contains($spec, "locator('[data-back-home]').click()"),
              'The live suite must open and close the rendered profile screen.');

          $assert(str_contains($spec, 'openNotificationToastAndWaitForAction')
              && str_contains($spec, "locator('#notificationToast')")
              && str_contains($spec, 'closeNotificationSheetAndAssertStable')
              && str_contains($spec, 'waitForTimeout(3_500)')
              && str_contains($spec, "not.toHaveClass(/show/)"),
              'The live suite must click the mobile notification toast and prove it stays dismissed.');

          $assert(str_contains($spec, "actionResponse(INVITES_ROUTE, 'create_link_draft')") === false
              && str_contains($spec, "isActionResponse(INVITES_ROUTE, 'create_link_draft')")
              && str_contains($spec, "locator('[data-copy-invite-link]')")
              && str_contains($spec, "isActionResponse(INVITES_ROUTE, 'discard_draft')"),
              'The live suite must prepare and discard a real Share draft.');

          $assert(str_contains($spec, "locator('[data-open-player-picker]').click()")
              && str_contains($spec, "data-direct-opponent=\"stg_test_player_b\"")
              && str_contains($spec, "isActionResponse(INVITES_ROUTE, 'create_direct')")
              && str_contains($spec, "data-invite-action=\"cancel\""),
              'The live suite must choose TEST PLAYER B and cancel the real direct invitation.');

          $assert(str_contains($spec, 'cancelledInviteActionsRemoved: true')
              && str_contains($spec, 'productionChanged: false')
              && str_contains($spec, 'livePaymentsUsed: false'),
              'The safe report must preserve staging-only and no-payment evidence.');

          $assert(str_contains($notifications, "ANNOUNCED_STORAGE_KEY = 'mgw_announced_notifications_v3'")
              && str_contains($notifications, "el.addEventListener('click'")
              && str_contains($notifications, 'dismissNotificationToast();')
              && str_contains($notifications, 'openNotificationsSheet();'),
              'The tested toast must remain backed by canonical notification ownership.');

          $assert(str_contains($invites, "data-open-player-picker")
              && str_contains($invites, "data-create-link-invite")
              && str_contains($invites, "data-direct-opponent")
              && str_contains($invites, "data-invite-action=\"cancel\""),
              'The tested controls must remain backed by the production invite coordinator.');

          $assert(!str_contains($spec, 'lemonchiffon-gerbil-545102.hostingersite.com')
              && !str_contains($spec, 'mini-games-world.com')
              && !str_contains($spec, 'setup_secret'),
              'The live R11 acceptance scenario must contain no production target or long-lived secret.');

          fwrite(STDOUT, "ProductionMvp14R13R11LiveAcceptanceTest: {$assertions} assertions passed\n");
          '''
          Path('bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php').write_text(contract, encoding='utf-8')
          PY

          node --check e2e/staging/two-context.spec.mjs
          php -l bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php
          php bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-r11-live-acceptance-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/staging/two-context.spec.mjs \
            bot/tests/ProductionMvp14R13R11LiveAcceptanceTest.php \
            .github/workflows/temporary-r11-live-acceptance-patch.yml
          git diff --cached --check
          git commit -m 'Automate live R11 profile notification share and invite acceptance'
          git push origin HEAD:agent/mvp14r13-staging-r11-live-acceptance

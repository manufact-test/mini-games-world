name: MVP-15.3 live import diagnostic

on:
  push:
    branches:
      - agent/mvp-15-3-preloader-import-diagnostic
    paths:
      - '.github/workflows/mvp15-3-live-import-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - uses: actions/checkout@v4
      - name: Print live app and readiness responses
        shell: bash
        run: |
          set -u
          for path in '/app/' '/app/v114.php' '/app/index.html' '/bot/staging-e2e-readiness.php'; do
            echo "=== ${path} ==="
            rm -f /tmp/headers.txt /tmp/body.txt
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -D /tmp/headers.txt "${ORIGIN}${path}" -o /tmp/body.txt -w '%{http_code}' || true)"
            echo "HTTP ${code}"
            sed -n '1,20p' /tmp/headers.txt || true
            echo '--- BODY ---'
            sed -n '1,120p' /tmp/body.txt || true
            echo '------------'
          done

name: MVP-15.3 live import diagnostic

on:
  push:
    branches:
      - agent/mvp-15-3-preloader-import-diagnostic
    paths:
      - '.github/workflows/mvp15-3-live-import-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://seashell-okapi-889488.hostingersite.com
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact live assets
        shell: bash
        run: |
          set -Eeuo pipefail
          declare -a urls=(
            '/app/'
            '/app/assets/js/main.js?v=98.4-wallet-15-3'
            '/app/assets/js/ui.js?v=90-wallet-15-3'
            '/app/assets/js/screens/home-screen.js?v=75-wallet-15-3'
            '/app/assets/js/screens/profile-screen.js?v=93-wallet-15-3'
            '/app/assets/js/screens/store-screen.js?v=35-wallet-15-3'
            '/app/assets/css/main.css?v=93-wallet-15-3'
            '/app/assets/css/components/cards.css?v=125&sk=1&wallet=unified'
            '/app/assets/css/screens/profile.css?v=125&sk=1&wallet=unified'
            '/bot/staging-e2e-readiness.php'
          )
          for path in "${urls[@]}"; do
            echo "=== ${path} ==="
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
              -D /tmp/headers.txt "${ORIGIN}${path}" -o /tmp/body.txt
            head -n 8 /tmp/headers.txt
            wc -c /tmp/body.txt
            case "$path" in
              '/app/') grep -F 'main.js?v=98.4-wallet-15-3' /tmp/body.txt ;;
              '/app/assets/js/main.js?v=98.4-wallet-15-3')
                grep -F "profile-screen.js?v=93-wallet-15-3" /tmp/body.txt
                grep -F "ui.js?v=90-wallet-15-3" /tmp/body.txt ;;
              '/app/assets/js/ui.js?v=90-wallet-15-3') grep -F "balanceUnified" /tmp/body.txt ;;
              '/app/assets/js/screens/home-screen.js?v=75-wallet-15-3') grep -F "ui.js?v=90-wallet-15-3" /tmp/body.txt ;;
              '/app/assets/js/screens/profile-screen.js?v=93-wallet-15-3')
                grep -F 'MGW Coins' /tmp/body.txt
                grep -F "ui.js?v=90-wallet-15-3" /tmp/body.txt ;;
              '/app/assets/js/screens/store-screen.js?v=35-wallet-15-3') grep -F "ui.js?v=90-wallet-15-3" /tmp/body.txt ;;
              '/app/assets/css/main.css?v=93-wallet-15-3') grep -F "wallet=unified" /tmp/body.txt ;;
              '/app/assets/css/components/cards.css?v=125&sk=1&wallet=unified') grep -F 'MVP-15.3 unified wallet geometry' /tmp/body.txt ;;
              '/app/assets/css/screens/profile.css?v=125&sk=1&wallet=unified') grep -F 'MVP-15.3 single profile wallet' /tmp/body.txt ;;
              '/bot/staging-e2e-readiness.php') python3 -m json.tool /tmp/body.txt | head -n 80 ;;
            esac
          done

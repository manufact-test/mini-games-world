name: MVP-26.5 Disabled Platform Adapters

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'android-app/app/build.gradle'
      - 'android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java'
      - 'android-app/app/src/main/java/com/minigamesworld/app/platform/**'
      - 'android-app/app/src/test/java/com/minigamesworld/app/platform/**'
      - 'android-app/tools/verify-platform-adapters.py'
      - 'android-app/docs/MVP26_5_DISABLED_PLATFORM_ADAPTERS.md'
      - '.github/workflows/mvp26-5-platform-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    name: Disabled adapter contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify provider-neutral adapter ownership
        run: |
          set -euo pipefail
          python3 android-app/tools/verify-platform-adapters.py

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Frozen product-boundary guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            bot/games bot/ratings bot/tournaments bot/economy bot/ledger



  android-build:
    name: Android adapter regression build/lint/unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test lint and assemble
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify accepted package signing identity
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/mgw-mvp26-5-signing.txt
          grep -F 'CN=MGW Acceptance, O=Mini Games World, C=PL' /tmp/mgw-mvp26-5-signing.txt

      - name: Upload adapter regression APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-5-disabled-platform-adapters-regression-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-5-disabled-platform-adapters-regression-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

name: MVP-25.5 Repository secret scan

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
  push:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp25-5-secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Tracked repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify secret-scan gate contract
        run: node scripts/ci/check-secrets-contract.mjs

      - name: Reject tracked private config and live credentials
        run: node scripts/ci/check-secrets.mjs

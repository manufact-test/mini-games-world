name: Checkers exact pre-b94d restore

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/v110.php'
      - 'app/assets/css/games/checkers/game.css'
      - 'app/assets/css/games/checkers/telegram-height-fit-v1.css'
      - 'app/assets/js/games/checkers/renderer.js'
      - 'app/assets/css/production-v108-profile-entry-preview-live-owner-checkers-fit.css'
      - 'app/runtime/client/version-manifest.php'
      - 'app/locales/ru.json'
      - 'ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/CheckersTelegramFooterScrollTailContractTest.php'
      - 'bot/tests/CheckersTelegramViewportHeightFitContractTest.php'
      - '.github/workflows/checkers-telegram-footer-scroll-tail.yml'

jobs:
  contract:
    if: ${{ !startsWith(github.head_ref, 'agent/mvp23-manual-acceptance-') && !startsWith(github.head_ref, 'agent/mvp23-mobile-cold-first-interaction-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l bot/tests/CheckersTelegramFooterScrollTailContractTest.php
      - run: php bot/tests/CheckersTelegramFooterScrollTailContractTest.php
      - run: php -l bot/tests/CheckersTelegramViewportHeightFitContractTest.php
      - run: php bot/tests/CheckersTelegramViewportHeightFitContractTest.php
      - run: php -l app/v110.php
      - run: php -l app/runtime/client/version-manifest.php
      - run: node --check app/assets/js/games/checkers/renderer.js
      - run: node --check ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs
      - run: node ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs

name: MVP-27.1 Active Client Entry Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/v110.php'
      - 'app/v120.php'
      - 'app/locales/ru.json'
      - 'bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php'
      - 'bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php'
      - 'ops/checks/mvp27_1_active_client_entry_localization_contract.mjs'
      - 'ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-active-client-entry-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-client-entry-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and focused contracts
        run: |
          set -euo pipefail
          php -l app/v110.php
          php -l app/v120.php
          php -l bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php -l bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php
          node --check ops/checks/mvp27_1_active_client_entry_localization_contract.mjs
          node --check ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_active_client_entry_localization_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          php bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php bot/tests/Mvp25_2FinalHumanCopyClosureContractTest.php
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          php bot/tests/Mvp27_1LocalizationArchitectureAuditTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-active-client-entry-localization')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/v110\\.php|app/locales/ru\\.json|bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest\\.php|bot/tests/Mvp25_2FinalHumanCopyClosureContractTest\\.php|ops/checks/mvp27_1_active_client_entry_localization_contract\\.mjs|ops/checks/mvp27_1_active_shell_copy_bundle_contract\\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\\.json|\\.github/workflows/mvp27-1-active-client-entry-localization\\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected active client-entry localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

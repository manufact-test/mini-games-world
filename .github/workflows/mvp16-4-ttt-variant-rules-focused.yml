name: MVP-16.4 TTT variant rules focused
on:
  push:
    branches: [agent/mvp-16-4-ttt-variant-rules]
    paths: ['.github/workflows/mvp16-4-ttt-variant-rules-focused.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Focused contracts
        run: |
          set -Eeuo pipefail
          node ops/checks/mvp16_4_ttt_variant_rules_contract.mjs
          node ops/checks/mvp16_4_unified_game_setup_contract.mjs
          node ops/checks/mvp16_4_setup_ui_polish_contract.mjs
          node ops/checks/mvp16_3_shell_navigation_contract.mjs
          node ops/checks/mvp16_1_router_lifecycle_contract.mjs
          php bot/tests/Mvp161ClientBootstrapRouterTest.php
          php bot/tests/Mvp162LocalizationInfrastructureTest.php
          node --check app/assets/js/games/game-rules.js
          node --check app/assets/js/games/tictactoe/rules.js
          node --check app/assets/js/games/unified-game-launcher.js
          php -l app/runtime/client/version-manifest.php
          php app/v110.php > /tmp/mgw-v110.html
          grep -F 'main.css?v=161&sk=3&icons=c1efd5af&render=30&mvp16=setup-subtitle-width' /tmp/mgw-v110.html >/dev/null
          grep -F 'game-rules.js?v=76&mvp16=variant-rules' /tmp/mgw-v110.html >/dev/null
          test "$(grep -o '<script type="module" src="' /tmp/mgw-v110.html | wc -l)" -eq 1
          python3 scripts/ci/staging-runtime-fingerprint.py
          printf 'RUNTIME_FILES='
          grep -cve '^$' bot/helpers/staging-e2e-runtime-files.txt
          echo MVP16_4_TTT_VARIANT_RULES_FOCUSED=PASS
          echo FINGERPRINT_COVERAGE_RERUN=PASS

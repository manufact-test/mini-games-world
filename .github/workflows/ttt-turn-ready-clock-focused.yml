name: Tic Tac Toe turn-ready clock verifier

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l bot/services/MatchPreparationClockService.php
          php -l bot/services/MatchPreparationRuntimeService.php
      - name: Focused architecture and clock contracts
        run: |
          status=0
          for test_file in \
            bot/tests/PhaseBMatchPreparationClockServiceTest.php \
            bot/tests/PhaseBMatchPreparationRuntimeServiceTest.php \
            bot/tests/PhaseBActionGuardHandoffContractTest.php \
            bot/tests/PhaseBGameClockWriterDemotionContractTest.php \
            bot/tests/PhaseBReadOnlyGameWatchContractTest.php \
            bot/tests/PhaseBE2EAuthoritativeActionChainContractTest.php \
            bot/tests/TicTacToeAuthoritativeClockUiContractTest.php \
            bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php \
            bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
          do
            php "$test_file" || status=1
          done
          exit "$status"

name: Shield King accepted asset import temp

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.ref == 'agent/shield-king-light-metallic-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Import exact accepted assets
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPORT_BRANCH=agent/shield-king-accepted-icon-export
          EXPORT_SHA=bcb098b72333e5efa3247de82506550091710757
          EXPORT_ROOT=accepted-assets/shield-king-icons
          DEST=app/assets/icons/shield-king/accepted

          git fetch origin "${EXPORT_BRANCH}" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "${EXPORT_SHA}"
          git show "FETCH_HEAD:${EXPORT_ROOT}/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip" > /tmp/icons.zip
          git show "FETCH_HEAD:${EXPORT_ROOT}/MANIFEST.json" > /tmp/manifest.json

          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          unzip -q /tmp/icons.zip 'games/*' 'ui/*' -d "${DEST}"

          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          root = pathlib.Path('app/assets/icons/shield-king/accepted')
          expected = {x['path']:(x['sha256'], x['bytes']) for x in manifest['files']}
          actual = {}
          for path in sorted(root.rglob('*.webp')):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              actual[rel] = (hashlib.sha256(data).hexdigest(), len(data))
          assert len(expected) == 44, len(expected)
          assert actual == expected, (set(expected) - set(actual), set(actual) - set(expected))
          print(f'verified {len(actual)} accepted metallic assets')
          PY

          if git diff --quiet -- "${DEST}" && git ls-files --error-unmatch "${DEST}/games/tic-tac-toe.webp" >/dev/null 2>&1; then
            echo 'Accepted assets already imported.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${DEST}"
          git commit -m 'Shield King: import exact accepted metallic icon assets'
          git push origin "HEAD:${{ github.head_ref }}"

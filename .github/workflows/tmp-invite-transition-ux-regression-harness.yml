name: TMP invite transition UX regression harness

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/invite-transition-ux-regression-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invite-transition-ux-regression-harness
          fetch-depth: 0

      - name: Apply exact regression harness correction
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-invite-transition-ux-regression-harness.py
          node --check e2e/staging/invite-transition-ux-v1137.spec.mjs
          grep -Fq 'await notificationIsolation.stop();' e2e/staging/invite-transition-ux-v1137.spec.mjs
          grep -Fq "cancelHold = await holdSingleAction(playerB.page, 'cancel');" e2e/staging/invite-transition-ux-v1137.spec.mjs
          grep -Fq "isActionResponse(INVITES_ROUTE, 'sync')" e2e/staging/invite-transition-ux-v1137.spec.mjs
          git diff --check

      - name: Commit regression harness only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/staging/invite-transition-ux-v1137.spec.mjs
          git commit -m 'Correct invite transition UX regression isolation'
          git push origin HEAD:agent/invite-transition-ux-regression-harness

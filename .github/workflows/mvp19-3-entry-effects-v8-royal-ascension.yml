name: MVP-19.3 Entry Effects Entry02 Royal Ascension

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/entry-effects/**'
      - 'app/assets/css/entry-effects/**'
      - 'app/assets/media/cosmetics/entry-effects/**'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp19-3-entry-effects-v8-royal-ascension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  royal-ascension:
    name: Preserve accepted Entry02 Royal Ascension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard accepted Entry runtime identity
        run: |
          grep -F 'entry_live_img=premium-art-v7' app/runtime/client/version-manifest.php
          grep -F 'entry_v8=entry01-strike-entry02-royal-ascension-entry03-lord-entrance-v6' app/runtime/client/version-manifest.php
          test -s app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp
          git diff --check
      - name: Guard frozen accepted Entry visual owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/entry-effects \
            app/assets/css/entry-effects \
            app/assets/media/cosmetics/entry-effects

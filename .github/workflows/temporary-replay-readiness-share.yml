name: TEMP replay readiness Share fix

on:
  push:
    branches:
      - agent/mvp14r13-staging-readiness-share-single-owner-v2

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14r13-staging-readiness-share-single-owner-v2
          fetch-depth: 0

      - name: Replay verified files from prior branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin agent/mvp14r13-staging-readiness-share-single-owner
          git checkout origin/agent/mvp14r13-staging-readiness-share-single-owner -- \
            app/assets/js/first-interaction-readiness-v103.js \
            app/assets/js/main.js \
            app/index.html \
            app/v110.php \
            bot/tests/ProductionMvp14R13MainEntryCacheBustTest.php \
            bot/tests/ProductionMvp14R13NotificationAuthoritativeReadTest.php \
            bot/tests/ProductionMvp14R13NotificationSingleOwnerTest.php \
            bot/tests/ProductionMvp14R13ReadinessShareSingleOwnerTest.php \
            bot/tests/ProductionMvp14R13ShareSingleOwnerTest.php

          node --check app/assets/js/first-interaction-readiness-v103.js
          node --check app/assets/js/main.js
          php bot/tests/ProductionMvp14R13ReadinessShareSingleOwnerTest.php
          php bot/tests/ProductionMvp14R13NotificationSingleOwnerTest.php
          php bot/tests/ProductionMvp14R13ShareSingleOwnerTest.php

      - name: Commit replay and remove temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/temporary-replay-readiness-share.yml
          rm -f .github/replay-readiness-share.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Replay read-only Share readiness on latest staging'
          git push origin HEAD:agent/mvp14r13-staging-readiness-share-single-owner-v2

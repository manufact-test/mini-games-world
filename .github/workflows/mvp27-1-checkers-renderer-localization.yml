name: MVP-27.1 Checkers Renderer Localization

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/games/checkers/renderer.js'
      - 'app/assets/js/checkers-cosmetics/renderer-board-themes.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/Mvp19_6CheckersBoardsTest.php'
      - 'bot/tests/Mvp19_6CheckersMoveTrailAlignmentContractTest.mjs'
      - 'bot/tests/CheckersTelegramFooterScrollTailContractTest.php'
      - 'bot/tests/CheckersTelegramViewportHeightFitContractTest.php'
      - '.github/workflows/mvp27-1-checkers-renderer-localization.yml'
      - '.github/workflows/mvp19-6-checkers-boards.yml'
      - '.github/workflows/checkers-telegram-footer-scroll-tail.yml'
      - '.github/workflows/checkers-board-theme-live-probe.yml'
      - '.github/workflows/checkers-single-flight-live-probe.yml'
      - '.github/workflows/mvp26-6-android-product-parity.yml'
      - '.github/workflows/mvp19-9-domino-store-effects-v8.yml'
      - '.github/workflows/mvp19-9-domino-store-profile.yml'
      - '.github/workflows/mvp19-3-profile-game-cosmetics.yml'
      - '.github/workflows/mvp19-4-game-cosmetics-pilot.yml'
      - '.github/workflows/mvp19-6-profile-game-cosmetics-parity.yml'
      - 'bot/tests/Mvp19_4EffectsV2ContractTest.mjs'
      - 'bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest.mjs'
      - 'bot/tests/Mvp19_6CheckersEffectPreviewContractTest.mjs'
      - 'bot/tests/Mvp19_8GoLiveCosmeticsContractTest.mjs'
      - 'ops/checks/mvp27_1_domino_renderer_localization_contract.mjs'
      - '.github/workflows/mvp27-1-domino-renderer-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkers-renderer-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/checkers/renderer.js
          node --check app/assets/js/checkers-cosmetics/renderer-board-themes.js
          node --check ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs
          node --check bot/tests/Mvp19_6CheckersMoveTrailAlignmentContractTest.mjs
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp19_6CheckersBoardsTest.php
          php -l bot/tests/CheckersTelegramFooterScrollTailContractTest.php
          php -l bot/tests/CheckersTelegramViewportHeightFitContractTest.php
          node ops/checks/mvp27_1_checkers_renderer_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve accepted Checkers mechanics and presentation owners
        run: |
          set -euo pipefail
          php bot/tests/Mvp19_6CheckersBoardsTest.php
          node bot/tests/Mvp19_6CheckersMoveTrailAlignmentContractTest.mjs
          php bot/tests/CheckersTelegramFooterScrollTailContractTest.php
          php bot/tests/CheckersTelegramViewportHeightFitContractTest.php
          php bot/tests/Mvp14r2GamesContractTest.php
          php bot/tests/Mvp14r2GamesBaselineTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/games/checkers/renderer\.js|app/assets/js/checkers-cosmetics/renderer-board-themes\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_checkers_renderer_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/Mvp19_6CheckersBoardsTest\.php|bot/tests/Mvp19_6CheckersMoveTrailAlignmentContractTest\.mjs|bot/tests/CheckersTelegramFooterScrollTailContractTest\.php|bot/tests/CheckersTelegramViewportHeightFitContractTest\.php|bot/tests/Mvp19_4EffectsV2ContractTest\.mjs|bot/tests/Mvp19_6ProfileGameCosmeticsParityContractTest\.mjs|bot/tests/Mvp19_6CheckersEffectPreviewContractTest\.mjs|bot/tests/Mvp19_8GoLiveCosmeticsContractTest\.mjs|\.github/workflows/mvp27-1-checkers-renderer-localization\.yml|\.github/workflows/mvp19-6-checkers-boards\.yml|\.github/workflows/checkers-telegram-footer-scroll-tail\.yml|\.github/workflows/checkers-board-theme-live-probe\.yml|\.github/workflows/checkers-single-flight-live-probe\.yml|\.github/workflows/mvp26-6-android-product-parity\.yml|\.github/workflows/mvp19-9-domino-store-effects-v8\.yml|\.github/workflows/mvp19-9-domino-store-profile\.yml|\.github/workflows/mvp19-3-profile-game-cosmetics\.yml|\.github/workflows/mvp19-4-game-cosmetics-pilot\.yml|\.github/workflows/mvp19-6-profile-game-cosmetics-parity\.yml|ops/checks/mvp27_1_domino_renderer_localization_contract\.mjs|\.github/workflows/mvp27-1-domino-renderer-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Checkers localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

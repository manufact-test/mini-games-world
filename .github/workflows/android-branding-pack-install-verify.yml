name: Android Branding Pack Install Verify

on:
  pull_request:
    branches:
      - agent/android-branding-pack
    paths:
      - android-app/**
      - .github/workflows/android-branding-pack-install-verify.yml

permissions:
  contents: read

jobs:
  build-install-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout verifier head
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK, emulator and system image
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'

      - name: Verify isolated foundation contracts
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test, lint and assemble acceptance APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/app/v110.php?v=1123
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify package, signature and approved icon bytes
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.minigamesworld.app.acceptance'" /tmp/badging.txt
          ICON_ENTRY="$(unzip -Z1 "$APK" | grep -E 'res/drawable[^/]*/ic_mgw_launcher_art\.webp$' | head -n1)"
          test -n "$ICON_ENTRY"
          unzip -p "$APK" "$ICON_ENTRY" > /tmp/apk-icon.webp
          cmp android-app/app/src/main/res/drawable-nodpi/ic_mgw_launcher_art.webp /tmp/apk-icon.webp
          sha256sum android-app/app/src/main/res/drawable-nodpi/ic_mgw_launcher_art.webp /tmp/apk-icon.webp

      - name: Create Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd \
            --force \
            --name mgw_acceptance \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd mgw_acceptance \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -wipe-data \
            > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1

      - name: ADB install and launch gate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          adb install -r "$APK" | tee /tmp/adb-install.txt
          grep -F 'Success' /tmp/adb-install.txt
          adb shell pm path com.minigamesworld.app.acceptance
          adb shell am force-stop com.minigamesworld.app.acceptance
          adb shell am start -W -n com.minigamesworld.app.acceptance/com.minigamesworld.app.MainActivity | tee /tmp/launch.txt
          grep -E 'Status: ok|Complete' /tmp/launch.txt
          sleep 4
          adb shell pidof com.minigamesworld.app.acceptance
          adb exec-out screencap -p > /tmp/mgw-startup.png
          adb shell input keyevent KEYCODE_HOME
          sleep 2
          adb exec-out screencap -p > /tmp/mgw-home.png

      - name: Upload verified APK and screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-shield-king-acceptance-verified
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            /tmp/mgw-startup.png
            /tmp/mgw-home.png
            /tmp/adb-install.txt
            /tmp/launch.txt
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-shield-king-acceptance-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
            /tmp/emulator.log
          if-no-files-found: warn

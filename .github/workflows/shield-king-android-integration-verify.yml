name: Shield King Android integration verify

on:
  pull_request:
    branches:
      - agent/shield-king-android-integration
    paths:
      - android-app/**
      - .github/workflows/shield-king-android-integration-verify.yml

permissions:
  contents: read

jobs:
  build-install-launch:
    if: github.head_ref == 'agent/shield-king-android-integration-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify exact integration head and verifier-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = '21d184fea9b1555a87abccc67d76dec50c08137c'
          test "$(git rev-parse HEAD^)" = '21d184fea9b1555a87abccc67d76dec50c08137c'
          test "$(git diff --name-only 21d184fea9b1555a87abccc67d76dec50c08137c..HEAD)" = '.github/workflows/shield-king-android-integration-verify.yml'
          git diff --check d7be536a1391409dfad5a16efcb510a4f84d50b3..HEAD

      - name: Ensure Android SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'

      - name: Verify foundation and Shield King native presentation contracts
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify-foundation.py
          grep -F 'loadingPanel.setBackgroundColor(getColor(R.color.mgw_splash_background))' app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -F 'R.drawable.ic_mgw_launcher_foreground' app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -F 'mgw_brand_violet' app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -F 'MGW_BASE_URL' app/build.gradle

      - name: Test lint and assemble
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/app/v110.php?v=1123&sk=1
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify exact branding package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.minigamesworld.app.acceptance'" /tmp/badging.txt
          grep -F 'MGW Acceptance' /tmp/apksigner.txt
          base64 -d android-app/branding/shield_king_launcher_384.webp.b64 > /tmp/approved-icon.webp
          printf '%s  %s\n' 'f096f1f4821e514abf880e37e3346e46a60e00f97713170591991a0cfea5dc5e' '/tmp/approved-icon.webp' | sha256sum -c -
          ICON_ENTRY="$(unzip -Z1 "$APK" | grep -E 'res/drawable[^/]*/ic_mgw_launcher_art\.webp$' | head -n 1)"
          test -n "$ICON_ENTRY"
          unzip -p "$APK" "$ICON_ENTRY" > /tmp/apk-icon.webp
          cmp /tmp/approved-icon.webp /tmp/apk-icon.webp
          sha256sum /tmp/apk-icon.webp "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Create emulator
        shell: bash
        run: |
          set -euo pipefail
          AVDMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/avdmanager"
          AVD_HOME="$RUNNER_TEMP/mgw-avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n mgw_acceptance_api35 -k 'system-images;android-35;google_apis;x86_64' --force
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"
          ACCEL_ARGS=()
          if [[ ! -e /dev/kvm ]]; then ACCEL_ARGS=(-accel off); fi
          "$EMULATOR" -avd mgw_acceptance_api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics "${ACCEL_ARGS[@]}" > /tmp/emulator.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            kill -0 "$PID" 2>/dev/null || { cat /tmp/emulator.log; exit 1; }
            if "$ADB" get-state >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for i in $(seq 1 120); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then exit 0; fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1

      - name: ADB install and launch
        shell: bash
        run: |
          set -euo pipefail
          ADB="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/platform-tools/adb"
          "$ADB" install -r "$APK" | tee /tmp/adb-install.txt
          grep -F 'Success' /tmp/adb-install.txt
          "$ADB" shell am start -W -n com.minigamesworld.app.acceptance/com.minigamesworld.app.MainActivity | tee /tmp/am-start.txt
          sleep 4
          test -n "$("$ADB" shell pidof com.minigamesworld.app.acceptance | tr -d '\r')"
          "$ADB" exec-out screencap -p > /tmp/mgw-startup.png

      - name: Upload verified APK and startup evidence
        uses: actions/upload-artifact@v4
        with:
          name: mgw-shield-king-android-integration-verified
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            /tmp/mgw-startup.png
            /tmp/adb-install.txt
            /tmp/am-start.txt
            /tmp/apksigner.txt
            /tmp/badging.txt
          if-no-files-found: error

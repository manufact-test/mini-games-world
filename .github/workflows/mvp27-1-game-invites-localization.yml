name: MVP-27.1 Game Invites Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/games/game-invites-v110-rematch-policy-v175.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp18_3InviteV2ContractTest.php'
      - 'bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php'
      - 'bot/tests/RematchOptimisticUxContractTest.php'
      - 'bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php'
      - 'bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php'
      - 'bot/tests/Mvp18FriendsUiContractTest.mjs'
      - 'ops/checks/mvp27_1_game_invites_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-game-invites-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-invites-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax and localization contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/games/game-invites-v110-rematch-policy-v175.js
          node --check ops/checks/mvp27_1_game_invites_localization_contract.mjs
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp18_3InviteV2ContractTest.php
          php -l bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          php -l bot/tests/RematchOptimisticUxContractTest.php
          php -l bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php
          php -l bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php
          node --check bot/tests/Mvp18FriendsUiContractTest.mjs
          node ops/checks/mvp27_1_game_invites_localization_contract.mjs
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Preserve invite and rematch contracts
        run: |
          set -euo pipefail
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/RematchOptimisticUxContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          node bot/tests/Mvp18FriendsUiContractTest.mjs
          php bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php
          php bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest.php
          php bot/tests/Mvp17_5TerminalLaunchPolishContractTest.php
          php bot/tests/Mvp14r2InviteMatchmakingBaselineTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded migration scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/games/game-invites-v110\.js|app/assets/js/games/game-invites-v110-rematch-policy-v175\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|bot/tests/Mvp18_3InviteV2ContractTest\.php|bot/tests/Mvp18_7FriendsInvitesRegressionContractTest\.php|bot/tests/RematchOptimisticUxContractTest\.php|bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest\.php|bot/tests/Mvp17_5ResultHistoryEconomyPresentationTest\.php|bot/tests/Mvp18FriendsUiContractTest\.mjs|ops/checks/mvp27_1_game_invites_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-game-invites-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected game-invites localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: Temporary premium Entry Effect v7 wiring

on:
  push:
    branches:
      - agent/mvp19-3-premium-entry-art-v7

permissions:
  contents: write

concurrency:
  group: mgw-premium-entry-art-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout premium Entry Effect branch
        uses: actions/checkout@v4
        with:
          ref: agent/mvp19-3-premium-entry-art-v7
          fetch-depth: 0
          persist-credentials: true

      - name: Wire premium art, Store previews and cinematic motion
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin agent/mvp-13-2-staging

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all_exact(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              return count

          js = 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
          replace_once(
              js,
              "/* MVP-19.3 Entry Effects — authoritative live image owner.\n   Telegram manual review proved the real <img> owner is loadable, but the first\n   corrective accidentally mounted Store preview SVGs as the live Tier II/III art.\n   Keep Tier I on its accepted ceremonial SVG and mount the dedicated cinematic\n   WebP assets for Tier II/III as real <img> nodes. Store presentation, lifecycle,\n   equip, skip and game state are not changed here. */",
              "/* MVP-19.3 Entry Effects — authoritative premium live image owner.\n   All three tiers now use the decoder-valid premium fantasy rasters approved from\n   the reference-art pass. The reliable real <img> owner, lifecycle, equip, Skip\n   and game state stay unchanged; a lightweight sibling FX layer adds presentation\n   motion without becoming a second artwork owner. */"
          )
          replace_once(js, "  'entry-01':'/app/assets/media/cosmetics/entry-effects/store-entry-01-celestial-gate.svg?asset=reference-art-v3',", "  'entry-01':'/app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp?asset=premium-art-v7',")
          replace_once(js, "  'entry-02':'/app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp?asset=reference-raster-v6',", "  'entry-02':'/app/assets/media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp?asset=premium-art-v7',")
          replace_once(js, "  'entry-03':'/app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp?asset=reference-raster-v6',", "  'entry-03':'/app/assets/media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp?asset=premium-art-v7',")
          replace_once(
              js,
              "    const grid = layer.querySelector('.mgw-entry-effect-live-grid');\n    if (grid instanceof HTMLElement) layer.insertBefore(image, grid);\n    else layer.append(image);\n\n    if (!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches && typeof image.animate === 'function') {",
              "    const grid = layer.querySelector('.mgw-entry-effect-live-grid');\n    if (grid instanceof HTMLElement) layer.insertBefore(image, grid);\n    else layer.append(image);\n\n    const fx = document.createElement('div');\n    fx.className = 'mgw-entry-effect-live-fx';\n    fx.dataset.entryEffectVariant = variant;\n    fx.dataset.entryLiveArtKey = key;\n    fx.setAttribute('aria-hidden', 'true');\n    if (grid instanceof HTMLElement) layer.insertBefore(fx, grid);\n    else layer.append(fx);\n\n    if (!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches && typeof image.animate === 'function') {"
          )

          css = 'app/assets/css/production-v106-store-avatar-frame-density.css'
          replace_once(css, '/* Store/Profile previews: canonical SVG artwork remains the accepted owner. */', '/* Store/Profile previews: the same premium fantasy rasters are the visible owner. */')
          replace_once(css, "background-image:url('../media/cosmetics/entry-effects/store-entry-01-celestial-gate.svg?asset=reference-art-v3'),radial-gradient(circle at 50% 55%,rgba(80,162,255,.30),transparent 58%),linear-gradient(180deg,#101b34,#080b15)!important;", "background-image:url('../media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp?asset=premium-art-v7'),radial-gradient(circle at 50% 55%,rgba(80,162,255,.30),transparent 58%),linear-gradient(180deg,#101b34,#080b15)!important;")
          replace_once(css, "background-image:url('../media/cosmetics/entry-effects/store-entry-02-king-ascension.svg?asset=reference-art-v3'),radial-gradient(circle at 50% 52%,rgba(255,185,48,.30),transparent 58%),linear-gradient(180deg,#1b130d,#09090c)!important;", "background-image:url('../media/cosmetics/entry-effects/entry-effect-02-portal-knight.webp?asset=premium-art-v7'),radial-gradient(circle at 50% 52%,rgba(255,185,48,.30),transparent 58%),linear-gradient(180deg,#1b130d,#09090c)!important;")
          replace_once(css, "background-image:url('../media/cosmetics/entry-effects/store-entry-03-lord-blade.svg?asset=reference-art-v3'),radial-gradient(circle at 50% 52%,rgba(255,173,35,.32),transparent 58%),linear-gradient(180deg,#1d100b,#09080a)!important;", "background-image:url('../media/cosmetics/entry-effects/entry-effect-03-knight-strike.webp?asset=premium-art-v7'),radial-gradient(circle at 50% 52%,rgba(255,173,35,.32),transparent 58%),linear-gradient(180deg,#1d100b,#09080a)!important;")

          fx_css = r'''

/* MVP-19.3 premium Entry Effect v7 — presentation-only cinematic motion. */
.mgw-entry-effect-live-fx{
  position:absolute!important;
  inset:0!important;
  z-index:2!important;
  overflow:hidden!important;
  pointer-events:none!important;
  contain:paint!important;
}
.mgw-entry-effect-live-fx::before,
.mgw-entry-effect-live-fx::after{
  content:'';
  position:absolute;
  pointer-events:none;
  opacity:0;
}

/* Tier I — celestial gate: blue/gold portal bloom and a second soft pulse. */
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-01"]::before{
  left:50%;top:49%;width:min(84vw,430px);aspect-ratio:1;
  border:2px solid rgba(255,220,132,.88);border-radius:50%;
  background:radial-gradient(circle,rgba(96,180,255,.12) 0 38%,rgba(255,214,111,.08) 52%,transparent 68%);
  box-shadow:0 0 24px rgba(95,181,255,.58),0 0 54px rgba(255,205,95,.42),inset 0 0 42px rgba(97,181,255,.30);
  transform:translate(-50%,-50%) scale(.22);
  animation:mgwPremiumGateRing 2.4s cubic-bezier(.16,.84,.18,1) both;
}
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-01"]::after{
  left:50%;top:49%;width:min(66vw,330px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,248,205,.54) 0 2%,rgba(95,184,255,.22) 14%,rgba(255,210,98,.10) 36%,transparent 68%);
  transform:translate(-50%,-50%) scale(.36);
  animation:mgwPremiumGatePulse 2.4s ease-out both;
}

/* Tier II — royal ascension: vertical holy beam plus a grounded arrival ring. */
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-02"]::before{
  left:50%;top:12%;width:min(34vw,150px);height:72%;
  background:linear-gradient(180deg,transparent,rgba(255,243,194,.42) 18%,rgba(255,188,49,.20) 55%,transparent 100%);
  box-shadow:0 0 46px rgba(255,190,54,.40);
  transform:translateX(-50%) scaleY(.05);transform-origin:50% 0;
  animation:mgwPremiumKingBeam 3s cubic-bezier(.12,.86,.18,1) both;
}
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-02"]::after{
  left:50%;top:68%;width:min(76vw,380px);height:78px;
  border:3px solid rgba(255,222,128,.90);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,210,91,.24),transparent 66%);
  box-shadow:0 0 28px rgba(255,195,65,.52),0 0 52px rgba(255,151,36,.25);
  transform:translate(-50%,-50%) scale(.16);
  animation:mgwPremiumKingFloor 3s cubic-bezier(.12,.86,.2,1) both;
}

/* Tier III — legendary blade: fast diagonal slash plus impact shockwave. */
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-03"]::before{
  left:50%;top:50%;width:min(132vw,680px);height:18px;border-radius:999px;
  background:linear-gradient(90deg,transparent 2%,rgba(255,242,188,.94) 22%,#fff 43%,rgba(255,184,48,.96) 60%,rgba(206,39,22,.72) 82%,transparent 98%);
  box-shadow:0 0 18px rgba(255,244,199,.96),0 0 44px rgba(255,155,34,.78),0 0 68px rgba(196,35,22,.44);
  transform:translate(-50%,-50%) rotate(-18deg) scaleX(.04);
  animation:mgwPremiumBladeSlash 3.6s cubic-bezier(.08,.9,.16,1) both;
}
.mgw-entry-effect-live-fx[data-entry-effect-variant="entry-03"]::after{
  left:48%;top:63%;width:88px;height:88px;border:4px solid rgba(255,229,145,.92);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,225,.72),rgba(255,168,35,.25) 27%,transparent 67%);
  box-shadow:0 0 26px rgba(255,231,151,.90),0 0 64px rgba(255,130,26,.66);
  transform:translate(-50%,-50%) scale(.10);
  animation:mgwPremiumBladeImpact 3.6s cubic-bezier(.08,.88,.15,1) both;
}

@keyframes mgwPremiumGateRing{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.22)}
  22%{opacity:.98}
  60%{opacity:.68;transform:translate(-50%,-50%) scale(1.02)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.13)}
}
@keyframes mgwPremiumGatePulse{
  0%,10%{opacity:0;transform:translate(-50%,-50%) scale(.36)}
  34%{opacity:.88}
  74%{opacity:.26;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.24)}
}
@keyframes mgwPremiumKingBeam{
  0%{opacity:0;transform:translateX(-50%) scaleY(.05)}
  18%{opacity:.88}
  48%{opacity:.44;transform:translateX(-50%) scaleY(1)}
  100%{opacity:0;transform:translateX(-50%) scaleY(1)}
}
@keyframes mgwPremiumKingFloor{
  0%,16%{opacity:0;transform:translate(-50%,-50%) scale(.16)}
  38%{opacity:.98}
  70%{opacity:.38;transform:translate(-50%,-50%) scale(1.02)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
}
@keyframes mgwPremiumBladeSlash{
  0%,16%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(.04)}
  27%{opacity:1}
  42%{opacity:.94;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1)}
  58%{opacity:.18;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1.10)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1.10)}
}
@keyframes mgwPremiumBladeImpact{
  0%,28%{opacity:0;transform:translate(-50%,-50%) scale(.10)}
  40%{opacity:1}
  58%{opacity:.36;transform:translate(-50%,-50%) scale(1.45)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
}
@media(prefers-reduced-motion:reduce){
  .mgw-entry-effect-live-fx{display:none!important}
}
'''
          p = Path(css)
          text = p.read_text(encoding='utf-8')
          marker = '/* MVP-19.3 premium Entry Effect v7 — presentation-only cinematic motion. */'
          if marker in text:
              raise SystemExit(f'{css}: premium FX block already exists')
          p.write_text(text.rstrip() + fx_css + '\n', encoding='utf-8')

          manifest = 'app/runtime/client/version-manifest.php'
          replace_once(manifest, 'production-clean-entry-v110-mvp19-3-final-polish.js?v=1137', 'production-clean-entry-v110-mvp19-3-final-polish.js?v=1138')
          replace_once(manifest, 'entry_live_img=reference-raster-v6', 'entry_live_img=premium-art-v7')
          replace_once(manifest, 'production-v106-store-avatar-frame-density.css?v=9', 'production-v106-store-avatar-frame-density.css?v=10')
          replace_once(manifest, 'live_entry=reference-art-v3&entry_modal=viewport-safe-v1', 'live_entry=premium-art-v7&entry_motion=premium-cinematic-v1&entry_modal=viewport-safe-v1')

          spec = 'e2e/staging/entry-effects-runtime-diagnostic.spec.mjs'
          replace_once(spec, "const LIVE_JS_PATH = '/app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js?v=1137&entry_live_img=reference-raster-v6';", "const LIVE_JS_PATH = '/app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js?v=1138&entry_live_img=premium-art-v7';")
          replace_once(spec, "const LIVE_CSS_PATH = '/app/assets/css/production-v106-store-avatar-frame-density.css?v=9&live_entry=reference-art-v3';", "const LIVE_CSS_PATH = '/app/assets/css/production-v106-store-avatar-frame-density.css?v=10&live_entry=premium-art-v7';")
          replace_once(
              spec,
              "const EFFECTS = [\n  {\n    id: 'entry-02',",
              "const EFFECTS = [\n  {\n    id: 'entry-01',\n    file: 'entry-effect-01-celestial-gate.webp',\n    path: '/app/assets/media/cosmetics/entry-effects/entry-effect-01-celestial-gate.webp?asset=premium-art-v7',\n  },\n  {\n    id: 'entry-02',"
          )
          replace_all_exact(spec, '?asset=reference-raster-v6', '?asset=premium-art-v7', minimum=4)
          replace_once(spec, "test(`ENTRY EFFECT DIAGNOSTIC: deployed ${effect.id} reference raster paints pixels`", "test(`ENTRY EFFECT DIAGNOSTIC: deployed ${effect.id} premium art paints pixels`")
          replace_once(spec, "      expect(jsText).toContain('store-entry-01-celestial-gate.svg?asset=reference-art-v3');", "      expect(jsText).toContain('entry-effect-01-celestial-gate.webp?asset=premium-art-v7');")
          replace_all_exact(spec, 'reference-raster-v6', 'premium-art-v7', minimum=3)
          replace_once(spec, "      expect(cssText).not.toContain('.mgw-entry-effect-live-art{display:none!important}');", "      expect(cssText).not.toContain('.mgw-entry-effect-live-art{display:none!important}');\n      expect(cssText).toContain('mgw-entry-effect-live-fx');\n      expect(cssText).toContain('mgwPremiumBladeSlash');")

          runtime = '.github/workflows/mvp19-3-entry-effects-runtime-diagnostic.yml'
          replace_once(runtime, 'Verify canonical Entry Effect real-img owner', 'Verify premium Entry Effect real-img owner')
          replace_once(runtime, "          grep -F \"store-entry-01-celestial-gate.svg?asset=reference-art-v3\" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js", "          grep -F \"entry-effect-01-celestial-gate.webp?asset=premium-art-v7\" app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js")
          replace_all_exact(runtime, 'reference-raster-v6', 'premium-art-v7', minimum=3)
          replace_once(runtime, "          grep -F 'live_entry=reference-art-v3' app/runtime/client/version-manifest.php", "          grep -F 'live_entry=premium-art-v7' app/runtime/client/version-manifest.php\n          grep -F 'entry_motion=premium-cinematic-v1' app/runtime/client/version-manifest.php\n          grep -F 'mgw-entry-effect-live-fx' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js\n          grep -F 'mgwPremiumBladeSlash' app/assets/css/production-v106-store-avatar-frame-density.css")
          replace_once(runtime, 'Probe deployed real-img reference-raster owners', 'Probe deployed premium real-img owners')

          profile = '.github/workflows/mvp19-3-profile-entry-effects.yml'
          replace_once(profile, "          grep -F 'entry-effect-02-portal-knight.webp?asset=reference-raster-v6' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js", "          grep -F 'entry-effect-01-celestial-gate.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js\n          grep -F 'entry-effect-02-portal-knight.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js")
          replace_once(profile, "          grep -F 'entry-effect-03-knight-strike.webp?asset=reference-raster-v6' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js", "          grep -F 'entry-effect-03-knight-strike.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js")
          replace_once(profile, "          grep -F 'entry_live_img=reference-raster-v6' app/runtime/client/version-manifest.php", "          grep -F 'entry_live_img=premium-art-v7' app/runtime/client/version-manifest.php")
          replace_once(profile, "          grep -F 'live_entry=reference-art-v3' app/runtime/client/version-manifest.php", "          grep -F 'live_entry=premium-art-v7' app/runtime/client/version-manifest.php\n          grep -F 'entry_motion=premium-cinematic-v1' app/runtime/client/version-manifest.php\n          grep -F 'mgw-entry-effect-live-fx' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js")
          PY

          # Restore the borrowed registered workflow so it is never part of the product diff.
          git show origin/agent/mvp-13-2-staging:.github/workflows/production-primary-coordinator-foundation-safety.yml > .github/workflows/production-primary-coordinator-foundation-safety.yml

          node --check app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          node --check e2e/staging/entry-effects-runtime-diagnostic.spec.mjs
          php -l app/runtime/client/version-manifest.php
          git diff --check

          grep -F 'entry-effect-01-celestial-gate.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'entry-effect-02-portal-knight.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'entry-effect-03-knight-strike.webp?asset=premium-art-v7' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'mgw-entry-effect-live-fx' app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          grep -F 'mgwPremiumBladeSlash' app/assets/css/production-v106-store-avatar-frame-density.css
          grep -F 'entry_live_img=premium-art-v7' app/runtime/client/version-manifest.php
          grep -F 'live_entry=premium-art-v7' app/runtime/client/version-manifest.php

      - name: Commit premium Entry Effect wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add \
            app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js \
            app/assets/css/production-v106-store-avatar-frame-density.css \
            app/runtime/client/version-manifest.php \
            e2e/staging/entry-effects-runtime-diagnostic.spec.mjs \
            .github/workflows/mvp19-3-entry-effects-runtime-diagnostic.yml \
            .github/workflows/mvp19-3-profile-entry-effects.yml \
            .github/workflows/production-primary-coordinator-foundation-safety.yml
          git diff --cached --quiet && { echo 'No product changes to commit' >&2; exit 1; }
          git commit -m 'MVP-19.3: wire premium fantasy Entry Effects v7'
          git push origin HEAD:agent/mvp19-3-premium-entry-art-v7

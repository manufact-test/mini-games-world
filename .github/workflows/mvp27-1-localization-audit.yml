name: MVP-27.1 Localization Architecture Audit

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'ops/checks/mvp16_2_localization_contract.mjs'
      - 'ops/checks/mvp27_1_localization_architecture_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_client_entry_debt_classification_contract.mjs'
      - 'ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs'
      - 'ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs'
      - 'ops/checks/mvp27_1_residual_ui_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v104_invite_game_controls_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v107_invite_actions_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v109_invite_speed_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v97_runtime_owner_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_prepared_share_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_result_share_performance_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_cross_game_coordinator_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_notification_window_owner_v119_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_profile_victory_effects_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_four_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_reversi_entry_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_game_router_localization_contract.mjs'
      - 'ops/checks/mvp27_1_v102_history_controller_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_active_client_entry_localization_contract.mjs'
      - 'ops/checks/mvp27_1_active_game_copy_bundle_contract.mjs'
      - 'ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/Mvp27_1LocalizationArchitectureAuditTest.php'
      - 'docs/MVP27_1_LOCALIZATION_ARCHITECTURE_AUDIT.md'
      - '.github/workflows/mvp27-1-localization-audit.yml'
      - '.github/workflows/mvp27-1-legacy-profile-victory-effects-reachability.yml'
      - '.github/workflows/mvp27-1-legacy-domino-entry-reachability.yml'
      - '.github/workflows/mvp27-1-legacy-four-entry-reachability.yml'
      - '.github/workflows/mvp27-1-legacy-reversi-entry-reachability.yml'
      - '.github/workflows/mvp27-1-game-router-localization.yml'
      - '.github/workflows/mvp27-1-active-client-entry-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check ops/checks/mvp16_2_localization_contract.mjs
          node --check ops/checks/mvp27_1_localization_architecture_contract.mjs
          node --check ops/checks/mvp27_1_hardcoded_text_audit.mjs
          node --check ops/checks/mvp27_1_client_entry_debt_classification_contract.mjs
          node --check ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs
          node --check ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs
          node --check ops/checks/mvp27_1_residual_ui_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v104_invite_game_controls_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v107_invite_actions_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v109_invite_speed_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v97_runtime_owner_reachability_contract.mjs
          node --check ops/checks/mvp27_1_prepared_share_reachability_contract.mjs
          node --check ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_result_share_performance_reachability_contract.mjs
          node --check ops/checks/mvp27_1_cross_game_coordinator_reachability_contract.mjs
          node --check ops/checks/mvp27_1_notification_window_owner_v119_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_profile_victory_effects_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_four_entry_reachability_contract.mjs
          node --check ops/checks/mvp27_1_legacy_reversi_entry_reachability_contract.mjs
          node --check ops/checks/mvp27_1_game_router_localization_contract.mjs
          node --check ops/checks/mvp27_1_v102_history_controller_reachability_contract.mjs
          node --check ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs
          node --check ops/checks/mvp27_1_active_client_entry_localization_contract.mjs
          node --check ops/checks/mvp27_1_active_game_copy_bundle_contract.mjs
          node --check ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node --check app/assets/js/localization/i18n.js

      - name: Existing localization foundation
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: MVP-27.1 architecture proof
        run: |
          set -euo pipefail
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          php bot/tests/Mvp27_1LocalizationArchitectureAuditTest.php

      - name: Active game-copy bundle proof
        run: node ops/checks/mvp27_1_active_game_copy_bundle_contract.mjs

      - name: Active shell-copy bundle proof
        run: node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs

      - name: Active client-entry localization proof
        run: node ops/checks/mvp27_1_active_client_entry_localization_contract.mjs

      - name: Client-entry active-owner classification proof
        run: node ops/checks/mvp27_1_client_entry_debt_classification_contract.mjs

      - name: Invite-owner active-graph classification proof
        run: node ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs

      - name: Invite canonical game polling proof
        run: node ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs

      - name: Residual UI factual reachability proof
        run: node ops/checks/mvp27_1_residual_ui_reachability_contract.mjs

      - name: V104 invite-game-controls factual reachability proof
        run: node ops/checks/mvp27_1_v104_invite_game_controls_reachability_contract.mjs

      - name: V105 invite-latency factual reachability proof
        run: node ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs

      - name: V106 invite-actions factual reachability proof
        run: node ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs

      - name: V107 invite-actions factual reachability proof
        run: node ops/checks/mvp27_1_v107_invite_actions_reachability_contract.mjs

      - name: V109 invite-speed factual reachability proof
        run: node ops/checks/mvp27_1_v109_invite_speed_reachability_contract.mjs

      - name: V97 runtime-owner factual reachability proof
        run: node ops/checks/mvp27_1_v97_runtime_owner_reachability_contract.mjs

      - name: Prepared-share factual reachability proof
        run: node ops/checks/mvp27_1_prepared_share_reachability_contract.mjs

      - name: First-interaction readiness factual reachability proof
        run: node ops/checks/mvp27_1_first_interaction_readiness_reachability_contract.mjs

      - name: Legacy notifications factual reachability proof
        run: node ops/checks/mvp27_1_legacy_notifications_reachability_contract.mjs

      - name: Legacy result/share performance factual reachability proof
        run: node ops/checks/mvp27_1_legacy_result_share_performance_reachability_contract.mjs

      - name: Cross-game coordinator factual reachability proof
        run: node ops/checks/mvp27_1_cross_game_coordinator_reachability_contract.mjs

      - name: Notification window owner v119 factual reachability proof
        run: node ops/checks/mvp27_1_notification_window_owner_v119_reachability_contract.mjs

      - name: Legacy Profile Victory Effects factual reachability proof
        run: node ops/checks/mvp27_1_legacy_profile_victory_effects_reachability_contract.mjs

      - name: Legacy Domino entry factual reachability proof
        run: node ops/checks/mvp27_1_legacy_domino_entry_reachability_contract.mjs

      - name: Legacy Four-in-a-row entry factual reachability proof
        run: node ops/checks/mvp27_1_legacy_four_entry_reachability_contract.mjs

      - name: Legacy Reversi entry factual reachability proof
        run: node ops/checks/mvp27_1_legacy_reversi_entry_reachability_contract.mjs

      - name: Active game-router localization proof
        run: node ops/checks/mvp27_1_game_router_localization_contract.mjs

      - name: V102 history-controller factual reachability proof
        run: node ops/checks/mvp27_1_v102_history_controller_reachability_contract.mjs

      - name: Phase-B current factual reachability proof
        run: node ops/checks/mvp27_1_phase_b_current_reachability_contract.mjs

      - name: V99-V101 game-screen factual reachability proof
        run: node ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs

      - name: Hardcoded player text audit
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs --sample

      - name: Audit-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-invite-canonical-game-polling* ]]; then
            echo 'Canonical polling successor: focused runtime+debt workflow owns scope; architecture audit remains proof-only.'
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-*-reachability* ]]; then
            echo 'Reachability successor: focused classification workflow owns scope; architecture audit remains proof-only.'
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          audit_owner='^(ops/checks/mvp16_2_localization_contract\.mjs|ops/checks/mvp27_1_localization_architecture_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_client_entry_debt_classification_contract\.mjs|ops/checks/mvp27_1_invite_owner_debt_classification_contract\.mjs|bot/tests/Mvp27_1LocalizationArchitectureAuditTest\.php|docs/MVP27_1_LOCALIZATION_ARCHITECTURE_AUDIT\.md)$'
          if printf '%s\n' "$changed" | grep -Eq "$audit_owner"; then
            allowed='^(ops/checks/mvp16_2_localization_contract\.mjs|ops/checks/mvp27_1_localization_architecture_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_client_entry_debt_classification_contract\.mjs|ops/checks/mvp27_1_invite_owner_debt_classification_contract\.mjs|ops/checks/mvp27_1_active_client_entry_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/Mvp27_1LocalizationArchitectureAuditTest\.php|docs/MVP27_1_LOCALIZATION_ARCHITECTURE_AUDIT\.md|\.github/workflows/mvp27-1-localization-audit\.yml|\.github/workflows/mvp27-1-active-client-entry-localization\.yml)$'
            bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
            test -z "$bad" || { printf 'Unexpected MVP-27.1 audit paths:\n%s\n' "$bad" >&2; exit 1; }
          else
            echo 'Successor localization slice: architecture audit runs as proof + debt ratchet; audit-only path guard is not applicable.'
          fi

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

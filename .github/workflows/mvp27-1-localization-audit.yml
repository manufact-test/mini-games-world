        run: node ops/checks/mvp27_1_v99_v101_game_screen_reachability_contract.mjs

      - name: Final active client localization proof
        run: node ops/checks/mvp27_1_final_active_client_localization_contract.mjs

      - name: Hardcoded player text audit
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs --sample

      - name: Audit-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-invite-canonical-game-polling* ]]; then
            echo 'Canonical polling successor: focused runtime+debt workflow owns scope; architecture audit remains proof-only.'
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-*-reachability* ]]; then
            echo 'Reachability successor: focused classification workflow owns scope; architecture audit remains proof-only.'
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-session-ownership-localization* ]]; then
            echo 'Session-ownership localization successor: focused workflow owns runtime scope; architecture audit remains proof-only.'
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == agent/mvp27-1-backend-debt-guards-successor-safe* || "${{ github.head_ref }}" == agent/mvp27-1-backend-nonplayer-classification-bundle-* || "${{ github.head_ref }}" == agent/mvp27-1-backend-baseline-player-localization-bundle-* ]]; then
            echo 'Backend-debt/classification/localization bundle: focused ownership proof owns scope; architecture audit remains proof-only.'
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          audit_owner='^(ops/checks/mvp16_2_localization_contract\.mjs|ops/checks/mvp27_1_localization_architecture_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_client_entry_debt_classification_contract\.mjs|ops/checks/mvp27_1_invite_owner_debt_classification_contract\.mjs|bot/tests/Mvp27_1LocalizationArchitectureAuditTest\.php|docs/MVP27_1_LOCALIZATION_ARCHITECTURE_AUDIT\.md)$'
          if printf '%s\n' "$changed" | grep -Eq "$audit_owner"; then
            allowed='^(ops/checks/mvp16_2_localization_contract\.mjs|ops/checks/mvp27_1_localization_architecture_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_client_entry_debt_classification_contract\.mjs|ops/checks/mvp27_1_invite_owner_debt_classification_contract\.mjs|ops/checks/mvp27_1_active_client_entry_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|bot/tests/Mvp27_1LocalizationArchitectureAuditTest\.php|docs/MVP27_1_LOCALIZATION_ARCHITECTURE_AUDIT\.md|\.github/workflows/mvp27-1-localization-audit\.yml|\.github/workflows/mvp27-1-active-client-entry-localization\.yml)$'
            bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
            test -z "$bad" || { printf 'Unexpected MVP-27.1 audit paths:\n%s\n' "$bad" >&2; exit 1; }
          else
            echo 'Successor localization slice: architecture audit runs as proof + debt ratchet; audit-only path guard is not applicable.'
          fi

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

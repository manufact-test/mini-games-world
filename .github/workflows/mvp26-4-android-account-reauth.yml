name: MVP-26.4 Android Account Reauth

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'android-app/**'
      - 'bot/android-reauth.php'
      - 'bot/account-data.php'
      - 'bot/accounts/AndroidAuthAttemptLimiter.php'
      - 'bot/accounts/AndroidDeviceAuthService.php'
      - 'bot/accounts/AccountReauthGuard.php'
      - 'bot/database/migrations/20261001_0071_add_android_session_reauth.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'bot/tests/Mvp26_4AndroidAccountReauthTest.php'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp26-4-android-account-reauth.yml'
      - '.github/workflows/mvp26-2-android-device-auth.yml'
      - '.github/workflows/mvp26-3-5-account-link-home-onboarding.yml'
      - '.github/workflows/mvp22-8-account-data.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'android-app/**'
      - 'bot/android-reauth.php'
      - 'bot/account-data.php'
      - 'bot/accounts/AndroidAuthAttemptLimiter.php'
      - 'bot/accounts/AndroidDeviceAuthService.php'
      - 'bot/accounts/AccountReauthGuard.php'
      - 'bot/database/migrations/20261001_0071_add_android_session_reauth.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'bot/tests/Mvp26_4AndroidAccountReauthTest.php'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/runtime/client/version-manifest.php'
      - '.github/workflows/mvp26-4-android-account-reauth.yml'

permissions:
  contents: read

jobs:
  server-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/android-reauth.php
          php -l bot/account-data.php
          php -l bot/accounts/AndroidAuthAttemptLimiter.php
          php -l bot/accounts/AndroidDeviceAuthService.php
          php -l bot/accounts/AccountReauthGuard.php
          php -l bot/database/migrations/20261001_0071_add_android_session_reauth.php
          php -l bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/components/account-shortcuts.js
          node --check app/assets/js/screens/account-data-sheet-v1.js

      - name: Android sensitive-action reauth proof
        run: |
          set -euo pipefail
          php bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php bot/tests/Mvp26_2AndroidDeviceAuthTest.php
          php bot/tests/Mvp22_8AccountDataLifecycleTest.php

      - name: Cache and native boundary contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "account-data-sheet-v1.js?v=7" app/assets/js/components/account-shortcuts.js
          grep -Fq "account-shortcuts.js?v=57" app/runtime/client/version-manifest.php
          grep -Fq "android_reauth_required" bot/accounts/AccountReauthGuard.php
          grep -Fq "mgw-native://reauth?request=" app/assets/js/screens/account-data-sheet-v1.js
          grep -Fq "mgw:native-reauth-result" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          ! grep -Fq "addJavascriptInterface" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java

      - name: Exact staging fingerprint coverage
        shell: bash
        run: |
          set -euo pipefail
          manifest='bot/helpers/staging-e2e-runtime-files.txt'
          for file in \
            bot/android-reauth.php \
            bot/accounts/AndroidAuthAttemptLimiter.php \
            bot/accounts/AndroidDeviceAuthService.php \
            bot/accounts/AccountReauthGuard.php \
            bot/database/migrations/20261001_0071_add_android_session_reauth.php \
            app/assets/js/components/account-shortcuts.js \
            app/assets/js/screens/account-data-sheet-v1.js \
            app/runtime/client/version-manifest.php
          do
            grep -Fx "$file" "$manifest"
          done

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/(mvp26-4-android-account-reauth|mvp26-2-android-device-auth|mvp26-3-5-account-link-home-onboarding|mvp22-8-account-data)\.yml|android-app/(README\.md|tools/verify-foundation\.py|app/build\.gradle|app/src/main/java/com/minigamesworld/app/(MainActivity|NavigationPolicy|ShellConfig)\.java|app/src/main/res/values/strings\.xml|app/src/test/java/com/minigamesworld/app/NavigationPolicyTest\.java)|app/assets/js/(components/account-shortcuts|screens/account-data-sheet-v1)\.js|app/runtime/client/version-manifest\.php|bot/(android-reauth|account-data)\.php|bot/accounts/(AndroidAuthAttemptLimiter|AndroidDeviceAuthService|AccountReauthGuard)\.php|bot/database/migrations/20261001_0071_add_android_session_reauth\.php|bot/helpers/staging-e2e-runtime-files\.txt|bot/tests/Mvp26_4AndroidAccountReauthTest\.php)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected Android reauth paths:\n%s\n' "$bad" >&2; exit 1; }

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify native security boundary
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test lint assemble staging APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify accepted signing identity
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/mgw-apk-signing.txt
          grep -F 'CN=MGW Acceptance, O=Mini Games World, C=PL' /tmp/mgw-apk-signing.txt

      - name: Upload staging APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-4-account-reauth-staging-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-4-account-reauth-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  mysql-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_android_reauth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Prove Android reauth migration on MySQL 8.4
        run: |
          php -r '
            require "bot/database/DatabaseConnectionInterface.php";
            require "bot/database/PdoDatabaseConnection.php";
            require "bot/database/DatabaseMigrationInterface.php";
            $pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=mgw_android_reauth;charset=utf8mb4","root","root",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $db=new PdoDatabaseConnection($pdo);
            $db->execute("CREATE TABLE mgw_sessions (
              session_key_hash CHAR(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL PRIMARY KEY,
              last_seen_at_utc DATETIME(6) NOT NULL
            ) ENGINE=InnoDB");
            $migration=require "bot/database/migrations/20261001_0071_add_android_session_reauth.php";
            $migration->up($db);
            $count=(int)$db->fetchValue("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"mgw_sessions\" AND column_name=\"last_reauthenticated_at_utc\"");
            if ($count !== 1) throw new RuntimeException("Android session reauth column missing.");
            echo "MVP-26.4 MySQL reauth migration PASS\n";
          '

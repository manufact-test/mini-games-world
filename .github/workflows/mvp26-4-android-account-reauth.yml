name: MVP-26.4 Android Account Reauth

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'android-app/app/build.gradle'
      - 'android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java'
      - 'android-app/app/src/main/java/com/minigamesworld/app/NavigationPolicy.java'
      - 'android-app/app/src/main/java/com/minigamesworld/app/ShellConfig.java'
      - 'android-app/app/src/main/AndroidManifest.xml'
      - 'android-app/app/src/main/res/values/strings.xml'
      - 'android-app/app/src/test/java/com/minigamesworld/app/NavigationPolicyTest.java'
      - 'android-app/tools/verify-foundation.py'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/components/account-shortcuts.js'
      - 'app/assets/js/screens/account-data-sheet-v1.js'
      - 'app/assets/css/account-data-v1.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/account-data.php'
      - 'bot/account-data-download.php'
      - 'bot/android-reauth.php'
      - 'bot/accounts/AccountReauthGuard.php'
      - 'bot/accounts/AndroidAccountReauthService.php'
      - 'bot/accounts/AndroidDeviceAuthService.php'
      - 'bot/database/migrations/20261001_0071_create_android_reauth_challenges.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'bot/tests/Mvp26_4AndroidAccountReauthTest.php'
      - 'bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php'
      - 'docs/MVP26_4_ANDROID_ACCOUNT_REAUTH.md'
      - '.github/workflows/mvp26-4-android-account-reauth.yml'
      - '.github/workflows/mvp26-2-android-device-auth.yml'
      - '.github/workflows/mvp26-3-1-account-link-backend.yml'
      - '.github/workflows/mvp22-8-account-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Provider-neutral reauth contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/account-data.php
          php -l bot/account-data-download.php
          php -l bot/android-reauth.php
          php -l bot/accounts/AccountReauthGuard.php
          php -l bot/accounts/AndroidAccountReauthService.php
          php -l bot/accounts/AndroidDeviceAuthService.php
          php -l bot/database/migrations/20261001_0071_create_android_reauth_challenges.php
          php -l bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php -l bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/api/client.js
          node --check app/assets/js/components/account-shortcuts.js
          node --check app/assets/js/screens/account-data-sheet-v1.js

      - name: Android reauth security proof
        run: |
          set -euo pipefail
          php bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php
          php bot/tests/Mvp26_2AndroidDeviceAuthTest.php
          php bot/tests/Mvp26_3AccountLinkServiceTest.php
          php bot/tests/Mvp22_8AccountDataLifecycleTest.php
          php bot/tests/Mvp15ProviderNeutralIdentityCoreTest.php
          php bot/tests/Mvp25_5SecurityResilienceClosureContractTest.php

      - name: Guard native boundary and exact staging fingerprint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "createConfirmDeviceCredentialIntent" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -Fq "mgw:android-reauth-success" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -Fq "nativeReauthChallenge" android-app/app/src/main/java/com/minigamesworld/app/NavigationPolicy.java
          grep -Fq "android-reauth.php" android-app/app/src/main/java/com/minigamesworld/app/ShellConfig.java
          ! grep -Fq "addJavascriptInterface" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          ! grep -Fq "credential" app/assets/js/screens/account-data-sheet-v1.js
          ! grep -Fq "credential" app/assets/js/api/client.js
          grep -Fq "android_reauth_required" bot/accounts/AccountReauthGuard.php
          grep -Fq "hasRecentGrant" bot/accounts/AccountReauthGuard.php
          grep -Fq "GRANT_TTL_SECONDS = 300" bot/accounts/AndroidAccountReauthService.php
          grep -Fq "session_key_hash" bot/accounts/AndroidAccountReauthService.php
          grep -Fq "mvp26_4=android-reauth-v1" app/runtime/client/version-manifest.php
          grep -Fq "DownloadManager" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -Fq "MiniGamesWorldAndroid/" android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java
          grep -Fq "nativeAccountDownloadRequest" android-app/app/src/main/java/com/minigamesworld/app/NavigationPolicy.java
          grep -Fq "account-data-download.php" android-app/app/src/main/java/com/minigamesworld/app/ShellConfig.java
          grep -Fq "mvp26_4_2=android-download-v1" app/runtime/client/version-manifest.php
          grep -Fq "pendingActions = new Set" app/assets/js/screens/account-data-sheet-v1.js
          ! grep -Fq "let actionPending" app/assets/js/screens/account-data-sheet-v1.js
          grep -Fq ".account-data-v1-spinner" app/assets/css/account-data-v1.css
          for file in \
            bot/android-reauth.php \
            bot/account-data-download.php \
            bot/accounts/AndroidAccountReauthService.php \
            bot/accounts/AndroidDeviceAuthService.php \
            bot/accounts/AndroidAuthAttemptLimiter.php \
            bot/database/migrations/20261001_0071_create_android_reauth_challenges.php
          do
            grep -Fxq "$file" bot/helpers/staging-e2e-runtime-files.txt
          done

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ "${{ github.head_ref }}" == agent/mvp26-3-native-shell-settings-* ]]; then
            exit 0
          fi
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp26-4-android-account-reauth.yml|\
              .github/workflows/mvp26-2-android-device-auth.yml|\
              .github/workflows/mvp26-3-1-account-link-backend.yml|\
              .github/workflows/mvp22-8-account-data.yml|\
              android-app/app/build.gradle|\
              android-app/app/src/main/java/com/minigamesworld/app/MainActivity.java|\
              android-app/app/src/main/java/com/minigamesworld/app/NavigationPolicy.java|\
              android-app/app/src/main/java/com/minigamesworld/app/ShellConfig.java|\
              android-app/app/src/main/AndroidManifest.xml|\
              android-app/app/src/main/res/values/strings.xml|\
              android-app/app/src/test/java/com/minigamesworld/app/NavigationPolicyTest.java|\
              android-app/tools/verify-foundation.py|\
              app/assets/js/api/client.js|\
              app/assets/js/components/account-shortcuts.js|\
              app/assets/js/screens/account-data-sheet-v1.js|\
              app/assets/css/account-data-v1.css|\
              app/runtime/client/version-manifest.php|\
              bot/account-data.php|\
              bot/account-data-download.php|\
              bot/android-reauth.php|\
              bot/accounts/AccountReauthGuard.php|\
              bot/accounts/AndroidAccountReauthService.php|\
              bot/accounts/AndroidDeviceAuthService.php|\
              bot/database/migrations/20261001_0071_create_android_reauth_challenges.php|\
              bot/helpers/staging-e2e-runtime-files.txt|\
              bot/tests/Mvp26_4AndroidAccountReauthTest.php|\
              bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php|\
              docs/MVP26_4_ANDROID_ACCOUNT_REAUTH.md)
                ;;
              *)
                echo "Unexpected MVP-26.4 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          git diff --exit-code "$base" "$head" -- \
            bot/games bot/ratings bot/tournaments bot/economy bot/ledger bot/notifications

  android-build:
    name: Android build/lint/unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager is unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify accepted Android foundation
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test lint and assemble reauth APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify accepted package signing identity
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/mgw-apk-signing.txt
          grep -F 'CN=MGW Acceptance, O=Mini Games World, C=PL' /tmp/mgw-apk-signing.txt

      - name: Upload staging reauth APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-4-2-android-account-data-download-staging-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-mvp26-4-2-android-account-data-download-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  mysql-migration:
    name: Android reauth migration on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_android_reauth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Prove idempotent MySQL migration
        run: |
          php -r '
            require "bot/database/DatabaseConnectionInterface.php";
            require "bot/database/PdoDatabaseConnection.php";
            require "bot/database/DatabaseMigrationInterface.php";
            $pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=mgw_android_reauth;charset=utf8mb4","root","root",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            $db=new PdoDatabaseConnection($pdo);
            $db->execute("CREATE TABLE mgw_users (mgw_id VARCHAR(24) CHARACTER SET ascii COLLATE ascii_bin NOT NULL PRIMARY KEY) ENGINE=InnoDB");
            $migration=require "bot/database/migrations/20261001_0071_create_android_reauth_challenges.php";
            $migration->up($db);
            $migration->up($db);
            $count=(int)$db->fetchValue("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=\"mgw_android_reauth_challenges\"");
            if ($count !== 1) throw new RuntimeException("Android reauth table missing.");
            $indexes=(int)$db->fetchValue("SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name=\"mgw_android_reauth_challenges\" AND index_name=\"idx_mgw_android_reauth_session\"");
            if ($indexes < 1) throw new RuntimeException("Android reauth session index missing.");
            echo "MVP-26.4 MySQL migration PASS\n";
          '

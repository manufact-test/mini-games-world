name: MVP-27.1 Active Clean Entry Profile Selection Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v110.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2.js'
      - 'app/assets/js/localization/i18n.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/locales/ru.json'
      - 'bot/tests/Mvp23ProfileRouteLatencyContractTest.php'
      - 'ops/checks/mvp27_1_active_clean_entry_profile_selection_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-active-clean-entry-profile-selection-localization.yml'
      - '.github/workflows/mvp23-profile-route-latency.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-clean-entry-profile-selection-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and focused localization proof
        run: |
          set -euo pipefail
          php -l app/runtime/client/version-manifest.php
          node --check app/assets/js/production-clean-entry-v110.js
          node --check app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js
          node --check app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2.js
          node --check ops/checks/mvp27_1_active_clean_entry_profile_selection_localization_contract.mjs
          node ops/checks/mvp27_1_active_clean_entry_profile_selection_localization_contract.mjs

      - name: Preserve localization architecture and debt ratchet
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded active-owner localization scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/production-clean-entry-v110\.js|app/assets/js/production-clean-entry-v110-mvp19-3-final-polish\.js|app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2\.js|app/runtime/client/version-manifest\.php|app/locales/ru\.json|bot/tests/Mvp23ProfileRouteLatencyContractTest\.php|ops/checks/mvp27_1_active_clean_entry_profile_selection_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp23-profile-route-latency\.yml|\.github/workflows/mvp27-1-active-clean-entry-profile-selection-localization\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected active clean-entry localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: MVP-16.1 legacy screen edge audit
on:
  push:
    branches: [agent/mvp-16-1-final-runtime-audit]
    paths: ['.github/workflows/mvp16-1-final-edge-audit.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace legacy screen imports and calls
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== IMPORTS: game-screen.js ==='
          grep -RFn --include='*.js' "game-screen.js?v=74" app/assets/js || true
          echo '=== IMPORTS: search-screen.js ==='
          grep -RFn --include='*.js' "search-screen.js?v=74" app/assets/js || true
          echo '=== CALLS / IMPORTS: screen lifecycle functions ==='
          grep -RFn --include='*.js' -E "(initGameScreen|startGamePolling|initSearchScreen|startSearchPolling)" app/assets/js | head -n 250 || true

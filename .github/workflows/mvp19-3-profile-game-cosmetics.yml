name: MVP-19.3 Profile-owned game cosmetics

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/profile/**'
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs'
      - '.github/workflows/mvp19-3-profile-game-cosmetics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-game-cosmetics:
    name: Preserve accepted game-cosmetics collection
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Run Profile game-cosmetics contracts
        run: |
          node bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs
          php bot/tests/Mvp19_1ProductInventoryTest.php
          php bot/tests/Mvp19_4GameCosmeticsPilotTest.php
          node bot/tests/Mvp19_4EffectsV2ContractTest.mjs
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php
      - name: Guard accepted game-cosmetics owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'

          # Inventory/effect mechanics remain frozen. The canonical Profile owner may
          # change only together with its executable contract, so a proven Profile
          # defect can be fixed at the owner instead of being monkey-patched in a
          # wrapper while the accepted ownership/equip architecture stays guarded.
          git diff --exit-code "$base" "$head" -- \
            bot/catalog/ProductInventoryService.php \
            bot/tests/Mvp19_4EffectsV2ContractTest.mjs

          if ! git diff --quiet "$base" "$head" -- app/assets/js/screens/profile-screen-v110.js; then
            if git diff --quiet "$base" "$head" -- bot/tests/Mvp19_3ProfileGameCosmeticsContractTest.mjs; then
              echo 'Profile owner changed without a matching Profile game-cosmetics contract migration.' >&2
              exit 1
            fi
          fi

          git diff --exit-code "$base" "$head" -- \
            app/assets/js/games \
            ':(exclude)app/assets/js/games/chess/renderer.js'
          git diff --check
name: MVP-25.1 Profile placeholder cleanup

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_1_PRODUCT_WIDE_UNFINISHED_AUDIT.md'
      - 'bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest.php'
      - 'bot/tests/ProfileV2CorrectiveStaticContractTest.php'
      - '.github/workflows/mvp25-1-profile-placeholder-cleanup.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/profile-screen-v110.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'docs/MVP25_1_PRODUCT_WIDE_UNFINISHED_AUDIT.md'
      - 'bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest.php'
      - '.github/workflows/mvp25-1-profile-placeholder-cleanup.yml'

permissions:
  contents: read

jobs:
  profile-placeholder-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check app/assets/js/screens/profile-screen-v110.js
          node -e "JSON.parse(require('fs').readFileSync('app/locales/ru.json','utf8'))"
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest.php
          php -l bot/tests/ProfileV2CorrectiveStaticContractTest.php

      - name: Placeholder cleanup contract
        run: |
          php bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest.php
          php bot/tests/ProfileV2CorrectiveStaticContractTest.php

      - name: Localization regression
        run: php bot/tests/Mvp162LocalizationInfrastructureTest.php

      - name: Guard bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(app/assets/js/screens/profile-screen-v110\.js|app/locales/ru\.json|app/runtime/client/version-manifest\.php|docs/MVP25_1_PRODUCT_WIDE_UNFINISHED_AUDIT\.md|bot/tests/Mvp25_1ProfilePlaceholderCleanupContractTest\.php|bot/tests/ProfileV2CorrectiveStaticContractTest\.php|\.github/workflows/mvp25-1-profile-placeholder-cleanup\.yml)
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.1 paths:\n%s\n' "$bad" >&2; exit 1; }
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-25.1 paths:\n%s\n' "$bad" >&2; exit 1; }
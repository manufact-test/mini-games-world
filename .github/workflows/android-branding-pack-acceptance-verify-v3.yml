name: Android Branding Pack Acceptance Verify V3

on:
  pull_request:
    branches:
      - agent/android-branding-pack
    paths:
      - android-app/**
      - .github/workflows/android-branding-pack-acceptance-verify-v3.yml

permissions:
  contents: read

jobs:
  build-install-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout verifier head
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Ensure Android SDK and emulator
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [[ -x "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'sdkmanager unavailable' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'

      - name: Verify isolated foundation contracts
        working-directory: android-app
        run: python3 tools/verify-foundation.py

      - name: Test lint and assemble acceptance APK
        working-directory: android-app
        env:
          MGW_BASE_URL: https://seashell-okapi-889488.hostingersite.com/app/v110.php?v=1123
        run: gradle --no-daemon clean test lint assembleDebug

      - name: Verify package signature and approved raster
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.minigamesworld.app.acceptance'" /tmp/badging.txt
          grep -F "MGW Acceptance" /tmp/apksigner.txt
          base64 -d android-app/branding/shield_king_launcher_384.webp.b64 > /tmp/approved-icon.webp
          ICON_ENTRY="$(unzip -Z1 "$APK" | grep -E 'res/drawable[^/]*/ic_mgw_launcher_art\.webp$' | head -n 1)"
          test -n "$ICON_ENTRY"
          unzip -p "$APK" "$ICON_ENTRY" > /tmp/apk-icon.webp
          cmp /tmp/approved-icon.webp /tmp/apk-icon.webp
          sha256sum /tmp/approved-icon.webp /tmp/apk-icon.webp "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Create Android emulator
        shell: bash
        run: |
          set -euo pipefail
          AVDMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$AVDMANAGER" ]]; then AVDMANAGER="$(command -v avdmanager)"; fi
          AVD_HOME="$RUNNER_TEMP/mgw-avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | "$AVDMANAGER" create avd \
            -n mgw_acceptance_api35 \
            -k 'system-images;android-35;google_apis;x86_64' \
            --force
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo "AVD contents:"
          find "$AVD_HOME" -maxdepth 2 -type f -print

      - name: Enable emulator acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm unavailable; emulator will use software acceleration'
          fi

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$EMULATOR"
          test -x "$ADB"
          test -n "${ANDROID_AVD_HOME:-}"
          test -d "$ANDROID_AVD_HOME"
          "$EMULATOR" -list-avds

          ACCEL_ARGS=()
          if [[ ! -e /dev/kvm ]]; then
            ACCEL_ARGS=(-accel off)
          fi

          "$EMULATOR" -avd mgw_acceptance_api35 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-metrics "${ACCEL_ARGS[@]}" \
            > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!

          DEVICE_READY=0
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Emulator process exited before device became ready' >&2
              cat /tmp/emulator.log
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          if [[ "$DEVICE_READY" != "1" ]]; then
            echo 'ADB device did not become ready in time' >&2
            cat /tmp/emulator.log
            exit 1
          fi

          for i in $(seq 1 120); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              "$ADB" shell input keyevent 82 || true
              exit 0
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Emulator process exited during Android boot' >&2
              cat /tmp/emulator.log
              exit 1
            fi
            sleep 2
          done
          echo 'Android boot did not complete in time' >&2
          cat /tmp/emulator.log
          exit 1

      - name: ADB install and launch gate
        shell: bash
        run: |
          set -euo pipefail
          ADB="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/platform-tools/adb"
          test -x "$ADB"
          "$ADB" install -r "$APK" | tee /tmp/adb-install.txt
          grep -F 'Success' /tmp/adb-install.txt
          "$ADB" shell am start -W -n com.minigamesworld.app.acceptance/com.minigamesworld.app.MainActivity | tee /tmp/am-start.txt
          sleep 4
          PID="$("$ADB" shell pidof com.minigamesworld.app.acceptance | tr -d '\r')"
          test -n "$PID"
          "$ADB" exec-out screencap -p > /tmp/mgw-acceptance-startup.png

      - name: Upload verified APK and screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-shield-king-acceptance-verified-v3
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            /tmp/mgw-acceptance-startup.png
            /tmp/adb-install.txt
            /tmp/am-start.txt
            /tmp/apksigner.txt
            /tmp/badging.txt
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgw-android-shield-king-acceptance-v3-reports
          path: |
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
            /tmp/emulator.log
          if-no-files-found: warn

name: MVP-15.4 canonical bonuses

on:
  push:
    branches:
      - agent/mvp-15-4-canonical-bonuses
    paths:
      - 'bot/services/WeeklyMatchEconomyService.php'
      - 'bot/services/NotificationService.php'
      - 'bot/services/UserService.php'
      - 'bot/weekly/RuntimeWeeklyBonusRepository.php'
      - 'bot/tests/Mvp154CanonicalBonusesTest.php'
      - 'bot/tests/Mvp154AccountIdentityTest.php'
      - 'bot/tests/WeeklyBonusRuntimeBridgeTest.php'
      - '.github/workflows/mvp15-4-canonical-bonuses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-bonus-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l bot/services/WeeklyMatchEconomyService.php
          php -l bot/services/NotificationService.php
          php -l bot/services/UserService.php
          php -l bot/weekly/RuntimeWeeklyBonusRepository.php
          php -l bot/tests/Mvp154CanonicalBonusesTest.php
          php -l bot/tests/Mvp154AccountIdentityTest.php
          php -l bot/tests/WeeklyBonusRuntimeBridgeTest.php
      - name: MVP-15.4 canonical bonus regression
        run: php bot/tests/Mvp154CanonicalBonusesTest.php
      - name: Provider-neutral account identity regression
        run: php bot/tests/Mvp154AccountIdentityTest.php
      - name: Weekly DB runtime bridge regression
        id: weekly_bridge
        shell: bash
        run: |
          set +e
          php bot/tests/WeeklyBonusRuntimeBridgeTest.php > /tmp/weekly-bridge.log 2>&1
          status=$?
          cat /tmp/weekly-bridge.log
          cp /tmp/weekly-bridge.log weekly-bridge.log
          exit "$status"
      - name: Upload weekly bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp15-4-weekly-bridge-${{ github.run_id }}
          path: weekly-bridge.log
          if-no-files-found: warn
          retention-days: 3

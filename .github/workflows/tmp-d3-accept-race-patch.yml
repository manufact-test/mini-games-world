name: TMP D3 accept race patch

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/invite-popup-transition-stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invite-popup-transition-stability
          fetch-depth: 0
      - name: Apply exact D3 regression patch
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/tmp-d3-accept-race-patch.py
          node --check e2e/staging/d3-shared-invite.spec.mjs
          git diff --check
          git diff -- e2e/staging/d3-shared-invite.spec.mjs
      - name: Commit D3 regression only
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- e2e/staging/d3-shared-invite.spec.mjs; then
            echo 'D3 regression already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/staging/d3-shared-invite.spec.mjs
          git commit -m 'E2E: prove stale invite sync cannot roll back Accept UI'
          git push origin HEAD:agent/invite-popup-transition-stability

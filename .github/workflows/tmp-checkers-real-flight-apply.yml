name: TEMP Checkers real-flight cascade applier

on:
  push:
    branches:
      - agent/mvp19-6-checkers-real-flight-css-owner-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Checkers real-flight cascade fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact proven cascade fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_once(
              'app/assets/css/games/checkers/live-effects-store-parity-v1.css',
              '.checkers-surface.mgw-checkers-live-fx-running .checkers-cell.move-impact .checkers-piece,\n.checkers-surface.mgw-checkers-live-fx-running .checkers-cell.promotion-flash .checkers-piece{',
              '.checkers-surface.mgw-checkers-live-fx-running .checkers-cell.move-impact .checkers-piece:not(.mgw-checkers-live-real-move-piece),\n.checkers-surface.mgw-checkers-live-fx-running .checkers-cell.promotion-flash .checkers-piece{'
          )

          replace_once(
              'app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js',
              "effectLink.dataset.mgwCheckersLiveEffects = 'mvp19-6-store-parity-v4';",
              "effectLink.dataset.mgwCheckersLiveEffects = 'mvp19-6-store-parity-v5-real-flight';"
          )
          replace_once(
              'app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js',
              "live-effects-store-parity-v1.css?v=4&mvp19_6=landing-handoff-v1",
              "live-effects-store-parity-v1.css?v=5&mvp19_6=real-piece-flip-exempt-v1"
          )

          replace_once(
              'app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js',
              'renderer-live-effects-v1.js?v=13&mvp19_6=runtime-smoothing-v13',
              'renderer-live-effects-v1.js?v=14&mvp19_6=runtime-smoothing-v13&cascade=real-flight-v1'
          )

          replace_once(
              'app/runtime/client/version-manifest.php',
              'renderer-single-flight-v1.js?v=1&mvp19_6=single-flight-dom-v1',
              'renderer-single-flight-v1.js?v=2&mvp19_6=single-flight-dom-v1&real_flight=css-cascade-v1'
          )
          replace_once(
              'app/runtime/client/version-manifest.php',
              'renderer-live-effects-v1.js?v=13&mvp19_6=runtime-smoothing-v13',
              'renderer-live-effects-v1.js?v=14&mvp19_6=runtime-smoothing-v13&cascade=real-flight-v1'
          )
          replace_once(
              'app/runtime/client/version-manifest.php',
              '&single_flight=dom-v1',
              '&single_flight=dom-v1&real_flight=css-cascade-v1'
          )

      - name: Verify bounded diff and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js
          node --check app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js
          php -l app/runtime/client/version-manifest.php
          grep -F '.checkers-piece:not(.mgw-checkers-live-real-move-piece)' app/assets/css/games/checkers/live-effects-store-parity-v1.css
          grep -F 'live-effects-store-parity-v1.css?v=5&mvp19_6=real-piece-flip-exempt-v1' app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js
          grep -F 'renderer-single-flight-v1.js?v=2' app/runtime/client/version-manifest.php
          grep -F 'renderer-live-effects-v1.js?v=14' app/runtime/client/version-manifest.php
          git diff --check
          git diff --stat
      - name: Commit exact product fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'manufact-test'
          git config user.email 'manufact.test@gmail.com'
          git add app/assets/css/games/checkers/live-effects-store-parity-v1.css \
                  app/assets/js/checkers-cosmetics/renderer-live-effects-v1.js \
                  app/assets/js/checkers-cosmetics/renderer-single-flight-v1.js \
                  app/runtime/client/version-manifest.php
          git commit -m 'Apply Checkers real-flight cascade fix'
          git push origin HEAD:agent/mvp19-6-checkers-real-flight-css-owner-v1

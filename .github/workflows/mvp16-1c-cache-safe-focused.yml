name: MVP-16.1C cache-safe focused

on:
  push:
    branches:
      - agent/mvp-16-1c-cache-safe-route-polling
    paths:
      - '.github/workflows/mvp16-1c-cache-safe-focused.yml'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/screens/search-screen-v102.js'
      - 'app/assets/js/screens/game-screen-v102-safe.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/v110.php'
      - 'bot/tests/Mvp161ClientBootstrapRouterTest.php'
      - 'bot/tests/Mvp156UnifiedZoneCutoverTest.php'
      - 'bot/tests/Mvp156NotificationSemanticScrollTest.php'
      - 'ops/checks/mvp16_1c_route_scoped_polling_contract.mjs'
      - 'ops/checks/verify-mvp15-3-unified-balance-owner.py'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax
        run: |
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/screens/search-screen-v102.js
          node --check app/assets/js/screens/game-screen-v102-safe.js
          node --check ops/checks/mvp16_1c_route_scoped_polling_contract.mjs
      - name: PHP syntax
        run: |
          php -l app/runtime/client/version-manifest.php
          php -l app/v110.php
          php -l bot/tests/Mvp161ClientBootstrapRouterTest.php
          php -l bot/tests/Mvp156UnifiedZoneCutoverTest.php
          php -l bot/tests/Mvp156NotificationSemanticScrollTest.php
      - name: MVP 16.1 bootstrap/router contract
        run: php bot/tests/Mvp161ClientBootstrapRouterTest.php
      - name: MVP 16.1C route polling contract
        run: node ops/checks/mvp16_1c_route_scoped_polling_contract.mjs
      - name: MVP 15.6 unified zone regression
        run: php bot/tests/Mvp156UnifiedZoneCutoverTest.php
      - name: MVP 15.6 notification regression
        run: php bot/tests/Mvp156NotificationSemanticScrollTest.php
      - name: MVP 15.3 unified balance verifier
        run: python3 ops/checks/verify-mvp15-3-unified-balance-owner.py
      - name: Exact candidate runtime fingerprint
        run: |
          php -r 'require "bot/helpers/StagingE2eSourceFingerprint.php"; $f=(new StagingE2eSourceFingerprint(getcwd(), "bot/helpers/staging-e2e-runtime-files.txt"))->calculate(); file_put_contents("candidate-fingerprint.txt", $f["sha256"]."\n".$f["file_count"]."\n");'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-fingerprint
          path: candidate-fingerprint.txt
          if-no-files-found: error

name: MVP-27.1 V106 Invite Actions Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish-mobile-nav-v2.js'
      - 'app/assets/js/production-clean-entry-v110-mvp19-3-final-polish.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/games/game-invites-v110.js'
      - 'app/assets/js/production-clean-entry-v106.js'
      - 'app/assets/js/production-clean-entry-v107.js'
      - 'app/assets/js/production-clean-entry-v108.js'
      - 'app/assets/js/production-clean-entry-v109.js'
      - 'app/assets/js/production-v106-invite-actions.js'
      - 'ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-v106-invite-actions-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v106-invite-actions-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and factual reachability proof
        run: |
          set -euo pipefail
          node --check app/assets/js/production-v106-invite-actions.js
          node --check ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs
          node --check ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs
          node ops/checks/mvp27_1_v105_invite_latency_reachability_contract.mjs
          node ops/checks/mvp27_1_v106_invite_actions_reachability_contract.mjs

      - name: Preserve localization and invite ownership
        run: |
          set -euo pipefail
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_game_invites_localization_contract.mjs
          node ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_v105_invite_latency_reachability_contract\.mjs|ops/checks/mvp27_1_v106_invite_actions_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-v106-invite-actions-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected v106 reachability paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

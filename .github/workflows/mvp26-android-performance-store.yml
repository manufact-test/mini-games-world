name: MVP-26 Android Store Performance Corrective

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/screens/store-screen.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'tests/mvp19-13-ttt-bundle-reference.mjs'
      - 'bot/tests/Mvp25_6StoreClientContractTest.mjs'
      - '.github/workflows/mvp26-6-android-product-parity.yml'
      - '.github/workflows/mvp26-android-performance-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-performance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/store-screen.js
          node --check tests/mvp19-13-ttt-bundle-reference.mjs
          node --check bot/tests/Mvp25_6StoreClientContractTest.mjs
          php -l app/runtime/client/version-manifest.php
          php -l bot/helpers/WebAppLaunchUrl.php

      - name: Store contracts
        run: |
          set -euo pipefail
          node tests/mvp19-13-ttt-bundle-reference.mjs
          node bot/tests/Mvp25_6StoreClientContractTest.mjs

      - name: Lazy bundle performance ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-store-v2-bundle-hydrated' app/assets/js/screens/store-screen.js
          grep -F "targetPanel.innerHTML = renderGameBundle(targetBundle);" app/assets/js/screens/store-screen.js
          grep -F "if (bundlePanel instanceof HTMLElement && !bundlePanel.classList.contains('active')) return;" app/assets/js/screens/store-screen.js
          ! grep -Fq 'globalThis.setTimeout(fit, 90)' app/assets/js/screens/store-screen.js
          grep -F 'bundle-selector-click-hint-v11-performance' app/runtime/client/version-manifest.php
          grep -F 'bundles=bundle-selector-click-hint-v11-performance' bot/helpers/WebAppLaunchUrl.php

      - name: Bounded corrective diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --quiet "$base" "$head" -- app/assets/js/screens/store-screen.js; then
            echo "Successor slice: Store performance owner unchanged; original corrective scope does not apply."
            exit 0
          fi
          allowed='^(app/assets/js/screens/store-screen\.js|app/runtime/client/version-manifest\.php|bot/helpers/WebAppLaunchUrl\.php|tests/mvp19-13-ttt-bundle-reference\.mjs|bot/tests/Mvp25_6StoreClientContractTest\.mjs|\.github/workflows/mvp26-6-android-product-parity\.yml|\.github/workflows/mvp26-android-performance-store\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected performance-corrective paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

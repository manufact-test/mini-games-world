name: Shield King V113 painted geometry focused r2

on:
  pull_request:
    branches:
      - agent/shield-king-v113-painted-geometry-correction

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/shield-king-v113-painted-geometry-correction-verifier-r2'
    runs-on: ubuntu-latest
    env:
      FEATURE_SHA: 803fd0a1a95e68a86b9af3831f7f9504075d4584
      BASE_SHA: 6ecb0abb46a554a0a6bd68dcd285afab66865b59
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact branch boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "${FEATURE_SHA}"
          test "$(git diff --name-only "${FEATURE_SHA}" HEAD)" = '.github/workflows/shield-king-v113-painted-geometry-verifier-r2.yml'
          actual="$(git diff --name-only "${BASE_SHA}" "${FEATURE_SHA}")"
          expected=$'app/assets/css/main.css\napp/assets/css/shield-king-icons-v10.css\napp/v110.php\nbot/helpers/staging-e2e-runtime-files.txt\nbot/tests/ShieldKingV113PaintedGeometryContractTest.php'
          test "${actual}" = "${expected}"
      - name: Verify gameplay and accepted assets untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --quiet "${BASE_SHA}" "${FEATURE_SHA}" -- app/assets/css/games app/assets/js bot/services bot/realtime bot/ledger bot/shop bot/payments bot/weekly
          git diff --quiet "${BASE_SHA}" "${FEATURE_SHA}" -- app/assets/icons/shield-king/accepted app/assets/icons/shield-king/mgw-mark.svg
          git diff --quiet "${BASE_SHA}" "${FEATURE_SHA}" -- app/assets/css/components/preloader.css app/assets/css/shield-king-icons-v9.css
      - name: Verify V113 contract and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l app/v110.php
          php -l bot/tests/ShieldKingV113PaintedGeometryContractTest.php
          php bot/tests/ShieldKingV113PaintedGeometryContractTest.php

name: Finalize D1 architecture roadmap

on:
  pull_request:
    branches:
      - agent/mvp14-d1-roadmap-trigger-base

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update canonical roadmap and export master copy
        run: python tools/update_d1_architecture_roadmap.py

      - name: Validate roadmap checkpoint
        run: |
          grep -q 'CURRENT STAGING COMMIT: 76e25cd34ceb53259b27fd26689d04d0ea16ef72' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          grep -q 'D1.0 — Read-only owner audit' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          grep -q '\*\*Статус:\*\* COMPLETE' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          grep -q 'RETIRED HOTFIX GRAPH' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          grep -q 'IMPLEMENTATION RECORD — 2026-08-04' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          grep -q '30943775973' docs/MVP-14R-RELATIONAL-MYSQL-REBUILD-ROADMAP.md
          test -s MGW_MASTER_MVP_ROADMAP_V2_UPDATED_2026-08-04_ARCHITECTURE_REBUILD.md

      - name: Upload user roadmap file
        uses: actions/upload-artifact@v4
        with:
          name: MGW_MASTER_MVP_ROADMAP_V2_UPDATED_2026-08-04_ARCHITECTURE_REBUILD
          path: MGW_MASTER_MVP_ROADMAP_V2_UPDATED_2026-08-04_ARCHITECTURE_REBUILD.md
          retention-days: 14

      - name: Commit canonical roadmap and remove temporary runner
        run: |
          rm -f tools/update_d1_architecture_roadmap.py .github/workflows/finalize-d1-roadmap.yml MGW_MASTER_MVP_ROADMAP_V2_UPDATED_2026-08-04_ARCHITECTURE_REBUILD.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update D1 architecture roadmap checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

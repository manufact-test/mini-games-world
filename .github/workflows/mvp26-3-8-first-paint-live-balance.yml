name: MVP-26.3.8 First-paint live balance

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/profile.php'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php'
      - 'bot/tests/Mvp25_4StartupPerformanceContractTest.php'
      - '.github/workflows/mvp26-3-8-first-paint-live-balance.yml'
  push:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/profile.php'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php'
      - 'bot/tests/Mvp25_4StartupPerformanceContractTest.php'
      - '.github/workflows/mvp26-3-8-first-paint-live-balance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Primary-runtime balance before first Home paint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/profile.php
          php -l app/runtime/client/version-manifest.php
          php -l bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php
          php -l bot/tests/Mvp25_4StartupPerformanceContractTest.php
          node --check app/assets/js/main-v110-handoff-shell.js

      - name: First-paint balance contract
        run: php bot/tests/Mvp26_3_8FirstPaintBalanceContractTest.php

      - name: Existing startup ownership
        run: php bot/tests/Mvp25_4StartupPerformanceContractTest.php

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/mvp26-3-8-first-paint-live-balance\.yml|bot/profile\.php|app/assets/js/main-v110-handoff-shell\.js|app/runtime/client/version-manifest\.php|bot/tests/Mvp26_3_8FirstPaintBalanceContractTest\.php|bot/tests/Mvp25_4StartupPerformanceContractTest\.php|bot/tests/Mvp15UnifiedProfileAvatarClientTest\.php)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected MVP-26.3.8 paths:\n%s\n' "$bad" >&2; exit 1; }

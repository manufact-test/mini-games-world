name: MVP-15.5 normal match economy

on:
  push:
    branches:
      - agent/mvp-15-5-normal-match-economy
    paths:
      - 'bot/economy/MatchEconomyRuntimeConfig.php'
      - 'bot/core/bootstrap.php'
      - 'bot/api.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'bot/tests/Mvp155NormalMatchEconomyTest.php'
      - 'app/v110.php'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/main.js'
      - 'app/assets/js/config.js'
      - 'app/assets/js/state.js'
      - 'app/assets/js/screens/home-screen.js'
      - '.github/workflows/mvp15-5-normal-match-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-normal-match-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l bot/economy/MatchEconomyRuntimeConfig.php
          php -l bot/core/bootstrap.php
          php -l bot/api.php
          php -l app/v110.php
          php -l bot/tests/Mvp155NormalMatchEconomyTest.php
      - name: JavaScript syntax
        run: |
          node --check app/assets/js/main-v110-handoff-shell.js
          node --check app/assets/js/main.js
          node --check app/assets/js/config.js
          node --check app/assets/js/state.js
          node --check app/assets/js/screens/home-screen.js
      - name: Canonical normal-match regression
        run: php bot/tests/Mvp155NormalMatchEconomyTest.php
      - name: Verify accepted Telegram v110 owner
        shell: bash
        run: |
          set -Eeuo pipefail
          php app/v110.php > /tmp/mgw-v110.html
          grep -F './assets/js/config.js?v=39&mvp15=match-economy' /tmp/mgw-v110.html
          grep -F './assets/js/state.js?v=29&mvp15=match-economy' /tmp/mgw-v110.html
          grep -F './assets/js/screens/home-screen.js?v=76&mvp15=match-economy' /tmp/mgw-v110.html
          grep -F './assets/js/main-v110-handoff-shell.js?v=1140&mvp15=match-economy' /tmp/mgw-v110.html
          grep -F 'APP_CONFIG.matchBet = matchEntryCost' app/assets/js/main-v110-handoff-shell.js
          grep -F 'state.selectedBet = matchEntryCost' app/assets/js/main-v110-handoff-shell.js
      - name: Verify client has no active Match price owner
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'matchBet: null' app/assets/js/config.js
          grep -F 'selectedBet: 0' app/assets/js/state.js
          grep -F 'APP_CONFIG.matchBet = matchEntryCost' app/assets/js/main.js
          if grep -Eq 'Match-комнате участие всегда стоит 10|Участие всегда стоит 10' app/assets/js/screens/home-screen.js; then
            echo 'legacy 10-coin Match copy remains active' >&2
            exit 1
          fi
      - name: Verify exact deployment coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx 'app/assets/js/config.js' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fx 'app/assets/js/main-v110-handoff-shell.js' bot/helpers/staging-e2e-runtime-files.txt
          grep -Fx 'bot/economy/MatchEconomyRuntimeConfig.php' bot/helpers/staging-e2e-runtime-files.txt
          python3 scripts/ci/staging-runtime-fingerprint.py | grep -E '^[a-f0-9]{64}$'

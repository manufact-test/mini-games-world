name: MVP-15.5 normal match economy

on:
  push:
    branches:
      - agent/mvp-15-5-normal-match-economy
    paths:
      - 'bot/economy/MatchEconomyRuntimeConfig.php'
      - 'bot/core/bootstrap.php'
      - 'bot/api.php'
      - 'bot/tests/Mvp155NormalMatchEconomyTest.php'
      - 'app/assets/js/main.js'
      - 'app/assets/js/config.js'
      - 'app/assets/js/state.js'
      - 'app/assets/js/screens/home-screen.js'
      - '.github/workflows/mvp15-5-normal-match-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-normal-match-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l bot/economy/MatchEconomyRuntimeConfig.php
          php -l bot/core/bootstrap.php
          php -l bot/api.php
          php -l bot/tests/Mvp155NormalMatchEconomyTest.php
      - name: JavaScript syntax
        run: |
          node --check app/assets/js/main.js
          node --check app/assets/js/config.js
          node --check app/assets/js/state.js
          node --check app/assets/js/screens/home-screen.js
      - name: Canonical normal-match regression
        run: php bot/tests/Mvp155NormalMatchEconomyTest.php
      - name: Verify client has no active Match price owner
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'matchBet: null' app/assets/js/config.js
          grep -F 'selectedBet: 0' app/assets/js/state.js
          grep -F 'APP_CONFIG.matchBet = matchEntryCost' app/assets/js/main.js
          if grep -Eq 'Match-комнате участие всегда стоит 10|Участие всегда стоит 10' app/assets/js/screens/home-screen.js; then
            echo 'legacy 10-coin Match copy remains active' >&2
            exit 1
          fi

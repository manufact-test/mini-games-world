name: MVP-16.4 final bottom nav polish focused
on:
  push:
    branches: [agent/mvp-16-4-bottom-nav-final-polish]
    paths: ['.github/workflows/mvp16-4-bottom-nav-final-polish-focused.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Focused contracts
        run: |
          set -Eeuo pipefail
          node ops/checks/mvp16_3_shell_navigation_contract.mjs
          node ops/checks/mvp16_4_remaining_variant_rules_nav_contract.mjs
          node ops/checks/mvp16_4_ttt_variant_rules_contract.mjs
          node ops/checks/mvp16_4_rules_return_to_setup_contract.mjs
          test "$(grep -RIl --include='*.css' '\.app-bottom-nav' app/assets/css | wc -l)" -eq 1
          php app/v110.php > /tmp/mgw-v110.html
          grep -F 'main.css?v=165&sk=3&icons=c1efd5af&render=34&mvp16=final-bottom-nav' /tmp/mgw-v110.html >/dev/null
          test "$(grep -o '<script type="module" src="' /tmp/mgw-v110.html | wc -l)" -eq 1
          python3 scripts/ci/staging-runtime-fingerprint.py
          echo MVP16_4_BOTTOM_NAV_FINAL_POLISH=PASS

name: MVP-27.1 Active Targeted Interactions Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/assets/js/production-v110-targeted-interactions.js'
      - 'app/assets/js/production-clean-entry-v110.js'
      - 'app/locales/ru.json'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_active_targeted_interactions_localization_contract.mjs'
      - 'ops/checks/mvp27_1_active_game_meta_localization_contract.mjs'
      - 'ops/checks/mvp27_1_top_residual_historical_client_reachability_contract.mjs'
      - 'bot/tests/Mvp17_5TicTacToeFirstTapSingleOwnerContractTest.php'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-active-targeted-interactions-localization.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-targeted-interactions-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and active localization proof
        run: |
          set -euo pipefail
          node --check app/assets/js/production-v110-targeted-interactions.js
          node --check ops/checks/mvp27_1_active_targeted_interactions_localization_contract.mjs
          node ops/checks/mvp27_1_active_targeted_interactions_localization_contract.mjs

      - name: Preserve localization foundations
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_game_meta_localization_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded active localization scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-active-targeted-interactions-localization')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/assets/js/production-v110-targeted-interactions\\.js|app/locales/ru\\.json|app/runtime/client/version-manifest\\.php|ops/checks/mvp27_1_active_targeted_interactions_localization_contract\\.mjs|ops/checks/mvp27_1_active_game_meta_localization_contract\\.mjs|ops/checks/mvp27_1_top_residual_historical_client_reachability_contract\\.mjs|bot/tests/Mvp17_5TicTacToeFirstTapSingleOwnerContractTest\\.php|ops/checks/mvp27_1_hardcoded_text_baseline\\.json|\\.github/workflows/mvp27-1-active-targeted-interactions-localization\\.yml|\\.github/workflows/mvp27-1-localization-audit\\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected active targeted-interactions localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

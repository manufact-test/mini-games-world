name: E2E Phase B turn handoff focused

on:
  pull_request:
    branches:
      - agent/e2e-phase-b-turn-handoff-owner

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 33cb3c934eac5adfff07afcd6c056219d7c643d2
  STATUS_CONTEXT: phase-b-turn-handoff-e2e-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B turn handoff E2E verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: E2E source syntax and contract
        run: |
          set -Eeuo pipefail
          node --check e2e/staging/two-context.spec.mjs
          python3 - <<'PY'
          from pathlib import Path
          text = Path('e2e/staging/two-context.spec.mjs').read_text(encoding='utf-8')
          required = [
              'async function waitForAuthoritativeTurnWindow(player)',
              "phase === 'active'",
              'turn === expectedTurn',
              'serverNowMs >= turnStartsAtMs',
              'await waitForAuthoritativeTurnWindow(player);',
          ]
          for needle in required:
              assert needle in text, needle
          assert 'page.waitForTimeout(1_000)' not in text
          assert 'timeout: 31_000' not in text
          print('authoritative turn handoff E2E owner: PASS')
          PY
          git diff --check origin/agent/e2e-phase-b-turn-handoff-owner...HEAD || true

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B turn handoff E2E verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Phase B turn handoff E2E verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

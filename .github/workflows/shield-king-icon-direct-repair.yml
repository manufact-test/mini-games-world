name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-icon-repair-payload
          path: payload
          fetch-depth: 1

      - name: Checkout isolated accepted-asset target
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-accepted-icon-export
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Reconstruct exact accepted ZIP from stored exact payload chunks
        shell: python
        run: |
          import base64, hashlib, pathlib, re
          parts = sorted(pathlib.Path('payload/repair-payload').glob('exact-*'))
          assert parts, 'no exact payload chunks found'
          chunks=[]
          for p in parts:
              s=p.read_text()
              clean=re.sub(r'\s+','',s)
              chunks.append(clean)
              print(p.name, len(clean))
          encoded=''.join(chunks)
          print('PART_COUNT', len(parts))
          print('TOTAL_BASE64_CHARS', len(encoded))
          assert len(encoded) == 1230784, f'base64 length mismatch: {len(encoded)}'
          payload=base64.b64decode(encoded, validate=True)
          zip_sha=hashlib.sha256(payload).hexdigest()
          print('ZIP_BYTES', len(payload))
          print('ZIP_SHA256', zip_sha)
          assert len(payload) == 923086
          assert zip_sha == '83e4bb23745fa3f0453d8bf22a7298030bec963942577c0bc20f1d1964d4df60'
          pathlib.Path('/tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip').write_bytes(payload)

      - name: Extract and verify source against frozen MANIFEST 44/44
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/export
          mkdir -p /tmp/export
          unzip -q /tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip -d /tmp/export
          python3 - <<'PY'
          import hashlib, json, pathlib
          base = pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest = json.loads((base / 'MANIFEST.json').read_text())
          assert len(manifest['files']) == 44
          src = pathlib.Path('/tmp/export')
          for item in manifest['files']:
              p = src / item['path']
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
              assert len(data) == item['bytes'], item['path']
          assert len(list(src.rglob('*.webp'))) == 44
          print('SOURCE_MANIFEST_VERIFY=44/44 PASS')
          PY

      - name: Materialize 44 direct WebP files and replace ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd target
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/export/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/export/ui accepted-assets/shield-king-icons/files/
          cp /tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip accepted-assets/shield-king-icons/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip

      - name: Verify repository bytes 44/44 and exact ZIP
        shell: python
        run: |
          import hashlib, json, pathlib
          base = pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest = json.loads((base / 'MANIFEST.json').read_text())
          rows=[]
          for item in manifest['files']:
              p = base / 'files' / item['path']
              data = p.read_bytes()
              actual_sha=hashlib.sha256(data).hexdigest()
              actual_size=len(data)
              assert actual_sha == item['sha256'], item['path']
              assert actual_size == item['bytes'], item['path']
              rows.append({'path':item['path'],'sha256':actual_sha,'bytes':actual_size,'pass':True})
          assert len(rows) == 44
          assert len(list((base / 'files').rglob('*.webp'))) == 44
          zip_path=base/'MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip'
          z=zip_path.read_bytes()
          zip_sha=hashlib.sha256(z).hexdigest()
          assert len(z)==923086
          assert zip_sha=='83e4bb23745fa3f0453d8bf22a7298030bec963942577c0bc20f1d1964d4df60'
          audit={'status':'PASS','verified':'44/44','zip_sha256':zip_sha,'zip_bytes':len(z),'files':rows}
          (base/'REPAIR_VERIFICATION.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('REPOSITORY_MANIFEST_VERIFY=44/44 PASS')
          print('ZIP_VERIFY=PASS')

      - name: Commit repair only to isolated asset branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accepted-assets/shield-king-icons/files \
                  accepted-assets/shield-king-icons/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip \
                  accepted-assets/shield-king-icons/REPAIR_VERIFICATION.json
          test "$(git diff --cached --name-only | wc -l)" -eq 46
          git commit -m 'assets(shield-king): repair accepted icon binaries 44 of 44'
          git push origin HEAD:agent/shield-king-accepted-icon-export
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"

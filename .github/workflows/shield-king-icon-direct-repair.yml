name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated accepted-asset target
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-accepted-icon-export
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Fetch existing accepted assets and verify MANIFEST 44/44 before any write
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.parse, urllib.request

          base = pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest = json.loads((base / 'MANIFEST.json').read_text())
          assert len(manifest['files']) == 44

          endpoint = 'https://seashell-okapi-889488.hostingersite.com/app/assets/shield-king-icon.php'
          out = pathlib.Path('/tmp/shield-king-accepted')
          if out.exists():
              import shutil; shutil.rmtree(out)
          out.mkdir(parents=True)

          rows = []
          for item in manifest['files']:
              url = endpoint + '?' + urllib.parse.urlencode({'asset': item['path']})
              req = urllib.request.Request(url, headers={'User-Agent':'MGW-Shield-King-Repair/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  status = getattr(response, 'status', 200)
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)
              ok = status == 200 and sha == item['sha256'] and size == item['bytes']
              rows.append({'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':ok})
              assert ok, f"MANIFEST mismatch: {item['path']} status={status} bytes={size} sha={sha}"
              p = out / item['path']
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)

          assert len(rows) == 44
          assert len(list(out.rglob('*.webp'))) == 44
          pathlib.Path('/tmp/source_rows.json').write_text(json.dumps(rows, indent=2) + '\n')
          print('SOURCE_MANIFEST_VERIFY=44/44 PASS')

      - name: Materialize direct WebP files only after source verification passed
        shell: bash
        run: |
          set -euo pipefail
          cd target
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/shield-king-accepted/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/shield-king-accepted/ui accepted-assets/shield-king-icons/files/

      - name: Verify repository direct files 44/44 and write audit
        shell: python
        run: |
          import hashlib, json, pathlib
          base = pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest = json.loads((base / 'MANIFEST.json').read_text())
          rows = []
          for item in manifest['files']:
              p = base / 'files' / item['path']
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)
              ok = sha == item['sha256'] and size == item['bytes']
              rows.append({'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':ok})
              assert ok, item['path']
          assert len(rows) == 44
          assert len(list((base / 'files').rglob('*.webp'))) == 44
          audit = {
              'status':'PASS',
              'verified':'44/44',
              'manifest_source':'accepted-assets/shield-king-icons/MANIFEST.json',
              'direct_files_root':'accepted-assets/shield-king-icons/files',
              'source':'existing read-only Shield King asset endpoint',
              'zip_repair':'not part of this commit; direct files are verified independently',
              'files':rows,
          }
          (base / 'REPAIR_VERIFICATION.json').write_text(json.dumps(audit, indent=2) + '\n')
          print('REPOSITORY_MANIFEST_VERIFY=44/44 PASS')

      - name: Commit repair only to isolated asset branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accepted-assets/shield-king-icons/files accepted-assets/shield-king-icons/REPAIR_VERIFICATION.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'assets(shield-king): materialize accepted WebP files 44 of 44'
          git push origin HEAD:agent/shield-king-accepted-icon-export

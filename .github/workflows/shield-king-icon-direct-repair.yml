name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-icon-repair-payload
          path: payload
          fetch-depth: 1
      - name: Diagnose exact payload files without writing anything
        shell: python
        run: |
          import pathlib,re
          parts=sorted(pathlib.Path('payload/repair-payload').glob('exact-*'))
          print('PART_COUNT',len(parts))
          total=0
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          for p in parts:
              s=p.read_text(errors='replace')
              bad=[(i,ord(ch),repr(ch)) for i,ch in enumerate(s) if ch not in allowed]
              clean=''.join(ch for ch in s if ch in allowed and not ch.isspace())
              total+=len(clean)
              print(p.name,'raw_len=',len(s),'clean_len=',len(clean),'bad_count=',len(bad),'bad_first=',bad[:8],'head=',repr(clean[:12]),'tail=',repr(clean[-12:]))
          print('TOTAL_CLEAN_BASE64_CHARS',total)
          print('EXPECTED_BASE64_CHARS',1230784)

name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated accepted-asset branch
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-accepted-icon-export
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact ZIP bytes already stored in target Git branch
        shell: bash
        run: |
          set -euo pipefail
          ZIP='accepted-assets/shield-king-icons/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip'
          SIZE="$(stat -c%s "$ZIP")"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "TARGET_ZIP_BYTES=$SIZE"
          echo "TARGET_ZIP_SHA256=$SHA"
          test "$SIZE" -eq 923086
          test "$SHA" = '83e4bb23745fa3f0453d8bf22a7298030bec963942577c0bc20f1d1964d4df60'
          rm -rf /tmp/export
          mkdir -p /tmp/export
          unzip -q "$ZIP" -d /tmp/export

      - name: Verify ZIP members 44/44 against frozen MANIFEST
        shell: python
        run: |
          import hashlib, json, pathlib
          base=pathlib.Path('accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          assert len(manifest['files']) == 44
          source=pathlib.Path('/tmp/export')
          rows=[]
          for item in manifest['files']:
              data=(source/item['path']).read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              size=len(data)
              ok=(sha==item['sha256'] and size==item['bytes'])
              rows.append({'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':ok})
              if not ok:
                  raise SystemExit(f'VERIFY_FAIL {item["path"]}')
          print('ZIP_MEMBER_MANIFEST_VERIFY=44/44 PASS')
          pathlib.Path('/tmp/rows.json').write_text(json.dumps(rows,indent=2))

      - name: Materialize accepted WebP files directly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/export/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/export/ui accepted-assets/shield-king-icons/files/

      - name: Reverify materialized repository files and write audit
        shell: python
        run: |
          import hashlib, json, pathlib
          base=pathlib.Path('accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          rows=[]
          for item in manifest['files']:
              p=base/'files'/item['path']
              data=p.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              size=len(data)
              ok=(sha==item['sha256'] and size==item['bytes'])
              rows.append({'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':ok})
              if not ok:
                  raise SystemExit(f'REPOSITORY_VERIFY_FAIL {item["path"]}')
          if len(list((base/'files').rglob('*.webp'))) != 44:
              raise SystemExit('Expected exactly 44 WebP files')
          zip_path=base/'MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip'
          audit={'status':'PASS','verified':44,'total':44,'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'zip_bytes':len(zip_path.read_bytes()),'manifest_source':str(base/'MANIFEST.json'),'files':rows}
          (base/'REPAIR_VERIFICATION.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('REPOSITORY_MANIFEST_VERIFY=44/44 PASS')

      - name: Commit only direct accepted files and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accepted-assets/shield-king-icons/files accepted-assets/shield-king-icons/REPAIR_VERIFICATION.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'assets(shield-king): materialize accepted WebP files 44 of 44'
          git push origin HEAD:agent/shield-king-accepted-icon-export

name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated accepted-asset target
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-accepted-icon-export
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Assemble staged Git blobs and require exact ZIP identity
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          shas = [
            'c9fca8c66bc1034ffaa3c3c9d38fc62db460069c',
            '675ba5d5c1a38b0a1c683dc97ba6ca51da798264',
            'e23927d8772be35d123927d605a16fd1188e2d82',
            'dde6b26ee006e27d047130797df3bc8111b0af33',
            '7cbbab754388e88374758b8a3b0a0679defb3217',
            '22ebff15bffb7e197c78e383745efa2595262e9a',
            '289e143c8ae7a67e27b205e52cc9a67d0628f244',
            '115e5ad6f98b95f978d036ab9878337d74b7a0cb',
            '1a00394b5fd1c08b8f9bc3cad6887a123eca8e52',
            '362ce40ae245a9d5eae15f6ddfd22b5ebb39d24f',
            '0e5ab136464af065f5f56908b503496a5fddfb85',
            '01d94b6e08ecd4cdd23c090a04bb242abc9240f1',
            'a424b8a535a455a2e65410c3b394498ce655a4a0',
            '8673137117c132c767f700c7e54f29f927124ec0',
          ]
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          chunks=[]; sizes=[]
          for sha in shas:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'MGW-Repair'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  obj=json.loads(r.read())
              data=base64.b64decode(obj['content'])
              chunks.append(data); sizes.append(len(data))
          payload=b''.join(chunks)
          path=pathlib.Path('/tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip'); path.write_bytes(payload)
          sha=hashlib.sha256(payload).hexdigest()
          print('BLOB_SIZES='+','.join(map(str,sizes)))
          print(f'ZIP_BYTES={len(payload)}')
          print(f'ZIP_SHA256={sha}')
          assert len(payload)==923086, 'staged blob payload size mismatch'
          assert sha=='83e4bb23745fa3f0453d8bf22a7298030bec963942577c0bc20f1d1964d4df60', 'staged blob payload SHA mismatch'

      - name: Extract and verify source members 44/44
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/export && mkdir -p /tmp/export
          unzip -q /tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip -d /tmp/export
          python3 - <<'PY'
          import hashlib,json,pathlib
          base=pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          assert len(manifest['files'])==44
          src=pathlib.Path('/tmp/export')
          for item in manifest['files']:
              data=(src/item['path']).read_bytes()
              assert len(data)==item['bytes'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          assert len(list(src.rglob('*.webp')))==44
          print('SOURCE_MANIFEST_VERIFY=44/44 PASS')
          PY

      - name: Materialize direct files and replace ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd target
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/export/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/export/ui accepted-assets/shield-king-icons/files/
          cp /tmp/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip accepted-assets/shield-king-icons/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip

      - name: Verify repository bytes 44/44 and exact ZIP
        shell: python
        run: |
          import hashlib,json,pathlib
          base=pathlib.Path('target/accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          rows=[]
          for item in manifest['files']:
              p=base/'files'/item['path']; data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest(); size=len(data)
              ok=sha==item['sha256'] and size==item['bytes']; assert ok,item['path']
              rows.append({'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':True})
          assert len(rows)==44 and len(list((base/'files').rglob('*.webp')))==44
          z=(base/'MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip').read_bytes()
          zsha=hashlib.sha256(z).hexdigest(); assert len(z)==923086; assert zsha=='83e4bb23745fa3f0453d8bf22a7298030bec963942577c0bc20f1d1964d4df60'
          audit={'status':'PASS','verified':'44/44','zip_sha256':zsha,'zip_bytes':len(z),'manifest_source':'accepted-assets/shield-king-icons/MANIFEST.json','files':rows}
          (base/'REPAIR_VERIFICATION.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('REPOSITORY_MANIFEST_VERIFY=44/44 PASS'); print('ZIP_VERIFY=PASS')

      - name: Commit repair only to isolated asset branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accepted-assets/shield-king-icons/files accepted-assets/shield-king-icons/MGW_SHIELD_KING_ACCEPTED_METALLIC_ICON_EXPORT_V1.zip accepted-assets/shield-king-icons/REPAIR_VERIFICATION.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'assets(shield-king): repair accepted icon binaries 44 of 44'
          git push origin HEAD:agent/shield-king-accepted-icon-export

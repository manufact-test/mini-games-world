name: Shield King accepted icon direct-file repair

on:
  pull_request:
    branches:
      - agent/shield-king-icon-repair-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated accepted-asset branch
        uses: actions/checkout@v4
        with:
          ref: agent/shield-king-accepted-icon-export
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch exact accepted WebP assets read-only from staging and verify 44/44
        shell: python
        env:
          ASSET_ENDPOINT: https://seashell-okapi-889488.hostingersite.com/app/assets/shield-king-icon.php
        run: |
          import hashlib, json, os, pathlib, sys, urllib.parse, urllib.request
          base=pathlib.Path('accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          if len(manifest['files']) != 44:
              raise SystemExit(f'Expected 44 manifest entries, got {len(manifest["files"])}')
          out=pathlib.Path('/tmp/sk-direct')
          out.mkdir(parents=True, exist_ok=True)
          results=[]
          endpoint=os.environ['ASSET_ENDPOINT']
          for item in manifest['files']:
              url=endpoint+'?'+urllib.parse.urlencode({'asset':item['path']})
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'MGW-Shield-King-Asset-Repair/1'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read()
                      status=getattr(r,'status',200)
              except Exception as exc:
                  raise SystemExit(f'FETCH_FAIL {item["path"]}: {exc!r}')
              sha=hashlib.sha256(data).hexdigest()
              size=len(data)
              ok=(status==200 and size==item['bytes'] and sha==item['sha256'])
              row={'path':item['path'],'expected_sha256':item['sha256'],'actual_sha256':sha,'expected_bytes':item['bytes'],'actual_bytes':size,'pass':ok}
              results.append(row)
              if not ok:
                  raise SystemExit('VERIFY_FAIL '+json.dumps(row))
              p=out/item['path']
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          report={'status':'PASS','verified':44,'total':44,'manifest_source':'accepted-assets/shield-king-icons/MANIFEST.json','source':'read-only staging Shield King accepted asset endpoint','files':results}
          pathlib.Path('/tmp/DIRECT_FILE_VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          print('SOURCE_AND_MANIFEST_VERIFY=44/44 PASS')

      - name: Materialize direct accepted files in repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/sk-direct/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/sk-direct/ui accepted-assets/shield-king-icons/files/
          cp /tmp/DIRECT_FILE_VERIFICATION.json accepted-assets/shield-king-icons/DIRECT_FILE_VERIFICATION.json

      - name: Re-verify repository files 44/44 after materialization
        shell: python
        run: |
          import hashlib, json, pathlib
          base=pathlib.Path('accepted-assets/shield-king-icons')
          manifest=json.loads((base/'MANIFEST.json').read_text())
          for item in manifest['files']:
              p=base/'files'/item['path']
              data=p.read_bytes()
              assert len(data)==item['bytes'], (item['path'],len(data),item['bytes'])
              assert hashlib.sha256(data).hexdigest()==item['sha256'], item['path']
          assert len(list((base/'files').rglob('*.webp'))) == 44
          print('REPOSITORY_MANIFEST_VERIFY=44/44 PASS')

      - name: Commit direct-file repair only to isolated asset branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add accepted-assets/shield-king-icons/files accepted-assets/shield-king-icons/DIRECT_FILE_VERIFICATION.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'assets(shield-king): materialize accepted WebP files 44 of 44'
          git push origin HEAD:agent/shield-king-accepted-icon-export

name: Shield King accepted icon direct-file repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/shield-king-icon-repair-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch exact accepted WebP assets read-only from staging
        shell: python
        env:
          ASSET_ENDPOINT: https://seashell-okapi-889488.hostingersite.com/app/assets/shield-king-icon.php
        run: |
          import hashlib, json, os, pathlib, sys, urllib.parse, urllib.request
          manifest_path = pathlib.Path('accepted-assets/shield-king-icons/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          out = pathlib.Path('/tmp/sk-direct')
          out.mkdir(parents=True, exist_ok=True)
          bad=[]
          results=[]
          endpoint=os.environ['ASSET_ENDPOINT']
          for item in manifest['files']:
              url=endpoint+'?'+urllib.parse.urlencode({'asset':item['path']})
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'MGW-Shield-King-Asset-Repair/1'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read()
                      status=getattr(r,'status',200)
              except Exception as exc:
                  bad.append({'path':item['path'],'error':repr(exc)})
                  continue
              sha=hashlib.sha256(data).hexdigest()
              ok=(status==200 and len(data)==item['bytes'] and sha==item['sha256'])
              row={'path':item['path'],'bytes':len(data),'sha256':sha,'expected_bytes':item['bytes'],'expected_sha256':item['sha256'],'status':'PASS' if ok else 'FAIL'}
              results.append(row)
              if not ok:
                  bad.append(row)
                  continue
              p=out/item['path']
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
          passed=sum(1 for x in results if x['status']=='PASS')
          print(f'verified={passed}/{len(manifest["files"])}')
          if bad or passed != 44:
              print(json.dumps(bad, indent=2))
              sys.exit(1)
          report={
              'status':'PASS',
              'verified':'44/44',
              'manifest':'accepted-assets/shield-king-icons/MANIFEST.json',
              'source':'read-only staging Shield King accepted asset endpoint',
              'files':results,
          }
          pathlib.Path('/tmp/DIRECT_FILE_VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')

      - name: Materialize direct files after 44/44 verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted-assets/shield-king-icons/files
          mkdir -p accepted-assets/shield-king-icons/files
          cp -a /tmp/sk-direct/games accepted-assets/shield-king-icons/files/
          cp -a /tmp/sk-direct/ui accepted-assets/shield-king-icons/files/
          cp /tmp/DIRECT_FILE_VERIFICATION.json accepted-assets/shield-king-icons/DIRECT_FILE_VERIFICATION.json
          rm -f .github/workflows/shield-king-icon-direct-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assets(shield-king): materialize accepted WebP files 44/44'
          git push origin HEAD:${{ github.head_ref }}

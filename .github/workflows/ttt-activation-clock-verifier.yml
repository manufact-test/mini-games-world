name: Tic Tac Toe Activation Clock Verifier

on:
  push:
    branches:
      - agent/tictactoe-clock-activation-v2

permissions:
  contents: read

concurrency:
  group: mgw-ttt-activation-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Exact activation clock contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate changed syntax
        shell: bash
        run: |
          php -l bot/services/MatchPreparationClockService.php
          php -l bot/tests/PhaseBMatchPreparationClockServiceTest.php
          node --check e2e/staging/two-context.spec.mjs
          node --check e2e/staging/frontend-immutable-core.spec.mjs

      - name: Run exact activation and source contracts
        shell: bash
        run: |
          set -o pipefail
          {
            php bot/tests/PhaseBMatchPreparationClockServiceTest.php
            php bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
            php bot/tests/StagingE2eSourceFingerprintTest.php
            php bot/tests/StagingGlobalSetupRuntimeFingerprintCoverageContractTest.php
          } 2>&1 | tee ttt-activation-clock-report.txt

      - name: Upload focused report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttt-activation-clock-report
          path: ttt-activation-clock-report.txt
          if-no-files-found: error
          retention-days: 3

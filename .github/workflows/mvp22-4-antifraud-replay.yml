name: MVP-22.4 Anti-fraud cases and replay

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/admin-replay.php'
      - 'bot/replay/MatchReplayReader.php'
      - 'bot/antifraud/AntiFraudCaseService.php'
      - 'bot/database/migrations/20260925_0064_create_antifraud_cases.php'
      - 'bot/helpers/staging-e2e-runtime-files.txt'
      - 'bot/tests/MatchReplayReaderTest.php'
      - 'bot/tests/Mvp22_4AntiFraudWorkflowTest.php'
      - 'bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php'
      - 'bot/tests/Mvp22_4AntiFraudContractTest.php'
      - 'bot/tests/Mvp22AdminShellReworkContractTest.php'
      - 'app/admin.php'
      - 'app/assets/css/admin-shell.css'
      - 'app/assets/js/admin-shell.js'
      - 'app/assets/js/admin-antifraud.js'
      - '.github/workflows/mvp22-admin-rework.yml'
      - '.github/workflows/mvp22-3-moderation.yml'
      - '.github/workflows/mvp22-4-antifraud-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  antifraud:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/admin-replay.php
          php -l bot/replay/MatchReplayReader.php
          php -l bot/antifraud/AntiFraudCaseService.php
          php -l bot/database/migrations/20260925_0064_create_antifraud_cases.php
          php -l bot/tests/MatchReplayReaderTest.php
          php -l bot/tests/Mvp22_4AntiFraudWorkflowTest.php
          php -l bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php
          php -l bot/tests/Mvp22_4AntiFraudContractTest.php
          php -l bot/tests/Mvp22AdminShellReworkContractTest.php
          php -l app/admin.php
          node --check app/assets/js/admin-shell.js
          node --check app/assets/js/admin-antifraud.js

      - name: Replay reader regression
        run: php bot/tests/MatchReplayReaderTest.php

      - name: Anti-fraud lifecycle
        run: php bot/tests/Mvp22_4AntiFraudWorkflowTest.php

      - name: Anti-fraud static contract
        run: php bot/tests/Mvp22_4AntiFraudContractTest.php

      - name: Preserve Admin shell
        run: php bot/tests/Mvp22AdminShellReworkContractTest.php

      - name: No signal auto-sanction
        run: |
          set -euo pipefail
          ! grep -Eiq 'UPDATE[[:space:]]+mgw_users[[:space:]]+SET[[:space:]]+status' bot/antifraud/AntiFraudCaseService.php
          ! grep -Fq 'recommendPermanentBan(' bot/antifraud/AntiFraudCaseService.php
          ! grep -Fq '->restrict(' bot/antifraud/AntiFraudCaseService.php
          grep -Fq "'auto_ban' => false" bot/antifraud/AntiFraudCaseService.php
          grep -Fq "'single_signal_sanction' => false" bot/antifraud/AntiFraudCaseService.php

      - name: Exact staging fingerprint coverage
        run: |
          set -euo pipefail
          manifest='bot/helpers/staging-e2e-runtime-files.txt'
          grep -Fx 'bot/admin-replay.php' "$manifest"
          grep -Fx 'bot/replay/MatchReplayReader.php' "$manifest"
          grep -Fx 'bot/antifraud/AntiFraudCaseService.php' "$manifest"
          grep -Fx 'bot/database/migrations/20260925_0064_create_antifraud_cases.php' "$manifest"
          grep -Fx 'app/assets/js/admin-antifraud.js' "$manifest"

      - name: Scope guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          admin_successor=0
          if [[ "${{ github.head_ref }}" == agent/mvp22-5-* || "${{ github.head_ref }}" == agent/mvp22-6-* || "${{ github.head_ref }}" == agent/mvp22-7-* ]]; then
            admin_successor=1
          elif [[ "${{ github.head_ref }}" == agent/mvp22-admin-ux-* ]] \
            && git diff --name-only "$base" "$head" | grep -Fxq '.github/workflows/mvp22-admin-rework.yml'; then
            admin_successor=1
          fi
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp22-admin-rework.yml|.github/workflows/mvp22-3-moderation.yml|.github/workflows/mvp22-4-antifraud-replay.yml|app/admin.php|app/assets/css/admin-shell.css|app/assets/js/admin-shell.js|app/assets/js/admin-antifraud.js|bot/admin-replay.php|bot/replay/MatchReplayReader.php|bot/antifraud/AntiFraudCaseService.php|bot/database/migrations/20260925_0064_create_antifraud_cases.php|bot/helpers/staging-e2e-runtime-files.txt|bot/tests/MatchReplayReaderTest.php|bot/tests/Mvp22AdminShellReworkContractTest.php|bot/tests/Mvp22_4AntiFraudWorkflowTest.php|bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php|bot/tests/Mvp22_4AntiFraudContractTest.php)
                ;;
              *)
                if [[ "$admin_successor" -eq 0 ]]; then
                  echo "Unexpected MVP-22.4 path: $path" >&2
                  bad=1
                fi
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0
          if [[ "$admin_successor" -eq 1 ]]; then
            git diff --exit-code "$base" "$head" -- bot/games bot/antifraud bot/replay
          else
            git diff --exit-code "$base" "$head" -- bot/games bot/support bot/moderation bot/ratings bot/tournaments bot/economy bot/ledger
          fi

  antifraud-mysql:
    name: Anti-fraud lifecycle on MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_antifraud_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Lint MySQL proof
        run: php -l bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php
      - name: Run MySQL proof
        env:
          MGW_ANTIFRAUD_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_antifraud_ci;charset=utf8mb4
          MGW_ANTIFRAUD_MYSQL_USER: root
          MGW_ANTIFRAUD_MYSQL_PASS: root
        run: php bot/tests/Mvp22_4AntiFraudMySqlIntegrationTest.php

name: MVP-27.1 Backend Account Chain Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/locales/ru.json'
      - 'bot/localization/ServerLocalization.php'
      - 'bot/accounts/AccountDataLifecycleService.php'
      - 'bot/accounts/AccountLinkService.php'
      - 'bot/accounts/AndroidAccountReauthService.php'
      - 'bot/accounts/AccountDataZipWriter.php'
      - 'bot/accounts/AccountReauthGuard.php'
      - 'bot/accounts/AccountIdentityService.php'
      - 'bot/accounts/AndroidDeviceAuthService.php'
      - 'bot/android-reauth.php'
      - 'bot/android-auth.php'
      - 'ops/checks/mvp27_1_backend_account_chain_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_tournament_status_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_account_link_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_account_data_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_friends_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_cosmetic_store_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_notifications_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_backend_invites_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_active_targeted_interactions_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp22-8-account-data.yml'
      - '.github/workflows/mvp26-3-3-account-link-mysql-proof.yml'
      - '.github/workflows/mvp26-6-android-product-parity.yml'
      - '.github/workflows/mvp27-1-backend-account-chain-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_link_full
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/localization/ServerLocalization.php
          php -l bot/accounts/AccountDataLifecycleService.php
          php -l bot/accounts/AccountLinkService.php
          php -l bot/accounts/AndroidAccountReauthService.php
          php -l bot/accounts/AccountDataZipWriter.php
          php -l bot/accounts/AccountReauthGuard.php
          php -l bot/accounts/AccountIdentityService.php
          php -l bot/accounts/AndroidDeviceAuthService.php
          php -l bot/android-reauth.php
          php -l bot/android-auth.php
          php -l app/runtime/localization/LocalizationCatalog.php
          node --check ops/checks/mvp27_1_backend_account_chain_localization_contract.mjs
          node --check ops/checks/mvp27_1_hardcoded_text_audit.mjs
          node -e "JSON.parse(require('fs').readFileSync('app/locales/ru.json','utf8'))"

      - name: Accepted MVP26 service-chain baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline='b3d0b7a703fc379821a4722fba8526174d22ea5d'
          base='${{ github.event.pull_request.base.sha }}'
          git cat-file -e "${baseline}^{commit}"
          git diff --exit-code "${baseline}" "${base}" -- \
            bot/accounts/AccountDataLifecycleService.php \
            bot/accounts/AccountLinkService.php \
            bot/accounts/AndroidAccountReauthService.php \
            bot/accounts/AccountDataZipWriter.php \
            bot/accounts/AccountReauthGuard.php \
            bot/accounts/AccountIdentityService.php \
            bot/accounts/AndroidDeviceAuthService.php \
            bot/android-reauth.php \
            bot/android-auth.php

      - name: Focused localization contract
        run: node ops/checks/mvp27_1_backend_account_chain_localization_contract.mjs

      - name: Preserve Account Data and identity semantics
        run: |
          set -euo pipefail
          php bot/tests/Mvp22_8AccountDataLifecycleTest.php
          php bot/tests/AccountIdentityServiceTest.php
          php bot/tests/MgwProfileIdentityCorrectiveTest.php
          php bot/tests/Mvp15ProviderNeutralIdentityCoreTest.php

      - name: Preserve Android authentication and reauth semantics
        run: |
          set -euo pipefail
          php bot/tests/Mvp26_2AndroidDeviceAuthTest.php
          php bot/tests/Mvp26_2FreshAccountWeeklyBootstrapTest.php
          php bot/tests/Mvp26_4AndroidAccountReauthTest.php
          php bot/tests/Mvp26_4_2AndroidAccountDataDownloadContractTest.php
          php bot/tests/Mvp26_6AndroidParityCorrectiveTest.php

      - name: Preserve Account Link and wallet ownership semantics
        run: |
          set -euo pipefail
          php bot/tests/Mvp26_3AccountLinkServiceTest.php
          php bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php
          php bot/tests/Mvp26_3StoreWalletOwnershipContractTest.php

      - name: Full Account Link MySQL flow
        env:
          MGW_ACCOUNT_LINK_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_link_full;charset=utf8mb4
          MGW_ACCOUNT_LINK_MYSQL_USER: root
          MGW_ACCOUNT_LINK_MYSQL_PASSWORD: root
        run: php bot/tests/Mvp26_3_3AccountLinkMysqlFullFlowTest.php

      - name: Preserve predecessor backend localization proofs
        run: |
          set -euo pipefail
          node ops/checks/mvp27_1_backend_tournament_status_localization_contract.mjs
          node ops/checks/mvp27_1_backend_account_link_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_account_data_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_friends_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_cosmetic_store_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_notifications_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_invites_endpoint_localization_contract.mjs

      - name: Hardcoded player text ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Localization-only bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(app/locales/ru\.json|bot/localization/ServerLocalization\.php|bot/accounts/(AccountDataLifecycleService|AccountLinkService|AndroidAccountReauthService|AccountDataZipWriter|AccountReauthGuard|AccountIdentityService|AndroidDeviceAuthService)\.php|bot/android-(auth|reauth)\.php|ops/checks/mvp27_1_backend_(account_chain|tournament_status|account_link_endpoint|account_data_endpoint|friends_endpoint|cosmetic_store_endpoint|notifications_endpoint|invites_endpoint)_localization_contract\.mjs|ops/checks/mvp27_1_active_targeted_interactions_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/(mvp22-8-account-data|mvp26-3-3-account-link-mysql-proof|mvp26-6-android-product-parity|mvp27-1-backend-account-chain-localization)\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected account-chain localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --exit-code "$base" "$head" -- \
            bot/games bot/economy bot/ledger bot/tournaments bot/moderation bot/support \
            bot/catalog bot/social bot/notifications bot/operations app/assets android-app

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: MVP-27.1 Legacy Invite Link v115 Reachability

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'app/v110.php'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/app-bootstrap-v2-core.js'
      - 'app/assets/js/main-v110-reconnect-v174.js'
      - 'app/assets/js/main-v110.js'
      - 'app/assets/js/main-v110-handoff-shell.js'
      - 'app/assets/js/games/invite-link-entry-v115.js'
      - 'app/assets/js/games/invite-link-entry-v110r12.js'
      - 'ops/checks/mvp27_1_game_router_localization_contract.mjs'
      - 'ops/checks/mvp27_1_legacy_invite_link_v115_reachability_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-game-router-localization.yml'
      - '.github/workflows/mvp27-1-legacy-invite-link-v115-reachability.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-invite-link-v115-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax and exhaustive reachability proof
        run: |
          set -euo pipefail
          node --check app/assets/js/games/invite-link-entry-v115.js
          node --check app/assets/js/games/invite-link-entry-v110r12.js
          node --check ops/checks/mvp27_1_legacy_invite_link_v115_reachability_contract.mjs
          node ops/checks/mvp27_1_game_router_localization_contract.mjs
          node ops/checks/mvp27_1_legacy_invite_link_v115_reachability_contract.mjs

      - name: Preserve active invite-link localization
        run: |
          set -euo pipefail
          node ops/checks/mvp16_2_localization_contract.mjs
          node ops/checks/mvp27_1_localization_architecture_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs
          node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded classification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(ops/checks/mvp27_1_game_router_localization_contract\.mjs|ops/checks/mvp27_1_legacy_invite_link_v115_reachability_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-game-router-localization\.yml|\.github/workflows/mvp27-1-legacy-invite-link-v115-reachability\.yml|\.github/workflows/mvp27-1-localization-audit\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected legacy invite-link v115 reachability paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs


name: MVP-16.1 client owner audit

on:
  push:
    branches:
      - agent/mvp-16-1-bootstrap-router-audit
    paths:
      - '.github/workflows/mvp16-1-client-owner-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp-16-1-bootstrap-router-audit
          fetch-depth: 1

      - name: Map active bootstrap router state timer owners
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT AUDIT HEAD ==='
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo '=== SCREEN SWITCH OWNERS ==='
          git grep -nE "screen\.active|classList\.(add|remove)\(['\"]active['\"]\)|dataset\.screen|data-screen|showScreen|openScreen|navigate|route" -- app/assets/js app/index.html | head -n 400 || true

          echo '=== TIMER OWNERS ==='
          git grep -nE 'setInterval|setTimeout|clearInterval|clearTimeout|requestAnimationFrame|cancelAnimationFrame' -- app/assets/js | head -n 500 || true

          echo '=== GLOBAL LISTENER OWNERS ==='
          git grep -nE "document\.addEventListener|window\.addEventListener|Telegram\.WebApp\.onEvent|\.onEvent\(" -- app/assets/js | head -n 500 || true

          echo '=== ACTIVE ENTRY IMPORTS ==='
          sed -n '1,180p' app/v110.php
          printf '\n--- main-v110.js ---\n'
          cat app/assets/js/main-v110.js
          printf '\n--- production-clean-entry-v110.js ---\n'
          sed -n '1,220p' app/assets/js/production-clean-entry-v110.js
          printf '\n--- handoff shell imports/init ---\n'
          sed -n '1,180p' app/assets/js/main-v110-handoff-shell.js

          echo '=== STATE IMPORTERS ==='
          git grep -n "from './state.js\|from '../state.js\|from \"./state.js\|from \"../state.js" -- app/assets/js || true

          echo '=== MVP16_1_CLIENT_OWNER_AUDIT=PASS ==='

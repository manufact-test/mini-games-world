name: Tic Tac Toe Authoritative Clock Verifier

on:
  pull_request:
    branches:
      - agent/tictactoe-authoritative-clock-v1

permissions:
  contents: read

concurrency:
  group: mgw-ttt-authoritative-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Full quality plus TTT clock contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mgw_ci
          MYSQL_USER: mgw_ci_user
          MYSQL_PASSWORD: ci_database_password_not_secret
          MYSQL_ROOT_PASSWORD: ci_root_password_not_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mgw_ci_mariadb
          MARIADB_USER: mgw_ci_mariadb_user
          MARIADB_PASSWORD: ci_mariadb_password_not_secret
          MARIADB_ROOT_PASSWORD: ci_mariadb_root_password_not_secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MGW_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=mgw_ci;charset=utf8mb4
      MGW_TEST_MYSQL_USER: mgw_ci_user
      MGW_TEST_MYSQL_PASSWORD: ci_database_password_not_secret
      MGW_TEST_MARIADB_DSN: mysql:host=127.0.0.1;port=3307;dbname=mgw_ci_mariadb;charset=utf8mb4
      MGW_TEST_MARIADB_USER: mgw_ci_mariadb_user
      MGW_TEST_MARIADB_PASSWORD: ci_mariadb_password_not_secret

    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full repository checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/run.sh 2>&1 | tee ttt-authoritative-clock-report.txt

      - name: Re-run exact TTT contracts
        shell: bash
        run: |
          php bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
          node --check app/assets/js/screens/game-screen-phase-b-current.js
          node --check app/assets/js/phase-b-current-runtime.js
          node --check e2e/staging/two-context.spec.mjs

      - name: Upload focused report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttt-authoritative-clock-report
          path: ttt-authoritative-clock-report.txt
          if-no-files-found: error
          retention-days: 3

# verifier synchronization event

name: Tic Tac Toe Authoritative Clock Verifier

on:
  push:
    branches:
      - agent/tictactoe-authoritative-clock-v1

permissions:
  contents: read

concurrency:
  group: mgw-ttt-authoritative-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Exact TTT clock and ownership contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate changed PHP syntax
        shell: bash
        run: |
          php -l bot/services/MatchPreparationClockService.php
          php -l bot/tests/PhaseBMatchPreparationClockServiceTest.php
          php -l bot/tests/TicTacToeAuthoritativeClockUiContractTest.php

      - name: Run exact TTT clock and UI ownership contracts
        shell: bash
        run: |
          set -o pipefail
          {
            php bot/tests/PhaseBMatchPreparationClockServiceTest.php
            php bot/tests/TicTacToeAuthoritativeClockUiContractTest.php
            php bot/tests/StagingE2eSourceFingerprintTest.php
            php bot/tests/StagingGlobalSetupRuntimeFingerprintCoverageContractTest.php
          } 2>&1 | tee ttt-authoritative-clock-report.txt

      - name: Validate changed JavaScript and canonical E2E source
        shell: bash
        run: |
          node --check app/assets/js/screens/game-screen-phase-b-current.js
          node --check app/assets/js/phase-b-current-runtime.js
          node --check app/assets/js/production-regression-fix-entry.js
          node --check app/assets/js/phase-b-current-entry.js
          node --check e2e/staging/two-context.spec.mjs

      - name: Upload focused report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttt-authoritative-clock-report
          path: ttt-authoritative-clock-report.txt
          if-no-files-found: error
          retention-days: 3

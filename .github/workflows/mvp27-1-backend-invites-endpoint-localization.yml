name: MVP-27.1 Backend Invites Endpoint Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/invites.php'
      - 'app/locales/ru.json'
      - 'ops/checks/mvp27_1_backend_invites_endpoint_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - 'bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php'
      - '.github/workflows/mvp16-6-notification-center-v2.yml'
      - '.github/workflows/mvp27-1-backend-invites-endpoint-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-invites-endpoint-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/invites.php
          php -l app/runtime/localization/LocalizationCatalog.php
          node --check ops/checks/mvp27_1_backend_invites_endpoint_localization_contract.mjs
          node --check ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Focused server localization proof
        run: node ops/checks/mvp27_1_backend_invites_endpoint_localization_contract.mjs

      - name: Preserve Invite v2 and social/rematch semantics
        run: |
          set -euo pipefail
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          php bot/tests/RematchOptimisticUxContractTest.php
          php bot/tests/Mvp14r2InviteMatchmakingBaselineTest.php
          php bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php

      - name: Preserve prior backend endpoint proofs
        run: |
          set -euo pipefail
          node ops/checks/mvp27_1_backend_notifications_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_cosmetic_store_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_friends_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_account_data_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_account_link_endpoint_localization_contract.mjs
          node ops/checks/mvp27_1_backend_tournament_status_localization_contract.mjs

      - name: Hardcoded player text ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/mvp27-1-backend-invites-endpoint-localization')
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head")"
          allowed='^(bot/invites\.php|app/locales/ru\.json|bot/tests/Mvp18_7FriendsInvitesRegressionContractTest\.php|ops/checks/mvp27_1_backend_invites_endpoint_localization_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp16-6-notification-center-v2\.yml|\.github/workflows/mvp27-1-backend-invites-endpoint-localization\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected backend Invites localization paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: TEMP MVP-18.5 schema12 fixture maintenance

on:
  push:
    branches:
      - agent/mvp18-5-reports-blocked-users

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp18-5-reports-blocked-users
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact current-schema fixture updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('bot/tests/UnifiedEconomyRuntimeSyncTest.php'): [
                  ("$assertSame(11, $runner->migrate(false)['executed_count'], 'Runtime sync test must apply all migrations');",
                   "$assertSame(12, $runner->migrate(false)['executed_count'], 'Runtime sync test must apply all migrations');"),
              ],
              Path('bot/tests/UnifiedEconomyDevUserSyncRegressionTest.php'): [
                  ("$assertSame(11, $runner->migrate(false)['executed_count'], 'Regression fixture must apply current schema');",
                   "$assertSame(12, $runner->migrate(false)['executed_count'], 'Regression fixture must apply current schema');"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected schema literal not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Audit remaining current-schema literals still pinned to 11
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE "executed_count.{0,120}(11|eleven)|(11|eleven).{0,120}executed_count" bot/tests --include='*.php' || true)"
          if [ -n "$matches" ]; then
            echo 'Remaining schema-count=11 candidates:' >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi

      - name: Commit exact fixture-only changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'bot/tests/UnifiedEconomyDevUserSyncRegressionTest.php\nbot/tests/UnifiedEconomyRuntimeSyncTest.php'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected temporary maintenance diff:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/tests/UnifiedEconomyRuntimeSyncTest.php bot/tests/UnifiedEconomyDevUserSyncRegressionTest.php
          git commit -m 'MVP-18.5 advance runtime sync fixtures to schema 12'
          git push origin HEAD:agent/mvp18-5-reports-blocked-users

name: TEMP Checkers real-flight browser proof

on:
  push:
    branches:
      - agent/mvp19-6-checkers-real-flight-css-owner-v1

permissions:
  contents: read

jobs:
  prove-real-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create local static diagnostic shell
        shell: bash
        run: |
          cat > app/__checkers_real_flight_diag.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <link rel="stylesheet" href="/assets/css/main.css">
          <link rel="stylesheet" href="/assets/css/games/checkers/game.css">
          </head><body></body></html>
          HTML
          python3 -m http.server 8080 --directory app >/tmp/mgw-http.log 2>&1 &
          echo $! > /tmp/mgw-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/__checkers_real_flight_diag.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Prove checker visibly flies and same DOM node survives confirmation
        shell: bash
        run: |
          cat > checkers-real-flight-proof.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const center = r => ({x:r.left+r.width/2,y:r.top+r.height/2});
          const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, reducedMotion:'no-preference'});
            await page.goto('http://127.0.0.1:8080/__checkers_real_flight_diag.html', {waitUntil:'domcontentloaded'});
            const proof = await page.evaluate(async()=>{
              const mod = await import('/assets/js/checkers-cosmetics/renderer-single-flight-v1.js?v=2&mvp19_6=single-flight-dom-v1&real_flight=css-cascade-v1&proof=' + Date.now());
              const container = document.createElement('div'); document.body.appendChild(container);
              const board = Array(64).fill(''); board[40]='w'; board[17]='b';
              const p1={id:'p1',name:'A',side:'white',game_cosmetics:{slots:{game_checkers_effect:'game-checkers-effect-move',game_checkers_elements:'game-checkers-pieces-neon'}}};
              const p2={id:'p2',name:'B',side:'black',game_cosmetics:{slots:{}}};
              const base={id:'proof-flight',status:'active',turn:'p1',viewer_side:'white',board,players:[p1,p2],legal_moves:[{from:40,to:33,capture:false}],capture_required:false,forced_piece:null,pending_captures:[],last_captured_cells:[],last_promotion:null,white_pieces:1,black_pieces:1,white_kings:0,black_kings:0,move_timeout_sec:60};
              const me={id:'p1'}; let active=structuredClone(base);
              const onAction=action=>{
                const optimistic=structuredClone(active);
                optimistic.board[action.to]=optimistic.board[action.from]; optimistic.board[action.from]='';
                optimistic.last_move={from:action.from,to:action.to,capture:false,captured:null,player_id:'p1',side:'white',promoted:false,chain_continues:false};
                optimistic.turn='p2'; optimistic.legal_moves=[]; optimistic.__mgw_v100_pending_action=structuredClone(action);
                active=optimistic; mod.renderCheckersSurface({game:optimistic,me,container,onAction});
              };
              mod.renderCheckersSurface({game:base,me,container,onAction});
              await new Promise(r=>setTimeout(r,350));
              container.querySelector('[data-checkers-cell="40"][data-checkers-piece]').click();
              const sourceRect=container.querySelector('[data-checkers-cell="40"] .checkers-piece').getBoundingClientRect();
              const targetCell=container.querySelector('[data-checkers-cell="33"]');
              const destinationRectBefore=targetCell.getBoundingClientRect();
              targetCell.click();
              const piece=container.querySelector('[data-checkers-cell="33"] .checkers-piece');
              const snap=label=>{
                const cs=getComputedStyle(piece); const r=piece.getBoundingClientRect();
                const a=piece.getAnimations()[0] || null;
                return {label,animationName:cs.animationName,transform:cs.transform,rect:{left:r.left,top:r.top,width:r.width,height:r.height},currentTime:a?.currentTime ?? null,playState:a?.playState ?? null,dx:piece.style.getPropertyValue('--mgw-real-move-dx'),dy:piece.style.getPropertyValue('--mgw-real-move-dy'),overlayPiece:Boolean(document.querySelector('.mgw-checkers-live-fx-piece'))};
              };
              const sync=snap('sync');
              await new Promise(requestAnimationFrame); const raf=snap('raf');
              await new Promise(r=>setTimeout(r,220)); const mid=snap('220ms');
              const authoritative=structuredClone(active); delete authoritative.__mgw_v100_pending_action;
              mod.renderCheckersSurface({game:authoritative,me,container,onAction});
              const sameNode=piece===container.querySelector('[data-checkers-cell="33"] .checkers-piece');
              const afterConfirmation=snap('after-confirmation');
              await new Promise(r=>setTimeout(r,700)); const landed=snap('landed');
              return {sourceRect:{left:sourceRect.left,top:sourceRect.top,width:sourceRect.width,height:sourceRect.height},destinationCell:{left:destinationRectBefore.left,top:destinationRectBefore.top,width:destinationRectBefore.width,height:destinationRectBefore.height},sync,raf,mid,sameNode,afterConfirmation,landed};
            });
            console.log(JSON.stringify(proof,null,2));
            assert.match(proof.sync.animationName,/mgw-checkers-live-real-piece-flip/,'FLIP animation must win cascade');
            assert.notEqual(proof.sync.transform,'none','first rendered checker frame must be transformed from destination');
            const src=center(proof.sourceRect), first=center(proof.raf.rect), mid=center(proof.mid.rect), end=center(proof.landed.rect), dest={x:proof.destinationCell.left+proof.destinationCell.width/2,y:proof.destinationCell.top+proof.destinationCell.height/2};
            assert.ok(dist(first,src)<6,`first painted checker must start near source; distance=${dist(first,src)}`);
            assert.ok(dist(mid,dest)<dist(first,dest), 'checker must progress toward destination');
            assert.equal(proof.sameNode,true,'authoritative confirmation must preserve physical moving checker');
            assert.match(proof.afterConfirmation.animationName,/mgw-checkers-live-real-piece-flip/,'confirmation must not kill FLIP animation');
            assert.ok(dist(end,dest)<2,`checker must settle at destination; distance=${dist(end,dest)}`);
            assert.equal(proof.raf.overlayPiece,false,'detached duplicate checker must be removed before painted flight');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node checkers-real-flight-proof.cjs

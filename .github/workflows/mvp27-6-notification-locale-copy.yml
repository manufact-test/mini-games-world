name: MVP-27.6 Notification Locale Copy

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_6_notification_server_copy_contract.mjs'
      - '.github/workflows/mvp27-6-notification-locale-copy.yml'
  push:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/screens/notifications-screen-v110r13.js'
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_6_notification_server_copy_contract.mjs'
      - '.github/workflows/mvp27-6-notification-locale-copy.yml'

permissions:
  contents: read

jobs:
  system-notification-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Notification locale presentation and accepted semantics
        run: |
          set -euo pipefail
          node --check app/assets/js/screens/notifications-screen-v110r13.js
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_6_notification_server_copy_contract.mjs
          php bot/tests/Mvp27_3ManualLocaleCorrectiveTest.php
          node scripts/ci/check-secrets.mjs
          git diff --check

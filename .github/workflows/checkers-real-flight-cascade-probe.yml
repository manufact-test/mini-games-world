name: Checkers real-flight cascade probe

on:
  push:
    branches:
      - agent/mvp19-6-checkers-real-flight-cascade-fix-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify real checker wins cascade
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ reducedMotion:'no-preference' });
            await page.setContent(`
              <div class="checkers-surface mgw-checkers-live-fx-running">
                <div class="checkers-cell move-impact">
                  <span id="real" class="checkers-piece mgw-checkers-live-real-move-piece"
                    style="--mgw-real-move-dx:-44px;--mgw-real-move-dy:44px;--mgw-real-move-delay:0ms"></span>
                </div>
                <div class="checkers-cell move-impact">
                  <span id="base" class="checkers-piece"></span>
                </div>
              </div>
            `);
            await page.addStyleTag({ path:path.resolve('app/assets/css/games/checkers/runtime-handoff-mobile-v1.css') });
            await page.addStyleTag({ path:path.resolve('app/assets/css/games/checkers/live-effects-store-parity-v1.css') });
            const result = await page.evaluate(() => {
              const real = document.querySelector('#real');
              const base = document.querySelector('#base');
              return {
                reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,
                realName:getComputedStyle(real).animationName,
                realTransform:getComputedStyle(real).transform,
                realAnimations:real.getAnimations().map(a => ({ name:a.animationName, playState:a.playState })),
                baseName:getComputedStyle(base).animationName,
                baseAnimations:base.getAnimations().map(a => ({ name:a.animationName, playState:a.playState })),
              };
            });
            console.log('MGW_CHECKERS_CASCADE=' + JSON.stringify(result));
            if (result.reduced) throw new Error('probe unexpectedly uses reduced motion');
            if (result.realName !== 'mgw-checkers-live-real-piece-flip') {
              throw new Error(`real checker FLIP lost cascade: ${result.realName}`);
            }
            if (!result.realAnimations.some(a => a.name === 'mgw-checkers-live-real-piece-flip')) {
              throw new Error('real checker has no running FLIP Animation object');
            }
            if (result.baseName !== 'none') {
              throw new Error(`base move-impact suppression regressed: ${result.baseName}`);
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

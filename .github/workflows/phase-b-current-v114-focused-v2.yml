name: Phase B current v114 focused v2

on:
  pull_request:
    branches:
      - agent/phase-b-current-v114-launch-runtime

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 1cd4b1edd22e5861add0108f2b539e06ba1cbf04
  STATUS_CONTEXT: phase-b-current-v114-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Current v114 Phase B verification v2 is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -Eeuo pipefail
          node --check app/assets/js/phase-b-current-entry.js
          node --check app/assets/js/phase-b-current-runtime.js
          node --check app/assets/js/screens/game-screen-phase-b-current.js
          node --check e2e/staging/frontend-immutable-core.spec.mjs
          node --check e2e/staging/two-context.spec.mjs
      - name: PHP syntax and current-entry contracts
        run: |
          set -Eeuo pipefail
          php -l app/v114.php
          php -l bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php
          php bot/tests/PhaseBCurrentTelegramEntrypointContractTest.php
          php bot/tests/PhaseBStagingRuntimeFingerprintCoverageContractTest.php
      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Current v114 Phase B verification v2 passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Current v114 Phase B verification v2 failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

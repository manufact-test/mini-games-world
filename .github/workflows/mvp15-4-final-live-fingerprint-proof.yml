name: MVP-15.4 final exact live fingerprint proof

on:
  push:
    branches:
      - agent/mvp-15-4-fingerprint-manifest
    paths:
      - '.github/workflows/mvp15-4-final-live-fingerprint-proof.yml'

permissions:
  contents: read

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  prove-final-live-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare exact live readiness fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected}" = '64'
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 25 \
            --header 'Accept: application/json' \
            "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
            --output live-staging-readiness.json
          python3 - "${expected}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path('live-staging-readiness.json').read_text(encoding='utf-8'))
          expected = sys.argv[1]
          actual = payload.get('source_fingerprint_sha256')
          assert payload.get('ok') is True, payload
          assert payload.get('build') == 'mgw-staging-playwright-r15.3-v1', payload
          assert payload.get('environment') == 'staging', payload
          assert payload.get('base_host') == 'seashell-okapi-889488.hostingersite.com', payload
          assert actual == expected, {'expected': expected, 'actual': actual}
          assert int(payload.get('runtime_file_count') or 0) == 181, payload
          assert payload.get('isolation', {}).get('live_payments_disabled') is True, payload
          assert payload.get('isolation', {}).get('production_changed') is False, payload
          assert payload.get('capabilities', {}).get('exact_runtime_fingerprint') is True, payload
          print(f'EXPECTED_RUNTIME_FINGERPRINT={expected}')
          print(f'LIVE_RUNTIME_FINGERPRINT={actual}')
          print('MVP15_4_FINAL_EXACT_LIVE_FINGERPRINT_PROOF=PASS')
          PY

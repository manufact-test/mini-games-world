name: MVP-19.9 Domino Store/Profile premium v11

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/screens/store-screen.js'
      - 'app/assets/css/games/domino/store-effects-scene-v9.css'
      - 'app/assets/css/screens/profile-domino-store-parity-v1.css'
      - 'app/assets/js/screens/store-screen-domino-store-v1.js'
      - 'app/assets/js/screens/store-screen-domino-effects-v9.js'
      - 'app/assets/js/screens/store-screen-checkers-board-source-wrapper.js'
      - 'app/assets/js/screens/store-screen-reversi-store-v1.js'
      - 'app/assets/js/profile/mgw-profile-domino-parity.js'
      - 'app/assets/js/profile/mgw-profile-domino-hard-ratio-v1.js'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/Mvp19_9DominoStoreProfileTest.php'
      - 'bot/tests/Mvp19_9DominoPreviewReadabilityContractTest.mjs'
      - '.github/workflows/mvp19-9-domino-store-effects-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-9-domino-premium-v11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domino-store-profile-v11:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and current Domino contracts
        run: |
          set -euo pipefail
          php -l app/runtime/client/version-manifest.php
          php -l bot/helpers/WebAppLaunchUrl.php
          php -l bot/tests/Mvp19_9DominoStoreProfileTest.php
          node --check app/assets/js/screens/store-screen.js
          node --check app/assets/js/screens/store-screen-domino-store-v1.js
          node --check app/assets/js/screens/store-screen-domino-effects-v9.js
          node --check app/assets/js/screens/store-screen-checkers-board-source-wrapper.js
          node --check app/assets/js/screens/store-screen-reversi-store-v1.js
          node --check app/assets/js/profile/mgw-profile-domino-parity.js
          node --check app/assets/js/profile/mgw-profile-domino-hard-ratio-v1.js
          node --check bot/tests/Mvp19_9DominoPreviewReadabilityContractTest.mjs
          php bot/tests/Mvp19_9DominoStoreProfileTest.php
          node bot/tests/Mvp19_9DominoPreviewReadabilityContractTest.mjs

      - name: Guard native Store render, stable selector and premium v11 choreography
        shell: bash
        run: |
          set -euo pipefail
          base_store='app/assets/js/screens/store-screen.js'
          store='app/assets/js/screens/store-screen-domino-store-v1.js'
          wrapper='app/assets/js/screens/store-screen-checkers-board-source-wrapper.js'
          selector_owner='app/assets/js/screens/store-screen-reversi-store-v1.js'
          effects='app/assets/css/games/domino/store-effects-scene-v9.css'
          effect_loader='app/assets/js/screens/store-screen-domino-effects-v9.js'
          profile='app/assets/js/profile/mgw-profile-domino-parity.js'
          profile_css='app/assets/css/screens/profile-domino-store-parity-v1.css'
          hard_ratio='app/assets/js/profile/mgw-profile-domino-hard-ratio-v1.js'
          manifest='app/runtime/client/version-manifest.php'

          grep -F "dominoPreviewMarkup, dominoHeaderMarksMarkup" "$base_store"
          grep -F "if (gameType === 'domino')" "$base_store"
          grep -F 'dominoPreviewMarkup(safeLayer, safeVariant)' "$base_store"
          grep -F "gameType === 'domino' ? 'Домино'" "$base_store"

          grep -F 'native:v6' "$store"
          ! grep -Fq 'queuePostRenderUpgrade' "$store"
          ! grep -Fq 'installApiHooks' "$store"
          ! grep -Fq 'MutationObserver' "$store"
          ! grep -Fq 'requestAnimationFrame' "$store"
          ! grep -Fq 'setTimeout' "$store"

          grep -F "store-screen-reversi-store-v1.js?v=2&mvp19_7=store-only&selector=instant-active-v1" "$wrapper"
          grep -F "store-screen-domino-store-v1.js?v=6&mvp19_9=domino-native-render-v6" "$wrapper"
          grep -F "store-screen-domino-effects-v9.js?v=3&mvp19_9=domino-premium-effects-v11" "$wrapper"
          ! grep -Fq 'installDominoStoreRerenderStabilityV1' "$wrapper"
          grep -F 'selector.scrollLeft = left;' "$selector_owner"
          ! grep -Fq "behavior:'smooth'" "$selector_owner"

          grep -F '.mgw-domino-fx-piece' "$effects"
          grep -F 'aspect-ratio:47 / 24!important' "$effects"
          grep -F 'mgw-domino-v11-magnetic-glide' "$effects"
          grep -F 'mgw-domino-v11-spectral-draw' "$effects"
          grep -F 'mgw-domino-v11-lux-sheen' "$effects"
          grep -F 'mix-blend-mode:screen!important' "$effects"
          grep -F '@media(prefers-reduced-motion:reduce)' "$effects"
          ! grep -Fq 'mgw-domino-v10-precision-glide' "$effects"
          ! grep -Fq 'mgw-domino-v10-stock-flight' "$effects"
          ! grep -Fq 'mgw-domino-v10-finale-wave' "$effects"
          ! grep -Fq 'transform-style:preserve-3d' "$effects"
          grep -F 'store-effects-scene-v9.css?v=3&mvp19_9=domino-premium-effects-v11' "$effect_loader"

          grep -F "dominoPreviewMarkup } from '../screens/store-screen-domino-store-v1.js?v=6&mvp19_9=domino-native-render-v6'" "$profile"
          grep -F 'store-effects-scene-v9.css?v=3&mvp19_9=domino-premium-effects-v11' "$profile"
          grep -F 'profile-domino-store-parity-v1.css?v=3&mvp19_9=domino-profile-single-back-v3' "$profile"
          grep -F 'mgw-domino-profile-tab-mark::before' "$profile_css"
          ! grep -Fq 'radial-gradient(circle at 24% 31%' "$profile_css"
          ! grep -Fq 'getBoundingClientRect' "$hard_ratio"
          ! grep -Fq 'setImportant(' "$hard_ratio"
          ! grep -Fq 'setTimeout' "$hard_ratio"

          grep -F 'domino_preview=native-v10' "$manifest"
          grep -F 'domino_effects=premium-v11' "$manifest"
          grep -F 'selector_center=instant-v1' "$manifest"
          grep -F 'domino_base=native-render-v1' "$manifest"
          grep -F 'domino_preview=shared-store-v10' "$manifest"
          grep -F 'domino_icon=single-back-v1' "$manifest"
          grep -F 'ux=ready-only-history-sheet' "$manifest"
          php -r '$s=file_get_contents("bot/helpers/WebAppLaunchUrl.php"); if(!preg_match("~/app/v110\\.php\\?v=(\\d+)~", $s, $m) || (int)$m[1] < 1166) exit(1);'

      - name: Guard accepted static Store geometry and frozen gameplay
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'height:100%!important' app/assets/css/games/domino/store-card-fill-live-pips-v5.css
          grep -F 'aspect-ratio:8 / 5!important' app/assets/css/games/domino/store-card-fill-live-pips-v5.css
          grep -F 'width:3px' app/assets/css/games/domino/store-card-fill-live-pips-v5.css
          grep -F 'border-radius:50%' app/assets/css/games/domino/store-card-fill-live-pips-v5.css
          grep -F 'theme-walnut .mgw-domino-preview-table' app/assets/css/games/domino/store-cosmetics-v1.css

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
            git diff --exit-code "$base" "$head" -- \
              app/assets/css/games/domino/store-cosmetics-v1.css \
              app/assets/css/games/domino/store-card-fill-live-pips-v5.css
            git diff --exit-code "$base" "$head" -- \
              app/assets/js/games/domino/entry.js \
              app/assets/js/games/domino/meta.js \
              app/assets/js/games/domino/renderer.js \
              app/assets/js/games/domino/rules.js \
              app/assets/js/games/domino/chain-layout.js \
              app/assets/css/games/domino/game.css \
              app/assets/css/games/domino/rules.css \
              app/assets/js/games/go \
              app/assets/js/games/reversi \
              app/assets/js/games/chess \
              app/assets/js/games/checkers \
              app/assets/js/checkers-cosmetics \
              bot/catalog/ProductInventoryService.php \
              bot/database/migrations
          fi
          git diff --check
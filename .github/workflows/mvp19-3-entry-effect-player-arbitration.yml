name: MVP-19.3 Entry Effects player arbitration

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/profile/mgw-profile-entry-effects.js'
      - 'app/assets/js/profile/mgw-entry-effect-player-arbitration.js'
      - 'app/runtime/client/version-manifest.php'
      - 'tests/mvp19-3-entry-effect-player-arbitration.mjs'
      - '.github/workflows/mvp19-3-entry-effect-player-arbitration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-player-arbitration:
    name: Preserve accepted player arbitration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run four-combination arbitration acceptance
        run: node tests/mvp19-3-entry-effect-player-arbitration.mjs
      - name: Guard accepted runtime identity
        run: |
          grep -F 'mgw-profile-entry-effects.js?v=6&mvp19_3=player-arbitration' app/runtime/client/version-manifest.php
          git diff --check
      - name: Guard frozen Entry arbitration owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/profile/mgw-profile-entry-effects.js \
            app/assets/js/profile/mgw-entry-effect-player-arbitration.js \
            tests/mvp19-3-entry-effect-player-arbitration.mjs

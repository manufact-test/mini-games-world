name: MVP-27.1 Invite Canonical Game Polling

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/runtime/client/version-manifest.php'
      - 'ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs'
      - 'ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs'
      - 'ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_audit.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-invite-canonical-game-polling.yml'
      - '.github/workflows/mvp27-1-localization-audit.yml'
      - '.github/workflows/mvp27-1-active-client-entry-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invite-canonical-game-polling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Syntax and focused ownership proofs
        run: |
          set -euo pipefail
          node --check app/assets/js/games/game-invites-v110.js
          node --check app/assets/js/screens/game-screen-v102-safe.js
          node --check app/assets/js/screens/game-screen-v102.js
          node --check ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs
          node --check ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs
          php -l app/runtime/client/version-manifest.php
          node ops/checks/mvp27_1_invite_canonical_game_polling_contract.mjs
          node ops/checks/mvp27_1_game_invites_localization_contract.mjs
          node ops/checks/mvp27_1_game_screen_localization_contract.mjs
          node ops/checks/mvp27_1_invite_owner_debt_classification_contract.mjs
          node ops/checks/mvp27_1_active_shell_copy_bundle_contract.mjs

      - name: Preserve invite and game lifecycle contracts
        run: |
          set -euo pipefail
          php bot/tests/Mvp18_3InviteV2ContractTest.php
          php bot/tests/Mvp18_7FriendsInvitesRegressionContractTest.php
          node bot/tests/Mvp18FriendsUiContractTest.mjs
          php bot/tests/Mvp26_3_12InviteSyncBalanceOwnershipContractTest.php
          php bot/tests/ProductionV110InviteStartSyncOwnershipContractTest.php
          php bot/tests/Mvp21_5_6CorrectiveV4ContractTest.php

      - name: Localization debt ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded successor scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          allowed='^(app/runtime/client/version-manifest\.php|ops/checks/mvp27_1_invite_canonical_game_polling_contract\.mjs|ops/checks/mvp27_1_invite_owner_debt_classification_contract\.mjs|ops/checks/mvp27_1_active_shell_copy_bundle_contract\.mjs|ops/checks/mvp27_1_hardcoded_text_audit\.mjs|ops/checks/mvp27_1_hardcoded_text_baseline\.json|\.github/workflows/mvp27-1-invite-canonical-game-polling\.yml|\.github/workflows/mvp27-1-localization-audit\.yml|\.github/workflows/mvp27-1-active-client-entry-localization\.yml)$'
          bad="$(git diff --name-only "$base" "$head" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { printf 'Unexpected canonical invite polling paths:\n%s\n' "$bad" >&2; exit 1; }

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

name: Apply D2 terminal notification context request acceptance

on:
  push:
    branches:
      - agent/mvp14-d2-terminal-notification-context-request

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-notification-context-request
          fetch-depth: 1

      - name: Patch acceptance helper and contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          e2e_path = Path('e2e/staging/d2-d3-d5-integration.spec.mjs')
          e2e = e2e_path.read_text(encoding='utf-8')
          old_helper = """async function notificationByInviteToken(page, inviteToken) {
            return page.evaluate(async ({ inviteToken: expectedToken }) => {
              const sessionId = localStorage.getItem('mgw_device_session_id');
              const deviceId = localStorage.getItem('mgw_device_id');
              const response = await fetch('/bot/notifications.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({
                  markRead: true,
                  initData: '',
                  sessionId,
                  deviceId,
                }),
              });
              const payload = await response.json().catch(() => null);
              const items = Array.isArray(payload?.items) ? payload.items : [];
              const item = items.find(candidate =>
                String(candidate?.invite_token || '') === String(expectedToken || '')
              ) || null;
              return {
                status: response.status,
                ok: payload?.ok === true,
                publicError: typeof payload?.error === 'string' ? payload.error.slice(0, 300) : null,
                item,
                availableTokens: items.slice(0, 8).map(candidate => String(candidate?.invite_token || '')),
              };
            }, { inviteToken });
          }
          """
          new_helper = """async function notificationByInviteToken(player, inviteToken) {
            const identity = await player.page.evaluate(() => ({
              sessionId: localStorage.getItem('mgw_device_session_id'),
              deviceId: localStorage.getItem('mgw_device_id'),
            }));
            const response = await player.context.request.post(NOTIFICATIONS_ROUTE, {
              headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              data: {
                markRead: true,
                initData: '',
                sessionId: identity.sessionId,
                deviceId: identity.deviceId,
              },
              timeout: 35_000,
            });
            const payload = await response.json().catch(() => null);
            const items = Array.isArray(payload?.items) ? payload.items : [];
            const item = items.find(candidate =>
              String(candidate?.invite_token || '') === String(inviteToken || '')
            ) || null;
            return {
              status: response.status(),
              ok: payload?.ok === true,
              publicError: typeof payload?.error === 'string' ? payload.error.slice(0, 300) : null,
              item,
              availableTokens: items.slice(0, 8).map(candidate => String(candidate?.invite_token || '')),
            };
          }
          """
          if old_helper not in e2e:
              raise SystemExit('Old notification helper was not found exactly')
          e2e = e2e.replace(old_helper, new_helper, 1)
          old_call = 'const bNotification = await notificationByInviteToken(playerB.page, directToken);'
          new_call = 'const bNotification = await notificationByInviteToken(playerB, directToken);'
          if old_call not in e2e:
              raise SystemExit('Old notification helper call was not found')
          e2e = e2e.replace(old_call, new_call, 1)
          e2e_path.write_text(e2e, encoding='utf-8')

          scalar_path = Path('bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php')
          scalar_path.write_text("""<?php
declare(strict_types=1);

$root = dirname(__DIR__, 2);
$e2e = file_get_contents($root . '/e2e/staging/d2-d3-d5-integration.spec.mjs');
if (!is_string($e2e)) throw new RuntimeException('Cannot read D2 integration E2E.');
$assertions = 0;
$assert = static function (bool $condition, string $message) use (&$assertions): void {
    $assertions++;
    if (!$condition) throw new RuntimeException($message);
};

$assert(str_contains($e2e, 'async function notificationByInviteToken(player, inviteToken)')
    && str_contains($e2e, 'player.page.evaluate(() => ({')
    && str_contains($e2e, 'player.context.request.post(NOTIFICATIONS_ROUTE')
    && str_contains($e2e, 'items.find(candidate =>')
    && str_contains($e2e, "String(candidate?.invite_token || '') === String(inviteToken || '')"),
    'The authenticated BrowserContext request must reduce the authoritative response to one exact-token item.');
$assert(str_contains($e2e, 'const bNotification = await notificationByInviteToken(playerB, directToken);')
    && str_contains($e2e, 'bNotification.item')
    && str_contains($e2e, 'bNotification.availableTokens.join'),
    'The Node test must assert only the scalar matched item and expose bounded diagnostics.');
$assert(!str_contains($e2e, 'async function notificationByInviteToken(page, inviteToken)')
    && !str_contains($e2e, "fetch('/bot/notifications.php'"),
    'The terminal acceptance must not pass the notification payload through the application page fetch boundary.');
$assert(!str_contains($e2e, 'const bNotifications = await expectPlayerRequest(')
    && !str_contains($e2e, 'Array.isArray(bNotifications.items)'),
    'The large notification history must not cross the Playwright structured-clone boundary.');
$assert(str_contains($e2e, "toMatch(/cancelled|canceled/)")
    && str_contains($e2e, 'bNotification.item?.actions'),
    'The second player terminal status and non-actionable state must remain mandatory.');

fwrite(STDOUT, "ProductionMvp14D2TerminalNotificationScalarAcceptanceTest: {$assertions} assertions passed\\n");
""", encoding='utf-8')

          integration_path = Path('bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php')
          integration = integration_path.read_text(encoding='utf-8')
          old_fragment = """    && str_contains($e2e, 'async function notificationByInviteToken(page, inviteToken)')
              && str_contains($e2e, 'items.find(candidate =>')
              && str_contains($e2e, 'const bNotification = await notificationByInviteToken(playerB.page, directToken);')
              && str_contains($e2e, 'otherParticipantTerminalStatusPresent: true'),
              'The live E2E must use the authoritative label and return one exact-token terminal notification from the browser context.');
          """
          new_fragment = """    && str_contains($e2e, 'async function notificationByInviteToken(player, inviteToken)')
              && str_contains($e2e, 'player.context.request.post(NOTIFICATIONS_ROUTE')
              && str_contains($e2e, 'items.find(candidate =>')
              && str_contains($e2e, 'const bNotification = await notificationByInviteToken(playerB, directToken);')
              && str_contains($e2e, 'otherParticipantTerminalStatusPresent: true'),
              'The live E2E must use the authoritative label and return one exact-token terminal notification through the authenticated BrowserContext request.');
          """
          if old_fragment not in integration:
              raise SystemExit('Old integration contract fragment was not found exactly')
          integration = integration.replace(old_fragment, new_fragment, 1)
          old_history = """$assert(!str_contains($e2e, 'const bNotifications = await expectPlayerRequest(')
              && !str_contains($e2e, 'Array.isArray(bNotifications.items)')
              && str_contains($e2e, 'bNotification.availableTokens.join'),
              'The full notification history must not cross the Playwright structured-clone boundary.');
          """
          new_history = """$assert(!str_contains($e2e, 'const bNotifications = await expectPlayerRequest(')
              && !str_contains($e2e, 'Array.isArray(bNotifications.items)')
              && !str_contains($e2e, "fetch('/bot/notifications.php'")
              && str_contains($e2e, 'bNotification.availableTokens.join'),
              'The notification history must bypass the application page fetch and structured-clone boundaries.');
          """
          if old_history not in integration:
              raise SystemExit('Old history contract fragment was not found exactly')
          integration = integration.replace(old_history, new_history, 1)
          integration_path.write_text(integration, encoding='utf-8')
          PY

      - name: Run focused checks
        shell: bash
        run: |
          node --check e2e/staging/d2-d3-d5-integration.spec.mjs
          php -l bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php
          php -l bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php
          php bot/tests/ProductionMvp14D2TerminalNotificationScalarAcceptanceTest.php
          php bot/tests/ProductionMvp14D2D3D5IntegrationContractTest.php

      - name: Commit test-only correction
        shell: bash
        run: |
          rm .github/workflows/mvp14-d2-context-request-apply.yml
          git config user.name "manufact-test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: read terminal notification through browser context request"
          git push origin HEAD:agent/mvp14-d2-terminal-notification-context-request

name: MVP-19.3 Profile Reactions

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'bot/cosmetic-store.php'
      - 'bot/helpers/response.php'
      - 'app/assets/js/production-v110-readonly-game-sync.js'
      - 'app/runtime/client/version-manifest.php'
      - 'app/assets/js/profile/**'
      - 'bot/tests/Mvp19_3ProfileReactionsTest.php'
      - '.github/workflows/mvp19-3-profile-reactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactions:
    name: Preserve accepted Profile reactions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Run reaction contract
        run: php bot/tests/Mvp19_3ProfileReactionsTest.php
      - name: Guard accepted reaction owners
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'; head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- app/assets/js/profile/mgw-profile-reactions.js app/assets/js/profile/mgw-profile-reactions-header.js bot/tests/Mvp19_3ProfileReactionsTest.php
          git diff --check

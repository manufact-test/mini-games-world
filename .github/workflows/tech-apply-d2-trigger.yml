name: Tech apply D2 trigger

on:
  pull_request:
    branches:
      - agent/mvp14-d2-tech-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mvp14-d2-tech-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-dedup-self-cancel-home
          fetch-depth: 1
          persist-credentials: true

      - name: Execute embedded exact patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast

          workflow = Path('.github/workflows/tech-apply-d2-terminal-dedup.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          wanted = {'new_terminal_block', 'new_bridge_mutation', 'new_json_mutation'}
          values = {}
          for node in ast.parse(script).body:
            if not isinstance(node, ast.Assign):
              continue
            for target in node.targets:
              if isinstance(target, ast.Name) and target.id in wanted:
                values[target.id] = ast.literal_eval(node.value)
          missing = wanted.difference(values)
          if missing:
            raise SystemExit(f'Cannot resolve embedded patch literals: {sorted(missing)}')

          client_path = Path('app/assets/js/games/game-invites-v110.js')
          client = client_path.read_text(encoding='utf-8')
          terminal_start = client.index("    if (action === 'decline' || action === 'cancel') {")
          terminal_end = client.index("    if (action === 'start') {", terminal_start)
          client_path.write_text(client[:terminal_start] + values['new_terminal_block'] + client[terminal_end:], encoding='utf-8')

          endpoint_path = Path('bot/notifications.php')
          endpoint = endpoint_path.read_text(encoding='utf-8')
          bridge_start = endpoint.index("        if ($markRead) {")
          bridge_end = endpoint.index("        $runtimeNotifications = new RuntimeNotificationBridgeCoordinator", bridge_start)
          endpoint = endpoint[:bridge_start] + values['new_bridge_mutation'] + endpoint[bridge_end:]
          json_start = endpoint.index("    } elseif ($markRead) {")
          json_end = endpoint.index("    } else {", json_start)
          endpoint = endpoint[:json_start] + values['new_json_mutation'] + endpoint[json_end:]
          endpoint_path.write_text(endpoint, encoding='utf-8')

          for exact_call in [
            "replace_once(client_path, old_terminal_block, new_terminal_block)\n",
            "replace_once(endpoint_path, old_bridge_mutation, new_bridge_mutation)\n",
            "replace_once(endpoint_path, old_json_mutation, new_json_mutation)\n",
          ]:
            if script.count(exact_call) != 1:
              raise SystemExit(f'Embedded replacement call is not unique: {exact_call!r}')
            script = script.replace(exact_call, '', 1)

          exec(compile(script, '<embedded-d2-patch>', 'exec'), {'__name__':'__main__'})
          PY

      - name: Commit clean focused branch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/tech-apply-d2-terminal-dedup.yml
          rm -f .github/workflows/tech-apply-d2-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "MVP-14 D2: remove duplicate terminal hints and return self-cancel home"
          git push origin HEAD:agent/mvp14-d2-terminal-dedup-self-cancel-home

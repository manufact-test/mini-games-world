name: Tech synchronize D2 live expectations

on:
  pull_request:
    branches:
      - agent/mvp14-d2-tech-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mvp14-d2-tech-live-expectations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch tool
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-tech-base
          path: tech
          fetch-depth: 1

      - name: Checkout exact test-only branch
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-live-expectations
          path: target
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize live expectations
        working-directory: target
        run: python3 ../tech/.github/scripts/apply_d2_live_expectation_sync.py

      - name: Commit test-only synchronization
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "MVP-14 D2 E2E: synchronize direct-home expectations"
          git push origin HEAD:agent/mvp14-d2-terminal-live-expectations

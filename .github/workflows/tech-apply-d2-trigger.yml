name: Tech harden D2 terminal dedup

on:
  pull_request:
    branches:
      - agent/mvp14-d2-tech-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mvp14-d2-tech-followup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch tool
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-tech-base
          path: tech
          fetch-depth: 1

      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/mvp14-d2-terminal-dedup-self-cancel-home
          path: target
          fetch-depth: 1
          persist-credentials: true

      - name: Apply focused race hardening
        working-directory: target
        run: python3 ../tech/.github/scripts/apply_d2_terminal_dedup_followup.py

      - name: Commit focused follow-up
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "MVP-14 D2: harden targeted terminal notification consume"
          git push origin HEAD:agent/mvp14-d2-terminal-dedup-self-cancel-home

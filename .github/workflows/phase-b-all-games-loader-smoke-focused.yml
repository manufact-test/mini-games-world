name: Phase B all-games loader smoke focused

on:
  pull_request:
    branches:
      - agent/phase-b-all-games-loader-smoke

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
  TARGET_SHA: dc9b0bfc097349276ad4b2f388499312b8f0bf64
  STATUS_CONTEXT: phase-b-all-games-loader-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Eight-game shared loader smoke is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Verify exact deployed runtime
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
            --output staging-e2e-readiness-all-games.json
          python3 - staging-e2e-readiness-all-games.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = sys.argv[2]
          assert payload.get('ok') is True
          assert payload.get('environment') == 'staging'
          assert payload.get('base_host') == 'seashell-okapi-889488.hostingersite.com'
          assert payload.get('source_fingerprint_sha256') == expected
          assert payload.get('capabilities', {}).get('exact_runtime_fingerprint') is True
          assert payload.get('isolation', {}).get('live_payments_disabled') is True
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install --with-deps chromium

      - name: Run eight-game shared loader smoke
        run: |
          set -Eeuo pipefail
          npx --no-install playwright test \
            --config=e2e/playwright.config.mjs \
            e2e/staging/phase-b-all-games-loader.spec.mjs

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"All eight games use the shared deterministic loader\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Eight-game shared loader smoke failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

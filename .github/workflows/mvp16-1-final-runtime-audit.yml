name: MVP-16.1 final runtime ownership audit

on:
  push:
    branches:
      - agent/mvp-16-1-final-runtime-audit
    paths:
      - '.github/workflows/mvp16-1-final-runtime-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact active Telegram start graph
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '$m=require "app/runtime/client/version-manifest.php"; echo json_encode($m, JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);' > /tmp/mgw-manifest.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { URL } = require('url');

          const manifest = JSON.parse(fs.readFileSync('/tmp/mgw-manifest.json','utf8'));
          const documentBase = new URL('https://mgw.invalid/app/v110.php');
          const normalizedMap = new Map();
          for (const [key, target] of Object.entries(manifest.imports || {})) {
            if (key.startsWith('.') || key.startsWith('/')) {
              normalizedMap.set(new URL(key, documentBase).href, new URL(target, documentBase));
            } else {
              normalizedMap.set(key, new URL(target, documentBase));
            }
          }

          function resolveSpecifier(specifier, importerUrl) {
            if (!specifier.startsWith('.') && !specifier.startsWith('/')) {
              const mapped = normalizedMap.get(specifier);
              if (!mapped) throw new Error(`Unmapped bare specifier ${specifier} from ${importerUrl.href}`);
              return mapped;
            }
            const resolved = new URL(specifier, importerUrl);
            return normalizedMap.get(resolved.href) || resolved;
          }

          function toRepoPath(url) {
            const pathname = decodeURIComponent(url.pathname);
            if (!pathname.startsWith('/app/')) return null;
            return pathname.slice(1);
          }

          const staticImport = /\b(?:import|export)\s+(?:[^'";]*?\sfrom\s*)?['"]([^'"]+)['"]/g;
          const dynamicImport = /\bimport\s*\(\s*['"]([^'"]+)['"]\s*\)/g;
          const queue = [];
          const seen = new Map();
          const bootstrap = new URL(manifest.assets.bootstrap, documentBase);
          queue.push(bootstrap);

          while (queue.length) {
            const url = queue.shift();
            const repoPath = toRepoPath(url);
            if (!repoPath || !repoPath.endsWith('.js')) continue;
            if (seen.has(repoPath)) continue;
            if (!fs.existsSync(repoPath)) throw new Error(`Missing active module ${repoPath}`);
            const text = fs.readFileSync(repoPath,'utf8');
            seen.set(repoPath, url.href);
            for (const rx of [staticImport, dynamicImport]) {
              rx.lastIndex = 0;
              let match;
              while ((match = rx.exec(text))) {
                const child = resolveSpecifier(match[1], url);
                const childPath = toRepoPath(child);
                if (childPath && childPath.endsWith('.js') && !seen.has(childPath)) queue.push(child);
              }
            }
          }

          const patterns = {
            interval: /\b(?:window\.)?setInterval\s*\(/,
            timeout: /\b(?:window\.)?setTimeout\s*\(/,
            add_listener: /\.addEventListener\s*\(/,
            remove_listener: /\.removeEventListener\s*\(/,
            state_timer: /\bstate\.timers\.[A-Za-z0-9_]+/,
            route_cleanup: /\bregisterScreenCleanup\s*\(/,
            route_enter: /\bonScreenEnter\s*\(/,
            route_leave: /\bonScreenLeave\s*\(/,
            state_owner: /\bexport\s+const\s+state\s*=/,
          };

          console.log(`ACTIVE_JS_FILES=${seen.size}`);
          console.log('ACTIVE_FILES');
          [...seen.keys()].sort().forEach(f => console.log(f));
          const totals = Object.fromEntries(Object.keys(patterns).map(k => [k,0]));
          const filesByKind = Object.fromEntries(Object.keys(patterns).map(k => [k,new Set()]));

          for (const repoPath of [...seen.keys()].sort()) {
            const lines = fs.readFileSync(repoPath,'utf8').split(/\r?\n/);
            const hits=[];
            lines.forEach((line, idx) => {
              const kinds=[];
              for (const [kind, rx] of Object.entries(patterns)) {
                if (rx.test(line)) {
                  totals[kind]++;
                  filesByKind[kind].add(repoPath);
                  kinds.push(kind);
                }
              }
              if (kinds.length) hits.push(`${idx+1}: [${kinds.join(',')}] ${line.trim()}`);
            });
            if (hits.length) {
              console.log(`\nFILE ${repoPath}`);
              hits.forEach(h => console.log(h));
            }
          }

          console.log('\nTOTALS');
          for (const [kind,total] of Object.entries(totals)) {
            console.log(`${kind}=${total};files=${[...filesByKind[kind]].sort().join(',')}`);
          }

          if (totals.state_owner !== 1 || !filesByKind.state_owner.has('app/assets/js/state.js')) {
            throw new Error('Active graph must have exactly one canonical state owner');
          }
          const requiredCleanups = new Set([
            'app/assets/js/main-v110-handoff-shell.js',
            'app/assets/js/screens/search-screen-v102.js',
            'app/assets/js/screens/game-screen-v102-safe.js',
          ]);
          for (const file of requiredCleanups) {
            if (!filesByKind.route_cleanup.has(file)) throw new Error(`Missing route cleanup owner: ${file}`);
          }
          console.log('MVP16_1_ACTIVE_GRAPH_AUDIT=PASS');
          NODE

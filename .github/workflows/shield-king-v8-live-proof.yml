name: Shield King V8 visible-glyph optical diagnostic

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/shield-king-v8-live-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for exact Hostinger deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          for attempt in $(seq 1 24); do
            current="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 25 'https://seashell-okapi-889488.hostingersite.com/bot/staging-e2e-readiness.php' | jq -r '.source_fingerprint_sha256 // empty')"
            if test "$current" = "$expected"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Fetch exact accepted UI art
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
            'https://seashell-okapi-889488.hostingersite.com/app/assets/shield-king-icon.php?asset=ui/actions/more.webp&v=c1efd5af' -o /tmp/more.webp
          curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
            'https://seashell-okapi-889488.hostingersite.com/app/assets/shield-king-icon.php?asset=ui/actions/rules.webp&v=c1efd5af' -o /tmp/rules.webp
          test "$(wc -c < /tmp/more.webp | tr -d ' ')" -gt 1000
          test "$(wc -c < /tmp/rules.webp | tr -d ' ')" -gt 1000

      - name: Measure bright visible centroid and recommended desktop offset
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, subprocess, sys
          if importlib.util.find_spec('PIL') is None:
              subprocess.check_call([sys.executable,'-m','pip','install','--quiet','Pillow==11.3.0'])
          from PIL import Image

          def centroid(path):
              im=Image.open(path).convert('RGBA')
              sx=sy=sw=0.0
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a=im.getpixel((x,y))
                      if a <= 8: continue
                      # Perceptual visible-metal weight: suppress near-black decorative pixels,
                      # emphasize the silver/white/gold pixels the human eye actually tracks.
                      lum=max(r,g,b)/255.0
                      w=(a/255.0)*(lum**2.2)
                      if w <= 0: continue
                      sx += (x+0.5)*w; sy += (y+0.5)*w; sw += w
              return sx/sw/im.width, sy/sw/im.height

          more=centroid('/tmp/more.webp')
          rules=centroid('/tmp/rules.webp')
          # Geometry captured from the exact V8 real-browser diagnostic at 430x900 fine-pointer:
          # more: untransformed 36px image top=22; button center y=40
          # rules: untransformed 37px image top=731.3125; button center y=749.808
          more_shift=18.0-more[1]*36.0
          rules_shift=(749.808-731.3125)-rules[1]*37.0
          print('[MGW_VISIBLE_CENTROID]', {'more':more,'rules':rules,'recommended_more_shift_px':more_shift,'recommended_rules_shift_px':rules_shift})
          assert -8 < more_shift < 8
          assert -8 < rules_shift < 8
          PY

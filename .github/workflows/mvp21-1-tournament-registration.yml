name: MVP-21.1 Tournament registration reservation

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'bot/database/migrations/20260920_0049_create_official_tournaments.php'
      - 'bot/database/migrations/20260920_0050_add_tournament_rules_consent.php'
      - 'bot/database/migrations/20260920_0051_refresh_tournament_rules_copy.php'
      - 'bot/tournaments/TournamentRegistrationService.php'
      - 'bot/tournaments/TournamentAdminNotificationBridge.php'
      - 'bot/tournaments/StagingTournamentManualAcceptanceService.php'
      - 'bot/api.php'
      - 'bot/tournament-status.php'
      - 'bot/runtime/RuntimePrimaryStagingRequestFinalizer.php'
      - 'bot/economy/UnifiedEconomyRuntimeSyncService.php'
      - 'bot/ledger/RuntimeEconomyRepository.php'
      - 'bot/services/UserService.php'
      - 'bot/services/StagingTestPlayerStateResetService.php'
      - 'bot/admin-tournaments.php'
      - 'bot/core/bootstrap.php'
      - 'app/assets/js/api/client.js'
      - 'app/assets/js/screens/tournaments-screen-v1.js'
      - 'app/assets/css/main.css'
      - 'app/runtime/client/version-manifest.php'
      - 'app/v110.php'
      - 'app/admin.php'
      - 'app/assets/js/admin-tournaments.js'
      - 'app/assets/css/admin-shell.css'
      - 'bot/tests/Mvp21_1TournamentRegistrationTest.php'
      - 'bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php'
      - 'bot/tests/Mvp21_1TournamentReservationRuntimeCompatibilityTest.php'
      - 'bot/tests/Mvp21_1TournamentRegistrationMysqlRuntimeTest.php'
      - 'bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php'
      - 'bot/tests/Mvp21_1StagingTournamentResetContractTest.php'
      - 'bot/tests/Mvp21_2TournamentRulesTest.php'
      - 'bot/tests/Mvp21_2TournamentRulesCopyRevisionTest.php'
      - 'bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php'
      - 'bot/tests/RuntimeNotificationRepositoryTest.php'
      - 'bot/tests/RuntimePrimaryStagingRequestFinalizerTest.php'
      - 'e2e/staging/tournament-registration-live.spec.mjs'
      - 'e2e/playwright.config.mjs'
      - '.github/workflows/mvp21-1-tournament-registration.yml'
      - '.github/workflows/mvp21-2-tournament-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp21-1-tournament-registration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Draft, reserve, leave and last-seat boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mgw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none

      - name: Lint MVP-21.1 server and client slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            bot/database/migrations/20260920_0049_create_official_tournaments.php
            bot/database/migrations/20260920_0050_add_tournament_rules_consent.php
            bot/database/migrations/20260920_0051_refresh_tournament_rules_copy.php
            bot/tournaments/TournamentRegistrationService.php
            bot/tournaments/TournamentAdminNotificationBridge.php
            bot/tournaments/StagingTournamentManualAcceptanceService.php
            bot/api.php
            bot/tournament-status.php
            bot/runtime/RuntimePrimaryStagingRequestFinalizer.php
            bot/economy/UnifiedEconomyRuntimeSyncService.php
            bot/ledger/RuntimeEconomyRepository.php
            bot/services/UserService.php
            bot/services/StagingTestPlayerStateResetService.php
            bot/admin-tournaments.php
            bot/core/bootstrap.php
            app/v110.php
            app/admin.php
            bot/tests/Mvp21_1TournamentRegistrationTest.php
            bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php
            bot/tests/Mvp21_1TournamentReservationRuntimeCompatibilityTest.php
            bot/tests/Mvp21_1TournamentRegistrationMysqlRuntimeTest.php
            bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php
            bot/tests/Mvp21_1StagingTournamentResetContractTest.php
            bot/tests/Mvp21_2TournamentRulesTest.php
            bot/tests/Mvp21_2TournamentRulesCopyRevisionTest.php
            bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php
            bot/tests/RuntimeNotificationRepositoryTest.php
            bot/tests/RuntimePrimaryStagingRequestFinalizerTest.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          node --check app/assets/js/api/client.js
          node --check app/assets/js/screens/tournaments-screen-v1.js
          node --check app/assets/js/admin-tournaments.js
          node --check e2e/staging/tournament-registration-live.spec.mjs
          node --check e2e/playwright.config.mjs

      - name: Run MVP-21.1 tournament registration model
        run: php bot/tests/Mvp21_1TournamentRegistrationTest.php

      - name: Run MVP-21.1 integration and ownership contract
        run: php bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php

      - name: Run MVP-21.1 runtime reservation compatibility
        run: php bot/tests/Mvp21_1TournamentReservationRuntimeCompatibilityTest.php

      - name: Run MVP-21.1 MySQL DB-primary registration acceptance
        env:
          MGW_TEST_MYSQL_HOST: 127.0.0.1
          MGW_TEST_MYSQL_PORT: 3306
          MGW_TEST_MYSQL_DATABASE: mgw_test
          MGW_TEST_MYSQL_USER: root
          MGW_TEST_MYSQL_PASSWORD: root
        run: php bot/tests/Mvp21_1TournamentRegistrationMysqlRuntimeTest.php

      - name: Run MVP-21.1 manual acceptance UX contract
        run: php bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php

      - name: Prove staging reset releases stale A/B tournament reservations
        run: php bot/tests/Mvp21_1StagingTournamentResetContractTest.php

      - name: Preserve MVP-21.2 rules and auto-close extension
        run: |
          php bot/tests/Mvp21_2TournamentRulesTest.php
          php bot/tests/Mvp21_2TournamentRulesCopyRevisionTest.php
          php bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php

      - name: Preserve concurrent staging request finalization
        run: php bot/tests/RuntimePrimaryStagingRequestFinalizerTest.php

      - name: Preserve unified balance runtime
        run: |
          php bot/tests/UnifiedEconomyRuntimeSyncTest.php
          php bot/tests/UnifiedEconomyDevUserSyncRegressionTest.php
          php bot/tests/UnifiedEconomyUninitializedRuntimeHydrationTest.php

      - name: Preserve MVP-20 rating and season stack
        run: |
          php bot/tests/Mvp20_1PerGameVisibleRatingTest.php
          php bot/tests/Mvp20_1VisibleRatingIntegrationContractTest.php
          php bot/tests/Mvp20_2HiddenSkillModelTest.php
          php bot/tests/Mvp20_2HiddenSkillIntegrationContractTest.php
          php bot/tests/Mvp20_3LeaderboardsAntiFarmingTest.php
          php bot/tests/Mvp20_3LeaderboardIntegrationContractTest.php
          php bot/tests/Mvp20_4QuarterlySeasonLifecycleTest.php
          php bot/tests/Mvp20_4SeasonLifecycleIntegrationContractTest.php
          php bot/tests/Mvp20_5SeasonalAwardsTest.php
          php bot/tests/Mvp20_5SeasonalAwardsIntegrationContractTest.php
          php bot/tests/Mvp20_6YearlyMedalTest.php
          php bot/tests/Mvp20_6YearlyMedalIntegrationContractTest.php
          php bot/tests/Mvp20_7RatingArchiveTest.php
          php bot/tests/Mvp20_7RatingArchiveIntegrationContractTest.php
          php bot/tests/Mvp20_8RatingAdminTest.php
          php bot/tests/Mvp20_8RatingAdminIntegrationContractTest.php

      - name: Guard MVP-21.1 scope and frozen owners
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/mvp21-1-tournament-registration.yml|\
              .github/workflows/mvp21-2-tournament-rules.yml|\
              .github/workflows/mvp21-3-tournament-schedule.yml|\
              .github/workflows/staging-playwright-e2e.yml|\
              bot/staging-projection-diagnostic.php|\
              bot/database/migrations/20260920_0049_create_official_tournaments.php|\
              bot/database/migrations/20260920_0050_add_tournament_rules_consent.php|\
              bot/database/migrations/20260920_0051_refresh_tournament_rules_copy.php|\
              bot/database/migrations/20260921_0052_add_tournament_schedule.php|\
              bot/tournaments/TournamentRegistrationService.php|\
              bot/tournaments/TournamentAdminNotificationBridge.php|\
              bot/tournaments/TournamentParticipantNotificationBridge.php|\
              bot/tournaments/StagingTournamentManualAcceptanceService.php|\
              bot/api.php|\
              bot/tournament-status.php|\
              bot/runtime/RuntimePrimaryStagingRequestFinalizer.php|\
              bot/economy/UnifiedEconomyRuntimeSyncService.php|\
              bot/ledger/RuntimeEconomyRepository.php|\
              bot/services/UserService.php|\
              bot/services/StagingTestPlayerStateResetService.php|\
              bot/admin-tournaments.php|\
              bot/core/bootstrap.php|\
              app/assets/js/api/client.js|\
              app/assets/js/screens/tournaments-screen-v1.js|\
              app/assets/css/main.css|\
              app/runtime/client/version-manifest.php|\
              app/v110.php|\
              app/admin.php|\
              app/assets/js/admin-tournaments.js|\
              app/assets/css/admin-shell.css|\
              bot/tests/Mvp21_1TournamentRegistrationTest.php|\
              bot/tests/Mvp21_1TournamentRegistrationIntegrationContractTest.php|\
              bot/tests/Mvp21_1TournamentReservationRuntimeCompatibilityTest.php|\
              bot/tests/Mvp21_1TournamentRegistrationMysqlRuntimeTest.php|\
              bot/tests/Mvp21_1TournamentManualAcceptanceContractTest.php|\
              bot/tests/Mvp21_1StagingTournamentResetContractTest.php|\
              bot/tests/Mvp21_2TournamentRulesTest.php|\
              bot/tests/Mvp21_2TournamentRulesCopyRevisionTest.php|\
              bot/tests/Mvp21_3TournamentScheduleTest.php|\
              bot/tests/Mvp21_3ManualAcceptanceRosterFixtureTest.php|\
              bot/tests/RuntimeNotificationRepositoryTest.php|\
              bot/tests/RuntimePrimaryStagingRequestFinalizerTest.php|\
              e2e/staging/tournament-registration-live.spec.mjs|\
              e2e/playwright.config.mjs)
                ;;
              *)
                echo "Unexpected MVP-21.1 path: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          test "$bad" -eq 0

          git diff --exit-code "$base" "$head" -- \
            bot/games app/assets/js/games app/assets/css/games \
            bot/shop bot/ledger/LedgerWriteService.php \
            bot/runtime/ProductionPrimaryApplicationEntrypoints.php

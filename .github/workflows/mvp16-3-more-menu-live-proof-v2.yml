name: MVP-16.3 More menu live proof v2
on:
  push:
    branches: [agent/mvp-16-3-more-menu-live-proof]
    paths: ['.github/workflows/mvp16-3-more-menu-live-proof-v2.yml']
permissions:
  contents: read
env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com
  EXPECTED_FINGERPRINT: c9917809026c6789e3a9fd81f069a1559fa463c4f744489a4d23bdfe14b61a77
  EXPECTED_FILES: '194'
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read authoritative Hostinger readiness fingerprint
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "ATTEMPT=${attempt}"
            if curl --connect-timeout 5 --max-time 15 -fsS "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" -o readiness.json && python3 - <<'PY'
          import json, os
          data=json.load(open('readiness.json', encoding='utf-8'))
          actual=str(data.get('source_fingerprint_sha256',''))
          files=str(data.get('runtime_file_count',''))
          expected=os.environ['EXPECTED_FINGERPRINT']
          expected_files=os.environ['EXPECTED_FILES']
          print(f"EXPECTED={expected}\nACTUAL={actual}\nFILES={files}")
          assert data.get('ok') is True
          assert actual == expected
          assert files == expected_files
          PY
            then
              exit 0
            fi
            sleep 5
          done
          exit 1

name: Staging invite protected history parity focused r2

on:
  pull_request:
    branches:
      - agent/staging-invite-protected-history-parity

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 1f09b6fcebb4fa00decf7b6d13a0e017b162f295
  STATUS_CONTEXT: staging-invite-protected-history-parity-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Protected invite history verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4
        with:
          ref: agent/staging-invite-protected-history-parity-verifier-r2
          fetch-depth: 0

      - name: Syntax
        run: |
          set -Eeuo pipefail
          php -l bot/invites/RuntimeInviteRepository.php
          php -l bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php -l bot/tests/RuntimeInviteRepositoryTest.php
          php -l bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php -l bot/tests/StagingTestPlayerScopedInviteIsolationContractTest.php
          php -l bot/tests/ProductionAvatarInviteRegressionHotfixTest.php

      - name: Focused regressions
        run: |
          set -Eeuo pipefail
          php bot/tests/StagingInviteLifecycleParityReconciliationTest.php
          php bot/tests/RuntimeInviteRepositoryTest.php
          php bot/tests/StagingTestOnlyInviteOrphanRecoveryContractTest.php
          php bot/tests/StagingTestPlayerScopedInviteIsolationContractTest.php
          php bot/tests/ProductionAvatarInviteRegressionHotfixTest.php

      - name: Protected-history contract
        run: |
          set -Eeuo pipefail
          grep -F 'SELECT invite_id, match_id FROM mgw_invites ORDER BY invite_id' bot/invites/RuntimeInviteRepository.php
          grep -F 'WHERE invite_id = :invite_id OR source_match_id = :source_match_id' bot/invites/RuntimeInviteRepository.php
          grep -F "if (\$matchId !== '' || \$relatedMatches > 0)" bot/invites/RuntimeInviteRepository.php
          grep -F "?? ((\$config['environment'] ?? null) === 'staging');" bot/invites/RuntimeInviteRepository.php
          grep -F "\$productionConfig['environment'] = 'production';" bot/tests/RuntimeInviteRepositoryTest.php
          grep -F "str_contains(\$sql, 'SELECT invite_id, match_id FROM mgw_invites')" bot/tests/ProductionAvatarInviteRegressionHotfixTest.php

      - name: Unchanged reset and product boundary
        run: |
          set -Eeuo pipefail
          git diff --quiet 02c6c94cdb9000989ed293ce0f854e04434829e2...1f09b6fcebb4fa00decf7b6d13a0e017b162f295 -- \
            bot/services/StagingTestOnlyInviteOrphanRecoveryService.php \
            bot/services/StagingTestPlayerStateResetService.php \
            bot/staging-test-auth.php \
            e2e/staging-global-setup.mjs \
            app
          ! git diff 02c6c94cdb9000989ed293ce0f854e04434829e2...1f09b6fcebb4fa00decf7b6d13a0e017b162f295 | grep -E '^\+.*(TRUNCATE|DROP TABLE|retry|sleep\()'
          git diff --check 02c6c94cdb9000989ed293ce0f854e04434829e2...1f09b6fcebb4fa00decf7b6d13a0e017b162f295

      - name: Exact verifier diff guard
        run: |
          set -Eeuo pipefail
          git diff --check 1f09b6fcebb4fa00decf7b6d13a0e017b162f295...HEAD
          test "$(git diff --name-only 1f09b6fcebb4fa00decf7b6d13a0e017b162f295...HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only 1f09b6fcebb4fa00decf7b6d13a0e017b162f295...HEAD)" = '.github/workflows/staging-invite-protected-history-parity-focused-r2.yml'

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Protected invite history verification passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Protected invite history verification failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

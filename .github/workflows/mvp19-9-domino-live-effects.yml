name: MVP-19.9 Domino live effects

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/games/domino/renderer-cosmetics-v1.js'
      - 'app/assets/css/games/domino/live-effects-v1.css'
      - 'app/assets/css/games/domino/live-cosmetics-v2.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs'
      - 'e2e/staging/domino-live-diagnostic.spec.mjs'
      - 'e2e/playwright.domino-live-diagnostic.config.mjs'
      - '.github/workflows/mvp19-9-domino-live-effects.yml'
  push:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/assets/js/games/domino/renderer-cosmetics-v1.js'
      - 'app/assets/css/games/domino/live-effects-v1.css'
      - 'app/assets/css/games/domino/live-cosmetics-v2.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs'
      - 'e2e/staging/domino-live-diagnostic.spec.mjs'
      - 'e2e/playwright.domino-live-diagnostic.config.mjs'
      - '.github/workflows/mvp19-9-domino-live-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-9-domino-live-effects-${{ github.ref }}
  cancel-in-progress: true

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  domino-live-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and bounded live cosmetics contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/domino/renderer-cosmetics-v1.js
          node --check bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs
          node --check e2e/staging/domino-live-diagnostic.spec.mjs
          node --check e2e/playwright.domino-live-diagnostic.config.mjs
          php -l app/runtime/client/version-manifest.php
          php -l bot/helpers/WebAppLaunchUrl.php
          node bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs

      - name: Freeze accepted Store Buy choreography and base Domino mechanics
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/js/screens/store-screen-domino-store-v1.js \
            app/assets/css/games/domino/store-cosmetics-v1.css \
            app/assets/css/games/domino/store-effects-scene-v9.css \
            app/assets/css/games/domino/store-effects-visual-parity-v16.css \
            app/assets/css/games/domino/store-effects-smooth-preview-v17.css \
            app/assets/css/games/domino/store-effects-timing-parity-v18.css \
            app/assets/css/games/domino/store-effects-precision-alignment-v19.css \
            app/assets/css/games/domino/store-effects-card-fullwidth-v20.css \
            app/assets/js/games/domino/renderer.js \
            app/assets/css/games/domino/game.css

      - name: Guard bounded live cosmetic ownership
        run: |
          set -euo pipefail
          ! grep -Fq '@keyframes' app/assets/css/games/domino/live-effects-v1.css
          ! grep -Fq '@keyframes' app/assets/css/games/domino/live-cosmetics-v2.css
          ! grep -Fq 'MutationObserver' app/assets/js/games/domino/renderer-cosmetics-v1.js
          ! grep -Fq 'setTimeout(' app/assets/js/games/domino/renderer-cosmetics-v1.js
          ! grep -Fq 'setInterval(' app/assets/js/games/domino/renderer-cosmetics-v1.js
          ! grep -Fq 'prefersReducedMotion()' app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "dominoPreviewMarkup('effect', variant)" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "container.dataset.mgwDominoLiveCosmetics = 'full-v4'" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "state?.profileInventory?.equipped" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "height:100dvh!important" app/assets/css/games/domino/live-cosmetics-v2.css
          grep -F "max-height:100dvh!important" app/assets/css/games/domino/live-cosmetics-v2.css
          grep -F "overflow-y:auto!important" app/assets/css/games/domino/live-cosmetics-v2.css
          grep -F "overflow-x:auto!important" app/assets/css/games/domino/live-cosmetics-v2.css
          grep -F 'body .domino-live-fx-host > .store-v2-game-preview.domino-live-fx-preview[data-game-type="domino"]{' app/assets/css/games/domino/live-effects-v1.css
          grep -F "max-width:none!important" app/assets/css/games/domino/live-effects-v1.css
          grep -F "animation-iteration-count:1!important" app/assets/css/games/domino/live-effects-v1.css
          grep -F "live-preview-root-specificity-v6" app/runtime/client/version-manifest.php
          grep -F "/app/v110.php?v=1186" bot/helpers/WebAppLaunchUrl.php

      - name: Wait for exact Hostinger staging fingerprint
        id: readiness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 24); do
            rm -f domino-live-readiness.json
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --retry 1 --retry-delay 2 --retry-connrefused \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output domino-live-readiness.json; then
              if python3 - domino-live-readiness.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          assert payload.get('environment') == 'staging'
          PY
              then
                ready=1
                break
              fi
            fi
            if [[ "$attempt" -lt 24 ]]; then sleep 15; fi
          done
          test "$ready" = '1'

      - name: Install pinned Playwright browser
        if: github.event_name != 'pull_request' && steps.readiness.outcome == 'success'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Probe deployed Domino runtime in a real browser
        if: github.event_name != 'pull_request' && steps.readiness.outcome == 'success'
        run: |
          set -euo pipefail
          npx --no-install playwright test --config=e2e/playwright.domino-live-diagnostic.config.mjs --workers=1

name: MVP-19.9 Domino live effects

on:
  pull_request:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/v110.php'
      - 'app/assets/js/games/domino/renderer-cosmetics-v1.js'
      - 'app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js'
      - 'app/assets/js/games/domino/renderer-live-manual-v30.js'
      - 'app/assets/css/games/domino/live-native-effects-v1.css'
      - 'app/assets/css/games/domino/live-native-manual-v25.css'
      - 'app/assets/css/games/domino/live-hand-gesture-v27.css'
      - 'app/assets/css/games/domino/live-cosmetics-v2.css'
      - 'app/assets/css/games/domino/live-mobile-stability-v30.css'
      - 'app/assets/css/games/domino/live-effects-v32.css'
      - 'app/assets/js/screens/store-screen-domino-store-v1.js'
      - 'app/assets/js/screens/store-screen-domino-effects-v9.js'
      - 'app/assets/js/profile/mgw-profile-domino-parity.js'
      - 'app/assets/css/games/domino/store-effects-preview-component-v44.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs'
      - 'bot/tests/Mvp19_9DominoLiveStabilityV30ContractTest.mjs'
      - 'e2e/staging/domino-live-diagnostic.spec.mjs'
      - 'e2e/staging/domino-live-stability-v30.spec.mjs'
      - 'e2e/staging/domino-preview-animation-v44.spec.mjs'
      - 'e2e/playwright.domino-live-diagnostic.config.mjs'
      - '.github/workflows/mvp19-9-domino-live-effects.yml'
  push:
    branches: [agent/mvp-13-2-staging]
    paths:
      - 'app/v110.php'
      - 'app/assets/js/games/domino/renderer-cosmetics-v1.js'
      - 'app/assets/js/games/domino/renderer-live-manual-v30.js'
      - 'app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js'
      - 'app/assets/css/games/domino/live-native-effects-v1.css'
      - 'app/assets/css/games/domino/live-native-manual-v25.css'
      - 'app/assets/css/games/domino/live-hand-gesture-v27.css'
      - 'app/assets/css/games/domino/live-cosmetics-v2.css'
      - 'app/assets/css/games/domino/live-mobile-stability-v30.css'
      - 'app/assets/css/games/domino/live-effects-v32.css'
      - 'app/assets/js/screens/store-screen-domino-store-v1.js'
      - 'app/assets/js/screens/store-screen-domino-effects-v9.js'
      - 'app/assets/js/profile/mgw-profile-domino-parity.js'
      - 'app/assets/css/games/domino/store-effects-preview-component-v44.css'
      - 'app/runtime/client/version-manifest.php'
      - 'bot/helpers/WebAppLaunchUrl.php'
      - 'bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs'
      - 'bot/tests/Mvp19_9DominoLiveStabilityV30ContractTest.mjs'
      - 'e2e/staging/domino-live-diagnostic.spec.mjs'
      - 'e2e/staging/domino-live-stability-v30.spec.mjs'
      - 'e2e/staging/domino-preview-animation-v44.spec.mjs'
      - 'e2e/playwright.domino-live-diagnostic.config.mjs'
      - '.github/workflows/mvp19-9-domino-live-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgw-mvp19-9-domino-live-effects-${{ github.ref }}
  cancel-in-progress: true

env:
  MGW_STAGING_ORIGIN: https://seashell-okapi-889488.hostingersite.com

jobs:
  domino-live-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and LIVE-native contract
        run: |
          set -euo pipefail
          node --check app/assets/js/games/domino/renderer-cosmetics-v1.js
          node --check app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js
          node --check app/assets/js/games/domino/renderer-live-manual-v30.js
          node --check bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs
          node --check bot/tests/Mvp19_9DominoLiveStabilityV30ContractTest.mjs
          node --check e2e/staging/domino-live-stability-v30.spec.mjs
          node --check e2e/staging/domino-preview-animation-v44.spec.mjs
          node --check e2e/playwright.domino-live-diagnostic.config.mjs
          php -l app/v110.php
          php -l app/runtime/client/version-manifest.php
          php -l bot/helpers/WebAppLaunchUrl.php
          node bot/tests/Mvp19_9DominoLiveEffectsContractTest.mjs
          node bot/tests/Mvp19_9DominoLiveStabilityV30ContractTest.mjs

      - name: Freeze Store previews and base Domino mechanics
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --exit-code "$base" "$head" -- \
            app/assets/css/games/domino/store-cosmetics-v1.css \
            app/assets/css/games/domino/store-effects-scene-v9.css \
            app/assets/css/games/domino/store-effects-visual-parity-v16.css \
            app/assets/css/games/domino/store-effects-smooth-preview-v17.css \
            app/assets/css/games/domino/store-effects-timing-parity-v18.css \
            app/assets/css/games/domino/store-effects-precision-alignment-v19.css \
            app/assets/css/games/domino/store-effects-card-fullwidth-v20.css \
            app/assets/js/games/domino/renderer.js \
            app/assets/css/games/domino/game.css

      - name: Guard native real-DOM ownership
        run: |
          set -euo pipefail
          for file in \
            app/assets/js/games/domino/renderer-cosmetics-v1.js \
            app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js; do
            ! grep -Fq 'dominoPreviewMarkup' "$file"
            ! grep -Fq 'store-screen-domino-store' "$file"
            ! grep -Fq 'store-v2-game-preview' "$file"
            ! grep -Fq 'mgw-domino-preview' "$file"
            ! grep -Fq 'MutationObserver' "$file"
            ! grep -Fq 'setTimeout(' "$file"
            ! grep -Fq 'setInterval(' "$file"
          done
          grep -F "mgw-domino-native-precision-tile" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "mgw-domino-native-stock-source" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "mgw-domino-native-stock-target" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "mgw-domino-native-finale-tile" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "container.dataset.mgwDominoLiveCosmetics = 'full-v4'" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "container.dataset.mgwDominoNativeEffects = 'v1'" app/assets/js/games/domino/renderer-cosmetics-v1.js
          grep -F "container.dataset.mgwDominoManualCorrective = 'v25'" app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js
          grep -F "hand.dataset.dominoHandDrag = 'v26'" app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js
          grep -F "hand.dataset.dominoHandGesture = 'v27'" app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js
          grep -F "container.dataset.mgwDominoHandPointer = 'v28'" app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js
          grep -F "button.dataset.dominoFinaleQa = 'preview'" app/assets/js/games/domino/renderer-cosmetics-corrective-v25.js

          grep -F "container.dataset.mgwDominoManualStability = 'v30'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "container.dataset.mgwDominoLiveEffects = 'v38'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "new MutationObserver" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "count >= 9" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "hand.style.setProperty('display', 'grid', 'important')" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "actionEffectId(args, container) !== PRECISION_ID" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "const precisionSeenByGame = new Map()" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "root.dataset.dominoPrecisionVisual = 'eight-visible-shards-v38'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "root.dataset.dominoPrecisionShardCount = '8'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "for (let index = 0; index < 8; index += 1)" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "duration:1700" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "const viewerHandIdsByGame = new Map()" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "const newIds = currentIds.filter(id => !previousViewerHandIds.has(id))" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "root.dataset.dominoStockTarget = 'exact-new-tile-v38'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "root.dataset.dominoStockGeometry = 'viewport-portal-v38'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "root.dataset.dominoStockSparkCount = '12'" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "for (let index = 0; index < 12; index += 1)" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "const spread = 38 + (index % 4) * 7" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "Promise.allSettled(animations.map(animation => animation.finished))" app/assets/js/games/domino/renderer-live-manual-v30.js
          grep -F "live-effects-v32.css?v=9&mvp19_9=precision-compact-v41" app/assets/js/games/domino/renderer-live-manual-v30.js
          ! grep -Fq 'rayBoxDistance' app/assets/js/games/domino/renderer-live-manual-v30.js
          ! grep -Fq 'store-screen-domino-store' app/assets/js/games/domino/renderer-live-manual-v30.js
          ! grep -Fq 'onAction?.' app/assets/js/games/domino/renderer-live-manual-v30.js

          grep -F "touch-action:pan-x pan-y!important" app/assets/css/games/domino/live-native-manual-v25.css
          grep -F "touch-action:pan-y!important" app/assets/css/games/domino/live-hand-gesture-v27.css
          ! grep -Fq "touch-action:pan-x" app/assets/css/games/domino/live-hand-gesture-v27.css
          grep -F ".domino-hand:has(> .domino-hand-tile:nth-child(9))" app/assets/css/games/domino/live-hand-gesture-v27.css
          grep -F "height:232px!important" app/assets/css/games/domino/live-mobile-stability-v30.css
          grep -F "transition:none!important" app/assets/css/games/domino/live-mobile-stability-v30.css
          grep -F "display:grid!important" app/assets/css/games/domino/live-mobile-stability-v30.css
          grep -F "overflow-x:visible!important" app/assets/css/games/domino/live-mobile-stability-v30.css
          grep -F ".mgw-domino-live-fx-layer-v38" app/assets/css/games/domino/live-effects-v32.css
          grep -F "z-index:10050!important" app/assets/css/games/domino/live-effects-v32.css
          grep -F ".mgw-domino-precision-burst-v38 .precision-shard-v38" app/assets/css/games/domino/live-effects-v32.css
          grep -F "width:6px!important" app/assets/css/games/domino/live-effects-v32.css
          grep -F "height:22px!important" app/assets/css/games/domino/live-effects-v32.css
          grep -F ".mgw-domino-stock-burst-v38 .stock-spark-v38" app/assets/css/games/domino/live-effects-v32.css
          grep -F "height:.62px!important" app/assets/css/games/domino/live-effects-v32.css
          ! grep -Fq "@keyframes mgw-domino-precision-streak-v37" app/assets/css/games/domino/live-effects-v32.css
          ! grep -Fq "@keyframes mgw-domino-stock-spark-v37" app/assets/css/games/domino/live-effects-v32.css
          grep -F "mgw-domino-native-precision-tile-v25" app/assets/css/games/domino/live-native-manual-v25.css
          grep -F "mgw-domino-native-stock-orb-v25" app/assets/css/games/domino/live-native-manual-v25.css
          grep -F "overflow-y:auto!important" app/assets/css/games/domino/live-cosmetics-v2.css
          grep -F "renderer-live-manual-v30.js?v=1&mvp19_9=manual-stability-v30&parent=manual-corrective-v25&visual_portal=v38&precision_geometry=v41" app/runtime/client/version-manifest.php
          grep -F "&gesture_owner=v27" app/v110.php
          grep -F "&live_effects=v41" app/v110.php
          grep -F "X-MGW-Domino-Hand-Gesture: v27-pan-y-js-horizontal" app/v110.php
          grep -F "/app/v110.php?v=1192&domino_stability=30&runtime_fix=1" bot/helpers/WebAppLaunchUrl.php

      - name: Wait for exact Hostinger staging fingerprint
        id: readiness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_fingerprint="$(python3 scripts/ci/staging-runtime-fingerprint.py)"
          test "${#expected_fingerprint}" = '64'
          ready=0
          for attempt in $(seq 1 24); do
            rm -f domino-live-readiness.json
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --retry 1 --retry-delay 2 --retry-connrefused \
              --header 'Accept: application/json' \
              "${MGW_STAGING_ORIGIN}/bot/staging-e2e-readiness.php" \
              --output domino-live-readiness.json; then
              if python3 - domino-live-readiness.json "${expected_fingerprint}" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload.get('ok') is True
          assert payload.get('source_fingerprint_sha256') == sys.argv[2]
          assert payload.get('environment') == 'staging'
          PY
              then
                ready=1
                break
              fi
            fi
            if [[ "$attempt" -lt 24 ]]; then sleep 15; fi
          done
          test "$ready" = '1'

      - name: Probe deployed Domino Store/Profile v44 preview component
        if: github.event_name != 'pull_request' && steps.readiness.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f domino-preview-store-v13.js domino-preview-loader-v11.js domino-preview-component-v44.css

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "${MGW_STAGING_ORIGIN}/app/assets/js/screens/store-screen-domino-store-v1.js?v=13&mvp19_9=domino-preview-polish-v47" \
            --output domino-preview-store-v13.js

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "${MGW_STAGING_ORIGIN}/app/assets/js/screens/store-screen-domino-effects-v9.js?v=11&mvp19_9=domino-preview-polish-v47" \
            --output domino-preview-loader-v11.js

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            "${MGW_STAGING_ORIGIN}/app/assets/css/games/domino/store-effects-preview-component-v44.css?v=3&mvp19_9=domino-preview-polish-v47" \
            --output domino-preview-component-v44.css

          grep -F 'native:v13:polish-v47' domino-preview-store-v13.js
          grep -F 'data-mgw-domino-preview-component' domino-preview-store-v13.js
          grep -F 'data-mgw-domino-preview-particles="8"' domino-preview-store-v13.js
          grep -F 'data-mgw-domino-preview-particles="12"' domino-preview-store-v13.js
          grep -F 'data-mgw-domino-preview-particles="6"' domino-preview-store-v13.js

          grep -F 'store-effects-preview-component-v44.css?v=3&mvp19_9=domino-preview-polish-v47' domino-preview-loader-v11.js

          grep -F 'does not reuse the old v13/v15/v18 effect' domino-preview-component-v44.css
          grep -F '@keyframes mgw-domino-v44-precision-shard' domino-preview-component-v44.css
          grep -F 'height:.62px!important' domino-preview-component-v44.css
          grep -F '@keyframes mgw-domino-v44-stock-spark' domino-preview-component-v44.css
          grep -F '@keyframes mgw-domino-v44-finale-sweep' domino-preview-component-v44.css
          grep -F '@keyframes mgw-domino-v44-finale-prism' domino-preview-component-v44.css
          grep -F 'Animated properties intentionally do NOT use !important' domino-preview-component-v44.css
          ! grep -Fq 'opacity:0!important' domino-preview-component-v44.css
          ! grep -Fq 'left:var(--sx)!important' domino-preview-component-v44.css
          ! grep -Fq 'top:var(--sy)!important' domino-preview-component-v44.css
          grep -F 'Preview-only pip geometry scales with tile size' domino-preview-component-v44.css
          grep -F 'width:clamp(1.25px,32%,3px)!important' domino-preview-component-v44.css
          grep -F 'Stock beam geometry is pinned to the exact source/target centers' domino-preview-component-v44.css
          grep -F 'width:60.2%!important' domino-preview-component-v44.css
          grep -F 'rotate(20deg)' domino-preview-component-v44.css

          printf 'Hostinger Domino preview component v44 assets verified.\n'

      - name: Install pinned Playwright browser
        if: github.event_name != 'pull_request' && steps.readiness.outcome == 'success'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx --no-install playwright install chromium

      - name: Probe deployed Domino v30 runtime
        if: github.event_name != 'pull_request' && steps.readiness.outcome == 'success'
        run: |
          set -euo pipefail
          npx --no-install playwright test --config=e2e/playwright.domino-live-diagnostic.config.mjs --workers=1

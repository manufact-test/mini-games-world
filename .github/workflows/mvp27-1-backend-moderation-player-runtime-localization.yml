name: MVP-27.1 Backend Moderation Player Runtime Localization

on:
  pull_request:
    branches:
      - agent/mvp-13-2-staging
    paths:
      - 'app/locales/ru.json'
      - 'bot/moderation/ModerationService.php'
      - 'bot/social/PlayerReportService.php'
      - 'bot/moderation.php'
      - 'bot/tests/Mvp22_3ModerationContractTest.php'
      - 'ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs'
      - 'ops/checks/mvp27_1_hardcoded_text_baseline.json'
      - '.github/workflows/mvp27-1-backend-moderation-player-runtime-localization.yml'

permissions:
  contents: read

jobs:
  moderation-player-localization:
    if: startsWith(github.head_ref, 'agent/mvp27-1-backend-moderation-player-runtime-localization-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact accepted staging base
        run: test '${{ github.event.pull_request.base.sha }}' = '212fc1a5844fcb320c367c783bf4f834881503cb'

      - name: Syntax
        run: |
          set -euo pipefail
          php -l bot/moderation/ModerationService.php
          php -l bot/social/PlayerReportService.php
          php -l bot/moderation.php
          php -l bot/localization/ServerLocalization.php
          php -l app/runtime/localization/LocalizationCatalog.php
          php -l bot/tests/Mvp22_3ModerationContractTest.php
          node --check ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs
          node --check ops/checks/mvp27_1_hardcoded_text_audit.mjs
          node -e "JSON.parse(require('fs').readFileSync('app/locales/ru.json','utf8'))"

      - name: Focused localization contract
        run: node ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs

      - name: Preserve moderation and player-report semantics
        run: |
          set -euo pipefail
          php bot/tests/Mvp22_3ModerationContractTest.php
          php bot/tests/Mvp22_3ModerationWorkflowTest.php
          php bot/tests/Mvp18_5ReportsBlockedUsersContractTest.php
          php bot/tests/Mvp25_2HumanFacingErrorBoundaryContractTest.php
          php bot/tests/PlayerReportServiceTest.php
          php bot/tests/Mvp25_5WriteReplaySafetyContractTest.php

      - name: Hardcoded player text ratchet
        run: node ops/checks/mvp27_1_hardcoded_text_audit.mjs

      - name: Bounded scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base" "$head" | sort)"
          allowed="$(cat <<'EOF'
          .github/workflows/mvp27-1-backend-moderation-player-runtime-localization.yml
          app/locales/ru.json
          bot/moderation.php
          bot/moderation/ModerationService.php
          bot/social/PlayerReportService.php
          bot/tests/Mvp22_3ModerationContractTest.php
          ops/checks/mvp27_1_backend_moderation_player_runtime_localization_contract.mjs
          ops/checks/mvp27_1_hardcoded_text_baseline.json
          EOF
          )"
          bad="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort) || true)"
          test -z "$bad" || { printf 'Unexpected moderation localization paths:\n%s\n' "$bad" >&2; exit 1; }
          git diff --check "$base" "$head"

      - name: Tracked secret scan
        run: node scripts/ci/check-secrets.mjs

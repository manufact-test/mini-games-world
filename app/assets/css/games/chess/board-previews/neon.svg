<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Neon chess board preview">
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24556f"/><stop offset="1" stop-color="#162e49"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#512567"/><stop offset="1" stop-color="#26163f"/></linearGradient>
    <pattern id="board" width="27" height="27" patternUnits="userSpaceOnUse"><rect width="13.5" height="13.5" fill="url(#light)"/><rect x="13.5" width="13.5" height="13.5" fill="url(#dark)"/><rect y="13.5" width="13.5" height="13.5" fill="url(#dark)"/><rect x="13.5" y="13.5" width="13.5" height="13.5" fill="url(#light)"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="108" height="108" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)"><rect width="108" height="108" fill="#050711"/><rect width="108" height="108" fill="url(#board)"/></g>
  <rect x=".75" y=".75" width="106.5" height="106.5" rx="7.25" fill="none" stroke="#8b55ff" stroke-opacity=".34" stroke-width="1.5" filter="url(#glow)"/>
  <g fill="#f6ead2" stroke="#4b3928" stroke-width=".45" paint-order="stroke fill" text-anchor="middle" font-family="Segoe UI Symbol, Noto Sans Symbols 2, DejaVu Sans, sans-serif" font-size="11.8" font-weight="700" filter="url(#glow)">
    <text x="6.75" y="11.2">♜</text><text x="20.25" y="11.2">♞</text><text x="33.75" y="11.2">♝</text><text x="47.25" y="11.2">♛</text><text x="60.75" y="11.2">♚</text><text x="74.25" y="11.2">♝</text><text x="87.75" y="11.2">♞</text><text x="101.25" y="11.2">♜</text>
    <text x="6.75" y="24.7">♟</text><text x="20.25" y="24.7">♟</text><text x="33.75" y="24.7">♟</text><text x="47.25" y="24.7">♟</text><text x="60.75" y="24.7">♟</text><text x="74.25" y="24.7">♟</text><text x="87.75" y="24.7">♟</text><text x="101.25" y="24.7">♟</text>
    <text x="6.75" y="92.2">♟</text><text x="20.25" y="92.2">♟</text><text x="33.75" y="92.2">♟</text><text x="47.25" y="92.2">♟</text><text x="60.75" y="92.2">♟</text><text x="74.25" y="92.2">♟</text><text x="87.75" y="92.2">♟</text><text x="101.25" y="92.2">♟</text>
    <text x="6.75" y="105.7">♜</text><text x="20.25" y="105.7">♞</text><text x="33.75" y="105.7">♝</text><text x="47.25" y="105.7">♛</text><text x="60.75" y="105.7">♚</text><text x="74.25" y="105.7">♝</text><text x="87.75" y="105.7">♞</text><text x="101.25" y="105.7">♜</text>

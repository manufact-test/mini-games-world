<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Mini Games World — Clean Runtime</title>
  <link rel="stylesheet" href="./assets/css/app.css?v=2">
</head>
<body>
  <main class="runtime-shell" id="app" data-runtime="mgw-clean-v1">
    <section class="runtime-screen is-active" data-screen="boot" aria-live="polite">
      <div class="runtime-card">
        <span class="runtime-kicker">Mini Games World</span>
        <h1>Подготавливаем clean staging</h1>
        <p data-runtime-message>Проверяем авторизацию, сессию и присутствие.</p>
      </div>
    </section>

    <section class="runtime-screen" data-screen="home" hidden>
      <div class="runtime-card">
        <span class="runtime-kicker">Staging</span>
        <h1>Clean runtime подключён</h1>
        <p>Авторизация, сессия и присутствие работают через один изолированный контур.</p>
        <dl class="runtime-details" data-launch-details></dl>
      </div>
    </section>

    <section class="runtime-screen" data-screen="error" hidden>
      <div class="runtime-card runtime-card--error">
        <span class="runtime-kicker">Ошибка запуска</span>
        <h1>Не удалось открыть приложение</h1>
        <p data-error-message>Повторите запуск из Telegram.</p>
      </div>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./assets/js/entry.js?v=3"></script>
</body>
</html>
